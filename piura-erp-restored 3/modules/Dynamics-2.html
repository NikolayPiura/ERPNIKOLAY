    @media(hover:hover){.score,.day-check,.nav,.date-open{transition:border-color .12s,background .12s}.dynamic-head:hover{background:linear-gradient(100deg,color-mix(in srgb,var(--accent) 13%,transparent),transparent 64%)}.day-check:hover{border-color:var(--accent)}.nav:hover,.date-open:hover,.edit-task:hover{border-color:var(--accent,var(--erp-primary,var(--primary)))}}
    .dynamic-lists{gap:11px}.dynamic-head{min-height:58px;padding:10px 16px}.task-head,.task-row{grid-template-columns:minmax(245px,1fr) 62px repeat(7,48px) 0;gap:7px;padding:6px 16px}.app.editing .task-head,.app.editing .task-row{grid-template-columns:minmax(225px,1fr) 62px repeat(7,48px) 40px}.task-row{min-height:57px}.task-name{font-size:14px;font-weight:840;line-height:1.25}.day-check{width:42px;height:42px;border-radius:12px;font-size:17px}.day-check.on{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 22%,transparent)}.edit-toggle{width:42px;padding:0;font-size:15px}.score:hover,.day-check:hover,.dynamic-panel:hover{transform:none!important;animation:none!important}.chart-line{filter:none}.score-chart{height:280px}.list-toolbar{min-height:42px;align-items:center}.dynamic-total b{font-size:24px}

<body>
<main class="app" id="app">
  <header class="top">
    <span id="serviceTitle" hidden>ПС №1</span>
    <div class="week-nav">
      <button class="nav" id="prevWeek" type="button" aria-label="Предыдущая неделя">‹</button>
      <button class="date-open" id="dateOpen" type="button"><span id="dateLabel">—</span></button>
      <input class="week-date" id="weekDate" type="date" tabindex="-1">
      <button class="nav" id="nextWeek" type="button" aria-label="Следующая неделя">›</button>
    </div>
  </header>

  <section class="scores">
    <article class="score primary"><div class="score-label"><span>Итог недели</span><i></i></div><strong id="currentScore">0</strong><small id="weekRange">—</small></article>
    <article class="score day"><div class="score-label"><span>Итог дня</span><i></i></div><strong id="dayScore">0</strong><small id="dayScoreDate">—</small></article>
    <article class="score day-record"><div class="score-label"><span>Рекорд дня</span><i></i></div><strong id="dayRecordScore">0</strong><small id="dayRecordDate">Первый день</small></article>
    <article class="score week-record"><div class="score-label"><span>Рекорд недели</span><i></i></div><strong id="weekRecordScore">0</strong><small id="weekRecordDate">Первая неделя</small></article>
  </section>

  <section class="panel chart-panel" id="chartPanel">
    <div class="panel-head"><h2 id="chartTitle">Общий график</h2><div class="periods" id="chartModes"><button class="period" data-chart-mode="daily">По дням</button><button class="period on" data-chart-mode="weekly">По неделям</button></div></div>
    <div class="chart-wrap" id="scoreChart"></div>
  </section>

  <div class="list-toolbar"><button class="edit-toggle" data-edit-toggle type="button" title="Редактировать пункты" aria-label="Редактировать пункты">✎</button></div>
  <section class="dynamic-lists" id="dynamicChecklists" aria-label="Восемь проверочных списков"></section>
</main>

<div class="modal-bg" id="taskModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
    <h3 id="taskModalTitle">Пункт списка</h3>
    <div class="fields">
      <div class="field wide"><label for="taskName">Название</label><input id="taskName" type="text" autocomplete="off"></div>
      <div class="field"><label for="taskDynamic">Динамика</label><select id="taskDynamic"></select></div>
      <div class="field"><label for="taskWeight">Вес</label><input id="taskWeight" type="number" min="1" step="1" inputmode="numeric"></div>
    </div>
    <div class="modal-actions"><button class="action danger" id="deleteTask" type="button">Удалить пункт</button><div><button class="action" id="cancelTask" type="button">Отмена</button><button class="action primary" id="saveTask" type="button">Готово</button></div></div>
  </div>
</div>

<script>
const DYNAMICS=[
  {id:1,name:'Я',accent:'#70a5ff'},
  {id:2,name:'Семья',accent:'#ff9d72'},
  {id:3,name:'Группа',accent:'#b58cff'},
  {id:4,name:'Человечество',accent:'#55d8b3'},
  {id:5,name:'Жизнь',accent:'#94d85b'},
  {id:6,name:'Вселенная',accent:'#61c7e8'},
  {id:7,name:'Духовное',accent:'#f3bf55'},
  {id:8,name:'Бесконечность',accent:'#ed78ba'}
];
const DEFAULT_TASKS=[
  [101,1,'Личная гигиена, душ, зубы, витамины',10],
  [102,1,'Тренировка: теннис / спортзал / разминка / растяжка / 6 000 шагов',20],
  [103,1,'Обучение (пара, инвестиции, наставничество, заочное или очное)',30],
  [104,1,'Сессия',75],
  [201,2,'Прогулка',5],
  [202,2,'Совместное мероприятие (ресторан, парк)',30],
  [203,2,'Шаг совместного плана',50],
  [301,3,'Kaizen-час',20],
  [302,3,'Все задачи предыдущего дня',30],
  [303,3,'Все встречи проведены в тайминге',50],
  [401,4,'Выполнена задача по 4-й динамике',40],
  [403,4,'Написана глава книги',30],
  [501,5,'Сделана стерилизация или закуплен корм',10],
  [502,5,'Посажено дерево или установлена кормушка / домик',20],
  [602,6,'Сделана уборка своими силами',30],
  [603,6,'Организована уборка',40],
  [701,7,'Выполнен пункт этического плана',30],
  [702,7,'День без расстройств',200],
  [801,8,'Описана тэта',280]
].map(([id,dynamicId,name,w],order)=>({id,dynamicId,name,w,order,active:true}));
const REMOVED_TASK_IDS=[402,601];
const HISTORY_SEED=[['2026-05-14',185],['2026-05-21',860],['2026-05-28',185],['2026-06-04',460],['2026-06-11',815],['2026-06-18',130],['2026-06-25',2545],['2026-07-02',1135],['2026-07-09',1670],['2026-07-16',760],['2026-07-23',550],['2026-07-30',150]].map(([date,snapshotTotal])=>({date,snapshotTotal}));
const STORE='wt5',SCHEMA_VERSION=13,DYNAMICS_VERSION=1,TASKS_VERSION=3,WEEK_CYCLE_VERSION=2,DAY_WINDOW=14,WEEK_WINDOW=12,DAY_NAMES=['Чт','Пт','Сб','Вс','Пн','Вт','Ср'];
const clone=value=>JSON.parse(JSON.stringify(value));
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const num=value=>Number(value)||0;
function iso(date){const value=new Date(date);return[value.getFullYear(),String(value.getMonth()+1).padStart(2,'0'),String(value.getDate()).padStart(2,'0')].join('-')}
function today(){return iso(new Date())}
function thursdayFor(value){const date=new Date((value||today())+'T12:00:00'),offset=(date.getDay()-4+7)%7;date.setDate(date.getDate()-offset);return iso(date)}
function daysFor(anchor){const thursday=new Date(anchor+'T12:00:00');return Array.from({length:7},(_,index)=>{const date=new Date(thursday);date.setDate(thursday.getDate()+index);return date})}
function shortDate(value){return new Date(value+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}
function fullRange(anchor){const days=daysFor(anchor);return `${shortDate(iso(days[0]))} — ${shortDate(iso(days[6]))}`}
function format(value){return Math.round(num(value)).toLocaleString('ru-RU')}
function defaultState(){return{tasks:clone(DEFAULT_TASKS),weeks:{},history:[],legacyHistory:clone(HISTORY_SEED),legacyBackup:null,nextId:1000,currentSnapshotTotal:0,counts:{},dailyCounts:{},settings:{chartMode:'weekly',chartWeeks:'12',serviceTitle:'ПС №1',schemaVersion:SCHEMA_VERSION,dynamicsVersion:DYNAMICS_VERSION,tasksVersion:TASKS_VERSION,weekCycleVersion:WEEK_CYCLE_VERSION}}}
function legacyTaskTotal(saved,scores={}){const tasks=Array.isArray(saved?.tasks)?saved.tasks:[];return tasks.filter(task=>task.active!==false).reduce((sum,task)=>sum+num(scores?.[task.id])*num(task.w),0)}
function legacyWeekTotal(saved,week={}){if(Number.isFinite(Number(week.snapshotTotal)))return Number(week.snapshotTotal);if(Number.isFinite(Number(week.total)))return Number(week.total);let total=legacyTaskTotal(saved,week.scores||week.weekly||{});Object.values(week.daily||{}).forEach(scores=>{total+=legacyTaskTotal(saved,scores)});return total}
function extractLegacy(saved){const found=new Map(HISTORY_SEED.map(item=>[thursdayFor(item.date),{date:thursdayFor(item.date),snapshotTotal:num(item.snapshotTotal)}]));const add=(date,total)=>{const anchor=thursdayFor(date),value=num(total);if(value>0)found.set(anchor,{date:anchor,snapshotTotal:value})};(saved?.legacyHistory||[]).forEach(item=>add(item.date,item.snapshotTotal??item.total));(saved?.history||[]).forEach(item=>add(item.date,legacyWeekTotal(saved,item)));Object.entries(saved?.weeks||{}).forEach(([date,week])=>add(date,legacyWeekTotal(saved,week)));if(saved?.counts&&Object.keys(saved.counts).length)add(thursdayFor(today()),legacyTaskTotal(saved,saved.counts));return[...found.values()].sort((a,b)=>a.date.localeCompare(b.date))}
let S=defaultState(),selectedWeek=thursdayFor(today()),selectedDynamicId=null,editId=null,editing=false,lastToday=today();
function loadS(){let saved=null;try{saved=JSON.parse(localStorage.getItem(STORE)||'null')}catch(error){}
  const compatible=Boolean(saved)&&num(saved.settings?.dynamicsVersion)===DYNAMICS_VERSION,needsTaskMigration=compatible&&num(saved.settings?.tasksVersion)<TASKS_VERSION,needsWeekMigration=compatible&&num(saved.settings?.weekCycleVersion)<WEEK_CYCLE_VERSION;
  if(!compatible){S=defaultState();if(saved){S.legacyHistory=extractLegacy(saved);S.legacyBackup={migratedAt:new Date().toISOString(),tasks:clone(saved.tasks||[]),weeks:clone(saved.weeks||{}),history:clone(saved.history||[]),counts:clone(saved.counts||{}),dailyCounts:clone(saved.dailyCounts||{}),currentSnapshotTotal:num(saved.currentSnapshotTotal)}}}
  else{const base=defaultState();S={...base,...saved,settings:{...base.settings,...(saved.settings||{})}};S.tasks=Array.isArray(saved.tasks)?saved.tasks:clone(DEFAULT_TASKS);S.weeks=saved.weeks&&typeof saved.weeks==='object'?saved.weeks:{};S.legacyHistory=Array.isArray(saved.legacyHistory)?saved.legacyHistory:clone(HISTORY_SEED)}
  S.tasks.forEach((task,index)=>{task.id=num(task.id);task.dynamicId=Math.min(8,Math.max(1,num(task.dynamicId)||1));task.w=Math.max(1,num(task.w));task.order=Number.isFinite(Number(task.order))?Number(task.order):index;task.active=task.active!==false});if(needsWeekMigration)realignWeeksToThursday();Object.entries(S.weeks).forEach(([anchor,week])=>{week.daily=week.daily&&typeof week.daily==='object'?week.daily:{};if(weekHasRawData(week))freezeWeek(anchor)});if(needsTaskMigration)migrateTaskCatalog();S.nextId=Math.max(num(S.nextId),...S.tasks.map(task=>num(task.id)+1),1000);S.settings.schemaVersion=SCHEMA_VERSION;S.settings.dynamicsVersion=DYNAMICS_VERSION;S.settings.tasksVersion=TASKS_VERSION;S.settings.weekCycleVersion=WEEK_CYCLE_VERSION;S.settings.chartWeeks=String(WEEK_WINDOW);persist(false)
}
function ensureWeek(anchor=selectedWeek){return S.weeks[anchor]||(S.weeks[anchor]={daily:{}})}
function activeTasks(dynamicId=null){return S.tasks.filter(task=>task.active!==false&&(dynamicId==null||num(task.dynamicId)===num(dynamicId))).sort((a,b)=>num(a.order)-num(b.order)||num(a.id)-num(b.id))}
function dailyMaximum(dynamicId=null){return activeTasks(dynamicId).reduce((sum,task)=>sum+num(task.w),0)}
function weekHasRawData(week){return Object.values(week?.daily||{}).some(scores=>Object.values(scores||{}).some(value=>num(value)>0))}
function freezeWeek(anchor){const week=ensureWeek(anchor);week.weights=week.weights&&typeof week.weights==='object'?week.weights:{};week.taskDynamics=week.taskDynamics&&typeof week.taskDynamics==='object'?week.taskDynamics:{};S.tasks.forEach(task=>{if(!Number.isFinite(Number(week.weights[task.id])))week.weights[task.id]=num(task.w);if(!Number.isFinite(Number(week.taskDynamics[task.id])))week.taskDynamics[task.id]=num(task.dynamicId)});return week}
function realignWeeksToThursday(){const rebuilt={};Object.values(S.weeks||{}).forEach(source=>{Object.entries(source?.daily||{}).forEach(([date,scores])=>{const anchor=thursdayFor(date),target=rebuilt[anchor]||(rebuilt[anchor]={daily:{},weights:{},taskDynamics:{}});target.daily[date]={...(target.daily[date]||{}),...(scores||{})};Object.entries(source.weights||{}).forEach(([id,value])=>{if(!Number.isFinite(Number(target.weights[id])))target.weights[id]=num(value)});Object.entries(source.taskDynamics||{}).forEach(([id,value])=>{if(!Number.isFinite(Number(target.taskDynamics[id])))target.taskDynamics[id]=num(value)})})});S.weeks=rebuilt}
function migrateTaskCatalog(){DEFAULT_TASKS.forEach(fresh=>{const task=S.tasks.find(item=>num(item.id)===num(fresh.id));if(task)Object.assign(task,{dynamicId:fresh.dynamicId,name:fresh.name,w:fresh.w,order:fresh.order,active:true});else S.tasks.push(clone(fresh))});S.tasks.forEach(task=>{if(REMOVED_TASK_IDS.includes(num(task.id)))task.active=false});const current=thursdayFor(today()),week=S.weeks[current];if(week&&weekHasRawData(week)){freezeWeek(current);DEFAULT_TASKS.forEach(task=>{week.weights[task.id]=task.w;week.taskDynamics[task.id]=task.dynamicId})}}
function taskWeekWeight(task,anchor){const stored=S.weeks[anchor]?.weights?.[task.id];return Number.isFinite(Number(stored))?Number(stored):num(task.w)}
function taskWeekDynamic(task,anchor){const stored=S.weeks[anchor]?.taskDynamics?.[task.id];return Number.isFinite(Number(stored))?Number(stored):num(task.dynamicId)}
function scoredTasks(anchor,dynamicId=null){return S.tasks.filter(task=>dynamicId==null||taskWeekDynamic(task,anchor)===num(dynamicId))}
function taskChecked(taskId,date,anchor=selectedWeek){return num(S.weeks[anchor]?.daily?.[date]?.[taskId])>0}
function dayTotal(date,dynamicId=null,anchor=thursdayFor(date)){const scores=S.weeks[anchor]?.daily?.[date]||{};return scoredTasks(anchor,dynamicId).reduce((sum,task)=>sum+(num(scores[task.id])>0?taskWeekWeight(task,anchor):0),0)}
function weekTotal(anchor=selectedWeek,dynamicId=null){const week=S.weeks[anchor],tasks=scoredTasks(anchor,dynamicId);if(!week)return 0;return Object.values(week.daily||{}).reduce((sum,scores)=>sum+tasks.reduce((taskSum,task)=>taskSum+(num(scores?.[task.id])>0?taskWeekWeight(task,anchor):0),0),0)}
function checkedCount(anchor=selectedWeek){const week=S.weeks[anchor];if(!week)return 0;return Object.values(week.daily||{}).reduce((sum,scores)=>sum+Object.values(scores||{}).filter(value=>num(value)>0).length,0)}
function hasWeekData(anchor){return weekHasRawData(S.weeks[anchor])}
function newHistory(){return Object.keys(S.weeks).filter(hasWeekData).sort().map(date=>({date,snapshotTotal:weekTotal(date),daily:clone(S.weeks[date].daily||{}),scores:{}}))}
function fullWeekHistory(){const found=new Map((S.legacyHistory||[]).map(item=>[thursdayFor(item.date),{date:thursdayFor(item.date),snapshotTotal:num(item.snapshotTotal)}]));newHistory().forEach(item=>found.set(item.date,item));return[...found.values()].sort((a,b)=>a.date.localeCompare(b.date))}
function chartWeekTotal(anchor,dynamicId=null){if(hasWeekData(anchor))return weekTotal(anchor,dynamicId);if(dynamicId!=null)return 0;return num((S.legacyHistory||[]).find(item=>thursdayFor(item.date)===anchor)?.snapshotTotal)}
function dayRecord(){let best={date:'',total:0};Object.entries(S.weeks).forEach(([anchor,week])=>Object.keys(week.daily||{}).forEach(date=>{const total=dayTotal(date,null,anchor);if(total>best.total)best={date,total}}));return best}
let notifyTimer=null;
function notifyParent(){clearTimeout(notifyTimer);notifyTimer=setTimeout(()=>{try{parent.postMessage({type:'piura:data-changed',source:'weekly'},location.origin)}catch(error){}},240)}
function persist(notify=true){const current=thursdayFor(today()),week=ensureWeek(current);S.currentSnapshotTotal=weekTotal(current);S.counts=Object.fromEntries(activeTasks().map(task=>[task.id,daysFor(current).filter(day=>taskChecked(task.id,iso(day),current)).length]).filter(([,count])=>count));S.dailyCounts=clone(week.daily||{});S.history=newHistory();localStorage.setItem(STORE,JSON.stringify(S));if(notify)notifyParent()}
function toggleCheck(taskId,date){const week=freezeWeek(selectedWeek),task=S.tasks.find(item=>num(item.id)===num(taskId)),scores=week.daily[date]||(week.daily[date]={});if(task){week.weights[task.id]=Number.isFinite(Number(week.weights[task.id]))?Number(week.weights[task.id]):num(task.w);week.taskDynamics[task.id]=Number.isFinite(Number(week.taskDynamics[task.id]))?Number(week.taskDynamics[task.id]):num(task.dynamicId)}scores[taskId]=num(scores[taskId])>0?0:1;if(!scores[taskId])delete scores[taskId];if(!Object.keys(scores).length)delete week.daily[date];persist();render()}
function shiftIso(value,days){const date=new Date(value+'T12:00:00');date.setDate(date.getDate()+days);return iso(date)}
function weeklySeries(dynamicId=null){return Array.from({length:WEEK_WINDOW},(_,index)=>{const anchor=shiftIso(selectedWeek,(index-WEEK_WINDOW+1)*7);return{date:anchor,total:chartWeekTotal(anchor,dynamicId),label:shortDate(anchor)}})}
function dailyWindowEnd(){return selectedWeek===thursdayFor(today())?today():iso(daysFor(selectedWeek)[6])}
function dailySeries(dynamicId=null){const end=dailyWindowEnd();return Array.from({length:DAY_WINDOW},(_,index)=>{const date=shiftIso(end,index-DAY_WINDOW+1),anchor=thursdayFor(date);return{date,total:dayTotal(date,dynamicId,anchor),label:shortDate(date)}})}
function niceScaleMax(series){const high=Math.max(...series.map(item=>num(item.total)),0);if(high<=0)return 10;const rough=high/4,magnitude=10**Math.floor(Math.log10(rough)),normal=rough/magnitude,step=(normal<=1?1:normal<=2?2:normal<=2.5?2.5:normal<=5?5:10)*magnitude;let max=Math.ceil(high/step)*step;if(max<=high)max+=step;if(max<=20)max=Math.ceil(max/5)*5;return Math.max(10,Math.round(max))}
function chartSmoothPath(points){if(!points.length)return'';if(points.length===1)return`M ${points[0].x} ${points[0].y}`;return points.reduce((path,point,index)=>{if(!index)return`M ${point.x} ${point.y}`;const previous=points[index-1],before=points[index-2]||previous,after=points[index+1]||point,low=Math.min(previous.y,point.y),high=Math.max(previous.y,point.y),cp1x=previous.x+(point.x-before.x)/6,cp1y=Math.max(low,Math.min(high,previous.y+(point.y-before.y)/6)),cp2x=point.x-(after.x-previous.x)/6,cp2y=Math.max(low,Math.min(high,point.y-(after.y-previous.y)/6));return`${path} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${point.x} ${point.y}`},'')}
function chartSvg(series,accent=null){const width=1000,height=290,pad={l:30,r:28,t:42,b:48},innerW=width-pad.l-pad.r,innerH=height-pad.t-pad.b,max=niceScaleMax(series),filtered=Boolean(accent),tone=accent||'#8e78ee',point=accent||'#43d39e',scoreLineStart='#35d8f5',scoreLineEnd='#9a72ed',lineStroke=filtered?tone:'url(#scoreLine)',x=index=>pad.l+(series.length===1?innerW/2:index*innerW/(series.length-1)),y=value=>pad.t+innerH-num(value)/max*innerH,coords=series.map((item,index)=>({x:x(index),y:y(item.total)})),line=chartSmoothPath(coords),area=coords.length?`${line} L ${coords.at(-1).x} ${pad.t+innerH} L ${coords[0].x} ${pad.t+innerH} Z`:'';const labels=series.map((item,index)=>`<g><circle class="chart-point" style="stroke:${point}" cx="${coords[index].x}" cy="${coords[index].y}" r="7"/><text class="chart-value" x="${coords[index].x}" y="${Math.max(20,coords[index].y-16)}" text-anchor="middle">${format(item.total)}</text><text class="chart-label" x="${coords[index].x}" y="${height-12}" text-anchor="middle">${esc(item.label||shortDate(item.date))}</text></g>`).join('');return `<svg class="score-chart" style="--chart-accent:${tone}" viewBox="0 0 ${width} ${height}" role="img" aria-label="График баллов"><defs><linearGradient id="scoreLine" x1="0" x2="1"><stop stop-color="${scoreLineStart}"/><stop offset="1" stop-color="${scoreLineEnd}"/></linearGradient><linearGradient id="scoreArea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="${tone}" stop-opacity=".34"/><stop offset="1" stop-color="${tone}" stop-opacity="0"/></linearGradient></defs><line x1="${pad.l}" y1="${pad.t+innerH}" x2="${width-pad.r}" y2="${pad.t+innerH}" stroke="rgba(255,255,255,.09)"/><path class="chart-area" fill="url(#scoreArea)" d="${area}"/><path class="chart-line" style="stroke:${lineStroke}" d="${line}"/>${labels}</svg>`}
function summaryDay(anchor){if(anchor===thursdayFor(today()))return today();const offset=(new Date(today()+'T12:00:00').getDay()-4+7)%7;return iso(daysFor(anchor)[offset])}
function renderSummary(){const total=weekTotal(),day=summaryDay(selectedWeek),bestDay=dayRecord(),bestWeek=fullWeekHistory().reduce((best,item)=>num(item.snapshotTotal)>num(best.snapshotTotal)?item:best,{snapshotTotal:0,date:''});document.getElementById('currentScore').textContent=format(total);document.getElementById('dayScore').textContent=format(dayTotal(day,null,selectedWeek));document.getElementById('dayScoreDate').textContent=shortDate(day);document.getElementById('dayRecordScore').textContent=format(bestDay.total);document.getElementById('dayRecordDate').textContent=bestDay.date?shortDate(bestDay.date):'Первый день';document.getElementById('weekRecordScore').textContent=format(bestWeek.snapshotTotal);document.getElementById('weekRecordDate').textContent=bestWeek.date?`неделя ${shortDate(bestWeek.date)}`:'Первая неделя';document.getElementById('weekRange').textContent=fullRange(selectedWeek);document.getElementById('dateLabel').textContent=fullRange(selectedWeek);document.getElementById('weekDate').value=iso(daysFor(selectedWeek)[0])}
function renderChart(){const dynamic=DYNAMICS.find(item=>item.id===selectedDynamicId),daily=S.settings.chartMode==='daily',series=daily?dailySeries(selectedDynamicId):weeklySeries(selectedDynamicId),panel=document.getElementById('chartPanel'),accent=dynamic?.accent||'#8e78ee';document.getElementById('chartTitle').textContent=dynamic?`${String(dynamic.id).padStart(2,'0')} · ${dynamic.name}`:'Общий график';panel.style.setProperty('--chart-accent',accent);panel.classList.toggle('is-filtered',Boolean(dynamic));document.getElementById('scoreChart').innerHTML=chartSvg(series,dynamic?accent:null);document.querySelectorAll('[data-chart-mode]').forEach(button=>button.classList.toggle('on',button.dataset.chartMode===S.settings.chartMode))}
function taskRows(dynamic){const tasks=activeTasks(dynamic.id),days=daysFor(selectedWeek),todayIso=today();if(!tasks.length)return'<div class="empty">В этой динамике пока нет пунктов</div>';return `<div class="task-grid"><div class="task-head"><span>Пункт</span><span>Баллы</span>${days.map((day,index)=>`<span title="${shortDate(iso(day))}">${DAY_NAMES[index]}</span>`).join('')}<span></span></div>${tasks.map(task=>`<div class="task-row"><div class="task-name">${esc(task.name)}</div><div class="weight">+${format(task.w)}</div>${days.map(day=>{const date=iso(day),checked=taskChecked(task.id,date);return`<button class="day-check ${checked?'on':''} ${date===todayIso?'today':''}" data-check="${task.id}" data-date="${date}" type="button" aria-pressed="${checked}" aria-label="${esc(task.name)}, ${shortDate(date)}">${checked?'✓':''}</button>`}).join('')}<button class="edit-task" data-edit-task="${task.id}" type="button" aria-label="Редактировать ${esc(task.name)}">✎</button></div>`).join('')}</div>`}
function renderChecklists(){document.getElementById('dynamicChecklists').innerHTML=DYNAMICS.map(dynamic=>{const score=weekTotal(selectedWeek,dynamic.id);return `<article class="panel dynamic-panel ${selectedDynamicId===dynamic.id?'selected':''}" id="dynamic-${dynamic.id}" style="--accent:${dynamic.accent}" data-dynamic-id="${dynamic.id}"><header class="dynamic-head" data-select-dynamic="${dynamic.id}"><div class="dynamic-title"><span class="dynamic-index">${String(dynamic.id).padStart(2,'0')}</span><div><h3>${esc(dynamic.name)}</h3><button class="add-task" data-add-task="${dynamic.id}" type="button">+ Добавить пункт</button></div></div><div class="dynamic-total"><b>${format(score)}</b></div></header><div class="task-scroll">${taskRows(dynamic)}</div></article>`}).join('')}
function render(){document.getElementById('app').classList.toggle('editing',editing);const editButton=document.querySelector('[data-edit-toggle]');editButton.textContent=editing?'✓':'✎';editButton.title=editing?'Завершить редактирование':'Редактировать пункты';editButton.setAttribute('aria-label',editButton.title);renderSummary();renderChart();renderChecklists()}
function setWeek(value){selectedWeek=thursdayFor(value);ensureWeek();render()}
function shiftWeek(direction){const nextDate=new Date(selectedWeek+'T12:00:00');nextDate.setDate(nextDate.getDate()+direction*7);setWeek(iso(nextDate))}
function setChartWeeks(){S.settings.chartWeeks=String(WEEK_WINDOW);persist(false);renderChart()}
function setChartMode(mode){S.settings.chartMode=mode==='daily'?'daily':'weekly';persist(false);renderChart()}
function selectDynamic(id){selectedDynamicId=id==null?null:num(id);renderChart();renderChecklists();if(selectedDynamicId!=null)document.getElementById('chartPanel').scrollIntoView({behavior:'smooth',block:'start'})}
function setServiceTitle(value){S.settings.serviceTitle=String(value||'ПС №1');document.getElementById('serviceTitle').textContent=S.settings.serviceTitle;persist(false)}
function openTask(id=null,dynamicId=1){editId=id==null?null:num(id);const task=S.tasks.find(item=>num(item.id)===editId);document.getElementById('taskModalTitle').textContent=task?'Редактировать пункт':'Новый пункт';document.getElementById('taskName').value=task?.name||'';document.getElementById('taskWeight').value=task?.w||10;document.getElementById('taskDynamic').value=String(task?.dynamicId||dynamicId);document.getElementById('deleteTask').style.visibility=task?'visible':'hidden';document.getElementById('taskModal').classList.add('on');setTimeout(()=>document.getElementById('taskName').focus(),30)}
function closeTask(){document.getElementById('taskModal').classList.remove('on');editId=null}
function saveTask(){const name=document.getElementById('taskName').value.trim(),w=Math.max(1,num(document.getElementById('taskWeight').value)),dynamicId=Math.min(8,Math.max(1,num(document.getElementById('taskDynamic').value)));if(!name){document.getElementById('taskName').focus();return}const task=S.tasks.find(item=>num(item.id)===editId);if(task){task.name=name;task.w=w;task.dynamicId=dynamicId;const current=thursdayFor(today()),week=S.weeks[current];if(week&&weekHasRawData(week)){freezeWeek(current);week.weights[task.id]=w;week.taskDynamics[task.id]=dynamicId}}else S.tasks.push({id:S.nextId++,dynamicId,name,w,active:true,order:S.tasks.length});persist();closeTask();render()}
function deleteTask(){const task=S.tasks.find(item=>num(item.id)===editId);if(task){task.active=false;persist()}closeTask();render()}
loadS();document.getElementById('serviceTitle').textContent=S.settings.serviceTitle||'ПС №1';document.getElementById('taskDynamic').innerHTML=DYNAMICS.map(dynamic=>`<option value="${dynamic.id}">${dynamic.id}. ${esc(dynamic.name)}</option>`).join('');
document.getElementById('prevWeek').onclick=()=>shiftWeek(-1);document.getElementById('nextWeek').onclick=()=>shiftWeek(1);document.getElementById('dateOpen').onclick=()=>{const input=document.getElementById('weekDate');if(input.showPicker)input.showPicker();else input.click()};document.getElementById('weekDate').onchange=event=>event.target.value&&setWeek(event.target.value);document.getElementById('chartModes').onclick=event=>{const mode=event.target.closest('[data-chart-mode]')?.dataset.chartMode;if(mode)setChartMode(mode)};document.getElementById('scoreChart').onclick=()=>{if(selectedDynamicId!=null)selectDynamic(null)};document.querySelector('[data-edit-toggle]').onclick=()=>{editing=!editing;render()};document.getElementById('dynamicChecklists').onclick=event=>{const check=event.target.closest('[data-check]'),edit=event.target.closest('[data-edit-task]'),add=event.target.closest('[data-add-task]'),selector=event.target.closest('[data-select-dynamic]');if(check)toggleCheck(num(check.dataset.check),check.dataset.date);else if(edit)openTask(edit.dataset.editTask);else if(add)openTask(null,add.dataset.addTask);else if(selector)selectDynamic(selector.dataset.selectDynamic)};document.getElementById('cancelTask').onclick=closeTask;document.getElementById('saveTask').onclick=saveTask;document.getElementById('deleteTask').onclick=deleteTask;document.getElementById('taskModal').onclick=event=>{if(event.target.id==='taskModal')closeTask()};document.getElementById('taskName').onkeydown=event=>{if(event.key==='Enter')saveTask()};document.addEventListener('keydown',event=>{if(event.key==='Escape')closeTask()});setInterval(()=>{const now=today();if(now!==lastToday){lastToday=now;selectedWeek=thursdayFor(now);persist(false);render()}},60000);render();
</script>
