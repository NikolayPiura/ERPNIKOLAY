<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ПС №1 — восемь динамик</title>
  <style>
    :root{color-scheme:dark;--bg:#08090d;--surface:#111319;--raised:#181b22;--line:rgba(255,255,255,.09);--text:#f5f7fb;--muted:#9299a7;--faint:#606876;--primary:#7ba7ff;--success:#43d39e;--danger:#ff7180;--warning:#f2c45c;--radius:22px}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;background:var(--erp-bg,var(--bg));color:var(--erp-text,var(--text));font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{touch-action:manipulation}.app{width:min(1720px,100%);margin:auto;padding:32px clamp(16px,3vw,52px) 88px;display:grid;gap:22px}.app>*{min-width:0}
    .top{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:92px;padding:20px 24px;border:1px solid var(--erp-line,var(--line));border-radius:24px;background:var(--erp-surface,var(--surface))}.title{font-size:clamp(34px,4vw,54px);font-weight:950;letter-spacing:-.065em;line-height:.92}.week-nav{display:flex;align-items:center;gap:7px;padding:7px;border:1px solid var(--erp-line,var(--line));border-radius:15px;background:var(--erp-raised,var(--raised))}.nav,.date-open{height:43px;border:1px solid var(--erp-line,var(--line));border-radius:11px;background:var(--erp-surface,var(--surface));color:var(--erp-text,var(--text));font-weight:850;cursor:pointer}.nav{width:43px;font-size:21px}.date-open{min-width:210px;padding:0 16px;color:var(--erp-primary,var(--primary))}.week-date{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
    .scores{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:14px}.score{position:relative;overflow:hidden;min-height:146px;padding:22px;border:1px solid var(--erp-line,var(--line));border-radius:var(--radius);background:var(--erp-surface,var(--surface));display:flex;flex-direction:column;justify-content:space-between}.score:before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:var(--score,var(--erp-primary,var(--primary)))}.score.primary{--score:var(--erp-primary,var(--primary));background:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--score) 19%,transparent),transparent 60%),var(--erp-surface,var(--surface))}.score.maximum{--score:var(--erp-warning,var(--warning))}.score.percent{--score:var(--erp-success,var(--success))}.score.record{--score:#b48cff}.score-label{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--erp-muted,var(--muted));font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.11em}.score-label i{width:8px;height:8px;border-radius:50%;background:var(--score)}.score strong{font-size:clamp(38px,4vw,65px);line-height:.9;letter-spacing:-.065em}.score.primary strong{color:var(--score)}.score small{color:var(--erp-faint,var(--faint));font-size:11px}.score-progress{height:5px;border-radius:10px;background:var(--erp-raised,var(--raised));overflow:hidden}.score-progress i{display:block;width:var(--progress,0%);height:100%;border-radius:inherit;background:var(--score)}
    .panel{border:1px solid var(--erp-line,var(--line));border-radius:var(--radius);background:var(--erp-surface,var(--surface));overflow:hidden}.panel-head{min-height:76px;padding:18px 22px;border-bottom:1px solid var(--erp-line,var(--line));display:flex;align-items:center;justify-content:space-between;gap:18px}.panel-head h2{margin:0;font-size:19px;letter-spacing:-.02em}.panel-head small{display:block;margin-top:6px;color:var(--erp-muted,var(--muted));font-size:11px}.periods,.panel-actions{display:flex;gap:6px}.period,.edit-toggle{height:38px;border:1px solid var(--erp-line,var(--line));border-radius:10px;background:var(--erp-raised,var(--raised));color:var(--erp-muted,var(--muted));font-size:11px;font-weight:850;cursor:pointer}.period{padding:0 12px}.period.on{border-color:var(--erp-primary,var(--primary));color:var(--erp-primary,var(--primary));background:color-mix(in srgb,var(--erp-primary,var(--primary)) 11%,var(--erp-raised,var(--raised)))}.edit-toggle{padding:0 15px;color:var(--erp-primary,var(--primary))}.app.editing .edit-toggle{border-color:var(--erp-primary,var(--primary));background:color-mix(in srgb,var(--erp-primary,var(--primary)) 13%,var(--erp-raised,var(--raised)))}
    .chart-panel{--chart-accent:var(--erp-primary,var(--primary))}.chart-wrap{min-width:0;padding:22px 20px 14px;overflow:auto;cursor:pointer}.score-chart{display:block;width:100%;min-width:760px;height:330px}.grid-line{stroke:var(--erp-line,var(--line));stroke-dasharray:4 7}.chart-area{fill:color-mix(in srgb,var(--chart-accent) 14%,transparent)}.chart-line{fill:none;stroke:var(--chart-accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.chart-point{fill:var(--erp-surface,var(--surface));stroke:var(--chart-accent);stroke-width:4}.chart-label,.chart-value,.chart-axis{fill:var(--erp-muted,var(--muted));font-size:12px}.chart-value{fill:var(--erp-text,var(--text));font-weight:900}.chart-panel.is-filtered{border-color:color-mix(in srgb,var(--chart-accent) 48%,var(--erp-line,var(--line)))}
    .list-toolbar{display:flex;justify-content:flex-end}.dynamic-lists{min-width:0;display:grid;grid-template-columns:1fr;gap:20px;align-items:start}.dynamic-panel{--accent:#7ba7ff;min-width:0;border-color:color-mix(in srgb,var(--accent) 28%,var(--erp-line,var(--line)))}.dynamic-panel.selected{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}.dynamic-head{min-height:86px;padding:18px 24px;border-bottom:1px solid var(--erp-line,var(--line));display:flex;align-items:center;justify-content:space-between;gap:18px;background:linear-gradient(100deg,color-mix(in srgb,var(--accent) 10%,transparent),transparent 58%);cursor:pointer}.dynamic-title{display:flex;align-items:center;gap:15px}.dynamic-index{display:grid;place-items:center;width:46px;height:46px;border:1px solid color-mix(in srgb,var(--accent) 48%,var(--erp-line,var(--line)));border-radius:14px;color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,var(--erp-raised,var(--raised)));font-size:14px;font-weight:950}.dynamic-title h3{margin:0;font-size:24px;letter-spacing:-.025em}.dynamic-total b{display:block;color:var(--accent);font-size:31px}.add-task{display:none;margin-top:7px;border:0;background:none;color:var(--accent);font-size:11px;font-weight:850;cursor:pointer}.app.editing .add-task{display:inline-block}.task-scroll{max-width:100%;overflow:auto}.task-grid{min-width:1000px}.task-head,.task-row{display:grid;grid-template-columns:minmax(380px,1fr) 78px repeat(7,60px) 0;gap:10px;align-items:center;padding:12px 22px}.app.editing .task-head,.app.editing .task-row{grid-template-columns:minmax(350px,1fr) 78px repeat(7,60px) 46px}.task-head{min-height:56px;color:var(--erp-muted,var(--muted));background:color-mix(in srgb,var(--erp-raised,var(--raised)) 70%,transparent);font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.07em}.task-head span{text-align:center}.task-head span:first-child{text-align:left}.task-row{min-height:84px;border-top:1px solid var(--erp-line,var(--line))}.task-name{min-width:0;font-size:17px;font-weight:780;line-height:1.35}.weight{justify-self:center;min-width:58px;padding:9px 7px;border-radius:11px;color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,var(--erp-raised,var(--raised)));text-align:center;font-size:14px;font-weight:900}.day-check{display:grid;place-items:center;width:52px;height:52px;border:1px solid var(--erp-line,var(--line));border-radius:14px;background:var(--erp-raised,var(--raised));color:transparent;cursor:pointer;font-size:20px;font-weight:950}.day-check.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,var(--erp-raised,var(--raised)));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 16%,transparent)}.day-check.today{outline:1px solid var(--erp-primary,var(--primary));outline-offset:3px}.edit-task{display:none;width:42px;height:42px;border:1px solid var(--erp-line,var(--line));border-radius:11px;background:var(--erp-raised,var(--raised));color:var(--erp-muted,var(--muted));cursor:pointer}.app.editing .edit-task{display:block}.empty{padding:36px;text-align:center;color:var(--erp-muted,var(--muted));font-size:14px}
    .modal-bg{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.72);backdrop-filter:blur(13px)}.modal-bg.on{display:flex}.modal{width:min(540px,96vw);padding:26px;border:1px solid var(--erp-line,var(--line));border-radius:23px;background:var(--erp-surface,var(--surface));box-shadow:0 35px 110px rgba(0,0,0,.48)}.modal h3{margin:0 0 22px;font-size:25px;letter-spacing:-.03em}.fields{display:grid;grid-template-columns:1fr 125px;gap:12px}.field{display:grid;gap:7px}.field.wide{grid-column:1/-1}.field label{color:var(--erp-muted,var(--muted));font-size:9px;font-weight:850;text-transform:uppercase;letter-spacing:.1em}.field input,.field select{height:48px;padding:0 12px;border:1px solid var(--erp-line,var(--line));border-radius:11px;background:var(--erp-raised,var(--raised));color:var(--erp-text,var(--text))}.modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.modal-actions div{display:flex;gap:8px}.action{height:42px;padding:0 15px;border:1px solid var(--erp-line,var(--line));border-radius:10px;background:var(--erp-raised,var(--raised));color:var(--erp-text,var(--text));cursor:pointer}.action.primary{border-color:var(--erp-primary,var(--primary));color:var(--erp-primary,var(--primary))}.action.danger{color:var(--erp-danger,var(--danger))}
    @media(hover:hover){.score,.day-check,.nav,.date-open{transition:transform .18s,border-color .18s,background .18s}.score:hover{transform:translateY(-2px)}.dynamic-head:hover{background:linear-gradient(100deg,color-mix(in srgb,var(--accent) 16%,transparent),transparent 64%)}.day-check:hover,.nav:hover,.date-open:hover,.edit-task:hover{border-color:var(--accent,var(--erp-primary,var(--primary)))}}
    @media(max-width:760px){.app{padding:14px 12px 60px;gap:14px}.top{align-items:flex-start;flex-direction:column;padding:21px}.week-nav{width:100%}.date-open{flex:1;min-width:0}.scores{grid-template-columns:1fr 1fr;gap:9px}.score{min-height:124px;padding:17px}.score strong{font-size:39px}.panel-head{align-items:flex-start;flex-direction:column}.dynamic-head{padding:15px}.fields{grid-template-columns:1fr}.field.wide{grid-column:auto}}
    @media(max-width:460px){.scores{grid-template-columns:1fr}.title{font-size:39px}.score{min-height:116px}.modal-actions{align-items:stretch;flex-direction:column-reverse}.modal-actions div{display:grid;grid-template-columns:1fr 1fr}.action.danger{width:100%}}
  </style>
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <div class="title" id="serviceTitle">ПС №1</div>
    <div class="week-nav">
      <button class="nav" id="prevWeek" type="button" aria-label="Предыдущая неделя">‹</button>
      <button class="date-open" id="dateOpen" type="button"><span id="dateLabel">—</span></button>
      <input class="week-date" id="weekDate" type="date" tabindex="-1">
      <button class="nav" id="nextWeek" type="button" aria-label="Следующая неделя">›</button>
    </div>
  </header>

  <section class="scores">
    <article class="score primary"><div class="score-label"><span>Итог недели</span><i></i></div><strong id="currentScore">0</strong><div><div class="score-progress" style="--score:var(--erp-primary,var(--primary))"><i id="currentBar"></i></div><small id="weekRange">—</small></div></article>
    <article class="score maximum"><div class="score-label"><span>Максимум</span><i></i></div><strong id="maximumScore">6 300</strong><small id="dailyMaximum">900 баллов в день</small></article>
    <article class="score percent"><div class="score-label"><span>Выполнено</span><i></i></div><strong id="completionScore">0%</strong><small id="completedChecks">0 отметок</small></article>
    <article class="score record"><div class="score-label"><span>Рекорд</span><i></i></div><strong id="recordScore">0</strong><small id="recordDate">Первая неделя</small></article>
  </section>

  <section class="panel chart-panel" id="chartPanel">
    <div class="panel-head"><h2 id="chartTitle">Общий график</h2><div class="periods" id="chartModes"><button class="period" data-chart-mode="daily">По дням</button><button class="period on" data-chart-mode="weekly">По неделям</button></div></div>
    <div class="chart-wrap" id="scoreChart"></div>
  </section>

  <div class="list-toolbar"><button class="edit-toggle" data-edit-toggle type="button">✎ Редактировать</button></div>
  <section class="dynamic-lists" id="dynamicChecklists" aria-label="Восемь проверочных списков"></section>
</main>

<div class="modal-bg" id="taskModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
    <h3 id="taskModalTitle">Пункт списка</h3>
    <div class="fields">
      <div class="field wide"><label for="taskName">Название</label><input id="taskName" type="text" autocomplete="off"></div>
      <div class="field"><label for="taskDynamic">Динамика</label><select id="taskDynamic"></select></div>
      <div class="field"><label for="taskWeight">Вес</label><input id="taskWeight" type="number" min="1" step="1" inputmode="numeric"></div>
    </div>
    <div class="modal-actions"><button class="action danger" id="deleteTask" type="button">Удалить пункт</button><div><button class="action" id="cancelTask" type="button">Отмена</button><button class="action primary" id="saveTask" type="button">Готово</button></div></div>
  </div>
</div>

<script>
const DYNAMICS=[
  {id:1,name:'Я',accent:'#70a5ff'},
  {id:2,name:'Семья',accent:'#ff9d72'},
  {id:3,name:'Группа',accent:'#b58cff'},
  {id:4,name:'Человечество',accent:'#55d8b3'},
  {id:5,name:'Жизнь',accent:'#94d85b'},
  {id:6,name:'Вселенная',accent:'#61c7e8'},
  {id:7,name:'Духовное',accent:'#f3bf55'},
  {id:8,name:'Бесконечность',accent:'#ed78ba'}
];
const DEFAULT_TASKS=[
  [101,1,'Душ',10],
  [102,1,'Спорт, тренировка или 6 000 шагов',20],
  [103,1,'Обучение (технология, инвестиции, наставничество, заочное или очное)',30],
  [104,1,'Сессия',75],
  [201,2,'Прогулка',5],
  [202,2,'Совместное мероприятие (ресторан, парк, тусовка, путешествие)',30],
  [203,2,'Выполнен шаг совместного плана',50],
  [301,3,'Кайдзен-час',10],
  [302,3,'Выполнены все задачи предыдущего дня',30],
  [303,3,'Все встречи проведены в тайминге',50],
  [401,4,'Выполнена задача по 4-й динамике',40],
  [402,4,'Привлечены средства в Endowment',60],
  [403,4,'Написана глава книги',30],
  [501,5,'Сделана стерилизация или закуплен корм',10],
  [502,5,'Посажено дерево или установлена кормушка / домик',20],
  [601,6,'Наведён порядок дома',10],
  [602,6,'Сделана уборка своими силами',30],
  [603,6,'Организована уборка',40],
  [701,7,'Выполнен пункт этического плана',30],
  [702,7,'День без расстройств',140],
  [801,8,'Описана тэта',180]
].map(([id,dynamicId,name,w],order)=>({id,dynamicId,name,w,order,active:true}));
const HISTORY_SEED=[['2026-05-14',185],['2026-05-21',860],['2026-05-28',185],['2026-06-04',460],['2026-06-11',815],['2026-06-18',130],['2026-06-25',2545],['2026-07-02',1135],['2026-07-09',1670],['2026-07-16',760],['2026-07-23',550],['2026-07-30',150]].map(([date,snapshotTotal])=>({date,snapshotTotal}));
const STORE='wt5',SCHEMA_VERSION=10,DYNAMICS_VERSION=1,DAY_NAMES=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const clone=value=>JSON.parse(JSON.stringify(value));
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const num=value=>Number(value)||0;
function iso(date){const value=new Date(date);return[value.getFullYear(),String(value.getMonth()+1).padStart(2,'0'),String(value.getDate()).padStart(2,'0')].join('-')}
function today(){return iso(new Date())}
function thursdayFor(value){const date=new Date((value||today())+'T12:00:00'),day=date.getDay()||7;date.setDate(date.getDate()+4-day);return iso(date)}
function mondayFor(anchor){const date=new Date(anchor+'T12:00:00');date.setDate(date.getDate()-3);return date}
function daysFor(anchor){const monday=mondayFor(anchor);return Array.from({length:7},(_,index)=>{const date=new Date(monday);date.setDate(monday.getDate()+index);return date})}
function shortDate(value){return new Date(value+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'short'})}
function fullRange(anchor){const days=daysFor(anchor);return `${shortDate(iso(days[0]))} — ${shortDate(iso(days[6]))}`}
function format(value){return Math.round(num(value)).toLocaleString('ru-RU')}
function defaultState(){return{tasks:clone(DEFAULT_TASKS),weeks:{},history:[],legacyHistory:clone(HISTORY_SEED),legacyBackup:null,nextId:1000,currentSnapshotTotal:0,counts:{},dailyCounts:{},settings:{chartMode:'weekly',chartWeeks:'12',serviceTitle:'ПС №1',schemaVersion:SCHEMA_VERSION,dynamicsVersion:DYNAMICS_VERSION}}}
function legacyTaskTotal(saved,scores={}){const tasks=Array.isArray(saved?.tasks)?saved.tasks:[];return tasks.filter(task=>task.active!==false).reduce((sum,task)=>sum+num(scores?.[task.id])*num(task.w),0)}
function legacyWeekTotal(saved,week={}){if(Number.isFinite(Number(week.snapshotTotal)))return Number(week.snapshotTotal);if(Number.isFinite(Number(week.total)))return Number(week.total);let total=legacyTaskTotal(saved,week.scores||week.weekly||{});Object.values(week.daily||{}).forEach(scores=>{total+=legacyTaskTotal(saved,scores)});return total}
function extractLegacy(saved){const found=new Map(HISTORY_SEED.map(item=>[thursdayFor(item.date),{date:thursdayFor(item.date),snapshotTotal:num(item.snapshotTotal)}]));const add=(date,total)=>{const anchor=thursdayFor(date),value=num(total);if(value>0)found.set(anchor,{date:anchor,snapshotTotal:value})};(saved?.legacyHistory||[]).forEach(item=>add(item.date,item.snapshotTotal??item.total));(saved?.history||[]).forEach(item=>add(item.date,legacyWeekTotal(saved,item)));Object.entries(saved?.weeks||{}).forEach(([date,week])=>add(date,legacyWeekTotal(saved,week)));if(saved?.counts&&Object.keys(saved.counts).length)add(thursdayFor(today()),legacyTaskTotal(saved,saved.counts));return[...found.values()].sort((a,b)=>a.date.localeCompare(b.date))}
let S=defaultState(),selectedWeek=thursdayFor(today()),selectedDynamicId=null,editId=null,editing=false,lastToday=today();
function loadS(){let saved=null;try{saved=JSON.parse(localStorage.getItem(STORE)||'null')}catch(error){}
  if(!saved||num(saved.settings?.dynamicsVersion)!==DYNAMICS_VERSION){S=defaultState();if(saved){S.legacyHistory=extractLegacy(saved);S.legacyBackup={migratedAt:new Date().toISOString(),tasks:clone(saved.tasks||[]),weeks:clone(saved.weeks||{}),history:clone(saved.history||[]),counts:clone(saved.counts||{}),dailyCounts:clone(saved.dailyCounts||{}),currentSnapshotTotal:num(saved.currentSnapshotTotal)}}}
  else{const base=defaultState();S={...base,...saved,settings:{...base.settings,...(saved.settings||{})}};S.tasks=Array.isArray(saved.tasks)?saved.tasks:clone(DEFAULT_TASKS);S.weeks=saved.weeks&&typeof saved.weeks==='object'?saved.weeks:{};S.legacyHistory=Array.isArray(saved.legacyHistory)?saved.legacyHistory:clone(HISTORY_SEED)}
  S.tasks.forEach((task,index)=>{task.id=num(task.id);task.dynamicId=Math.min(8,Math.max(1,num(task.dynamicId)||1));task.w=Math.max(1,num(task.w));task.order=Number.isFinite(Number(task.order))?Number(task.order):index;task.active=task.active!==false});S.nextId=Math.max(num(S.nextId),...S.tasks.map(task=>num(task.id)+1),1000);S.settings.schemaVersion=SCHEMA_VERSION;S.settings.dynamicsVersion=DYNAMICS_VERSION;persist(false)
}
function ensureWeek(anchor=selectedWeek){return S.weeks[anchor]||(S.weeks[anchor]={daily:{}})}
function activeTasks(dynamicId=null){return S.tasks.filter(task=>task.active!==false&&(dynamicId==null||num(task.dynamicId)===num(dynamicId))).sort((a,b)=>num(a.order)-num(b.order)||num(a.id)-num(b.id))}
function dailyMaximum(dynamicId=null){return activeTasks(dynamicId).reduce((sum,task)=>sum+num(task.w),0)}
function taskChecked(taskId,date,anchor=selectedWeek){return num(S.weeks[anchor]?.daily?.[date]?.[taskId])>0}
function dayTotal(date,dynamicId=null,anchor=selectedWeek){const scores=S.weeks[anchor]?.daily?.[date]||{};return activeTasks(dynamicId).reduce((sum,task)=>sum+(num(scores[task.id])>0?num(task.w):0),0)}
function weekTotal(anchor=selectedWeek,dynamicId=null){const week=S.weeks[anchor],tasks=activeTasks(dynamicId);if(!week)return 0;return Object.values(week.daily||{}).reduce((sum,scores)=>sum+tasks.reduce((taskSum,task)=>taskSum+(num(scores?.[task.id])>0?num(task.w):0),0),0)}
function checkedCount(anchor=selectedWeek){const week=S.weeks[anchor];if(!week)return 0;return Object.values(week.daily||{}).reduce((sum,scores)=>sum+activeTasks().filter(task=>num(scores?.[task.id])>0).length,0)}
function hasWeekData(anchor){return checkedCount(anchor)>0}
function newHistory(){return Object.keys(S.weeks).filter(hasWeekData).sort().map(date=>({date,snapshotTotal:weekTotal(date),daily:clone(S.weeks[date].daily||{}),scores:{}}))}
function persist(notify=true){const current=thursdayFor(today()),week=ensureWeek(current);S.currentSnapshotTotal=weekTotal(current);S.counts=Object.fromEntries(activeTasks().map(task=>[task.id,daysFor(current).filter(day=>taskChecked(task.id,iso(day),current)).length]).filter(([,count])=>count));S.dailyCounts=clone(week.daily||{});S.history=newHistory();localStorage.setItem(STORE,JSON.stringify(S));if(notify)try{parent.postMessage({type:'piura:data-changed',source:'weekly'},location.origin)}catch(error){}}
function toggleCheck(taskId,date){const week=ensureWeek(),scores=week.daily[date]||(week.daily[date]={});scores[taskId]=num(scores[taskId])>0?0:1;if(!scores[taskId])delete scores[taskId];if(!Object.keys(scores).length)delete week.daily[date];persist();render()}
function visibleSeries(dynamicId=null){let series=newHistory().map(item=>({date:item.date,total:dynamicId==null?num(item.snapshotTotal):weekTotal(item.date,dynamicId)}));if(!series.some(item=>item.date===selectedWeek))series.push({date:selectedWeek,total:weekTotal(selectedWeek,dynamicId)});series.sort((a,b)=>a.date.localeCompare(b.date));const limit=S.settings.chartWeeks==='all'?series.length:num(S.settings.chartWeeks)||12;return series.slice(-limit)}
function dailySeries(dynamicId=null){return daysFor(selectedWeek).map((day,index)=>{const date=iso(day);return{date,total:dayTotal(date,dynamicId),label:`${DAY_NAMES[index]} · ${shortDate(date)}`}})}
function chartSvg(series,maxHint=0){const width=1000,height=310,pad={l:62,r:28,t:34,b:46},innerW=width-pad.l-pad.r,innerH=height-pad.t-pad.b,max=Math.max(maxHint,...series.map(item=>item.total),1),x=index=>pad.l+(series.length===1?innerW/2:index*innerW/(series.length-1)),y=value=>pad.t+innerH-num(value)/max*innerH,points=series.map((item,index)=>`${x(index)},${y(item.total)}`).join(' '),area=series.length?`${pad.l},${pad.t+innerH} ${points} ${x(series.length-1)},${pad.t+innerH}`:'';let grid='';for(let i=0;i<=4;i++){const yy=pad.t+innerH*i/4,value=Math.round(max*(1-i/4));grid+=`<line class="grid-line" x1="${pad.l}" y1="${yy}" x2="${width-pad.r}" y2="${yy}"/><text class="chart-axis" x="${pad.l-11}" y="${yy+4}" text-anchor="end">${format(value)}</text>`}const labels=series.map((item,index)=>`<g><circle class="chart-point" cx="${x(index)}" cy="${y(item.total)}" r="6"/><text class="chart-value" x="${x(index)}" y="${Math.max(18,y(item.total)-15)}" text-anchor="middle">${format(item.total)}</text><text class="chart-label" x="${x(index)}" y="${height-14}" text-anchor="middle">${esc(item.label||shortDate(item.date))}</text></g>`).join('');return `<svg class="score-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="График баллов">${grid}<polygon class="chart-area" points="${area}"/><polyline class="chart-line" points="${points}"/>${labels}</svg>`}
function renderSummary(){const total=weekTotal(),max=dailyMaximum()*7,pct=max?Math.round(total/max*100):0,history=newHistory(),record=history.reduce((best,item)=>num(item.snapshotTotal)>num(best.snapshotTotal)?item:best,{snapshotTotal:0,date:''});document.getElementById('currentScore').textContent=format(total);document.getElementById('maximumScore').textContent=format(max);document.getElementById('dailyMaximum').textContent=`${format(dailyMaximum())} баллов в день`;document.getElementById('completionScore').textContent=`${pct}%`;document.getElementById('completedChecks').textContent=`${format(checkedCount())} отметок`;document.getElementById('recordScore').textContent=format(record.snapshotTotal);document.getElementById('recordDate').textContent=record.date?`неделя ${shortDate(record.date)}`:'Первая неделя';document.getElementById('currentBar').style.width=`${Math.min(100,pct)}%`;document.getElementById('weekRange').textContent=fullRange(selectedWeek);document.getElementById('dateLabel').textContent=fullRange(selectedWeek);document.getElementById('weekDate').value=iso(daysFor(selectedWeek)[0])}
function renderChart(){const dynamic=DYNAMICS.find(item=>item.id===selectedDynamicId),daily=S.settings.chartMode==='daily',series=daily?dailySeries(selectedDynamicId):visibleSeries(selectedDynamicId),max=daily?dailyMaximum(selectedDynamicId):dailyMaximum(selectedDynamicId)*7,panel=document.getElementById('chartPanel');document.getElementById('chartTitle').textContent=dynamic?`${String(dynamic.id).padStart(2,'0')} · ${dynamic.name}`:'Общий график';panel.style.setProperty('--chart-accent',dynamic?.accent||'var(--erp-primary,var(--primary))');panel.classList.toggle('is-filtered',Boolean(dynamic));document.getElementById('scoreChart').innerHTML=chartSvg(series,max);document.querySelectorAll('[data-chart-mode]').forEach(button=>button.classList.toggle('on',button.dataset.chartMode===S.settings.chartMode))}
function taskRows(dynamic){const tasks=activeTasks(dynamic.id),days=daysFor(selectedWeek),todayIso=today();if(!tasks.length)return'<div class="empty">В этой динамике пока нет пунктов</div>';return `<div class="task-grid"><div class="task-head"><span>Пункт</span><span>Баллы</span>${days.map((day,index)=>`<span title="${shortDate(iso(day))}">${DAY_NAMES[index]}</span>`).join('')}<span></span></div>${tasks.map(task=>`<div class="task-row"><div class="task-name">${esc(task.name)}</div><div class="weight">+${format(task.w)}</div>${days.map(day=>{const date=iso(day),checked=taskChecked(task.id,date);return`<button class="day-check ${checked?'on':''} ${date===todayIso?'today':''}" data-check="${task.id}" data-date="${date}" type="button" aria-pressed="${checked}" aria-label="${esc(task.name)}, ${shortDate(date)}">${checked?'✓':'·'}</button>`}).join('')}<button class="edit-task" data-edit-task="${task.id}" type="button" aria-label="Редактировать ${esc(task.name)}">✎</button></div>`).join('')}</div>`}
function renderChecklists(){document.getElementById('dynamicChecklists').innerHTML=DYNAMICS.map(dynamic=>{const score=weekTotal(selectedWeek,dynamic.id);return `<article class="panel dynamic-panel ${selectedDynamicId===dynamic.id?'selected':''}" id="dynamic-${dynamic.id}" style="--accent:${dynamic.accent}" data-dynamic-id="${dynamic.id}"><header class="dynamic-head" data-select-dynamic="${dynamic.id}"><div class="dynamic-title"><span class="dynamic-index">${String(dynamic.id).padStart(2,'0')}</span><div><h3>${esc(dynamic.name)}</h3><button class="add-task" data-add-task="${dynamic.id}" type="button">+ Добавить пункт</button></div></div><div class="dynamic-total"><b>${format(score)}</b></div></header><div class="task-scroll">${taskRows(dynamic)}</div></article>`}).join('')}
function render(){document.getElementById('app').classList.toggle('editing',editing);document.querySelector('[data-edit-toggle]').textContent=editing?'✓ Готово':'✎ Редактировать';renderSummary();renderChart();renderChecklists()}
function setWeek(value){selectedWeek=thursdayFor(value);ensureWeek();render()}
function shiftWeek(direction){const nextDate=new Date(selectedWeek+'T12:00:00');nextDate.setDate(nextDate.getDate()+direction*7);setWeek(iso(nextDate))}
function setChartWeeks(value){const next=value==='Все'||value==='all'?'all':String(num(value)||12);if(S.settings.chartWeeks!==next){S.settings.chartWeeks=next;persist()}renderChart()}
function setChartMode(mode){S.settings.chartMode=mode==='daily'?'daily':'weekly';persist(false);renderChart()}
function selectDynamic(id){selectedDynamicId=id==null?null:num(id);renderChart();renderChecklists();if(selectedDynamicId!=null)document.getElementById('chartPanel').scrollIntoView({behavior:'smooth',block:'start'})}
function setServiceTitle(value){S.settings.serviceTitle=String(value||'ПС №1');document.getElementById('serviceTitle').textContent=S.settings.serviceTitle;persist(false)}
function openTask(id=null,dynamicId=1){editId=id==null?null:num(id);const task=S.tasks.find(item=>num(item.id)===editId);document.getElementById('taskModalTitle').textContent=task?'Редактировать пункт':'Новый пункт';document.getElementById('taskName').value=task?.name||'';document.getElementById('taskWeight').value=task?.w||10;document.getElementById('taskDynamic').value=String(task?.dynamicId||dynamicId);document.getElementById('deleteTask').style.visibility=task?'visible':'hidden';document.getElementById('taskModal').classList.add('on');setTimeout(()=>document.getElementById('taskName').focus(),30)}
function closeTask(){document.getElementById('taskModal').classList.remove('on');editId=null}
function saveTask(){const name=document.getElementById('taskName').value.trim(),w=Math.max(1,num(document.getElementById('taskWeight').value)),dynamicId=Math.min(8,Math.max(1,num(document.getElementById('taskDynamic').value)));if(!name){document.getElementById('taskName').focus();return}const task=S.tasks.find(item=>num(item.id)===editId);if(task){task.name=name;task.w=w;task.dynamicId=dynamicId}else S.tasks.push({id:S.nextId++,dynamicId,name,w,active:true,order:S.tasks.length});persist();closeTask();render()}
function deleteTask(){const task=S.tasks.find(item=>num(item.id)===editId);if(task){task.active=false;persist()}closeTask();render()}
loadS();document.getElementById('serviceTitle').textContent=S.settings.serviceTitle||'ПС №1';document.getElementById('taskDynamic').innerHTML=DYNAMICS.map(dynamic=>`<option value="${dynamic.id}">${dynamic.id}. ${esc(dynamic.name)}</option>`).join('');
document.getElementById('prevWeek').onclick=()=>shiftWeek(-1);document.getElementById('nextWeek').onclick=()=>shiftWeek(1);document.getElementById('dateOpen').onclick=()=>{const input=document.getElementById('weekDate');if(input.showPicker)input.showPicker();else input.click()};document.getElementById('weekDate').onchange=event=>event.target.value&&setWeek(event.target.value);document.getElementById('chartModes').onclick=event=>{const mode=event.target.closest('[data-chart-mode]')?.dataset.chartMode;if(mode)setChartMode(mode)};document.getElementById('scoreChart').onclick=()=>{if(selectedDynamicId!=null)selectDynamic(null)};document.querySelector('[data-edit-toggle]').onclick=()=>{editing=!editing;render()};document.getElementById('dynamicChecklists').onclick=event=>{const check=event.target.closest('[data-check]'),edit=event.target.closest('[data-edit-task]'),add=event.target.closest('[data-add-task]'),selector=event.target.closest('[data-select-dynamic]');if(check)toggleCheck(num(check.dataset.check),check.dataset.date);else if(edit)openTask(edit.dataset.editTask);else if(add)openTask(null,add.dataset.addTask);else if(selector)selectDynamic(selector.dataset.selectDynamic)};document.getElementById('cancelTask').onclick=closeTask;document.getElementById('saveTask').onclick=saveTask;document.getElementById('deleteTask').onclick=deleteTask;document.getElementById('taskModal').onclick=event=>{if(event.target.id==='taskModal')closeTask()};document.getElementById('taskName').onkeydown=event=>{if(event.key==='Enter')saveTask()};document.addEventListener('keydown',event=>{if(event.key==='Escape')closeTask()});setInterval(()=>{const now=today();if(now!==lastToday){lastToday=now;selectedWeek=thursdayFor(now);persist(false);render()}},60000);render();
</script>
