<script>
const SMART='http://127.0.0.1:8765',ELGATO='http://127.0.0.1:45831',INCOME_API='https://script.google.com/macros/s/AKfycbxjg9I0W6r8slpuex8yvQIqO3BR9k9NS6h5grvqLVMN0Wjn7iT_1drEOXT2Sn93Y_x_/exec';
const cache=key=>{try{return JSON.parse(localStorage.getItem(key)||'null')}catch{return null}},number=value=>Number(String(value??'').replace(/[^0-9,.-]/g,'').replace(',','.'))||0,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
async function local(base,path,options={}){const method=String(options.method||'GET').toUpperCase(),response=await fetch(base+path,{...options,method,cache:'no-store',headers:method==='POST'?{'Content-Type':'application/json'}:undefined}),data=await response.json();if(!response.ok||data?.ok===false)throw new Error(data?.error||'Недоступно');return data}
const post=(base,path,body)=>local(base,path,{method:'POST',body:JSON.stringify(body)}),navigate=id=>parent.postMessage({type:'piura:navigate',id},location.origin);
let fan={online:false,power:false},lamp={online:false,power:false,color:'#5b9dff',brightness:70},zones=new Map(['1','3','2','5'].map(id=>[id,{online:false,power:false}])),busy=false,colorTimer=0,brightnessSending=false,brightnessPending=null;

function setMode(mode){const dashboard=mode==='dashboard';document.body.dataset.mode=mode;document.getElementById('modeToggle').classList.toggle('dashboard',dashboard);document.getElementById('roomMode').classList.toggle('active',!dashboard);document.getElementById('dashboardMode').classList.toggle('active',dashboard);document.getElementById('roomView').classList.toggle('active',!dashboard);document.getElementById('dashboardView').classList.toggle('active',dashboard);document.getElementById('masterPower').style.visibility=dashboard?'hidden':'visible';localStorage.setItem('piura_overview_test_mode_v1',dashboard?'dashboard':'room');if(dashboard)renderDashboard()}
document.getElementById('roomMode').onclick=()=>setMode('room');document.getElementById('dashboardMode').onclick=()=>setMode('dashboard');

function hsv(h,s,v=1){const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return'#'+[f(5),f(3),f(1)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
function drawWheel(){const canvas=document.getElementById('colorWheel'),ctx=canvas.getContext('2d'),r=canvas.width/2;for(let angle=0;angle<360;angle++){ctx.beginPath();ctx.moveTo(r,r);ctx.arc(r,r,r-8,(angle-1)*Math.PI/180,(angle+1)*Math.PI/180);ctx.closePath();const gradient=ctx.createRadialGradient(r,r,0,r,r,r);gradient.addColorStop(0,'#fff');gradient.addColorStop(.28,hsv(angle,.18));gradient.addColorStop(1,hsv(angle,1));ctx.fillStyle=gradient;ctx.fill()}ctx.beginPath();ctx.arc(r,r,r-8,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=2;ctx.stroke()}
function chooseWheel(event,commit=false){const canvas=document.getElementById('colorWheel'),rect=canvas.getBoundingClientRect(),x=(event.clientX-rect.left)/rect.width*canvas.width-canvas.width/2,y=(event.clientY-rect.top)/rect.height*canvas.height-canvas.height/2,r=Math.hypot(x,y),max=canvas.width/2;if(r>max)return;const hue=(Math.atan2(y,x)*180/Math.PI+360)%360,sat=clamp(r/max,0,1),hex=hsv(hue,sat);lamp.color=hex;document.documentElement.style.setProperty('--room',hex);document.getElementById('wheelKnob').style.left=(50+x/canvas.width*100)+'%';document.getElementById('wheelKnob').style.top=(50+y/canvas.height*100)+'%';if(commit)sendLampColor()}
const wheel=document.getElementById('colorWheel');let wheelDown=false;wheel.onpointerdown=e=>{wheelDown=true;wheel.setPointerCapture(e.pointerId);chooseWheel(e)};wheel.onpointermove=e=>wheelDown&&chooseWheel(e);wheel.onpointerup=e=>{wheelDown=false;chooseWheel(e,true)};

function renderRoom(){document.documentElement.style.setProperty('--room',lamp.color||'#5b9dff');document.getElementById('lightPower').classList.toggle('on',lamp.power);document.getElementById('lightPower').disabled=!lamp.online||busy;document.getElementById('brightness').value=lamp.brightness;document.getElementById('brightnessValue').textContent=Math.round(lamp.brightness)+'%';document.getElementById('fanDeck').classList.toggle('on',fan.power);document.getElementById('fanPower').disabled=!fan.online||busy;document.getElementById('fanPower').setAttribute('aria-label',fan.power?'Выключить вентилятор':'Включить вентилятор');document.querySelectorAll('[data-zone]').forEach(button=>{const state=zones.get(button.dataset.zone)||{};button.disabled=!state.online||busy;button.classList.toggle('on',Boolean(state.power));button.setAttribute('aria-pressed',String(Boolean(state.power)))});const online=[...zones.values()].filter(x=>x.online),active=online.filter(x=>x.power).length,allOn=online.length===4&&online.every(x=>x.power);document.getElementById('allZones').disabled=online.length!==4||busy;document.getElementById('allZones').classList.toggle('on',allOn);const any=fan.power||lamp.power||online.some(x=>x.power);document.getElementById('masterPower').classList.toggle('on',any);document.getElementById('masterPower').setAttribute('aria-label',any?'Выключить всё':'Включить всё');document.getElementById('telemetryLight').textContent=lamp.power?Math.round(lamp.brightness)+'%':'OFF';document.getElementById('telemetryZones').textContent=active+' / 4';document.getElementById('telemetryFan').textContent=fan.power?'RUN':'STOP';document.getElementById('telemetryColor').textContent=(lamp.color||'#5b9dff').toUpperCase();document.getElementById('telemetrySwatch').style.background=lamp.color||'#5b9dff';document.querySelectorAll('[data-scene]').forEach(button=>{const[color,brightness]=button.dataset.scene.split(',');button.classList.toggle('active',color.toLowerCase()===String(lamp.color).toLowerCase()&&Number(brightness)===Math.round(lamp.brightness))})}
async function refreshRoom(){const [fanResult,lampResult,zoneResult]=await Promise.allSettled([local(SMART,'/api/status'),local(SMART,'/api/map/status'),local(ELGATO,'/smart-home/status?devices=1,2,3,5')]);if(fanResult.status==='fulfilled')fan={online:Boolean(fanResult.value.online),power:Boolean(fanResult.value.online&&fanResult.value.power)};if(lampResult.status==='fulfilled'){const value=lampResult.value;lamp={online:Boolean(value.online),power:Boolean(value.online&&value.power),color:/^#[0-9a-f]{6}$/i.test(value.color||'')?value.color:lamp.color,brightness:clamp(Number(value.brightness)||lamp.brightness,1,100)}}if(zoneResult.status==='fulfilled'){const received=new Map((zoneResult.value.devices||[]).map(x=>[String(x.id),x]));zones.forEach((_,id)=>{const value=received.get(id);zones.set(id,{online:Boolean(value?.online),power:Boolean(value?.online&&value?.power)})})}renderRoom()}
async function setLampPower(power){const value=await post(SMART,'/api/map/power',{power:Boolean(power)});lamp.power=Boolean(value.power??power);lamp.online=true;renderRoom()}
async function sendLampColor(){if(!lamp.online)return;clearTimeout(colorTimer);colorTimer=setTimeout(async()=>{try{if(!lamp.power)await post(SMART,'/api/map/power',{power:true});const value=await post(SMART,'/api/map/color',{color:lamp.color,brightness:Math.round(lamp.brightness)});lamp.power=Boolean(value.power??true);lamp.online=true}catch(error){}renderRoom()},80)}
async function flushBrightness(){if(brightnessSending||brightnessPending==null||!lamp.online)return;brightnessSending=true;try{if(!lamp.power)await post(SMART,'/api/map/power',{power:true});while(brightnessPending!=null){const value=brightnessPending;brightnessPending=null;await post(SMART,'/api/map/color',{color:lamp.color,brightness:value});lamp.power=true}}catch(error){}finally{brightnessSending=false;renderRoom();if(brightnessPending!=null)flushBrightness()}}
document.getElementById('brightness').oninput=e=>{lamp.brightness=Number(e.target.value);document.getElementById('brightnessValue').textContent=lamp.brightness+'%';brightnessPending=lamp.brightness;clearTimeout(colorTimer);colorTimer=setTimeout(flushBrightness,90)};document.getElementById('brightness').onchange=flushBrightness;
document.getElementById('lightPower').onclick=()=>setLampPower(!lamp.power).catch(refreshRoom);document.getElementById('fanPower').onclick=async()=>{busy=true;renderRoom();try{const value=await post(SMART,'/api/power',{power:!fan.power});fan={online:Boolean(value.online??true),power:Boolean(value.power)}}finally{busy=false;renderRoom()}};
document.querySelectorAll('[data-zone]').forEach(button=>button.onclick=async()=>{const id=button.dataset.zone,state=zones.get(id);if(!state?.online)return;busy=true;renderRoom();try{await post(ELGATO,'/smart-home',{device:id,power:!state.power});state.power=!state.power}catch(error){}finally{busy=false;renderRoom()}});
document.getElementById('allZones').onclick=async()=>{const online=[...zones.entries()].filter(([,x])=>x.online),target=!online.every(([,x])=>x.power);busy=true;renderRoom();await Promise.allSettled(online.map(([id])=>post(ELGATO,'/smart-home',{device:id,power:target})));busy=false;refreshRoom()};
document.querySelectorAll('[data-scene]').forEach(button=>button.onclick=()=>{const[color,brightness]=button.dataset.scene.split(',');lamp.color=color;lamp.brightness=Number(brightness);renderRoom();sendLampColor()});
document.getElementById('masterPower').onclick=async()=>{const online=[...zones.entries()].filter(([,x])=>x.online),target=!(fan.power||lamp.power||online.some(([,x])=>x.power));busy=true;renderRoom();await Promise.allSettled([fan.online?post(SMART,'/api/power',{power:target}):null,lamp.online?post(SMART,'/api/map/power',{power:target}):null,...online.map(([id])=>post(ELGATO,'/smart-home',{device:id,power:target}))]);busy=false;refreshRoom()};

function climateCard(label,value,meter){const progress=clamp(meter,0,100);return`<div class="climate-ring" style="--meter:${progress};--bar:${progress}%"><svg viewBox="0 0 42 42"><circle class="track" cx="21" cy="21" r="16" pathLength="100"/><circle class="meter" cx="21" cy="21" r="16" pathLength="100"/></svg><strong class="climate-number">${value}</strong><small>${label}</small></div>`}
function renderClimate(data={}){const temp=number(data.temperature),humidity=number(data.humidity),air=number(data.air??data.co2);document.getElementById('climateDeck').innerHTML=climateCard('Температура',temp?temp.toLocaleString('ru-RU',{maximumFractionDigits:1})+'°F':'—',(temp-50)/40*100)+climateCard('Влажность',humidity?humidity.toLocaleString('ru-RU',{maximumFractionDigits:1})+'%':'—',humidity)+climateCard('Воздух',air?Math.round(air)+' ppm':'—',(air-400)/8)}
async function refreshClimate(){const saved=cache('overview_govee_climate_v1')||{};renderClimate(saved);try{const cloud=cache('piura_erp_cloud_v1')||{},url=new URL(cloud.url||'https://script.google.com/macros/s/AKfycbwtw3_PxS8KnkI5DAuK8Yg72gLR1rbVuu3c01Vj9CVPLnB7xVZlNzdnWsybyYTBwy1w/exec');url.searchParams.set('action','govee');if(cloud.token)url.searchParams.set('token',cloud.token);const response=await fetch(url),data=await response.json(),live={temperature:number(data.temperature),humidity:number(data.humidity),air:number(data.co2??data.airQuality)};if(live.temperature||live.humidity||live.air){localStorage.setItem('overview_govee_climate_v1',JSON.stringify({...live,updatedAt:Date.now()}));renderClimate(live)}}catch(error){}}

function compact(value){const n=number(value);if(Math.abs(n)>=1e6)return'$'+(n/1e6).toFixed(2)+'M';if(Math.abs(n)>=1e3)return'$'+Math.round(n/1e3)+'K';return'$'+Math.round(n).toLocaleString('en-US')}
function weeklyStats(weekly={}){const tasks=new Map((weekly.tasks||[]).map(task=>[String(task.id),number(task.w)])),days=[];Object.values(weekly.weeks||{}).forEach(week=>Object.entries(week?.daily||{}).forEach(([date,scores])=>{let total=0,checks=0;Object.entries(scores||{}).forEach(([id,value])=>{if(number(value)>0){total+=number(week?.weights?.[id]??tasks.get(String(id)));checks++}});days.push({date,total,checks})}));days.sort((a,b)=>a.date.localeCompare(b.date));const latest=days.at(-1)||{total:0,checks:0},record=days.reduce((best,item)=>item.total>best.total?item:best,{total:0}),history=[...(weekly.legacyHistory||[]),...(weekly.history||[])].map(item=>({date:item.date||'',total:number(item.snapshotTotal??item.total)})).filter(item=>item.total>0).slice(-12),weekRecord=history.reduce((best,item)=>item.total>best.total?item:best,{total:0}),score=number(weekly.currentSnapshotTotal)||number(weekly.history?.at?.(-1)?.snapshotTotal);return{latest,record,weekRecord,history,score}}
function renderDashboard(){document.getElementById('dashboardDate').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(new Date());const admin=cache('adminv6')||{},summary=cache('admin_program_summary_v1'),fallback=[23,20,28,11,6,11,1,1],fallbackDone=[3,3,1,0,0,0,0,0],names=['Я','Семья','Группа','Человечество','Жизнь','МЕСТ','Духовное','Бесконечность'],dynamics=[];let total=0,done=0;for(let i=0;i<8;i++){const reported=summary?.dynamics?.find?.(x=>Number(x.id)===i+1),items=admin[String(i+1)]?.['проги'],itemTotal=reported?Number(reported.total)||0:Array.isArray(items)?items.filter(x=>!x.hidden).length:fallback[i],itemDone=reported?Number(reported.done)||0:Array.isArray(items)?items.filter(x=>!x.hidden&&x.done).length:fallbackDone[i];total+=itemTotal;done+=itemDone;dynamics.push({name:names[i],done:itemDone,total:itemTotal})}document.getElementById('adminScore').textContent=`${done} / ${total}`;document.getElementById('adminOrbit').style.setProperty('--progress',total?done/total*100:0);document.getElementById('adminMiniGrid').innerHTML=dynamics.map((item,index)=>`<div class="admin-mini"><span>${index+1}. ${item.name}</span><b>${item.done} / ${item.total}</b><i style="--p:${item.total?Math.min(100,item.done/item.total*100):0}%"></i></div>`).join('');
  const goals=[['Котики',Math.round(287/400*100),'287 / 400'],['Наркотики',0,'0 / 20'],['Саентология',0,'0 / 100'],['Экология',50,'0 / 6 · 200 / 105'],['Ассоциация',0,'0 / 60']];document.getElementById('goalGrid').innerHTML=goals.map(([name,percent,ratio])=>`<div class="goal"><b>${name}</b><strong>${percent}%</strong><span>${ratio}</span><div class="goal-track"><i style="--goal-progress:${percent}%"></i></div></div>`).join('');
  const stats=weeklyStats(cache('wt5')||{}),history=stats.history.map(item=>item.total),max=Math.max(...history,stats.score,1);document.getElementById('psValue').textContent=Math.round(stats.score).toLocaleString('ru-RU');document.getElementById('psBars').innerHTML=(history.length?history:[185,860,185,460,815,130,2545,1135,1670,760,550,150]).map(value=>`<i style="height:${Math.max(4,value/max*100)}%"></i>`).join('');document.getElementById('psKpis').innerHTML=[['Последний день',stats.latest.total],['Рекорд дня',stats.record.total],['Рекорд недели',stats.weekRecord.total],['Отметок',stats.latest.checks]].map(([label,value])=>`<div class="ps-kpi"><span>${label}</span><b>${Math.round(value).toLocaleString('ru-RU')}</b></div>`).join('');
  const finance=cache('overview_finance_snapshot_v1')||{},effect=cache('piura_effectiveness_overview_v1')||{},pffData=cache('piura_cache_pff_v1')?.data||{},fundRow=(data,sheet,key)=>number((data?.[sheet]||[]).find(x=>String(x?.[key]||'').trim().toUpperCase().startsWith('ИТОГО'))?.['СУММА']),pff=fundRow(pffData,'2026 (PFF)','АКТИВ')||869341,endowment=number(cache('piura_cache_endowment_v2')?.total)||1653218,metrics=[['Доход за год',number(finance.income)||208385,360000],['Доллар в час',number(effect.dph)||235,500],['Piura Family Fund',pff,1000000],['Endowment',endowment/80,30000],['Подписчики',104,125],['Капитал фондов',1420000,1500000]];document.getElementById('metricGrid').innerHTML=metrics.map(([label,value,target])=>{const progress=Math.min(100,value/target*100),plain=label==='Подписчики';return`<div class="dash-metric"><div class="metric-head"><span>${label}</span><b>${Math.round(progress)}%</b></div><strong>${plain?Math.round(value):compact(value)}</strong><div class="metric-meta"><em>Цель</em><b>${plain?Math.round(target):compact(target)}</b></div><div class="track"><i style="--p:${progress}%"></i></div></div>`}).join('')}
