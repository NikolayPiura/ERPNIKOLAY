<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOLID</title>
<style>
:root{color-scheme:dark;--bg:#070a10;--panel:#10151e;--raised:#161d28;--line:rgba(255,255,255,.09);--text:#f3f6fa;--muted:#8290a4;--blue:#67a7ff;--green:#49d8a3;--violet:#aa7cff;--orange:#ff9873}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--erp-bg,var(--bg));color:var(--erp-text,var(--text));font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.shell{width:100%;padding:38px clamp(24px,4vw,68px) 100px;display:grid;gap:22px}.header{min-height:118px;padding:28px 32px;border:1px solid var(--erp-line,var(--line));border-radius:22px;background:radial-gradient(circle at 0 0,rgba(170,124,255,.12),transparent 38%),var(--erp-surface,var(--panel));display:flex;align-items:center;justify-content:space-between;gap:24px}.header small{display:block;color:var(--violet);font:900 10px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}.header h1{margin:8px 0 0;font-size:clamp(44px,4.8vw,72px);line-height:.9;letter-spacing:-.06em}.sync{display:flex;align-items:center;gap:10px;color:var(--erp-muted,var(--muted));font-size:11px}.sync i{width:8px;height:8px;border-radius:50%;background:#f3c861}.sync.ok i{background:var(--green)}.sync.error i{background:#ff7380}.reload{width:42px;height:42px;border:1px solid var(--erp-line,var(--line));border-radius:12px;background:var(--erp-raised,var(--raised));color:var(--text);cursor:pointer;font-size:19px}.summary{display:grid;grid-template-columns:1.25fr repeat(3,1fr);gap:14px}.summary-card{--c:var(--blue);min-height:154px;padding:23px;border:1px solid color-mix(in srgb,var(--c) 25%,var(--erp-line,var(--line)));border-radius:20px;background:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--c) 13%,transparent),transparent 60%),var(--erp-surface,var(--panel));display:flex;flex-direction:column;justify-content:space-between}.summary-card span{color:var(--erp-muted,var(--muted));font:900 9px ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase}.summary-card strong{font-size:clamp(31px,3vw,48px);line-height:.94;letter-spacing:-.055em}.summary-card small{color:var(--erp-muted,var(--muted));font-size:10px}.objects{display:grid;gap:28px}.object{--c:var(--blue);position:relative;padding:38px 40px;border:1px solid color-mix(in srgb,var(--c) 24%,var(--erp-line,var(--line)));border-radius:24px;background:radial-gradient(circle at 0 0,color-mix(in srgb,var(--c) 11%,transparent),transparent 36%),var(--erp-surface,var(--panel));overflow:hidden}.object:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c)}.object-top{display:flex;align-items:flex-start;justify-content:space-between;gap:28px}.object-title span{color:var(--c);font:900 10px ui-monospace,monospace;letter-spacing:.15em;text-transform:uppercase}.object-title h2{margin:10px 0 4px;font-size:clamp(34px,3.8vw,58px);line-height:.96;letter-spacing:-.055em}.object-title p{margin:0;color:var(--erp-muted,var(--muted));font-size:13px}.capital{text-align:right}.capital span{display:block;color:var(--erp-muted,var(--muted));font:850 9px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.12em}.capital strong{display:block;margin-top:7px;color:var(--c);font-size:clamp(38px,4vw,62px);line-height:.9;letter-spacing:-.06em}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-top:28px}.metric{min-height:105px;padding:17px;border:1px solid var(--erp-line,var(--line));border-radius:15px;background:rgba(7,10,16,.38);display:flex;flex-direction:column;justify-content:space-between}.metric span{color:var(--erp-muted,var(--muted));font:850 9px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}.metric strong{font-size:22px;letter-spacing:-.04em}.charts{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:13px}.chart{min-height:286px;padding:21px;border:1px solid var(--erp-line,var(--line));border-radius:17px;background:var(--erp-raised,var(--raised));overflow:hidden}.chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.chart h3{margin:0;font-size:17px}.chart p{margin:5px 0 0;color:var(--erp-muted,var(--muted));font-size:10px}.chart b{color:var(--c);font-size:18px}.chart svg{display:block;width:100%;height:205px;margin-top:11px;overflow:visible}.grid-line{stroke:rgba(255,255,255,.055);stroke-width:1}.area{fill:color-mix(in srgb,var(--c) 12%,transparent)}.line{fill:none;stroke:var(--c);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.point{fill:var(--raised);stroke:var(--c);stroke-width:3}.axis{fill:var(--erp-muted,var(--muted));font:700 8px ui-monospace,monospace}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:13px;border:1px solid var(--erp-line,var(--line));border-radius:16px;overflow:hidden;background:var(--erp-line,var(--line))}.stat{min-height:86px;padding:16px 18px;background:var(--erp-surface,var(--panel))}.stat span{color:var(--erp-muted,var(--muted));font:800 9px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.09em}.stat b{display:block;margin-top:8px;font-size:18px}.empty{padding:48px;color:var(--erp-muted,var(--muted));text-align:center;border:1px dashed var(--erp-line,var(--line));border-radius:20px}
@media(max-width:1100px){.summary{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr 1fr}.charts{grid-template-columns:1fr}}@media(max-width:700px){.shell{padding:16px 12px 70px}.header,.object-top{align-items:flex-start;flex-direction:column}.capital{text-align:left}.summary{grid-template-columns:1fr}.object{padding:28px 22px}.metrics,.stats{grid-template-columns:1fr 1fr}}
</style>

<body>
<main class="shell" data-piura-keep-full>
 <header class="header"><div><small>REAL ESTATE PORTFOLIO</small><h1>SOLID</h1></div><div class="sync" id="sync"><i></i><span>Загрузка Google Sheets</span><button class="reload" id="reload" aria-label="Обновить" title="Обновить">↻</button></div></header>
 <section class="summary" id="summary"></section><section class="objects" id="objects"></section>
</main>
<script>
const SHEET_ID='1ZrjETAPuytFmxlPtNShmYUMqMfDttltG51_MUrxN2dg',CACHE='piura_cache_solid_dashboard_v2';
const SPECS={one:{index:1,title:'Townhouse',address:'Clearwater, Florida',currency:'USD',dateMode:'mdy',color:'#67a7ff',defaults:{equity:61427,value:241500,debt:180073,cash:2417},sheets:{assets:'№1 АКТИВЫ',fp:'№1 ФП 08.2026',ops:'№1 ОПЕРАЦИИ ',schedule:'№1 ГРАФИК'}},two:{index:2,title:'Квартира в Мытищах',address:'Мытищи, Московская область',currency:'RUB',dateMode:'dmy',color:'#aa7cff',defaults:{equity:2670092,value:13284035,debt:10613943,cash:487960},sheets:{assets:'№2 АКТИВЫ',fp:'№2 ФП 08.2026',ops:'№2 ОПЕРАЦИИ ',schedule:'№2 ГРАФИК'}}};
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
function csvRows(text){const rows=[];let row=[],cell='',quoted=false;for(let index=0;index<text.length;index++){const char=text[index],next=text[index+1];if(char==='"'&&quoted&&next==='"'){cell+='"';index++}else if(char==='"')quoted=!quoted;else if(char===','&&!quoted){row.push(cell);cell=''}else if((char==='\n'||char==='\r')&&!quoted){if(char==='\r'&&next==='\n')index++;row.push(cell);if(row.some(value=>String(value).trim()))rows.push(row);row=[];cell=''}else cell+=char}row.push(cell);if(row.some(value=>String(value).trim()))rows.push(row);return rows}
function jsonp(sheet){return new Promise((resolve,reject)=>{const callback='solid_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script'),timer=setTimeout(()=>done(new Error('timeout')),18000);function done(error,rows){clearTimeout(timer);delete window[callback];script.remove();error?reject(error):resolve(rows)}window[callback]=result=>result?.status==='ok'?done(null,(result.table?.rows||[]).map(row=>(row.c||[]).map(cell=>cell?(cell.f??cell.v??''):''))):done(new Error('Sheets'));script.onerror=()=>done(new Error('network'));script.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${callback}&sheet=${encodeURIComponent(sheet)}&t=${Date.now()}`;document.head.appendChild(script)})}
async function readSheet(sheet){try{const response=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheet)}&t=${Date.now()}`);if(!response.ok)throw new Error(String(response.status));return csvRows(await response.text())}catch(error){return jsonp(sheet)}}
function number(value){const raw=String(value??'').replace(/\s/g,'').replace(/[$₽%]|р\./gi,'').replace(/,(?=\d{1,2}$)/,'.').replace(/,/g,'');const parsed=parseFloat(raw);return Number.isFinite(parsed)?parsed:0}function money(value,currency){return new Intl.NumberFormat('ru-RU',{style:'currency',currency,maximumFractionDigits:0}).format(Number(value)||0)}function compact(value,currency='USD'){const symbol=currency==='RUB'?'₽':'$',absolute=Math.abs(value),sign=value<0?'−':'';if(absolute>=1e6)return`${sign}${symbol}${(absolute/1e6).toLocaleString('ru-RU',{maximumFractionDigits:1})}M`;if(absolute>=1e3)return`${sign}${symbol}${(absolute/1e3).toLocaleString('ru-RU',{maximumFractionDigits:0})}K`;return money(value,currency)}
function rows(rows){return (rows||[]).filter(row=>row.some(value=>String(value??'').trim()))}function parseDate(value,mode){const parts=String(value||'').trim().split(/[./-]/).map(Number);if(parts.length!==3||parts.some(part=>!Number.isFinite(part)))return null;let [day,month,year]=parts;if(mode==='mdy')[month,day]=parts;if(year<100)year+=2000;const date=new Date(year,month-1,day);return Number.isNaN(date.getTime())?null:date}
function inferAssets(source,spec){const table=rows(source),headerIndex=table.findIndex(row=>row.some(value=>/имущество/i.test(String(value)))&&row.some(value=>/сумма/i.test(String(value))));if(headerIndex<0)return{...spec.defaults};const header=table[headerIndex].map(value=>String(value||'').toLocaleLowerCase('ru')),find=(pattern,fallback)=>{const index=header.findIndex(value=>pattern.test(value));return index>=0?index:fallback},nameI=find(/имущество/,0),sumI=find(/^сумма/,2),valueI=find(/общая стоимость/,4),debtI=find(/к погашению/,5),body=table.slice(headerIndex+1),property=body.find(row=>{const name=String(row[nameI]||'');return name&&!/деньги|фонд|итого/i.test(name)}),cash=body.filter(row=>/деньги|фонд/i.test(String(row[nameI]||''))&&!/итого/i.test(String(row[nameI]||''))).reduce((sum,row)=>sum+number(row[sumI]),0),live={equity:number(property?.[sumI]),value:number(property?.[valueI]),debt:number(property?.[debtI]),cash};return Object.fromEntries(Object.entries(live).map(([key,value])=>[key,value||spec.defaults[key]]))}
function scheduleModel(source,spec){const table=rows(source),headerIndex=table.findIndex(row=>row.some(value=>/дата|date/i.test(String(value))));if(headerIndex<0)return[];const header=table[headerIndex].map(value=>String(value||'').toLocaleLowerCase('ru')),find=patterns=>header.findIndex(value=>patterns.some(pattern=>value.includes(pattern))),dateI=find(['дата','date']),paymentI=find(['общая сумма','payment']),principalI=find(['погашение','principal']),balanceI=find(['остаток','balance']);return table.slice(headerIndex+1).map(row=>({date:parseDate(row[dateI],spec.dateMode),payment:number(row[paymentI]),principal:number(row[principalI]),balance:number(row[balanceI])})).filter(item=>item.date&&item.balance).sort((a,b)=>a.date-b.date)}
function operationsModel(source,spec){const table=rows(source),headerIndex=table.findIndex(row=>row.some(value=>/^дата$/i.test(String(value).trim()))&&row.some(value=>/сумма/i.test(String(value))));if(headerIndex<0)return[];const header=table[headerIndex].map(value=>String(value||'').toLocaleLowerCase('ru')),dateI=header.findIndex(value=>/дата/.test(value)),nameI=header.findIndex(value=>/наименование/.test(value)),amountI=header.findIndex(value=>/сумма/.test(value));return table.slice(headerIndex+1).map(row=>({date:parseDate(row[dateI],spec.dateMode==='mdy'?'dmy':'dmy'),name:String(row[nameI]||''),amount:number(row[amountI])})).filter(item=>item.name&&!/итого/i.test(item.name)&&item.amount)}
function planInflow(source){const row=rows(source).find(row=>row.some(value=>/приход дс/i.test(String(value))));return Math.max(0,...(row||[]).map(number))}
let data={},fx=83.81;function objectModel(key){const spec=SPECS[key],asset=inferAssets(data[spec.sheets.assets],spec),schedule=scheduleModel(data[spec.sheets.schedule],spec),operations=operationsModel(data[spec.sheets.ops],spec),capital=asset.equity+asset.cash,ltv=asset.value?asset.debt/asset.value*100:0,income=operations.filter(item=>item.amount>0).reduce((sum,item)=>sum+item.amount,0),expenses=Math.abs(operations.filter(item=>item.amount<0).reduce((sum,item)=>sum+item.amount,0));return{...spec,...asset,capital,ltv,schedule,operations,inflow:planInflow(data[spec.sheets.fp]),income,expenses}}
function chart(title,subtitle,labels,values,color,currency){if(!values.length)return`<section class="chart"><div class="chart-head"><div><h3>${title}</h3><p>${subtitle}</p></div></div><div class="empty">Нет истории в источнике</div></section>`;const width=720,height=170,pad=18,min=Math.min(...values),max=Math.max(...values),range=max-min||1,points=values.map((value,index)=>[pad+(width-pad*2)*(values.length===1?.5:index/(values.length-1)),height-pad-(height-pad*2)*(value-min)/range]),path=points.map(point=>point.join(',')).join(' '),area=`${pad},${height-pad} ${path} ${width-pad},${height-pad}`,step=Math.max(1,Math.ceil(labels.length/5));return`<section class="chart" style="--c:${color}"><div class="chart-head"><div><h3>${title}</h3><p>${subtitle}</p></div><b>${compact(values.at(-1),currency)}</b></div><svg viewBox="0 0 ${width} ${height+26}" role="img" aria-label="${esc(title)}">${[.25,.5,.75].map(value=>`<line class="grid-line" x1="${pad}" x2="${width-pad}" y1="${pad+(height-pad*2)*value}" y2="${pad+(height-pad*2)*value}"/>`).join('')}<polygon class="area" points="${area}"/><polyline class="line" points="${path}"/>${points.map((point,index)=>`<circle class="point" cx="${point[0]}" cy="${point[1]}" r="${index===points.length-1?5:3}"/>`).join('')}${labels.map((label,index)=>index%step===0||index===labels.length-1?`<text class="axis" x="${points[index][0]}" y="${height+14}" text-anchor="middle">${esc(label)}</text>`:'').join('')}</svg></section>`}
function metric(label,value){return`<div class="metric"><span>${label}</span><strong>${value}</strong></div>`}function renderObject(model){const schedule=model.schedule.slice(0,18),labels=schedule.map(item=>item.date.toLocaleDateString('ru-RU',{month:'short',year:'2-digit'})),equity=schedule.map(item=>Math.max(0,model.value-item.balance)),payments=schedule.map(item=>item.payment),net=model.income-model.expenses;return`<article class="object" style="--c:${model.color}"><header class="object-top"><div class="object-title"><span>${model.currency}</span><h2>${esc(model.title)}</h2><p>${esc(model.address)}</p></div><div class="capital"><span>Капитал</span><strong>${money(model.capital,model.currency)}</strong></div></header><div class="metrics">${metric('Стоимость',money(model.value,model.currency))}${metric('Долг',money(model.debt,model.currency))}${metric('LTV',model.ltv.toFixed(1)+'%')}${metric('Плановый доход',money(model.inflow,model.currency))}</div><div class="charts">${chart('Собственный капитал','стоимость минус остаток долга',labels,equity,model.color,model.currency)}${chart('Платежи','график обязательств',labels,payments,'#49d8a3',model.currency)}</div><div class="stats"><div class="stat"><span>Поступления</span><b>${money(model.income,model.currency)}</b></div><div class="stat"><span>Расходы</span><b>${money(model.expenses,model.currency)}</b></div><div class="stat"><span>Результат</span><b>${money(net,model.currency)}</b></div><div class="stat"><span>Операций</span><b>${model.operations.length}</b></div></div></article>`}
function render(){const one=objectModel('one'),two=objectModel('two'),totalCapital=one.capital+two.capital/fx,totalDebt=one.debt+two.debt/fx,totalValue=one.value+two.value/fx,ltv=totalValue?totalDebt/totalValue*100:0;document.getElementById('summary').innerHTML=[["Капитал SOLID",money(totalCapital,'USD'),`RUB пересчитан по ${fx.toFixed(2)} ₽/$`,'#67a7ff'],['Долг',money(totalDebt,'USD'),'два объекта','#ff9873'],['LTV',ltv.toFixed(1)+'%','долг / стоимость','#aa7cff'],['Плановый доход',`${compact(one.inflow,'USD')} + ${compact(two.inflow,'RUB')}`,'по финансовым планам','#49d8a3']].map(item=>`<article class="summary-card" style="--c:${item[3]}"><span>${item[0]}</span><strong>${item[1]}</strong><small>${item[2]}</small></article>`).join('');document.getElementById('objects').innerHTML=renderObject(one)+renderObject(two)}
async function load(force=false){const sync=document.getElementById('sync');sync.className='sync';sync.querySelector('span').textContent='Загрузка Google Sheets';if(!force){try{const cached=JSON.parse(localStorage.getItem(CACHE)||'null');if(cached){data=cached.data||{};fx=Number(cached.fx)||fx;render()}}catch{}}const names=[...new Set(Object.values(SPECS).flatMap(spec=>Object.values(spec.sheets)))];try{data=Object.fromEntries(await Promise.all(names.map(async name=>[name,await readSheet(name)])));try{const response=await fetch('https://cdn.jsdelivr.net/gh/fawazahmed0/currency-api@1/latest/currencies/usd/rub.json'),rate=await response.json();fx=Number(rate.rub)||fx}catch{}localStorage.setItem(CACHE,JSON.stringify({data,fx,at:Date.now()}));render();sync.className='sync ok';sync.querySelector('span').textContent='Данные обновлены'}catch(error){sync.className='sync error';sync.querySelector('span').textContent=Object.keys(data).length?'Сохранённый снимок':'Данные недоступны';console.warn(error)}}document.getElementById('reload').onclick=()=>load(true);load();
</script>
