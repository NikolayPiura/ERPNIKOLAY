*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--erp-bg,var(--bg));color:var(--erp-text,var(--text));font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.shell{width:100%;padding:38px clamp(24px,4vw,68px) 100px;display:grid;gap:22px}.header{min-height:122px;padding:28px 32px;border:1px solid var(--erp-line,var(--line));border-radius:22px;background:radial-gradient(circle at 0 0,rgba(73,216,163,.11),transparent 38%),var(--erp-surface,var(--panel));display:flex;align-items:center;justify-content:space-between;gap:24px}.header small{display:block;color:var(--green);font:900 10px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}.header h1{margin:8px 0 0;font-size:clamp(42px,4.5vw,68px);line-height:.92;letter-spacing:-.06em}.sync{display:flex;align-items:center;gap:10px;color:var(--erp-muted,var(--muted));font-size:11px}.sync i{width:8px;height:8px;border-radius:50%;background:#f3c861}.sync.ok i{background:var(--green)}.sync.error i{background:#ff7380}.reload{width:42px;height:42px;border:1px solid var(--erp-line,var(--line));border-radius:12px;background:var(--erp-raised,var(--raised));color:var(--text);cursor:pointer;font-size:19px}.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.kpi{--c:var(--blue);min-height:166px;padding:25px;border:1px solid color-mix(in srgb,var(--c) 26%,var(--erp-line,var(--line)));border-radius:20px;background:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--c) 14%,transparent),transparent 58%),var(--erp-surface,var(--panel));display:flex;flex-direction:column;justify-content:space-between}.kpi span{color:var(--erp-muted,var(--muted));font:900 9px ui-monospace,monospace;letter-spacing:.15em;text-transform:uppercase}.kpi strong{font-size:clamp(38px,4.2vw,62px);letter-spacing:-.06em;line-height:.95}.kpi small{color:var(--erp-muted,var(--muted));font-size:11px}.panel{border:1px solid var(--erp-line,var(--line));border-radius:22px;background:var(--erp-surface,var(--panel));overflow:hidden}.panel-head{min-height:74px;padding:19px 23px;border-bottom:1px solid var(--erp-line,var(--line));display:flex;align-items:center;justify-content:space-between;gap:20px}.panel-head span,.section-head span{display:block;color:var(--green);font:900 9px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase}.panel-head h2,.section-head h2{margin:5px 0 0;font-size:24px;letter-spacing:-.03em}.panel-head strong{font-size:18px}.trend{height:310px;padding:30px 27px 23px;display:flex;align-items:flex-end;gap:16px;background:linear-gradient(180deg,rgba(103,167,255,.025),transparent)}.month{--c:var(--blue);flex:1;min-width:56px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:9px}.month b{font-size:11px;white-space:nowrap}.bar{width:min(68px,78%);min-height:4px;border-radius:11px 11px 3px 3px;background:linear-gradient(color-mix(in srgb,var(--c) 65%,white),var(--c));opacity:.86}.month span{color:var(--erp-muted,var(--muted));font:800 9px ui-monospace,monospace;text-transform:uppercase}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-top:17px}.section-head p{margin:0;color:var(--erp-muted,var(--muted));font-size:12px}.types{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:6px;border:1px solid var(--erp-line,var(--line));border-radius:17px;background:var(--erp-surface,var(--panel))}.type{--c:var(--blue);min-height:72px;padding:13px 15px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--erp-muted,var(--muted));text-align:left;cursor:pointer}.type:hover,.type.on{border-color:color-mix(in srgb,var(--c) 44%,var(--erp-line,var(--line)));background:color-mix(in srgb,var(--c) 9%,var(--erp-raised,var(--raised)));color:var(--text)}.type b{display:block;font-size:13px}.type small{display:block;margin-top:6px;color:var(--erp-muted,var(--muted));font-size:10px}.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:11px}.tier{--c:var(--blue);min-height:142px;padding:19px;border:1px solid var(--erp-line,var(--line));border-radius:17px;background:var(--erp-surface,var(--panel));color:var(--text);text-align:left;cursor:pointer}.tier:hover,.tier.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,var(--erp-surface,var(--panel)))}.tier span{display:block;color:var(--erp-muted,var(--muted));font:850 9px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.1em}.tier strong{display:block;margin-top:11px;font-size:29px;letter-spacing:-.045em}.tier small{display:block;margin-top:9px;color:var(--erp-muted,var(--muted));font-size:11px;line-height:1.4}.focus{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;border:1px solid var(--erp-line,var(--line));border-radius:17px;background:var(--erp-line,var(--line));overflow:hidden}.focus div{min-height:96px;padding:18px 20px;background:var(--erp-surface,var(--panel))}.focus span{display:block;color:var(--erp-muted,var(--muted));font:850 9px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}.focus strong{display:block;margin-top:10px;font-size:24px;letter-spacing:-.04em}.agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.agent{--c:var(--green);min-height:238px;padding:24px;border:1px solid color-mix(in srgb,var(--c) 24%,var(--erp-line,var(--line)));border-radius:20px;background:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--c) 11%,transparent),transparent 58%),var(--erp-surface,var(--panel));display:flex;flex-direction:column}.agent h3{margin:0;font-size:21px}.agent-money{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0}.agent-money span{padding:13px;border:1px solid var(--erp-line,var(--line));border-radius:12px;background:rgba(7,10,16,.25);color:var(--erp-muted,var(--muted));font-size:9px;text-transform:uppercase;letter-spacing:.08em}.agent-money b{display:block;margi @media(max-width:900px){.kpis{grid-template-columns:1fr}.types{grid-template-columns:1fr 1fr}.focus{grid-template-columns:1fr 1fr}.trend{overflow-x:auto}.month{min-width:80px}}@media(max-width:650px){.shell{padding:16px 12px 70px}.header{align-items:flex-start;flex-direction:column}.types,.focus{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}.agent-money{grid-template-columns:1fr}}

<body>
<main class="shell" data-piura-keep-full>
 <header class="header"><div><small>ФОНД · ПОДПИСКИ И АГЕНТЫ</small><h1>Друг</h1></div><div class="sync" id="sync"><i></i><span>Загрузка Google Sheets</span><button class="reload" id="reload" title="Обновить" aria-label="Обновить">↻</button></div></header>
 <section class="kpis" id="kpis"></section>
 <section class="panel"><div class="panel-head"><div><span>Динамика поступлений</span><h2>Оплаты по месяцам</h2></div><strong id="trendTotal"></strong></div><div class="trend" id="trend"></div></section>
 <header class="section-head"><div><span>Структура столбца E</span><h2>Подписки и донаты</h2></div><p>Сначала выберите тип, затем сумму</p></header>
 <nav class="types" id="types" aria-label="Тип платежа"></nav><section class="tiers" id="tiers"></section><section class="focus" id="focus"></section>
 <header class="section-head"><div><span>Вклад команды</span><h2>Агенты</h2></div><p id="agentCaption"></p></header>
 <section class="agents" id="agents"></section>
</main>
<script>
const ID='167qHytXogtUN8iWVNhOc149oDR2k_0wqGjmbQOx_Db4',SHEET='Подписчики ',CACHE='piura_cache_friend_analytics_v3';let model=null,selectedType='all',selectedTier='all';
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
const number=value=>{const normalized=String(value??'').replace(/\s/g,'').replace(/[$₽]|р\./gi,'').replace(/,(?=\d{1,2}$)/,'.').replace(/,/g,'');const parsed=parseFloat(normalized);return Number.isFinite(parsed)?parsed:0};
const money=value=>Number(value||0).toLocaleString('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0});
function csvRows(text){const rows=[];let row=[],cell='',quoted=false;for(let index=0;index<text.length;index++){const char=text[index],next=text[index+1];if(char==='"'&&quoted&&next==='"'){cell+='"';index++}else if(char==='"')quoted=!quoted;else if(char===','&&!quoted){row.push(cell);cell=''}else if((char==='\n'||char==='\r')&&!quoted){if(char==='\r'&&next==='\n')index++;row.push(cell);if(row.some(value=>String(value).trim()))rows.push(row);row=[];cell=''}else cell+=char}row.push(cell);if(row.some(value=>String(value).trim()))rows.push(row);return rows}
function jsonp(){return new Promise((resolve,reject)=>{const callback='friend_'+Date.now(),script=document.createElement('script'),timer=setTimeout(()=>done(new Error('timeout')),18000);function done(error,rows){clearTimeout(timer);delete window[callback];script.remove();error?reject(error):resolve(rows)}window[callback]=result=>result?.status==='ok'?done(null,(result.table?.rows||[]).map(row=>(row.c||[]).map(cell=>cell?(cell.f??cell.v??''):''))):done(new Error('Sheets'));script.onerror=()=>done(new Error('network'));script.src=`https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?tqx=responseHandler:${callback}&sheet=${encodeURIComponent(SHEET)}&t=${Date.now()}`;document.head.appendChild(script)})}
async function readSheet(){try{const response=await fetch(`https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET)}&t=${Date.now()}`);if(!response.ok)throw new Error(String(response.status));return csvRows(await response.text())}catch(error){return jsonp()}}
const TYPES={cash:{label:'Наличные платежи',card:'Наличный платёж'},once:{label:'Разовые донаты',card:'Разовый донат'},subscription:{label:'Подписки',card:'Подписка'},monthly:{label:'Ежемесячные донаты',card:'Ежемесячный донат'}};
function parse(rows){const headerIndex=rows.findIndex(row=>row.some(cell=>/подписчик/i.test(String(cell))));if(headerIndex<0)throw new Error('Нет заголовка «Подписчик»');const header=rows[headerIndex].map(value=>String(value||'').trim()),find=(pattern,fallback)=>{const index=header.findIndex(value=>pattern.test(value.toLocaleLowerCase('ru')));return index>=0?index:fallback},nameI=find(/подписчик/,1),dateI=find(/^дата$/,2),agentI=find(/агент/,3),sumI=find(/сумм/,4),monthCols=[];header.forEach((label,index)=>{if(/^(дек|янв|фев|мар|апр|май|июн|июл|авг|сен|окт|ноя)/i.test(label))monthCols.push({index,label})});let totalRow=null,currentType='cash';const sectionMap={'наличные платежи':'cash','разовый донат':'once','подписки':'subscription','ежемесячный донат':'monthly'},people=[];rows.slice(headerIndex+1).forEach(row=>{const name=String(row[nameI]||'').trim(),normalized=name.toLocaleLowerCase('ru'),date=String(row[dateI]||'').trim();if(sectionMap[normalized]){currentType=sectionMap[normalized];return}if(/^итого$/i.test(name)){totalRow=row;return}if(!name)return;const rawAgent=String(row[agentI]||'').trim(),agent=!rawAgent||rawAgent==='-'?'Без агента':rawAgent,base=number(row[sumI]),values=monthCols.map(column=>number(row[column.index]));people.push({name,date,agent,type:currentType,base,values,lifetime:values.reduce((sum,value)=>sum+value,0)})});const months=monthCols.map((column,index)=>({label:column.label,amount:totalRow?number(totalRow[column.index]):people.reduce((sum,person)=>sum+person.values[index],0)}));return{people,months,at:Date.now()}}
function tierKey(value){return String(Number(value)||0)}function tierName(value){return Number(value)?money(value):'Без суммы'}
function render(){if(!model)return;const people=model.people||[],baseTotal=people.reduce((sum,person)=>sum+person.base,0),agentsAll=[...new Set(people.map(person=>person.agent).filter(agent=>agent!=='Без агента'))],colors=['#67a7ff','#49d8a3','#aa7cff','#ff9873'];document.getElementById('kpis').innerHTML=[["Подписчиков и доноров",people.length,'все заполненные строки столбца B','#67a7ff'],['Сумма по базе',money(baseTotal),'точная сумма столбца E','#49d8a3'],['Агентов',agentsAll.length,'уникальные имена без пустых значений','#aa7cff']].map(item=>`<article class="kpi" style="--c:${item[3]}"><span>${item[0]}</span><strong>${item[1]}</strong><small>${item[2]}</small></article>`).join('');const max=Math.max(1,...model.months.map(month=>month.amount)),historyTotal=model.months.reduce((sum,month)=>sum+month.amount,0);document.getElementById('trendTotal').textContent=money(historyTotal);document.getElementById('trend').innerHTML=model.months.map((month,index)=>`<div class="month" style="--c:${colors[index%colors.length]}" title="${esc(month.label)} · ${money(month.amount)}"><b>${money(month.amount)}</b><i class="bar" style="height:${Math.max(4,month.amount/max*205)}px"></i><span>${esc(month.label)}</span></div>`).join('');const typeOptions=[{key:'all',label:'Вся база'},...Object.entries(TYPES).map(([key,value])=>({key,label:value.label}))];document.getElementById('types').innerHTML=typeOptions.map((type,index)=>{const rows=type.key==='all'?people:people.filter(person=>person.type===type.key),sum=rows.reduce((total,person)=>total+person.base,0);return `<button class="type ${selectedType===type.key?'on':''}" style="--c:${colors[index%colors.length]}" data-type="${type.key}"><b>${type.label}</b><small>${rows.length} чел. · ${money(sum)}</small></button>`}).join('');document.querySelectorAll('[data-type]').forEach(button=>button.onclick=()=>{selectedType=button.dataset.type;selectedTier='all';render()});const typed=selectedType==='all'?people:people.filter(person=>person.type===selectedType),typedTotal=typed.reduce((sum,person)=>sum+person.base,0),grouped=new Map();typed.forEach(person=>{const key=tierKey(person.base),tier=grouped.get(key)||{value:person.base,people:[],sum:0};tier.people.push(person);tier.sum+=person.base;grouped.set(key,tier)});const tiers=[{key:'all',value:'all',people:typed,sum:typedTotal},...[...grouped.entries()].sort((a,b)=>Number(a[0])-Number(b[0])).map(([key,tier])=>({key,...tier}))],typeLabel=selectedType==='all'?'Столбец E':TYPES[selectedType].card;document.getElementById('tiers').innerHTML=tiers.map((tier,index)=>`<button class="tier ${String(selectedTier)===String(tier.key)?'on':''}" style="--c:${colors[index%colors.length]}" data-tier="${tier.key}"><span>${tier.key==='all'?typeLabel:TYPES[selectedType]?.card||'Сумма из E'}</span><strong>${tier.key==='all'?'Все суммы':tierName(tier.value)}</strong><small>${tier.people.length} чел. · ${money(tier.sum)} по столбцу E</small></button>`).join('');document.querySelectorAll('[data-tier]').forEach(button=>button.onclick=()=>{selectedTier=button.dataset.tier;render()});const chosen=selectedTier==='all'?typed:typed.filter(person=>tierKey(person.base)===selectedTier),chosenTotal=chosen.reduce((sum,person)=>sum+person.base,0),chosenLifetime=chosen.reduce((sum,person)=>sum+person.lifetime,0);document.getElementById('focus').innerHTML=[['Тип',selectedType==='all'?'Вся база':TYPES[selectedType].label],['Людей',chosen.length],['Столбец E',money(chosenTotal)],['Получено',money(chosenLifetime)]].map(item=>`<div><span>${item[0]}</span><strong>${item[1]}</strong></div>`).join('');const agents=new Map();chosen.filter(person=>person.agent!=='Без агента').forEach(person=>{const agent=agents.get(person.agent)||{name:person.agent,people:0,monthly:0,lifetime:0};agent.people++;agent.monthly+=person.base;agent.lifetime+=person.lifetime;agents.set(person.agent,agent)});const sorted=[...agents.values()].sort((a,b)=>b.lifetime-a.lifetime||b.monthly-a.monthly),agentsLifetime=sorted.reduce((sum,agent)=>sum+agent.lifetime,0);document.getElementById('agentCaption').textContent=`${sorted.length} агентов · ${money(agentsLifetime)} фактически получено`;document.getElementById('agents').innerHTML=sorted.map((agent,index)=>{const share=chosenLifetime?agent.lifetime/chosenLifetime*100:0,average=agent.people?agent.monthly/agent.people:0;return `<article class="agent" style="--c:${colors[index%colors.length]}"><h3>${esc(agent.name)}</h3><div class="agent-money"><span>Сумма из E<b>${money(agent.monthly)}</b></span><span>Получено за период<b>${money(agent.lifetime)}</b></span></div><div class="agent-grid"><span>Людей<b>${agent.people}</b></span><span>Средняя E<b>${money(average)}</b></span><span>Доля поступлений<b>${share.toFixed(1)}%</b></span></div></article>`}).join('')||'<div class="empty">Для выбранного среза агентов нет</div>'}
async function load(force=false){const sync=document.getElementById('sync');sync.className='sync';sync.querySelector('span').textContent='Загрузка Google Sheets';if(!force){try{const cached=JSON.parse(localStorage.getItem(CACHE)||'null');if(cached){model=cached;render()}}catch{}}try{model=parse(await readSheet());localStorage.setItem(CACHE,JSON.stringify(model));render();sync.className='sync ok';sync.querySelector('span').textContent='Данные обновлены'}catch(error){sync.className='sync error';sync.querySelector('span').textContent=model?'Сохранённый снимок':'Данные недоступны';console.warn(error)}}
document.getElementById('reload').onclick=()=>load(true);load();
</script>
