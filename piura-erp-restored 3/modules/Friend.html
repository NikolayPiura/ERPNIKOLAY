<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Друг</title>
<style>
:root{color-scheme:dark;--bg:#070a10;--panel:#10151e;--raised:#161d28;--line:rgba(255,255,255,.09);--text:#f3f6fa;--muted:#8290a4;--blue:#67a7ff;--green:#49d8a3;--violet:#aa7cff;--orange:#ff9873}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--erp-bg,var(--bg));color:var(--erp-text,var(--text));font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select{font:inherit}.shell{width:100%;padding:38px clamp(24px,4vw,68px) 100px;display:grid;gap:22px}.header{min-height:166px;padding:30px 34px;border:1px solid rgba(73,216,163,.25);border-radius:24px;background:radial-gradient(circle at 85% 0,rgba(103,167,255,.15),transparent 42%),linear-gradient(120deg,rgba(73,216,163,.1),transparent 45%),var(--erp-surface,var(--panel));display:flex;align-items:end;justify-content:space-between}.header small{color:var(--green);font:900 9px ui-monospace,monospace;letter-spacing:.17em}.header h1{margin:10px 0 0;font-size:clamp(48px,5.4vw,78px);line-height:.86;letter-spacing:-.07em}.sync{display:flex;align-items:center;gap:10px}.sync>span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.sync i{width:8px;height:8px;border-radius:50%;background:#f3c861}.sync.ok i{background:var(--green)}.sync.error i{background:#ff7380}.reload{width:42px;height:42px;border:1px solid var(--erp-line,var(--line));border-radius:12px;background:var(--erp-raised,var(--raised));color:var(--text);cursor:pointer;font-size:19px}.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.kpi{--c:var(--blue);min-height:154px;padding:25px;border:1px solid color-mix(in srgb,var(--c) 26%,var(--erp-line,var(--line)));border-radius:20px;background:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--c) 10%,transparent),transparent 58%),var(--erp-surface,var(--panel));display:flex;flex-direction:column;justify-content:space-between}.kpi span{color:var(--erp-muted,var(--muted));font:900 9px ui-monospace,monospace;letter-spacing:.13em;text-transform:uppercase}.kpi strong{font-size:clamp(38px,4.2vw,62px);letter-spacing:-.06em;line-height:.95}.panel{border:1px solid var(--erp-line,var(--line));border-radius:22px;background:var(--erp-surface,var(--panel));overflow:hidden}.panel-head{min-height:74px;padding:19px 23px;border-bottom:1px solid var(--erp-line,var(--line));display:flex;align-items:center;justify-content:space-between}.panel-head h2,.section-head h2{margin:0;font-size:25px;letter-spacing:-.035em}.panel-head strong{font-size:19px}.trend{height:330px;padding:30px 27px 23px;display:flex;align-items:flex-end;gap:16px;background:linear-gradient(180deg,rgba(73,216,163,.035),transparent)}.month{flex:1;min-width:56px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:10px}.month b{font-size:13px;white-space:nowrap}.bar{width:min(72px,78%);min-height:4px;border-radius:12px 12px 3px 3px;background:linear-gradient(#7aebbf,var(--green));opacity:.9}.month span{color:var(--erp-muted,var(--muted));font:850 9px ui-monospace,monospace;text-transform:uppercase}.section{padding:26px;border:1px solid var(--erp-line,var(--line));border-radius:22px;background:var(--erp-surface,var(--panel))}.section-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{position:relative;display:grid;gap:8px}.field span{color:var(--green);font:850 8px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}.field select{appearance:none;width:100%;height:64px;padding:0 48px 0 18px;border:1px solid rgba(103,167,255,.25);border-radius:15px;background:#0a0f17;color:var(--text);font-weight:850;outline:none;cursor:pointer}.field:after{content:"⌄";position:absolute;right:18px;bottom:21px;color:var(--blue);pointer-events:none}.field select:focus{border-color:var(--green)}.focus{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:18px;border:1px solid var(--erp-line,var(--line));border-radius:16px;background:var(--erp-line,var(--line));overflow:hidden}.focus div{min-height:102px;padding:19px 21px;background:rgba(7,10,16,.35)}.focus span{display:block;color:var(--erp-muted,var(--muted));font:850 9px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}.focus strong{display:block;margin-top:12px;font-size:27px;letter-spacing:-.045em}.people-list{overflow:hidden;border:1px solid var(--line);border-radius:17px;background:#0a0f17}.person-row{min-height:88px;padding:15px 19px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(180px,1.3fr) minmax(135px,.8fr) minmax(130px,.75fr) minmax(115px,.65fr);align-items:center;gap:18px}.person-row:last-child{border-bottom:0}.person-row:hover{background:rgba(73,216,163,.025)}.person-row>div{display:grid;gap:5px}.person-row span{color:var(--muted);font-size:8px;font-weight:800}.person-row h3{margin:0;font-size:14px}.person-row b{font-size:11px}.person-row>strong{font-size:18px;text-align:right}.type-pill{width:max-content;padding:6px 8px;border-radius:8px;background:rgba(103,167,255,.09);color:var(--blue)!important}.agent-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.agent-card{min-height:170px;padding:20px;border:1px solid rgba(73,216,163,.2);border-radius:17px;background:#0a0f17;display:grid;align-content:space-between;gap:20px}.agent-card header{display:flex;justify-content:space-between;gap:12px}.agent-card h3{margin:0;font-size:18px}.agent-card header span{color:var(--green);font-size:10px;font-weight:900}.agent-card dl{margin:0;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.agent-card dl div{display:grid;gap:5px}.agent-card dt{color:var(--muted);font-size:8px}.agent-card dd{margin:0;font-size:13px;font-weight:850}.empty{padding:48px;color:var(--erp-muted,var(--muted));text-align:center}
@media(max-width:900px){.kpis,.agent-grid{grid-template-columns:1fr}.trend{overflow-x:auto}.month{min-width:80px}.filters,.focus{grid-template-columns:1fr}.person-row{grid-template-columns:1fr 1fr}}@media(max-width:650px){.shell{padding:16px 12px 70px}.header{padding:22px}.section{padding:18px}.section-head{align-items:flex-start;flex-direction:column}.person-row{grid-template-columns:1fr}.person-row>strong{text-align:left}}
</style>
</head>
<body>
<main class="shell" data-piura-keep-full>
 <header class="header"><div><small>СООБЩЕСТВО И РЕГУЛЯРНАЯ ПОДДЕРЖКА</small><h1>Друг</h1></div><div class="sync" id="sync"><i></i><span>Загрузка данных</span><button class="reload" id="reload" title="Обновить" aria-label="Обновить">↻</button></div></header>
 <section class="kpis" id="kpis"></section>
 <section class="panel"><div class="panel-head"><h2>Оплаты по месяцам</h2><strong id="trendTotal"></strong></div><div class="trend" id="trend"></div></section>
 <section class="section"><header class="section-head"><h2>Подписки и донаты</h2><strong>Умный срез базы</strong></header><div class="filters"><label class="field"><span>Тип платежа</span><select id="typeSelect"></select></label><label class="field"><span>Сумма в месяц</span><select id="tierSelect"></select></label></div><div class="focus" id="focus"></div></section>
 <section class="section"><header class="section-head"><h2>Все подписки</h2><strong id="peopleCaption"></strong></header><div class="people-list" id="peopleRows"></div></section>
 <section class="section"><header class="section-head"><h2>Агенты</h2><strong id="agentCaption"></strong></header><div class="agent-grid" id="agents"></div></section>
</main>
<script>
const ID='167qHytXogtUN8iWVNhOc149oDR2k_0wqGjmbQOx_Db4',SHEET='Подписчики ',CACHE='piura_cache_friend_analytics_v4';let model=null,selectedType='all',selectedTier='all';
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
const number=value=>{const normalized=String(value??'').replace(/\s/g,'').replace(/[$₽]|р\./gi,'').replace(/,(?=\d{1,2}$)/,'.').replace(/,/g,'');const parsed=parseFloat(normalized);return Number.isFinite(parsed)?parsed:0};
const money=value=>Number(value||0).toLocaleString('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0});
function csvRows(text){const rows=[];let row=[],cell='',quoted=false;for(let index=0;index<text.length;index++){const char=text[index],next=text[index+1];if(char==='"'&&quoted&&next==='"'){cell+='"';index++}else if(char==='"')quoted=!quoted;else if(char===','&&!quoted){row.push(cell);cell=''}else if((char==='\n'||char==='\r')&&!quoted){if(char==='\r'&&next==='\n')index++;row.push(cell);if(row.some(value=>String(value).trim()))rows.push(row);row=[];cell=''}else cell+=char}row.push(cell);if(row.some(value=>String(value).trim()))rows.push(row);return rows}
function jsonp(){return new Promise((resolve,reject)=>{const callback='friend_'+Date.now(),script=document.createElement('script'),timer=setTimeout(()=>done(new Error('timeout')),18000);function done(error,rows){clearTimeout(timer);delete window[callback];script.remove();error?reject(error):resolve(rows)}window[callback]=result=>result?.status==='ok'?done(null,(result.table?.rows||[]).map(row=>(row.c||[]).map(cell=>cell?(cell.f??cell.v??''):''))):done(new Error('Sheets'));script.onerror=()=>done(new Error('network'));script.src=`https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?tqx=responseHandler:${callback}&sheet=${encodeURIComponent(SHEET)}&t=${Date.now()}`;document.head.appendChild(script)})}
async function readSheet(){try{const response=await fetch(`https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET)}&t=${Date.now()}`);if(!response.ok)throw new Error(String(response.status));return csvRows(await response.text())}catch(error){return jsonp()}}
const TYPES={cash:'Наличные платежи',once:'Разовые донаты',subscription:'Подписки',monthly:'Ежемесячные донаты'};
function parse(rows){const headerIndex=rows.findIndex(row=>row.some(cell=>/подписчик/i.test(String(cell))));if(headerIndex<0)throw new Error('Нет заголовка «Подписчик»');const header=rows[headerIndex].map(value=>String(value||'').trim()),find=(pattern,fallback)=>{const index=header.findIndex(value=>pattern.test(value.toLocaleLowerCase('ru')));return index>=0?index:fallback},nameI=find(/подписчик/,1),dateI=find(/^дата$/,2),agentI=find(/агент/,3),sumI=find(/сумм/,4),monthCols=[];header.forEach((label,index)=>{if(/^(дек|янв|фев|мар|апр|май|июн|июл|авг|сен|окт|ноя)/i.test(label))monthCols.push({index,label})});let totalRow=null,currentType='cash';const sectionMap={'наличные платежи':'cash','разовый донат':'once','подписки':'subscription','ежемесячный донат':'monthly'},people=[];rows.slice(headerIndex+1).forEach(row=>{const name=String(row[nameI]||'').trim(),normalized=name.toLocaleLowerCase('ru'),date=String(row[dateI]||'').trim();if(sectionMap[normalized]){currentType=sectionMap[normalized];return}if(/^итого$/i.test(name)){totalRow=row;return}if(!name)return;const rawAgent=String(row[agentI]||'').trim(),agent=!rawAgent||rawAgent==='-'?'Без агента':rawAgent,base=number(row[sumI]),values=monthCols.map(column=>number(row[column.index]));people.push({name,date,agent,type:currentType,base,values,lifetime:values.reduce((sum,value)=>sum+value,0)})});const months=monthCols.map((column,index)=>({label:column.label,amount:totalRow?number(totalRow[column.index]):people.reduce((sum,person)=>sum+person.values[index],0)}));return{people,months,at:Date.now()}}
function tierKey(value){return String(Number(value)||0)}
function selectedPeople(){const typed=selectedType==='all'?model.people:model.people.filter(person=>person.type===selectedType);return selectedTier==='all'?typed:typed.filter(person=>tierKey(person.base)===selectedTier)}
function renderFilters(){const people=model.people,typed=selectedType==='all'?people:people.filter(person=>person.type===selectedType),groups=new Map();typed.forEach(person=>{const key=tierKey(person.base);groups.set(key,(groups.get(key)||0)+1)});const typeSelect=document.getElementById('typeSelect'),tierSelect=document.getElementById('tierSelect');typeSelect.innerHTML=`<option value="all">Вся база</option>${Object.entries(TYPES).map(([key,label])=>`<option value="${key}">${label}</option>`).join('')}`;typeSelect.value=selectedType;tierSelect.innerHTML=`<option value="all">Все суммы</option>${[...groups.keys()].sort((a,b)=>Number(b)-Number(a)).map(key=>`<option value="${key}">${Number(key)?money(key):'Без суммы'} · ${groups.get(key)} чел.</option>`).join('')}`;tierSelect.value=[...groups.keys(),'all'].includes(selectedTier)?selectedTier:'all';selectedTier=tierSelect.value;typeSelect.onchange=()=>{selectedType=typeSelect.value;selectedTier='all';render()};tierSelect.onchange=()=>{selectedTier=tierSelect.value;render()}}
function render(){
  if(!model)return;const people=model.people||[],monthly=people.reduce((sum,person)=>sum+person.base,0),agentsAll=[...new Set(people.map(person=>person.agent).filter(agent=>agent!=='Без агента'))];
  document.getElementById('kpis').innerHTML=[["Подписчики и доноры",people.length,'#67a7ff'],['Регулярно в месяц',money(monthly),'#49d8a3'],['Активные агенты',agentsAll.length,'#aa7cff']].map(item=>`<article class="kpi" style="--c:${item[2]}"><span>${item[0]}</span><strong>${item[1]}</strong></article>`).join('');
  const max=Math.max(1,...model.months.map(month=>month.amount)),historyTotal=model.months.reduce((sum,month)=>sum+month.amount,0);document.getElementById('trendTotal').textContent=money(historyTotal);document.getElementById('trend').innerHTML=model.months.map(month=>`<div class="month" title="${esc(month.label)} · ${money(month.amount)}"><b>${money(month.amount)}</b><i class="bar" style="height:${Math.max(4,month.amount/max*220)}px"></i><span>${esc(month.label)}</span></div>`).join('');
  renderFilters();const chosen=selectedPeople().sort((a,b)=>b.base-a.base||b.lifetime-a.lifetime),chosenMonthly=chosen.reduce((sum,person)=>sum+person.base,0),chosenLifetime=chosen.reduce((sum,person)=>sum+person.lifetime,0);document.getElementById('focus').innerHTML=[['Людей',chosen.length],['В месяц',money(chosenMonthly)],['Получено',money(chosenLifetime)]].map(item=>`<div><span>${item[0]}</span><strong>${item[1]}</strong></div>`).join('');
  document.getElementById('peopleCaption').textContent=`${chosen.length} человек · ${money(chosenMonthly)} / мес.`;document.getElementById('peopleRows').innerHTML=chosen.map(person=>`<article class="person-row"><div><h3>${esc(person.name)}</h3><span>${esc(person.date||'Дата не указана')}</span></div><div><span class="type-pill">${esc(TYPES[person.type]||person.type)}</span><b>${esc(person.agent)}</b></div><div><span>ПОЛУЧЕНО</span><b>${money(person.lifetime)}</b></div><strong>${money(person.base)}<span>/ месяц</span></strong></article>`).join('')||'<div class="empty">В выбранном срезе подписок нет</div>';
  const agents=new Map();chosen.filter(person=>person.agent!=='Без агента').forEach(person=>{const agent=agents.get(person.agent)||{name:person.agent,people:0,monthly:0,lifetime:0};agent.people++;agent.monthly+=person.base;agent.lifetime+=person.lifetime;agents.set(person.agent,agent)});const sorted=[...agents.values()].sort((a,b)=>b.lifetime-a.lifetime||b.monthly-a.monthly),agentsLifetime=sorted.reduce((sum,agent)=>sum+agent.lifetime,0);document.getElementById('agentCaption').textContent=`${sorted.length} агентов · ${money(agentsLifetime)}`;document.getElementById('agents').innerHTML=sorted.map(agent=>{const share=chosenLifetime?agent.lifetime/chosenLifetime*100:0;return`<article class="agent-card"><header><h3>${esc(agent.name)}</h3><span>${share.toFixed(1)}%</span></header><dl><div><dt>Людей</dt><dd>${agent.people}</dd></div><div><dt>В месяц</dt><dd>${money(agent.monthly)}</dd></div><div><dt>Получено</dt><dd>${money(agent.lifetime)}</dd></div><div><dt>Средний</dt><dd>${money(agent.people?agent.monthly/agent.people:0)}</dd></div></dl></article>`}).join('')||'<div class="empty">Для выбранного среза агентов нет</div>';
}
async function load(force=false){const sync=document.getElementById('sync');sync.className='sync';sync.querySelector('span').textContent='Загрузка данных';if(!force){try{const cached=JSON.parse(localStorage.getItem(CACHE)||'null');if(cached){model=cached;render()}}catch{}}try{model=parse(await readSheet());localStorage.setItem(CACHE,JSON.stringify(model));render();sync.className='sync ok';sync.querySelector('span').textContent='Данные обновлены'}catch(error){sync.className='sync error';sync.querySelector('span').textContent=model?'Сохранённый снимок':'Данные недоступны';console.warn(error)}}
document.getElementById('reload').onclick=()=>load(true);load();
</script>
</body>
</html>
