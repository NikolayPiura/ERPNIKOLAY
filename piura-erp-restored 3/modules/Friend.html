<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Друг</title>
<style>
:root{color-scheme:dark;--bg:#070a10;--panel:#10151e;--raised:#161d28;--line:rgba(255,255,255,.09);--text:#f3f6fa;--muted:#8290a4;--blue:#67a7ff;--green:#49d8a3;--violet:#aa7cff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--erp-bg,var(--bg));color:var(--erp-text,var(--text));font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select{font:inherit}.shell{width:100%;padding:42px clamp(24px,4vw,72px) 110px;display:grid;gap:28px}.header{min-height:150px;padding:34px 38px;border:1px solid var(--erp-line,var(--line));border-radius:24px;background:var(--erp-surface,var(--panel));display:flex;align-items:center;justify-content:space-between}.header h1{margin:0;font-size:clamp(52px,5.6vw,82px);line-height:.86;letter-spacing:-.07em}.sync{display:flex;align-items:center;gap:10px}.sync>span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.sync i{width:8px;height:8px;border-radius:50%;background:#f3c861}.sync.ok i{background:var(--green)}.sync.error i{background:#ff7380}.reload{width:44px;height:44px;border:1px solid var(--erp-line,var(--line));border-radius:13px;background:var(--erp-raised,var(--raised));color:var(--text);cursor:pointer;font-size:19px}.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.kpi{--c:var(--blue);min-height:138px;padding:26px 28px;border:1px solid var(--erp-line,var(--line));border-radius:20px;background:var(--erp-surface,var(--panel));display:flex;flex-direction:column;justify-content:space-between}.kpi span{color:var(--erp-muted,var(--muted));font-size:11px;font-weight:750}.kpi strong{color:var(--c);font-size:clamp(38px,4vw,58px);letter-spacing:-.06em;line-height:.92}.panel{border:1px solid var(--erp-line,var(--line));border-radius:22px;background:var(--erp-surface,var(--panel));overflow:hidden}.panel-head{min-height:84px;padding:22px 28px;border-bottom:1px solid var(--erp-line,var(--line));display:flex;align-items:center;justify-content:space-between;gap:20px}.panel-head h2{margin:0;font-size:26px;letter-spacing:-.04em}.panel-head strong{font-size:20px}.trend{height:320px;padding:36px 30px 26px;display:flex;align-items:flex-end;gap:18px}.month{flex:1;min-width:58px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:11px}.month b{font-size:12px;white-space:nowrap}.bar{width:min(70px,76%);min-height:4px;border-radius:12px 12px 3px 3px;background:var(--green)}.month span{color:var(--erp-muted,var(--muted));font-size:10px;font-weight:800;text-transform:uppercase}.agent-toolbar{display:flex;align-items:center;gap:10px}.agent-toolbar select{appearance:none;height:46px;padding:0 38px 0 15px;border:1px solid rgba(103,167,255,.25);border-radius:12px;background:#0a0f17;color:var(--text);font-weight:800;cursor:pointer}.agent-list{overflow-x:auto}.agent-labels,.agent-row{min-width:780px;display:grid;grid-template-columns:minmax(230px,1.3fr) minmax(100px,.45fr) minmax(150px,.72fr) minmax(150px,.72fr) minmax(100px,.45fr);align-items:center;gap:24px}.agent-labels{min-height:48px;padding:0 28px;color:var(--muted);font-size:9px;font-weight:850;text-transform:uppercase}.agent-row{min-height:92px;padding:18px 28px;border-top:1px solid var(--line)}.agent-row:hover{background:rgba(73,216,163,.025)}.agent-row h3{margin:0;font-size:17px}.agent-row span{color:var(--muted);font-size:11px}.agent-row strong{font-size:17px}.agent-row b{color:var(--green);font-size:15px}.agent-share{display:flex;align-items:center;gap:10px}.agent-share i{width:44px;height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.agent-share i:after{content:"";display:block;width:var(--share);height:100%;background:var(--blue)}.empty{padding:48px;color:var(--erp-muted,var(--muted));text-align:center}
@media(max-width:900px){.kpis{grid-template-columns:1fr}.trend{overflow-x:auto}.month{min-width:76px}.panel-head{align-items:flex-start;flex-direction:column}.agent-toolbar{width:100%;flex-wrap:wrap}.agent-toolbar select{flex:1}}@media(max-width:650px){.shell{padding:16px 12px 70px}.header{padding:24px}.panel-head{padding:20px}.kpi{min-height:122px}}
</style>
</head>
<body>
<main class="shell" data-piura-keep-full>
 <header class="header"><h1>Друг</h1><div class="sync" id="sync"><i></i><span>Загрузка данных</span><button class="reload" id="reload" title="Обновить" aria-label="Обновить">↻</button></div></header>
 <section class="kpis" id="kpis"></section>
 <section class="panel"><div class="panel-head"><h2>Оплаты по месяцам</h2><strong id="trendTotal"></strong></div><div class="trend" id="trend"></div></section>
 <section class="panel"><div class="panel-head"><h2>Агенты</h2><div class="agent-toolbar"><select id="typeSelect" aria-label="Тип платежа"></select><select id="tierSelect" aria-label="Сумма в месяц"></select></div></div><div class="agent-list"><div class="agent-labels"><span>Агент</span><span>Людей</span><span>В месяц</span><span>Получено</span><span>Доля</span></div><div id="agents"></div></div></section>
</main>
<script>
const ID='167qHytXogtUN8iWVNhOc149oDR2k_0wqGjmbQOx_Db4',SHEET='Подписчики ',CACHE='piura_cache_friend_analytics_v4';let model=null,selectedType='all',selectedTier='all';
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
const number=value=>{const normalized=String(value??'').replace(/\s/g,'').replace(/[$₽]|р\./gi,'').replace(/,(?=\d{1,2}$)/,'.').replace(/,/g,'');const parsed=parseFloat(normalized);return Number.isFinite(parsed)?parsed:0};
const money=value=>Number(value||0).toLocaleString('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0});
function csvRows(text){const rows=[];let row=[],cell='',quoted=false;for(let index=0;index<text.length;index++){const char=text[index],next=text[index+1];if(char==='"'&&quoted&&next==='"'){cell+='"';index++}else if(char==='"')quoted=!quoted;else if(char===','&&!quoted){row.push(cell);cell=''}else if((char==='\n'||char==='\r')&&!quoted){if(char==='\r'&&next==='\n')index++;row.push(cell);if(row.some(value=>String(value).trim()))rows.push(row);row=[];cell=''}else cell+=char}row.push(cell);if(row.some(value=>String(value).trim()))rows.push(row);return rows}
function jsonp(){return new Promise((resolve,reject)=>{const callback='friend_'+Date.now(),script=document.createElement('script'),timer=setTimeout(()=>done(new Error('timeout')),18000);function done(error,rows){clearTimeout(timer);delete window[callback];script.remove();error?reject(error):resolve(rows)}window[callback]=result=>result?.status==='ok'?done(null,(result.table?.rows||[]).map(row=>(row.c||[]).map(cell=>cell?(cell.f??cell.v??''):''))):done(new Error('Sheets'));script.onerror=()=>done(new Error('network'));script.src=`https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?tqx=responseHandler:${callback}&sheet=${encodeURIComponent(SHEET)}&t=${Date.now()}`;document.head.appendChild(script)})}
async function readSheet(){try{const response=await fetch(`https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET)}&t=${Date.now()}`);if(!response.ok)throw new Error(String(response.status));return csvRows(await response.text())}catch(error){return jsonp()}}
const TYPES={cash:'Наличные платежи',once:'Разовые донаты',subscription:'Подписки',monthly:'Ежемесячные донаты'};
function parse(rows){const headerIndex=rows.findIndex(row=>row.some(cell=>/подписчик/i.test(String(cell))));if(headerIndex<0)throw new Error('Нет заголовка «Подписчик»');const header=rows[headerIndex].map(value=>String(value||'').trim()),find=(pattern,fallback)=>{const index=header.findIndex(value=>pattern.test(value.toLocaleLowerCase('ru')));return index>=0?index:fallback},nameI=find(/подписчик/,1),dateI=find(/^дата$/,2),agentI=find(/агент/,3),sumI=find(/сумм/,4),monthCols=[];header.forEach((label,index)=>{if(/^(дек|янв|фев|мар|апр|май|июн|июл|авг|сен|окт|ноя)/i.test(label))monthCols.push({index,label})});let totalRow=null,currentType='cash';const sectionMap={'наличные платежи':'cash','разовый донат':'once','подписки':'subscription','ежемесячный донат':'monthly'},people=[];rows.slice(headerIndex+1).forEach(row=>{const name=String(row[nameI]||'').trim(),normalized=name.toLocaleLowerCase('ru'),date=String(row[dateI]||'').trim();if(sectionMap[normalized]){currentType=sectionMap[normalized];return}if(/^итого$/i.test(name)){totalRow=row;return}if(!name)return;const rawAgent=String(row[agentI]||'').trim(),agent=!rawAgent||rawAgent==='-'?'Без агента':rawAgent,base=number(row[sumI]),values=monthCols.map(column=>number(row[column.index]));people.push({name,date,agent,type:currentType,base,values,lifetime:values.reduce((sum,value)=>sum+value,0)})});const months=monthCols.map((column,index)=>({label:column.label,amount:totalRow?number(totalRow[column.index]):people.reduce((sum,person)=>sum+person.values[index],0)}));return{people,months,at:Date.now()}}
function tierKey(value){return String(Number(value)||0)}
function selectedPeople(){const typed=selectedType==='all'?model.people:model.people.filter(person=>person.type===selectedType);return selectedTier==='all'?typed:typed.filter(person=>tierKey(person.base)===selectedTier)}
function renderFilters(){const people=model.people,typed=selectedType==='all'?people:people.filter(person=>person.type===selectedType),groups=new Map();typed.forEach(person=>{const key=tierKey(person.base);groups.set(key,(groups.get(key)||0)+1)});const typeSelect=document.getElementById('typeSelect'),tierSelect=document.getElementById('tierSelect');typeSelect.innerHTML=`<option value="all">Все типы</option>${Object.entries(TYPES).map(([key,label])=>`<option value="${key}">${label}</option>`).join('')}`;typeSelect.value=selectedType;tierSelect.innerHTML=`<option value="all">Все суммы</option>${[...groups.keys()].sort((a,b)=>Number(b)-Number(a)).map(key=>`<option value="${key}">${Number(key)?money(key):'Без суммы'} · ${groups.get(key)}</option>`).join('')}`;tierSelect.value=[...groups.keys(),'all'].includes(selectedTier)?selectedTier:'all';selectedTier=tierSelect.value;typeSelect.onchange=()=>{selectedType=typeSelect.value;selectedTier='all';render()};tierSelect.onchange=()=>{selectedTier=tierSelect.value;render()}}
function render(){if(!model)return;const people=model.people||[],monthly=people.reduce((sum,person)=>sum+person.base,0),agentsAll=[...new Set(people.map(person=>person.agent).filter(agent=>agent!=='Без агента'))];document.getElementById('kpis').innerHTML=[["Людей",people.length,'#67a7ff'],['В месяц',money(monthly),'#49d8a3'],['Агентов',agentsAll.length,'#aa7cff']].map(item=>`<article class="kpi" style="--c:${item[2]}"><span>${item[0]}</span><strong>${item[1]}</strong></article>`).join('');const max=Math.max(1,...model.months.map(month=>month.amount)),historyTotal=model.months.reduce((sum,month)=>sum+month.amount,0);document.getElementById('trendTotal').textContent=money(historyTotal);document.getElementById('trend').innerHTML=model.months.map(month=>`<div class="month"><b>${money(month.amount)}</b><i class="bar" style="height:${Math.max(4,month.amount/max*215)}px"></i><span>${esc(month.label)}</span></div>`).join('');renderFilters();const chosen=selectedPeople(),chosenLifetime=chosen.reduce((sum,person)=>sum+person.lifetime,0),agents=new Map();chosen.filter(person=>person.agent!=='Без агента').forEach(person=>{const agent=agents.get(person.agent)||{name:person.agent,people:0,monthly:0,lifetime:0};agent.people++;agent.monthly+=person.base;agent.lifetime+=person.lifetime;agents.set(person.agent,agent)});const sorted=[...agents.values()].sort((a,b)=>b.lifetime-a.lifetime||b.monthly-a.monthly);document.getElementById('agents').innerHTML=sorted.map(agent=>{const share=chosenLifetime?agent.lifetime/chosenLifetime*100:0;return`<article class="agent-row"><h3>${esc(agent.name)}</h3><strong>${agent.people}</strong><b>${money(agent.monthly)}</b><strong>${money(agent.lifetime)}</strong><span class="agent-share"><i style="--share:${Math.min(100,share)}%"></i>${share.toFixed(1)}%</span></article>`}).join('')||'<div class="empty">Агенты не найдены</div>'}
async function load(force=false){const sync=document.getElementById('sync');sync.className='sync';sync.querySelector('span').textContent='Загрузка данных';if(!force){try{const cached=JSON.parse(localStorage.getItem(CACHE)||'null');if(cached){model=cached;render()}}catch{}}try{model=parse(await readSheet());localStorage.setItem(CACHE,JSON.stringify(model));render();sync.className='sync ok';sync.querySelector('span').textContent='Данные обновлены'}catch(error){sync.className='sync error';sync.querySelector('span').textContent=model?'Сохранённый снимок':'Данные недоступны';console.warn(error)}}
document.getElementById('reload').onclick=()=>load(true);load();
</script>
</body>
</html>
