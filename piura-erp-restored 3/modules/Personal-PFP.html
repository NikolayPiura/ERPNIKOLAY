<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PFP</title>
  <link rel="stylesheet" href="Personal-Sheets.css?v=20260812k"><script src="Personal-Sheets.js?v=20260812k"></script>
</head>
<body>
<main class="ps-app ps-finance-app" data-piura-keep-full>
  <header class="ps-header ps-hero-header"><div class="ps-title"><span>ЛИЧНЫЙ КАПИТАЛ</span><h1>PFP</h1></div><div class="ps-live" id="syncState"><i></i><span>Загрузка</span><button class="ps-refresh" id="refresh" type="button" aria-label="Обновить">↻</button></div></header>
  <nav class="ps-tabs ps-primary-tabs ps-pfp-tabs" id="tabs">
    <button class="ps-tab on" data-tab="portfolio"><i>◈</i><span>PFF</span></button>
    <button class="ps-tab" data-tab="market"><i>↗</i><span>Рынок</span></button>
    <button class="ps-tab" data-tab="gold"><i>◆</i><span>Золото</span></button>
    <button class="ps-tab" data-tab="crypto"><i>₿</i><span>Крипта</span></button>
    <button class="ps-tab" data-tab="stats"><i>⌁</i><span>Стат.</span></button>
    <button class="ps-tab" data-tab="subscriptions"><i>◉</i><span>Подписки</span></button>
    <button class="ps-tab" data-tab="balance"><i>◎</i><span>Баланс</span></button>
  </nav>
  <section id="content"><div class="ps-loading">Собираем капитал</div></section>
</main>
<script>
const S=window.PIURASheet,content=document.getElementById('content'),syncState=document.getElementById('syncState'),COLORS=S.colors;
const SHEETS={portfolio:'2026 (PFF)',market:'2026 (РЫНОК) ',gold:'2026 (ЗОЛОТО)',crypto:'2026 (КРИПТА)',stats:'2026 (СТАТ)',subscriptions:'2026 (ПОДПИСКИ)',balance:'2026 (БАЛАНС)'};
let state={tab:'portfolio'},data=null,serial=0;

function rowsOf(payload){if(payload?.error&&!payload?.table)throw new Error(payload.error);const rows=S.cells(payload);if(!rows.length)throw new Error('Лист пока пуст');return rows}
function findHeader(rows,names){const normalized=names.map(S.normalize);return rows.findIndex(row=>normalized.every(name=>row.some(cell=>S.normalize(S.text(cell)).includes(name))))}
function column(header,...names){const normalized=names.map(S.normalize);let index=header.findIndex(cell=>normalized.includes(S.normalize(S.text(cell))));if(index<0)index=header.findIndex(cell=>normalized.some(name=>S.normalize(S.text(cell)).includes(name)));return index}
function value(row,index){return index>=0?S.text(row[index]):''}
function amount(row,index){return index>=0?S.number(row[index]):0}
function fallback(index,value){return index>=0?index:value}
function command(title,eyebrow,note=''){return `<section class="ps-command ps-reveal"><div class="ps-command-copy"><span>${S.esc(eyebrow)}</span><h2>${S.esc(title)}</h2></div>${note?`<div class="ps-command-note">${S.esc(note)}</div>`:''}</section>`}
function panelTable(title,eyebrow,headers,rows,total=''){
  return `<section class="ps-panel ps-data-panel ps-reveal"><div class="ps-panel-head"><div><span>${S.esc(eyebrow)}</span><h3>${S.esc(title)}</h3></div>${total?`<strong>${S.esc(total)}</strong>`:''}</div><div class="ps-scroll"><table class="ps-table"><thead><tr>${headers.map(item=>`<th>${S.esc(item)}</th>`).join('')}</tr></thead><tbody>${rows.map((row,index)=>`<tr style="--row:${COLORS[index%COLORS.length]}">${row.map((cell,col)=>col===0?`<td><span class="ps-row-name"><i></i>${S.esc(cell)}</span></td>`:`<td>${S.esc(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
}
function assetModel(payload){
  const rows=rowsOf(payload),head=findHeader(rows,['актив']);if(head<0)throw new Error('Не найдена структура активов');const header=rows[head];
  const isPersonal=column(header,'фио')>=0||column(header,'брокер')>=0;
  const isMarket=isPersonal&&S.normalize(value(header,4)).includes('isin'),isGold=isPersonal&&header.length<=5;
  const personal={name:3,type:2,country:-1,risk:-1,currency:-1,liquidity:-1,amount:isMarket?5:4,share:isGold?-1:isMarket?6:5,month:isGold?-1:isMarket?7:6,week:isGold?-1:isMarket?8:7,payout:-1,owner:0,broker:1};
  const institutional={name:0,type:1,country:2,risk:3,currency:4,liquidity:5,amount:6,share:7,month:8,week:9,payout:10,owner:-1,broker:-1};
  const layout=isPersonal?personal:institutional,c={name:fallback(column(header,'актив'),layout.name),type:fallback(column(header,'тип'),layout.type),country:fallback(column(header,'страна'),layout.country),risk:fallback(column(header,'риск'),layout.risk),currency:fallback(column(header,'валюта'),layout.currency),liquidity:fallback(column(header,'ликвидность'),layout.liquidity),amount:fallback(column(header,'сумма'),layout.amount),share:fallback(column(header,'%'),layout.share),month:fallback(column(header,'месяц'),layout.month),week:fallback(column(header,'неделя'),layout.week),payout:fallback(column(header,'выплата'),layout.payout),owner:fallback(column(header,'фио'),layout.owner),broker:fallback(column(header,'брокер'),layout.broker)};
  const items=rows.slice(head+1).map(row=>{const rawShare=amount(row,c.share);return {name:value(row,c.name),type:value(row,c.type),country:value(row,c.country),risk:value(row,c.risk),currency:value(row,c.currency),liquidity:value(row,c.liquidity),amount:amount(row,c.amount),share:rawShare&&Math.abs(rawShare)<=1?rawShare*100:rawShare,month:amount(row,c.month),week:amount(row,c.week),payout:value(row,c.payout),owner:value(row,c.owner),broker:value(row,c.broker)}}).filter(item=>item.name&&S.normalize(item.name)!=='итого'&&(item.amount||item.month||item.week));
  return {items,total:S.sum(items.map(item=>item.amount))};
}
function renderAssets(tab){
  const model=assetModel(data[tab]),items=[...model.items].sort((a,b)=>b.amount-a.amount),top=items.slice(0,12),monthly=S.sum(items.map(item=>item.month)),largest=items[0];
  const title={portfolio:'Piura Family Fund',market:'Рыночный портфель',gold:'Золото',crypto:'Криптовалюта'}[tab],accent={portfolio:'#63a4ff',market:'#43d9a3',gold:'#f4c65d',crypto:'#a779ff'}[tab];
  const metrics=S.metricCards([{label:'Капитал',value:S.compactMoney(model.total),note:title,color:accent},{label:'Активов',value:String(items.length),note:'в текущем портфеле',color:'#43d9a3'},{label:'Крупнейший актив',value:largest?largest.name:'—',note:largest?S.compactMoney(largest.amount):'нет данных',color:'#a779ff'},{label:'Доход в месяц',value:S.compactMoney(monthly),note:'по данным таблицы',color:'#ff8b64'}]);
  const chart=S.lineChart({title:'Архитектура портфеля',subtitle:'Крупнейшие позиции по стоимости',labels:top.map(item=>item.name.length>13?item.name.slice(0,12)+'…':item.name),series:[{label:'Стоимость',values:top.map(item=>item.amount),color:accent}],height:305});
  const cards=`<section class="ps-asset-grid ps-reveal">${items.slice(0,6).map((item,index)=>`<article class="ps-asset-card" style="--accent:${COLORS[index%COLORS.length]}"><div><span>${S.esc(item.type||item.country||'АКТИВ')}</span><strong>${S.esc(item.name)}</strong></div><b>${S.compactMoney(item.amount)}</b><small>${item.share?`${item.share.toLocaleString('ru-RU',{maximumFractionDigits:1})}% портфеля`:S.esc(item.broker||item.currency||item.risk||'')}</small></article>`).join('')}</section>`;
  const rows=items.map(item=>[item.name,item.type||'—',item.owner||item.country||item.broker||'—',item.currency||'USD',S.money(item.amount,'USD',2),item.month?S.money(item.month,'USD',2):'—']);
  content.innerHTML=command(title,'ИНВЕСТИЦИОННЫЙ КОНТУР','Google Sheets · только чтение')+metrics+chart+cards+panelTable('Все активы','СТРУКТУРА',['Актив','Тип','Контур','Валюта','Стоимость','В месяц'],rows,S.compactMoney(model.total));
}
function statsModel(payload){
  const rows=rowsOf(payload);let head=rows.findIndex(row=>row.filter(cell=>/\d{1,2}[.\/-]\d{1,2}/.test(S.text(cell))).length>=3);if(head<0)head=0;
  const cols=rows[head].map((cell,index)=>/\d{1,2}[.\/-]\d{1,2}/.test(S.text(cell))?index:-1).filter(index=>index>=0),labels=cols.map(index=>S.dateLabel(rows[head][index]));
  const find=name=>rows.find(row=>S.normalize(S.text(row[0])).includes(S.normalize(name)));
  const line=(name)=>{const row=find(name);return cols.map(index=>S.number(row?.[index]))};
  return {rows,labels,capital:line('капитал'),revenue:line('выручка'),reinvest:line('ре-инвест'),investments:line('новые инвестиции'),rate:line('фактический %')};
}
function renderStats(){
  const model=statsModel(data.stats),latest=values=>[...values].reverse().find(value=>value!==0)||0;
  const metrics=S.metricCards([{label:'Капитал',value:S.compactMoney(latest(model.capital)),note:'последняя фиксация',color:'#63a4ff'},{label:'Выручка',value:S.compactMoney(S.sum(model.revenue)),note:'за весь период',color:'#43d9a3'},{label:'Реинвестировано',value:S.compactMoney(S.sum(model.reinvest)),note:'возвращено в капитал',color:'#a779ff'},{label:'Фактическая ставка',value:`${latest(model.rate).toLocaleString('ru-RU',{maximumFractionDigits:1})}%`,note:'последнее значение',color:'#f4c65d'}]);
  const chart=S.lineChart({title:'Динамика капитала',subtitle:'Капитал, выручка и новые инвестиции',labels:model.labels,series:[{label:'Капитал',values:model.capital,color:'#63a4ff'},{label:'Выручка',values:model.revenue,color:'#43d9a3'},{label:'Новые инвестиции',values:model.investments,color:'#a779ff'}],height:320});
  const rows=model.labels.map((label,index)=>[label,S.money(model.capital[index],'USD',0),S.money(model.revenue[index],'USD',0),S.money(model.reinvest[index],'USD',0),S.money(model.investments[index],'USD',0),`${model.rate[index].toLocaleString('ru-RU',{maximumFractionDigits:1})}%`]);
  content.innerHTML=command('Статистика PFP','ДИНАМИКА КАПИТАЛА','Все ключевые показатели в одном потоке')+metrics+chart+panelTable('История по неделям','ФИКСАЦИИ',['Период','Капитал','Выручка','Реинвест','Инвестиции','Ставка'],rows);
}
function subscriptionsModel(payload){
  const rows=rowsOf(payload),head=findHeader(rows,['контрагент']);if(head<0)throw new Error('Не найден реестр подписок');const header=rows[head];
  const c={name:fallback(column(header,'контрагент'),2),type:fallback(column(header,'тип'),3),purpose:fallback(column(header,'назначение'),4),period:fallback(column(header,'период'),5),date:fallback(column(header,'дата'),6),amount:fallback(column(header,'сумма'),7),details:fallback(column(header,'реквизиты'),8)};
  const items=rows.slice(head+1).map(row=>({name:value(row,c.name),type:value(row,c.type),purpose:value(row,c.purpose),period:value(row,c.period),date:value(row,c.date),raw:value(row,c.amount),amount:amount(row,c.amount),details:value(row,c.details)})).filter(item=>item.name&&(item.raw||item.period));return items;
}
function renderSubscriptions(){
  const items=subscriptionsModel(data.subscriptions),active=items.filter(item=>item.amount),largest=[...active].sort((a,b)=>b.amount-a.amount)[0],periods=new Map();active.forEach(item=>periods.set(item.period||'Без периода',(periods.get(item.period||'Без периода')||0)+item.amount));
  const labels=[...periods.keys()],values=[...periods.values()];const metrics=S.metricCards([{label:'Подписок',value:String(items.length),note:'в реестре',color:'#63a4ff'},{label:'Активных сумм',value:String(active.length),note:'с указанной стоимостью',color:'#43d9a3'},{label:'Крупнейшая',value:largest?largest.name:'—',note:largest?largest.raw:'нет данных',color:'#a779ff'},{label:'Периодов',value:String(periods.size),note:'типов списания',color:'#f4c65d'}]);
  const rows=items.map(item=>[item.name,item.type||'—',item.purpose||'—',item.period||'—',item.date||'—',item.raw||'—']);
  content.innerHTML=command('Подписки','РЕГУЛЯРНЫЕ ПЛАТЕЖИ','Единый реестр обязательств')+metrics+S.lineChart({title:'Стоимость по периодам',subtitle:'Сумма подписок по типу списания',labels,series:[{label:'Сумма',values,color:'#ec6fae'}],height:290})+panelTable('Все подписки','РЕЕСТР',['Контрагент','Тип','Назначение','Период','Дата','Сумма'],rows);
}
function balanceModel(payload){
  const rows=rowsOf(payload),head=findHeader(rows,['фио']);if(head<0)throw new Error('Не найден реестр балансов');const header=rows[head];
  const c={name:fallback(column(header,'фио'),2),type:fallback(column(header,'тип'),3),currency:fallback(column(header,'валюта'),4),bank:fallback(column(header,'банк'),5),balance:fallback(column(header,'баланс'),6),owner:fallback(column(header,'ответ.'),1)};
  return rows.slice(head+1).map(row=>({name:value(row,c.name),type:value(row,c.type),currency:value(row,c.currency),bank:value(row,c.bank),balance:amount(row,c.balance),raw:value(row,c.balance),owner:value(row,c.owner)})).filter(item=>item.name&&item.raw);
}
function renderBalance(){
  const items=balanceModel(data.balance),usd=S.sum(items.filter(item=>item.currency.includes('$')||S.normalize(item.currency).includes('usd')).map(item=>item.balance)),rub=S.sum(items.filter(item=>item.currency.includes('₽')||S.normalize(item.currency).includes('rub')).map(item=>item.balance)),negative=items.filter(item=>item.balance<0),top=[...items].sort((a,b)=>Math.abs(b.balance)-Math.abs(a.balance)).slice(0,12);
  const metrics=S.metricCards([{label:'Баланс USD',value:S.compactMoney(usd),note:'долларовый контур',color:'#63a4ff'},{label:'Баланс RUB',value:S.compactMoney(rub,'₽'),note:'рублёвый контур',color:'#43d9a3'},{label:'Счетов',value:String(items.length),note:'в общем реестре',color:'#a779ff'},{label:'Отрицательных',value:String(negative.length),note:'требуют внимания',color:negative.length?'#ff8b64':'#43d9a3'}]);
  const rows=[...items].sort((a,b)=>b.balance-a.balance).map(item=>[item.name,item.type||'—',item.bank||'—',item.currency||'—',item.raw,item.owner||'—']);
  content.innerHTML=command('Баланс','ЛИКВИДНЫЕ СРЕДСТВА','Счета, банки и ответственные')+metrics+S.lineChart({title:'Крупнейшие балансы',subtitle:'Абсолютный размер счетов',labels:top.map(item=>item.name.length>13?item.name.slice(0,12)+'…':item.name),series:[{label:'Баланс',values:top.map(item=>Math.abs(item.balance)),color:'#43d9a3'}],height:300})+panelTable('Все счета','РЕЕСТР',['ФИО','Тип','Банк','Валюта','Баланс','Ответственный'],rows);
}
function paint(){if(!data)return;try{if(['portfolio','market','gold','crypto'].includes(state.tab))renderAssets(state.tab);else if(state.tab==='stats')renderStats();else if(state.tab==='subscriptions')renderSubscriptions();else renderBalance()}catch(error){content.innerHTML=S.errorCard('Не удалось собрать экран',error.message)}}
async function loadAll(){
  const token=++serial;content.innerHTML='<div class="ps-loading">Собираем капитал</div>';const names=Object.values(SHEETS);let result=await S.loadMany(names,{book:'pfp'});if(token!==serial)return;
  if(result[SHEETS.market]?.error&&!result[SHEETS.market]?.table){const fallback=await S.load('2026 (РЫНОК)',{book:'pfp'}).catch(error=>({error:error.message}));result[SHEETS.market]=fallback}
  data=Object.fromEntries(Object.entries(SHEETS).map(([key,name])=>[key,result[name]]));const values=Object.values(data);syncState.classList.toggle('cached',values.some(item=>item?.cached));syncState.querySelector('span').textContent=values.some(item=>item?.error&&!item?.table)?'Часть данных недоступна':values.some(item=>item?.cached)?'Сохранённые данные':'Данные обновлены';paint();
}
document.getElementById('tabs').onclick=event=>{const button=event.target.closest('[data-tab]');if(!button)return;state.tab=button.dataset.tab;document.querySelectorAll('.ps-tab').forEach(item=>item.classList.toggle('on',item===button));paint()};document.getElementById('refresh').onclick=loadAll;loadAll();
</script>
</body>
</html>
