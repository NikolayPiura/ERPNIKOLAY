<body>
<main class="ps-app ps-finance-app ps-pff-app" data-piura-keep-full>
 <header class="ps-header ps-hero-header"><div class="ps-title"><span>ИНВЕСТИЦИИ</span><h1>PFF</h1></div><div class="ps-live" id="syncState"><i></i><span>Загрузка</span><button class="ps-refresh" id="refresh" type="button" aria-label="Обновить">↻</button></div></header>

 </nav>
 <section id="content"><div class="ps-loading">Собираем капитал</div></section>
</main>
<script>
const S=window.PIURASheet,content=document.getElementById('content'),syncState=document.getElementById('syncState'),COLORS=S.colors,MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const SHEETS={portfolio:'2026 (PFF)',market:'2026 (РЫНОК) ',gold:'2026 (ЗОЛОТО)',crypto:'2026 (КРИПТА)',stats:'2026 (СТАТ)',subscriptions:'2026 (ПОДПИСКИ)',balance:'2026 (БАЛАНС)'},STATE_KEY='piura_personal_pff_state_v3';let state={tab:'portfolio',month:new Date().getMonth(),balancePerson:'all',assetSort:'capital'},data=null,serial=0,rates={rub:83.81,eurUsd:1.17};try{state={...state,...JSON.parse(localStorage.getItem(STATE_KEY)||'{}')}}catch{}
function saveState(){localStorage.setItem(STATE_KEY,JSON.stringify(state))}function rowsOf(payload){if(payload?.error&&!payload?.table)throw new Error(payload.error);const rows=S.cells(payload);if(!rows.length)throw new Error('Лист пока пуст');return rows}function findHeader(rows,names){const normalized=names.map(S.normalize);return rows.findIndex(row=>normalized.every(name=>row.some(cell=>S.normalize(S.text(cell)).includes(name))))}function column(header,...names){const normalized=names.map(S.normalize);let index=header.findIndex(cell=>normalized.includes(S.normalize(S.text(cell))));if(index<0)index=header.findIndex(cell=>normalized.some(name=>S.normalize(S.text(cell)).includes(name)));return index}function value(row,index){return index>=0?S.text(row[index]):''}function amount(row,index){return index>=0?S.number(row[index]):0}function fallback(index,value){return index>=0?index:value}
function command(title,eyebrow,controls=''){return `<section class="ps-command pfp-month-command ps-reveal"><div class="ps-command-copy"><span>${S.esc(eyebrow)}</span><h2>${S.esc(title)}</h2></div>${controls?`<div class="ps-command-controls">${controls}</div>`:''}</section>`}function monthControl(){return S.monthControl(state.month,MONTHS)}
function panelTable(title,eyebrow,headers,rows,total='',extraClass=''){return `<section class="ps-panel ps-data-panel ps-reveal ${extraClass}"><div class="ps-panel-head"><div><span>${S.esc(eyebrow)}</span><h3>${S.esc(title)}</h3></div>${total?`<strong>${S.esc(total)}</strong>`:''}</div><div class="ps-scroll"><table class="ps-table"><thead><tr>${headers.map(item=>`<th>${S.esc(item)}</th>`).join('')}</tr></thead><tbody>${rows.map((row,index)=>String(row[0]).startsWith('__GROUP__:')?`<tr class="pfp-group-row"><td colspan="${headers.length}">${S.esc(String(row[0]).slice(10))}</td></tr>`:`<tr style="--row:${COLORS[index%COLORS.length]}">${row.map((cell,col)=>col===0?`<td><span class="ps-row-name"><i></i>${S.esc(cell)}</span></td>`:`<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}
function dateMonth(label){const match=String(label||'').match(/^\d{1,2}[.\/-](\d{1,2})/);return match?Number(match[1])-1:-1}function weekDate(label){const match=String(label||'').match(/^(\d{1,2})[.\/-](\d{1,2})/);return match?new Date(new Date().getFullYear(),Number(match[2])-1,Number(match[1]),23,59,59):null}function weekIndexes(labels){return labels.map((label,index)=>({label,index,date:weekDate(label)})).filter(item=>dateMonth(item.label)===state.month)}
function assetModel(payload){const rows=rowsOf(payload),head=findHeader(rows,['актив']);if(head<0)throw new Error('Не найдена структура активов');const header=rows[head],isPersonal=column(header,'фио')>=0||column(header,'брокер')>=0,isMarket=isPersonal&&S.normalize(value(header,4)).includes('isin'),isGold=isPersonal&&header.length<=5,personal={name:3,type:2,amount:isMarket?5:4,month:isGold?-1:isMarket?7:6,week:isGold?-1:isMarket?8:7,owner:0,broker:1},institutional={name:0,type:1,amount:6,month:8,week:9,owner:-1,broker:-1},layout=isPersonal?personal:institutional,c={name:fallback(column(header,'актив'),layout.name),type:fallback(column(header,'тип'),layout.type),amount:fallback(column(header,'сумма'),layout.amount),month:fallback(column(header,'месяц'),layout.month),week:fallback(column(header,'неделя'),layout.week),owner:fallback(column(header,'фио'),layout.owner),broker:fallback(column(header,'брокер'),layout.broker)},weekColumns=header.map((cell,index)=>({index,label:S.dateLabel(cell)})).filter(item=>/^\d{2}\.\d{2}$/.test(item.label));let inheritedOwner='';const items=rows.slice(head+1).map(row=>{const name=value(row,c.name),owner=value(row,c.owner)||inheritedOwner;if(value(row,c.owner))inheritedOwner=value(row,c.owner);return{name,type:value(row,c.type),amount:amount(row,c.amount),month:amount(row,c.month),week:amount(row,c.week),owner,broker:value(row,c.broker),weekly:weekColumns.map(item=>amount(row,item.index))}}).filter(item=>item.name&&S.normalize(item.name)!=='итого'&&(item.amount||item.month||item.week||item.weekly.some(Boolean)));return{items,total:S.sum(items.map(item=>item.amount)),weekLabels:weekColumns.map(item=>item.label)}}
function categoryOf(item,tab){const type=item.type||'';if(tab==='crypto'&&S.normalize(type).includes('крипто'))return'Криптоактивы';if(tab==='gold'&&S.normalize(type).includes('золот'))return'Золотой резерв';return type||'Прочие активы'}
function assetGroups(items,tab,score){const groups=new Map();items.forEach(item=>{const key=categoryOf(item,tab),list=groups.get(key)||[];list.push(item);groups.set(key,list)});return [...groups.entries()].map(([name,list])=>({name,items:list.sort((a,b)=>score(b)-score(a)),total:S.sum(list.map(item=>item.amount)),income:S.sum(list.map(item=>item.periodIncome))})).sort((a,b)=>state.assetSort==='income'?b.income-a.income:b.total-a.total)}
function renderAssets(tab){
  const model=assetModel(data[tab]),items=model.items,indexes=weekIndexes(model.weekLabels),monthTotals=indexes.map(week=>S.sum(items.map(item=>item.weekly[week.index]))),monthIncome=S.sum(monthTotals),today=new Date(),actualIndexes=indexes.map((week,index)=>({week,index})).filter(item=>item.week.date&&item.week.date<=today),latestIndex=actualIndexes.at(-1)?.index??-1,latest=latestIndex>=0?monthTotals[latestIndex]:0,title={portfolio:'Piura Family Fund',market:'Рынок',gold:'Золото',crypto:'Крипта'}[tab];
  items.forEach(item=>item.periodIncome=S.sum(indexes.map(week=>item.weekly[week.index])));
  const score=item=>state.assetSort==='income'?item.periodIncome:item.amount,groups=assetGroups(items,tab,score),showOwner=items.some(item=>item.owner||item.broker),controls=`${indexes.length?monthControl():''}<button class="pfp-sort-button" type="button" data-asset-sort><strong>${state.assetSort==='capital'?'По сумме':'По доходу'}</strong><i>↕</i></button>`;
  const metrics=S.metricCards([{label:'Капитал',value:S.money(model.total,'USD',2),note:`${items.length} активов`,color:'#63a4ff'},{label:'Доход месяца',value:S.money(monthIncome,'USD',2),note:MONTHS[state.month],color:'#43d9a3'},{label:'Последняя неделя',value:S.money(latest,'USD',2),note:latestIndex>=0?indexes[latestIndex].label:'ещё не зафиксировано',color:'#a779ff'}]);
  const headers=['Актив',...(showOwner?['Владелец / счёт']:[]),'Сумма',...indexes.map(week=>week.label),...(indexes.length?['Итого']:[])],tableRows=[];
  groups.forEach(group=>{tableRows.push([`__GROUP__:${group.name} · ${S.money(group.total,'USD',2)}`]);group.items.forEach(item=>tableRows.push([item.name,...(showOwner?[`<b>${S.esc(item.owner||item.broker||'—')}</b>`]:[]),`<b>${S.money(item.amount,'USD',2)}</b>`,...indexes.map(week=>`<b>${S.money(item.weekly[week.index],'USD',2)}</b>`),...(indexes.length?[`<b>${S.money(item.periodIncome,'USD',2)}</b>`]:[])]))});
  if(indexes.length)tableRows.push(['ИТОГО',...(showOwner?['']:[]),`<b>${S.money(model.total,'USD',2)}</b>`,...monthTotals.map(total=>`<b>${S.money(total,'USD',2)}</b>`),`<b>${S.money(monthIncome,'USD',2)}</b>`]);
  content.innerHTML=command(title,'',controls)+metrics+panelTable(MONTHS[state.month],indexes.length?'НЕДЕЛЬНЫЙ ДОХОД':'АКТИВЫ',headers,tableRows,S.money(model.total,'USD',2),'pfp-source-table');
}
function renderStats(){
  const rows=rowsOf(data.stats),header=rows[0]||[],indexes=header.map((cell,index)=>({index,label:S.dateLabel(cell)})).filter(item=>dateMonth(item.label)===state.month),body=rows.slice(1).filter(row=>value(row,0)&&row.slice(1).some(cell=>S.text(cell)!==''));
  if(!indexes.length){content.innerHTML=command('Статистика PFF','ПОКАЗАТЕЛИ',monthControl())+'<div class="pfp-empty-month"><div><strong>Нет дат за этот месяц</strong></div></div>';return}
  const tableRows=body.map(row=>[value(row,0),...indexes.map(item=>`<b>${S.esc(value(row,item.index)||'0')}</b>`)]);
  content.innerHTML=command('Статистика PFF','',monthControl())+panelTable(MONTHS[state.month],'СТАТИСТИКА',['Показатель',...indexes.map(item=>item.label)],tableRows,'','stats-source');
}
function subscriptionsModel(payload){const rows=rowsOf(payload),head=findHeader(rows,['контрагент']);if(head<0)throw new Error('Не найден реестр подписок');const header=rows[head],c={name:fallback(column(header,'контрагент'),2),type:fallback(column(header,'тип'),3),purpose:fallback(column(header,'назначение'),4),period:fallback(column(header,'период'),5),date:fallback(column(header,'дата'),6),amount:fallback(column(header,'сумма'),7)};return rows.slice(head+1).map(row=>({name:value(row,c.name),type:value(row,c.type),purpose:value(row,c.purpose),period:value(row,c.period),date:value(row,c.date),raw:value(row,c.amount),amount:amount(row,c.amount)})).filter(item=>item.name&&S.normalize(item.name)!=='итого'&&(item.raw||item.period))}
function parseDate(text){const match=String(text||'').match(/(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/);if(!match)return null;const year=Number(match[3])<100?2000+Number(match[3]):Number(match[3]);return new Date(year,Number(match[2])-1,Number(match[1]))}function monthlyEquivalent(item){const period=S.normalize(item.period);if(period.includes('кварт'))return item.amount/3;if(period.includes('год'))return item.amount/12;return item.amount}
function periodName(value){const normalized=S.normalize(value);if(normalized.includes('месяч'))return'Ежемесячно';if(normalized.includes('кварт'))return'Ежеквартально';if(normalized.includes('год'))return'Ежегодно';return String(value||'Без периода').trim()||'Без периода'}
function renderSubscriptions(){const items=subscriptionsModel(data.subscriptions),active=items.filter(item=>item.amount>0).sort((a,b)=>b.amount-a.amount),monthly=S.sum(active.map(monthlyEquivalent)),largest=active[0],periods=new Map();active.forEach(item=>{const key=periodName(item.period),entry=periods.get(key)||{count:0,total:0};entry.count++;entry.total+=item.amount;periods.set(key,entry)});const maxPeriod=Math.max(1,...[...periods.values()].map(item=>item.total));const metrics=S.metricCards([{label:'В месяц',value:S.money(monthly,'USD',2),note:'все обязательства',color:'#63a4ff'},{label:'Подписок',value:String(active.length),note:'показаны все',color:'#43d9a3'},{label:'Крупнейшая',value:largest?S.money(largest.amount,'USD',2):S.money(0,'USD'),note:largest?.name||'',color:'#a779ff'}]);content.innerHTML=command('Подписки','ПОЛНЫЙ РЕЕСТРЬ')+metrics+`<section class="ps-section-head"><div><span>БЕЗ СКРЫТЫХ СТРОК</span><h2>Все подписки</h2></div><strong>${active.length} активных</strong></section><section class="sub-ledger sub-ledger-all">${active.map(item=>`<article class="sub-ledger-row"><time>${S.esc(item.date||'Дата не указана')}</time><div><h3>${S.esc(item.name)}</h3><p>${S.esc(item.purpose||item.type||'')}</p></div><span>${S.esc(periodName(item.period))}</span><strong>${S.esc(item.raw||S.money(item.amount,'USD',2))}</strong></article>`).join('')}</section><section class="ps-section-head"><div><span>Частота списаний</span><h2>Периоды</h2></div></section><section class="sub-periods">${[...periods.entries()].sort((a,b)=>b[1].total-a[1].total).map(([name,item])=>`<article class="sub-period" style="--share:${item.total/maxPeriod*100}%"><span>${S.esc(name)}</span><strong>${S.money(item.total,'USD',2)}</strong><small>${item.count} обязательств</small></article>`).join('')}</section>`}
function parseRawAmount(raw){let value=String(raw??'').replace(/\u00a0/g,'').replace(/\s/g,'').replace(/р\.|[$₽€₴]/gi,'');if(value.includes(',')&&!value.includes('.'))value=value.replace(',','.');else value=value.replace(/,/g,'');value=value.replace(/[^\d.-]/g,'');const parsed=Number(value);return Number.isFinite(parsed)?parsed:0}function inferredCurrency(raw,declared,bank){const text=String(raw||'');if(/р\.|₽/i.test(text)||/\bруб\b/i.test(bank))return'RUB';if(text.includes('$'))return'USD';if(text.includes('€'))return'EUR';if(text.includes('₴'))return'UAH';const value=S.normalize(declared);if(value.includes('₽')||value.includes('rub'))return'RUB';if(value.includes('€')||value.includes('eur'))return'EUR';if(value.includes('₴')||value.includes('uah'))return'UAH';return'USD'}
function balanceModel(payload){const rows=rowsOf(payload),head=findHeader(rows,['фио']);if(head<0)throw new Error('Не найден реестр балансов');const header=rows[head],c={name:fallback(column(header,'фио'),2),type:fallback(column(header,'тип'),3),currency:fallback(column(header,'валюта'),4),bank:fallback(column(header,'банк'),5),balance:fallback(column(header,'баланс'),6),owner:fallback(column(header,'ответ.'),1)};return rows.slice(head+1).map(row=>{const raw=value(row,c.balance),declared=value(row,c.currency),bank=value(row,c.bank);return{name:value(row,c.name),type:value(row,c.type),declared,bank,raw,balance:parseRawAmount(raw),currency:inferredCurrency(raw,declared,bank),owner:value(row,c.owner)}}).filter(item=>item.name&&item.raw)}
function currencyMoney(value,currency){return new Intl.NumberFormat('ru-RU',{style:'currency',currency,maximumFractionDigits:0}).format(Number(value)||0)}
function renderBalance(){
  const all=balanceModel(data.balance),people=[...new Set(all.flatMap(item=>[item.name,item.owner]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru')),items=state.balancePerson==='all'?all:all.filter(item=>item.name===state.balancePerson||item.owner===state.balancePerson),totals=Object.fromEntries(['USD','RUB','EUR','UAH'].map(currency=>[currency,S.sum(items.filter(item=>item.currency===currency).map(item=>item.balance))])),combined=totals.USD+totals.RUB/rates.rub+totals.EUR*rates.eurUsd,negative=items.filter(item=>item.balance<0);
  const chooser=`<div class="balance-controls"><label for="balancePerson">Человек</label><select id="balancePerson"><option value="all">Все</option>${people.map(person=>`<option ${state.balancePerson===person?'selected':''}>${S.esc(person)}</option>`).join('')}</select></div>`;
  const hero=`<section class="balance-hero ps-reveal"><div><span>СОВОКУПНЫЙ ЛИКВИДНЫЙ БАЛАНС</span><h2>${currencyMoney(combined,'USD')}</h2><p>${items.length} счетов · пересчитано по курсу ${rates.rub.toFixed(2)} ₽/$</p></div><dl><div><dt>USD</dt><dd>${currencyMoney(totals.USD,'USD')}</dd></div><div><dt>RUB</dt><dd>${currencyMoney(totals.RUB,'RUB')}</dd></div><div><dt>EUR</dt><dd>${currencyMoney(totals.EUR,'EUR')}</dd></div><div><dt>Отрицательные</dt><dd>${negative.length}</dd></div></dl></section>`;
  const tableRows=[...items].sort((a,b)=>b.balance-a.balance).map(item=>[item.name,S.esc(item.type||'—'),S.esc(item.bank||'—'),`<span class="currency-pill">${item.currency}</span>`,`<span class="balance-raw ${item.balance<0?'balance-negative':''}">${S.esc(item.raw)}</span>`,S.esc(item.owner||'—')]);
  content.innerHTML=command('Баланс','СЧЕТА ПО ВАЛЮТАМ',chooser)+hero+panelTable('Все счета','ОТ БОЛЬШЕГО К МЕНЬШЕМУ',['ФИО','Тип','Банк','Валюта','Баланс','Ответственный'],tableRows,`${items.length} счетов · ${negative.length} отриц.`);document.getElementById('balancePerson').onchange=event=>{state.balancePerson=event.target.value;saveState();renderBalance()};
}
function bindMonth(){content.querySelectorAll('[data-month]').forEach(button=>button.onclick=()=>{state.month=(state.month+Number(button.dataset.month)+12)%12;saveState();paint()});content.querySelectorAll('[data-asset-sort]').forEach(button=>button.onclick=()=>{state.assetSort=state.assetSort==='capital'?'income':'capital';saveState();paint()})}function paint(){if(!data)return;try{if(['portfolio','market','gold','crypto'].includes(state.tab))renderAssets(state.tab);else if(state.tab==='stats')renderStats();else if(state.tab==='subscriptions')renderSubscriptions();else renderBalance();bindMonth()}catch(error){content.innerHTML=S.errorCard('Не удалось собрать экран',error.message)}}
async function loadAll(){const token=++serial;content.innerHTML='<div class="ps-loading">Собираем капитал</div>';const names=Object.values(SHEETS);let result=await S.loadMany(names,{book:'pfp'});if(token!==serial)return;if(result[SHEETS.market]?.error&&!result[SHEETS.market]?.table)result[SHEETS.market]=await S.load('2026 (РЫНОК)',{book:'pfp'}).catch(error=>({error:error.message}));data=Object.fromEntries(Object.entries(SHEETS).map(([key,name])=>[key,result[name]]));try{const [rubResponse,eurResponse]=await Promise.all([fetch('https://cdn.jsdelivr.net/gh/fawazahmed0/currency-api@1/latest/currencies/usd/rub.json'),fetch('https://cdn.jsdelivr.net/gh/fawazahmed0/currency-api@1/latest/currencies/eur/usd.json')]);rates.rub=Number((await rubResponse.json()).rub)||rates.rub;rates.eurUsd=Number((await eurResponse.json()).usd)||rates.eurUsd}catch{}const values=Object.values(data);syncState.classList.toggle('cached',values.some(item=>item?.cached));syncState.querySelector('span').textContent=values.some(item=>item?.error&&!item?.table)?'Часть данных недоступна':values.some(item=>item?.cached)?'Сохранённые данные':'Данные обновлены';paint()}
document.getElementById('tabs').onclick=event=>{const button=event.target.closest('[data-tab]');if(!button)return;state.tab=button.dataset.tab;saveState();document.querySelectorAll('.ps-tab').forEach(item=>item.classList.toggle('on',item===button));paint()};document.querySelectorAll('.ps-tab').forEach(item=>item.classList.toggle('on',item.dataset.tab===state.tab));document.getElementById('refresh').onclick=loadAll;loadAll();
</script>
