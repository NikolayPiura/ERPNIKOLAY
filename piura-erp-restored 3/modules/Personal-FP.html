<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FP</title><link rel="stylesheet" href="Personal-Sheets.css"><script src="Personal-Sheets.js"></script></head>
<body><main class="ps-app">
  <header class="ps-header"><div class="ps-title"><h1>FP</h1><p>Финансовое планирование · Google Sheets · только чтение</p></div><div class="ps-live" id="syncState"><i></i><span>Подключение…</span><button class="ps-refresh" id="refresh" type="button" title="Обновить данные" aria-label="Обновить данные">↻</button></div></header>
  <nav class="ps-tabs" id="tabs"><button class="ps-tab on" data-tab="fp">2026 FP</button><button class="ps-tab" data-tab="expense">2026 Расход</button><button class="ps-tab" data-tab="fp1">FP №1</button></nav>
  <section id="content"><div class="ps-loading">Загрузка таблицы</div></section>
</main><script>
const S=window.PIURASheet,content=document.getElementById('content'),syncState=document.getElementById('syncState');
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];let tab='fp',month=new Date().getMonth(),serial=0;
function display(cell){return S.text(cell)||'—'}function sum(row,cols){return cols.reduce((total,col)=>total+S.number(row?.[col]),0)}function weekCols(rows,header,start){return (rows[header]||[]).map((cell,index)=>index>=start&&S.monthOf(cell)===month?index:-1).filter(index=>index>=0)}
function toolbar(title,controls=''){return `<section class="ps-toolbar"><h2>${S.esc(title)}</h2>${controls}</section>`}function monthControl(){return `<div class="ps-months"><button data-month="-1">‹</button><strong>${MONTHS[month]} 2026</strong><button data-month="1">›</button></div>`}
function kpis(items){return `<section class="ps-kpis">${items.map(item=>`<article class="ps-kpi"><span>${S.esc(item[0])}</span><strong>${S.esc(item[1])}</strong><small>${S.esc(item[2]||'')}</small></article>`).join('')}</section>`}
function table(headers,rows,{title='',note='',totalLast=false}={}){return `<section class="ps-panel"><div class="ps-panel-head"><h3>${S.esc(title)}</h3><span>${S.esc(note)}</span></div><div class="ps-scroll"><table class="ps-table"><thead><tr>${headers.map(h=>`<th>${S.esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map((row,index)=>`<tr class="${totalLast&&index===rows.length-1?'total':''}">${row.map(value=>`<td>${S.esc(value===''||value===null||value===undefined?'—':value)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`}
function bindMonth(){content.querySelectorAll('[data-month]').forEach(button=>button.onclick=()=>{month=(month+Number(button.dataset.month)+12)%12;render()})}
function renderFP(payload){
  const rows=S.cells(payload),cols=weekCols(rows,0,2),items=[],groups={};let currentType='';rows.slice(1).filter(row=>row.some(cell=>S.text(cell))).forEach(row=>{currentType=S.text(row[0])||currentType||'Прочее';const item={type:currentType,row};items.push(item);(groups[currentType]??=[]).push(row)});
  const groupTotals=Object.entries(groups).map(([type,list])=>[type,list.reduce((total,row)=>total+sum(row,cols),0)]),body=items.map(({type,row},index)=>[index===0||items[index-1].type!==type?type:'',display(row[1]),...cols.map(col=>display(row[col])),S.money(sum(row,cols))]);
  content.innerHTML=toolbar('Финансовое планирование',monthControl())+kpis(groupTotals.slice(0,4).map(([type,total])=>[type,S.compactMoney(total),'сумма значений месяца']))+table(['Раздел','Статья',...cols.map(col=>display(rows[0][col])),'Месяц'],body,{title:'FP по неделям',note:'Остаток, выделено, баланс, расход и пассивный доход'})+`<div class="ps-note">Все разделы листа 2026 (ФП) загружены без возможности редактирования.</div>`;bindMonth();
}
function renderExpense(payload){
  const rows=S.cells(payload),header=['Показатель','Итого',...MONTHS],body=rows.map(row=>header.map((_,index)=>display(row[index]))),expenseRows=rows.slice(5),annual=expenseRows.reduce((total,row)=>total+S.number(row?.[1]),0),income=S.number(rows[0]?.[1]),expense=S.number(rows[1]?.[1]);
  content.innerHTML=toolbar('Расходы 2026')+kpis([['Доход',S.compactMoney(income),'годовой итог'],['Расход',S.compactMoney(expense),'годовой итог'],['Разница',S.compactMoney(income-expense),'доход минус расход'],['Категорий',String(expenseRows.length),'структура FP']])+table(header,body,{title:'Доход, расход и категории',note:'Полный лист 2026 (РАСХОД)'})+`<div class="ps-note">Показатели и проценты отображаются в том виде, в котором рассчитаны в исходной таблице.</div>`;
}
function renderFP1(payload){
  const rows=S.cells(payload),last=rows.at(-1),total=S.number(last?.[2]),body=[],categories=new Set();let category='';rows.slice(0,-1).forEach(row=>{const title=S.text(row[1]),amount=S.text(row[2]);if(!title)return;if(!amount){category=title;categories.add(category);return}body.push([category,title,amount])});
  content.innerHTML=toolbar('FP №1')+kpis([['Общий объём',S.compactMoney(total),'итог листа'],['Категорий',String(categories.size),'направления'],['Статей',String(body.length),'в финансовом плане'],['Режим','Только чтение','данные из таблицы']])+table(['Раздел','Статья','Сумма'],body,{title:'Структура FP №1',note:'Все статьи и суммы'});
}
async function render(){const token=++serial,name={fp:'2026 (ФП)',expense:'2026 (РАСХОД)',fp1:'2026 (ФП №1)'}[tab];content.innerHTML='<div class="ps-loading">Загрузка таблицы</div>';try{const payload=await S.load(name);if(token!==serial)return;syncState.classList.toggle('cached',payload.cached);syncState.querySelector('span').textContent=payload.cached?'Резервная копия · '+new Date(payload.updatedAt).toLocaleString('ru-RU'):'Обновлено · '+new Date(payload.updatedAt).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});({fp:renderFP,expense:renderExpense,fp1:renderFP1}[tab])(payload)}catch(error){content.innerHTML=`<div class="ps-error"><div><strong>Нет связи с Google Sheets</strong><p>${S.esc(error.message)}</p></div></div>`;syncState.querySelector('span').textContent='Нет соединения'}}
document.getElementById('tabs').onclick=event=>{const button=event.target.closest('[data-tab]');if(!button)return;tab=button.dataset.tab;document.querySelectorAll('.ps-tab').forEach(item=>item.classList.toggle('on',item===button));render()};document.getElementById('refresh').onclick=render;render();
</script></body></html>
