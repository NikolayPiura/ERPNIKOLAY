<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FP</title>
  <link rel="stylesheet" href="Personal-Sheets.css?v=20260815b"><script src="Personal-Sheets.js?v=20260815b"></script>
  <style>.fp1-column h3{font-size:clamp(18px,1.7vw,24px);overflow-wrap:anywhere}.fp1-column header strong{white-space:nowrap}</style>
</head>
<body>
<main class="ps-app ps-finance-app" data-piura-keep-full>
  <header class="ps-header ps-hero-header"><div class="ps-title"><span>ФИНАНСОВОЕ ПЛАНИРОВАНИЕ</span><h1>FP</h1></div><div class="ps-live" id="syncState"><i></i><span>Загрузка</span><button class="ps-refresh" id="refresh" type="button" aria-label="Обновить">↻</button></div></header>
  <nav class="ps-tabs ps-primary-tabs" id="tabs"><button class="ps-tab on" data-tab="fp"><i>⌁</i><span>Планирование</span></button><button class="ps-tab" data-tab="expense"><i>↘</i><span>Расходы</span></button><button class="ps-tab" data-tab="fp1"><i>◉</i><span>FP №1</span></button></nav>
  <section id="content"><div class="ps-loading">Собираем финансовый план</div></section>
</main>
<script>
const S=window.PIURASheet,content=document.getElementById('content'),syncState=document.getElementById('syncState');
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],SHORT=MONTHS.map(item=>item.slice(0,3));
const TYPES=['ОСТАТОК','ВЫДЕЛЕНО','БАЛАНС','РАСХОД'],COLORS=S.colors;
let state={tab:'fp',month:new Date().getMonth(),week:null,expenseScope:'year'},data=null,serial=0;
function rowNamed(rows,name){return rows.find(row=>S.normalize(S.text(row[0]))===S.normalize(name))}
function command(title,eyebrow,right=''){return `<section class="ps-command ps-reveal"><div class="ps-command-copy"><span>${S.esc(eyebrow)}</span><h2>${S.esc(title)}</h2></div>${right?`<div class="ps-command-right">${right}</div>`:''}</section>`}
function fpModel(payload){
  if(payload?.error)throw new Error(payload.error);const rows=S.cells(payload),header=S.headerIndex(rows,'ТИП');if(header<0)throw new Error('Не найден блок FP');
  const sections={};let type='';rows.slice(header+1).forEach(row=>{const label=S.text(row[0]);if(TYPES.includes(label))type=label;if(!type)return;const category=S.text(row[1]);if(category)(sections[type]??={})[category]=row});
  const categories=[...new Set(TYPES.flatMap(key=>Object.keys(sections[key]||{})))];
  const dateCols=(rows[header]||[]).map((cell,index)=>index>=2&&S.monthOf(cell)>=0?index:-1).filter(index=>index>=0);return {rows,header,sections,categories,dateCols};
}
function renderFP(){
  const model=fpModel(data.fp),cols=model.dateCols.filter(col=>S.monthOf(model.rows[model.header][col])===state.month);
  if(!cols.length){content.innerHTML=command('Финансовое планирование','ПОМЕСЯЧНЫЙ КОНТУР',S.monthControl(state.month,MONTHS))+S.errorCard(MONTHS[state.month],'В этом месяце нет недель');bind();return}
  if(state.week===null){const today=new Date(),current=cols.map((col,index)=>{const match=S.dateLabel(model.rows[model.header][col]).match(/^(\d{1,2})\.(\d{1,2})$/);return{index,date:match?new Date(today.getFullYear(),Number(match[2])-1,Number(match[1]),23,59,59):null}}).filter(item=>item.date&&item.date<=today);state.week=current.at(-1)?.index??0}
  state.week=Math.min(state.week,Math.max(0,cols.length-1));
  const series=type=>cols.map(col=>S.sum(model.categories.map(category=>S.number(model.sections[type]?.[category]?.[col]))));
  const balance=series('БАЛАНС'),expense=series('РАСХОД'),reserved=series('ВЫДЕЛЕНО'),remaining=series('ОСТАТОК'),selected=cols[state.week];
  const rail=`<div class="ps-week-rail ps-reveal">${cols.map((col,index)=>`<button type="button" data-week="${index}" class="${index===state.week?'on':''}"><span>НЕДЕЛЯ ${index+1}</span><strong>${S.dateLabel(model.rows[model.header][col])}</strong></button>`).join('')}</div>`;
  const selectedTotals=TYPES.map(type=>S.sum(model.categories.map(category=>S.number(model.sections[type]?.[category]?.[selected]))));
  const metrics=S.metricCards([{label:'Остаток',value:S.compactMoney(selectedTotals[0]),note:'на выбранной неделе',color:'#63a4ff'},{label:'Выделено',value:S.compactMoney(selectedTotals[1]),note:'зарезервировано',color:'#43d9a3'},{label:'Баланс',value:S.compactMoney(selectedTotals[2]),note:'доступный контур',color:'#a779ff'},{label:'Расход',value:S.compactMoney(selectedTotals[3]),note:'фактически',color:'#ff8b64'}]);
  const rows=model.categories.map((category,index)=>[category,...TYPES.map(type=>S.number(model.sections[type]?.[category]?.[selected]))]);
  const table=`<section class="ps-panel ps-reveal"><div class="ps-panel-head"><div><span>ВЫБРАННАЯ НЕДЕЛЯ</span><h3>${S.dateLabel(model.rows[model.header][selected])}</h3></div><strong>${S.money(selectedTotals[2],'USD',2)}</strong></div><div class="ps-scroll"><table class="ps-table"><thead><tr><th>Категория</th>${TYPES.map(type=>`<th>${type[0]+type.slice(1).toLowerCase()}</th>`).join('')}</tr></thead><tbody>${rows.map((row,index)=>`<tr style="--row:${COLORS[index%COLORS.length]}"><td><span class="ps-row-name"><i></i>${S.esc(row[0])}</span></td>${row.slice(1).map(value=>`<td class="${value?'':'ps-cell-zero'}">${S.money(value,'USD',2)}</td>`).join('')}</tr>`).join('')}</tbody><tfoot><tr><td>Итого</td>${selectedTotals.map(value=>`<td>${S.money(value,'USD',2)}</td>`).join('')}</tr></tfoot></table></div></section>`;
  const overview=`<section class="fp-week-overview ps-reveal"><div class="ps-section-head"><div><span>МЕСЯЦ ЦЕЛИКОМ</span><h3>Контур по неделям</h3></div><strong>${S.money(S.sum(expense),'USD',0)} расходов</strong></div><div class="fp-week-grid">${cols.map((col,index)=>`<button type="button" data-week="${index}" class="fp-week-card ${index===state.week?'on':''}"><div><span>${S.dateLabel(model.rows[model.header][col])}</span><b>${index===state.week?'ВЫБРАНА':'НЕДЕЛЯ '+(index+1)}</b></div><strong>${S.money(balance[index],'USD',0)}</strong><dl><div><dt>Выделено</dt><dd>${S.money(reserved[index],'USD',0)}</dd></div><div><dt>Расход</dt><dd>${S.money(expense[index],'USD',0)}</dd></div><div><dt>Остаток</dt><dd>${S.money(remaining[index],'USD',0)}</dd></div></dl></button>`).join('')}</div></section>`;
  content.innerHTML=command('Финансовое планирование','ПОМЕСЯЧНЫЙ КОНТУР',S.monthControl(state.month,MONTHS))+rail+metrics+overview+table;bind();
}
function expenseModel(payload){
  if(payload?.error)throw new Error(payload.error);const rows=S.cells(payload);if(!rows.length)throw new Error('Лист расходов пуст');
  const income=rowNamed(rows,'ДОХОД'),expense=rowNamed(rows,'РАСХОД');
  const skip=new Set(['доход','расход','итого','прибыль','пассивный доход','факт','план','% от дохода','% от пассивного дохода']);
  const categories=rows.map(row=>({name:S.text(row[0]),values:MONTHS.map((_,m)=>S.number(row[m+2])),total:S.number(row[1])})).filter(item=>item.name&&!skip.has(S.normalize(item.name))&&(item.total||S.sum(item.values)));
  return {income,expense,categories};
}
function renderExpense(){
  const model=expenseModel(data.expense),incomeMonths=MONTHS.map((_,m)=>S.number(model.income?.[m+2])),expenseMonths=MONTHS.map((_,m)=>S.number(model.expense?.[m+2]));
  const incomeTotal=S.sum(incomeMonths),expenseTotal=S.sum(expenseMonths),profit=incomeTotal-expenseTotal,cell=(value,index)=>`<td class="${index===state.month?'current-month':''}">${value?S.money(value,'USD',0):'—'}</td>`;
  const summary=`<section class="expense-summary ps-reveal"><article><span>Доход</span><strong>${S.compactMoney(incomeTotal)}</strong></article><article><span>Расход</span><strong>${S.compactMoney(expenseTotal)}</strong></article><article class="${profit<0?'negative':''}"><span>Результат</span><strong>${S.compactMoney(profit)}</strong></article></section>`;
  const matrix=`<section class="expense-matrix ps-reveal"><div class="expense-matrix-head"><h2>Расходы по месяцам</h2><strong>2026</strong></div><div class="ps-scroll"><table><thead><tr><th>Статья</th><th>Итого</th>${SHORT.map((month,index)=>`<th class="${index===state.month?'current-month':''}">${month}</th>`).join('')}</tr></thead><tbody><tr class="income-row"><th>Доход</th><td>${S.money(incomeTotal,'USD',0)}</td>${incomeMonths.map(cell).join('')}</tr>${model.categories.map(item=>`<tr><th>${S.esc(item.name)}</th><td>${S.money(item.total||S.sum(item.values),'USD',0)}</td>${item.values.map(cell).join('')}</tr>`).join('')}</tbody><tfoot><tr><th>Расход</th><td>${S.money(expenseTotal,'USD',0)}</td>${expenseMonths.map(cell).join('')}</tr><tr><th>Результат</th><td>${S.money(profit,'USD',0)}</td>${incomeMonths.map((value,index)=>cell(value-expenseMonths[index],index)).join('')}</tr></tfoot></table></div></section>`;
  content.innerHTML=summary+matrix;
}
function fp1Model(payload){
  if(payload?.error)throw new Error(payload.error);const rows=S.cells(payload),groups=[];let group=null;
  rows.forEach(row=>{const name=S.text(row[1]),amount=S.number(row[2]);if(!name||S.normalize(name)==='итого')return;if(!amount){group={name,items:[]};groups.push(group)}else if(group)group.items.push({name,amount})});groups.forEach(item=>item.total=S.sum(item.items.map(entry=>entry.amount)));return groups.filter(item=>item.total);
}
function renderFP1(){
  const groups=fp1Model(data.fp1),total=S.sum(groups.map(group=>group.total));
  const head=`<section class="fp1-simple-head ps-reveal"><h2>FP №1</h2><strong>${S.money(total,'USD',0)}</strong></section>`;
  const board=`<section class="fp1-board">${groups.map((group,index)=>`<article class="fp1-column ps-reveal" style="--accent:${COLORS[index%COLORS.length]}"><header><h3>${S.esc(group.name)}</h3><strong>${S.money(group.total,'USD',0)}</strong></header><div class="fp1-share"><i style="width:${group.total/Math.max(1,total)*100}%"></i></div><div class="fp1-items">${group.items.sort((a,b)=>b.amount-a.amount).map(item=>`<div><span>${S.esc(item.name)}</span><strong>${S.money(item.amount,'USD',0)}</strong></div>`).join('')}</div></article>`).join('')}</section>`;
  content.innerHTML=head+board;
}
function bind(){content.querySelectorAll('[data-month]').forEach(button=>button.onclick=()=>{state.month=(state.month+Number(button.dataset.month)+12)%12;state.week=null;paint()});content.querySelectorAll('[data-week]').forEach(button=>button.onclick=()=>{state.week=Number(button.dataset.week);paint()});content.querySelectorAll('[data-control]').forEach(button=>button.onclick=()=>{state[button.dataset.control]=button.dataset.value;paint()})}
function paint(){if(!data)return;try{({fp:renderFP,expense:renderExpense,fp1:renderFP1}[state.tab])()}catch(error){content.innerHTML=S.errorCard('Не удалось собрать экран',error.message)}}
async function loadAll(){const token=++serial;content.innerHTML='<div class="ps-loading">Собираем финансовый план</div>';const result=await S.loadMany(['2026 (ФП)','2026 (РАСХОД)','2026 (ФП №1)']);if(token!==serial)return;data={fp:result['2026 (ФП)'],expense:result['2026 (РАСХОД)'],fp1:result['2026 (ФП №1)']};const values=Object.values(result);syncState.classList.toggle('cached',values.some(item=>item.cached));syncState.querySelector('span').textContent=values.some(item=>item.error&&!item.table)?'Часть данных недоступна':values.some(item=>item.cached)?'Сохранённые данные':'Данные обновлены';paint()}
document.getElementById('tabs').onclick=event=>{const button=event.target.closest('[data-tab]');if(!button)return;state.tab=button.dataset.tab;document.querySelectorAll('.ps-tab').forEach(item=>item.classList.toggle('on',item===button));paint()};document.getElementById('refresh').onclick=loadAll;loadAll();
</script>
</body>
</html>
