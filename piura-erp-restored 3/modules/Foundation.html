<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Фонды</title>
<style>
:root{color-scheme:dark;--bg:#070a10;--panel:#10151e;--raised:#161c27;--line:rgba(255,255,255,.09);--text:#f3f6fa;--muted:#8390a3;--blue:#66a6ff;--green:#47dba3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--erp-bg,var(--bg));color:var(--erp-text,var(--text));font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.shell{width:100%;max-width:none;margin:0;padding:24px clamp(18px,2vw,40px) 90px}.fund-years{width:max-content;display:flex;gap:7px;margin:0 0 20px auto;padding:5px;border:1px solid var(--erp-line,var(--line));border-radius:14px;background:color-mix(in srgb,var(--erp-surface,var(--panel)) 92%,transparent)}.fund-year{min-width:108px;height:42px;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--erp-muted,var(--muted));font-weight:900;cursor:pointer}.fund-year.on{border-color:color-mix(in srgb,var(--blue) 42%,var(--erp-line,var(--line)));background:color-mix(in srgb,var(--blue) 10%,transparent);color:var(--erp-text,var(--text))}.list{display:grid;gap:20px}.fund{--c:var(--blue);position:relative;min-height:245px;padding:36px 42px;display:grid;grid-template-columns:minmax(300px,.8fr) minmax(420px,1.2fr);align-items:stretch;gap:clamp(34px,4vw,60px);border:1px solid color-mix(in srgb,var(--c) 27%,var(--erp-line,var(--line)));border-radius:24px;background:radial-gradient(circle at 0 50%,color-mix(in srgb,var(--c) 10%,transparent),transparent 42%),var(--erp-surface,var(--panel));overflow:hidden}.fund:before{content:"";position:absolute;inset:24px auto 24px 0;width:4px;border-radius:0 8px 8px 0;background:var(--c);box-shadow:0 0 24px color-mix(in srgb,var(--c) 30%,transparent)}.fund-goal{display:flex;flex-direction:column;justify-content:center}.fund-goal h2{margin:0 0 12px;font-size:clamp(32px,2.7vw,46px);letter-spacing:-.06em;line-height:.96}.fund-goal p{max-width:620px;margin:0;color:var(--erp-muted,var(--muted));font-size:14px;line-height:1.55}.fund-result{min-width:0;padding:26px 30px;border:1px solid color-mix(in srgb,var(--c) 34%,var(--erp-line,var(--line)));border-radius:19px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 8%,var(--erp-raised,var(--raised))),var(--erp-raised,var(--raised)));display:flex;flex-direction:column;justify-content:center}.product-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:20px}.product-copy{margin:0;color:var(--erp-text,var(--text));font-size:clamp(16px,1.25vw,20px);font-weight:850;line-height:1.32}.result-percent{padding:7px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);font-size:12px;font-weight:900}.goal-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:20px}.goal-head span{color:var(--c);font-size:10px;font-weight:900;letter-spacing:.14em}.goal-numbers{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:18px;margin-top:16px}.goal-number{display:grid;gap:8px}.goal-number small{color:var(--erp-muted,var(--muted));font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.goal-number strong{color:var(--erp-text,var(--text));font-size:clamp(36px,3.2vw,52px);line-height:.82;letter-spacing:-.06em}.goal-number.current strong{color:var(--c)}.goal-divider{padding-bottom:7px;color:var(--erp-muted,var(--muted));font-size:13px;font-weight:800}.track{height:9px;margin-top:20px;border-radius:999px;background:color-mix(in srgb,var(--erp-text,var(--text)) 8%,var(--erp-raised,var(--raised)));overflow:hidden}.track i{display:block;height:100%;max-width:100%;border-radius:inherit;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 58%,white));box-shadow:0 0 20px color-mix(in srgb,var(--c) 30%,transparent)}
html[data-erp-theme="light"] .fund-years{background:#fff;box-shadow:0 8px 24px rgba(36,57,88,.06)}html[data-erp-theme="light"] .fund{background:radial-gradient(circle at 0 50%,color-mix(in srgb,var(--c) 8%,transparent),transparent 44%),#fff;box-shadow:0 14px 36px rgba(37,59,91,.065)}html[data-erp-theme="light"] .fund-result{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 7%,#f8fafc),#f8fafc)}
@media(max-width:1080px){.fund{grid-template-columns:1fr;gap:28px}.fund-result{min-height:210px}}@media(max-width:700px){.shell{padding:18px 12px 70px}.fund-years{width:100%;margin-bottom:16px}.fund-year{flex:1;min-width:0}.fund{min-height:0;padding:30px 24px;grid-template-columns:1fr;gap:26px}.fund-result{min-height:0;padding:24px 20px}.product-head{grid-template-columns:1fr}.goal-numbers{gap:12px}.goal-number strong{font-size:38px}}
/* Более выразительные карточки без дополнительных подписей. */
.fund-toolbar{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-bottom:30px}.fund-toolbar .fund-years{margin:0}.fund-edit{width:52px;height:52px;display:grid;place-items:center;border:1px solid var(--erp-line,var(--line));border-radius:14px;background:color-mix(in srgb,var(--erp-surface,var(--panel)) 92%,transparent);color:var(--erp-muted,var(--muted));cursor:pointer;transition:border-color .15s ease,color .15s ease,background .15s ease}.fund-edit:hover,.fund-edit.on{border-color:color-mix(in srgb,var(--blue) 55%,var(--erp-line,var(--line)));background:color-mix(in srgb,var(--blue) 12%,var(--erp-surface,var(--panel)));color:var(--erp-text,var(--text))}.fund-edit svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.list{gap:56px}
.fund{min-height:322px;padding:50px 56px;gap:clamp(48px,5.4vw,90px);border-radius:28px;background:radial-gradient(circle at 4% 50%,color-mix(in srgb,var(--c) 16%,transparent),transparent 40%),radial-gradient(circle at 88% 8%,color-mix(in srgb,var(--c) 8%,transparent),transparent 34%),linear-gradient(145deg,color-mix(in srgb,var(--c) 3%,var(--erp-surface,var(--panel))),var(--erp-surface,var(--panel)));box-shadow:0 24px 70px rgba(0,0,0,.18),inset 0 1px 0 color-mix(in srgb,var(--c) 13%,transparent)}
.fund:before{inset:27px auto 27px 0;width:5px;box-shadow:0 0 30px color-mix(in srgb,var(--c) 44%,transparent)}
.fund:after{content:"";position:absolute;right:-80px;top:-90px;width:250px;height:250px;border-radius:50%;background:color-mix(in srgb,var(--c) 7%,transparent);filter:blur(46px);pointer-events:none}
.fund-goal,.fund-result{position:relative;z-index:1}
.fund-results{position:relative;z-index:1;min-width:0;display:grid;grid-template-columns:1fr;gap:16px}
.fund-results.is-multiple{grid-template-columns:repeat(2,minmax(0,1fr))}
.fund-goal h2{margin-bottom:18px;font-size:clamp(40px,3.25vw,58px)}
.fund-goal p{font-size:clamp(14px,1vw,17px);line-height:1.65}
.fund-result{padding:34px 38px;border-radius:23px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 12%,var(--erp-raised,var(--raised))),color-mix(in srgb,var(--c) 2%,var(--erp-raised,var(--raised))));box-shadow:0 18px 46px rgba(0,0,0,.2),inset 0 1px 0 color-mix(in srgb,var(--c) 14%,transparent)}
.fund-results.is-multiple .fund-result{padding:28px 26px}.fund-results.is-multiple .product-copy{font-size:clamp(16px,1.1vw,19px)}.fund-results.is-multiple .goal-number strong{font-size:clamp(36px,2.8vw,50px)}
.product-copy{font-size:clamp(18px,1.4vw,22px);line-height:1.38}
.result-percent{padding:8px 12px;font-size:13px}
.goal-numbers{margin-top:30px}.goal-number strong{font-size:clamp(42px,3.6vw,60px)}
.track{height:11px;margin-top:24px}
.edit-control{width:100%;border:1px solid color-mix(in srgb,var(--c) 42%,var(--erp-line,var(--line)));border-radius:12px;background:color-mix(in srgb,var(--c) 8%,var(--erp-raised,var(--raised)));color:var(--erp-text,var(--text));outline:0;transition:border-color .15s ease,box-shadow .15s ease}.edit-control:focus{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 14%,transparent)}.fund-title-input{padding:10px 12px;font-size:clamp(36px,3.1vw,54px);font-weight:850;letter-spacing:-.06em;line-height:1}.fund-mission-input{min-height:76px;padding:12px 14px;resize:vertical;color:var(--erp-muted,var(--muted));font-size:clamp(14px,1vw,17px);line-height:1.55}.product-input{min-height:70px;padding:12px 14px;resize:vertical;font-size:clamp(17px,1.3vw,21px);font-weight:850;line-height:1.35}.goal-input{width:min(100%,190px);padding:7px 10px;font-size:clamp(36px,3.2vw,56px);font-weight:850;line-height:1;letter-spacing:-.05em}.goal-number.current .goal-input{color:var(--c)}.goal-input::-webkit-inner-spin-button{opacity:.45}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
html[data-erp-theme="light"] .fund{background:radial-gradient(circle at 4% 50%,color-mix(in srgb,var(--c) 10%,transparent),transparent 42%),radial-gradient(circle at 88% 8%,color-mix(in srgb,var(--c) 7%,transparent),transparent 34%),#fff;box-shadow:0 22px 58px rgba(37,59,91,.09)}
@media(max-width:1080px){.fund{min-height:0;padding:42px;gap:34px}.fund-result{min-height:230px}}
@media(max-width:1400px){.fund-results.is-multiple{grid-template-columns:1fr}}
@media(max-width:700px){.fund-toolbar{margin-bottom:22px}.fund-edit{width:48px;height:48px}.list{gap:34px}.fund{padding:32px 24px;border-radius:22px}.fund-goal h2{font-size:38px}.fund-result{min-height:0;padding:26px 22px}.goal-number strong{font-size:40px}.fund-title-input{font-size:36px}.goal-input{font-size:38px}}
</style>
</head>
<body>
<main class="shell" data-piura-keep-full>
  <div class="fund-toolbar">
    <button class="fund-edit" id="fundEdit" type="button" aria-label="Редактировать цели и показатели" aria-pressed="false"></button>
    <div class="fund-years" aria-label="Год"><button class="fund-year on" data-year="2026">2026</button><button class="fund-year" data-year="2027">2027</button></div>
  </div>
  <section class="list" id="fundList"></section>
  <div class="sr-only" id="fundStatus" role="status" aria-live="polite"></div>
</main>
<script>
const STORE='piura_foundation_goals_v1';
const DATA_REVISION_KEY='piura_foundation_goals_data_revision';
const DATA_REVISION='20260918a';
const FUNDS=[
 {key:'friend',name:'Котики',mission:'Планета без бездомных домашних животных',product:'Коты и кошки, которым оказана непосредственная помощь',fact:309,y26:300,y27:1000,color:'#66a6ff'},
 {key:'scientology',name:'Саентология',mission:'Планета, в которой большее количество людей clear',product:'Разданные книги «Дорога к счастью»',fact:0,y26:100,y27:1000,color:'#a77aff'},
 {key:'drugs',name:'Наркотики',mission:'Планета, в которой нет наркотиков',product:'Отзывы детей после антинаркотического просвещения',fact:0,y26:50,y27:500,color:'#47dba3'},
 {key:'ecology',name:'Экология',mission:'Планета, избавленная от лишнего мусора, в которой численность растений поддерживается в норме',goals:[{key:'planet',product:'Проведённые уборки',fact:1,y26:6,y27:50},{key:'plants',product:'Посаженные деревья',fact:260,y26:500,y27:5000}],color:'#58d4c5'},
 {key:'association',name:'Ассоциация добрых дел',mission:'Планета, в которой люди делают добрые дела',product:'Добрые дела участников ассоциации',fact:9,y26:60,y27:500,color:'#ff986f'}
];
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
function saved(){try{const state=JSON.parse(localStorage.getItem(STORE)||'{}');if(localStorage.getItem(DATA_REVISION_KEY)!==DATA_REVISION){state.planet=state.planet||{};state.planet.current={...(state.planet.current||{}),product:1};state.planet.targets={...(state.planet.targets||{}),2026:{...(state.planet.targets?.[2026]||{}),product:6}};state.plants=state.plants||{};state.plants.current={...(state.plants.current||{}),product:260};state.association=state.association||{};state.association.current={...(state.association.current||{}),product:9};state.association.targets={...(state.association.targets||{}),2026:{...(state.association.targets?.[2026]||{}),product:60}};localStorage.setItem(STORE,JSON.stringify(state));localStorage.setItem(DATA_REVISION_KEY,DATA_REVISION)}return state}catch{return{}}}let state=saved(),activeYear=2026,editMode=false;
function goalsFor(fund){return fund.goals||[fund]}
function factFor(goal){return Number(state?.[goal.key]?.current?.product??goal.fact)||0}
function targetFor(goal){const fallback=activeYear===2026?goal.y26:goal.y27,value=Number(state?.[goal.key]?.targets?.[activeYear]?.product??fallback);return Number.isFinite(value)?Math.max(0,value):fallback}
function fundName(fund){return state?.__funds?.[fund.key]?.name??fund.name}
function fundMission(fund){return state?.__funds?.[fund.key]?.mission??fund.mission}
function productName(goal){return state?.[goal.key]?.productTitle??goal.product}
function numberField(kind,key,value,label){return editMode?`<input class="edit-control goal-input" type="number" min="0" step="1" inputmode="numeric" data-edit-kind="${kind}" data-key="${esc(key)}" value="${value}" aria-label="${esc(label)}">`:`<strong>${value.toLocaleString('ru-RU')}</strong>`}
function result(goal){const fact=factFor(goal),target=targetFor(goal),percent=target?fact/target*100:0,product=productName(goal),productView=editMode?`<textarea class="edit-control product-input" data-edit-kind="goal-product" data-key="${esc(goal.key)}" aria-label="Название подцели">${esc(product)}</textarea>`:`<div class="product-copy">${esc(product)}</div>`;return `<section class="fund-result"><div class="product-head">${productView}<b class="result-percent">${percent.toFixed(0)}%</b></div><div class="goal-numbers"><div class="goal-number current"><small>Сделано</small>${numberField('current',goal.key,fact,'Сделано')}</div><span class="goal-divider">из</span><div class="goal-number"><small>План</small>${numberField('target',goal.key,target,'План')}</div></div><div class="track"><i style="width:${Math.min(100,percent)}%"></i></div></section>`}
function render(){const editButton=document.getElementById('fundEdit');editButton.classList.toggle('on',editMode);editButton.setAttribute('aria-pressed',String(editMode));editButton.setAttribute('aria-label',editMode?'Завершить редактирование':'Редактировать цели и показатели');editButton.innerHTML=editMode?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>';document.getElementById('fundList').innerHTML=FUNDS.map(fund=>{const goals=goalsFor(fund),name=fundName(fund),mission=fundMission(fund),goalView=editMode?`<section class="fund-goal"><input class="edit-control fund-title-input" data-edit-kind="fund-name" data-key="${esc(fund.key)}" value="${esc(name)}" aria-label="Название направления"><textarea class="edit-control fund-mission-input" data-edit-kind="fund-mission" data-key="${esc(fund.key)}" aria-label="Текст цели">${esc(mission)}</textarea></section>`:`<section class="fund-goal"><h2>${esc(name)}</h2><p>${esc(mission)}</p></section>`;return `<article class="fund" style="--c:${fund.color}">${goalView}<div class="fund-results${goals.length>1?' is-multiple':''}">${goals.map(result).join('')}</div></article>`}).join('')}
function saveControl(control){const kind=control.dataset.editKind,key=control.dataset.key;if(!kind||!key)return;if(kind==='fund-name'||kind==='fund-mission'){state.__funds=state.__funds||{};state.__funds[key]=state.__funds[key]||{};state.__funds[key][kind==='fund-name'?'name':'mission']=control.value}else if(kind==='goal-product'){state[key]=state[key]||{};state[key].productTitle=control.value}else{const value=Math.max(0,Number(control.value)||0);state[key]=state[key]||{};if(kind==='current')state[key].current={...(state[key].current||{}),product:value};if(kind==='target')state[key].targets={...(state[key].targets||{}),[activeYear]:{...(state[key].targets?.[activeYear]||{}),product:value}}}localStorage.setItem(STORE,JSON.stringify(state));document.getElementById('fundStatus').textContent='Изменения сохранены';render()}
document.querySelectorAll('[data-year]').forEach(button=>button.onclick=()=>{activeYear=Number(button.dataset.year);document.querySelectorAll('[data-year]').forEach(item=>item.classList.toggle('on',item===button));render()});
document.getElementById('fundEdit').onclick=()=>{editMode=!editMode;render()};
document.getElementById('fundList').addEventListener('change',event=>{const control=event.target.closest('[data-edit-kind]');if(control)saveControl(control)});
document.getElementById('fundList').addEventListener('keydown',event=>{if(event.key==='Enter'&&event.target.matches('input[data-edit-kind]'))event.target.blur()});
window.addEventListener('message',event=>{if(event.data?.type==='piura:cloud-data-applied'){state=saved();render()}});render();
</script>
</body>
</html>
