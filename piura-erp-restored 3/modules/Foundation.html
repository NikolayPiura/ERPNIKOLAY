<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Фонды</title>
<style>
:root{color-scheme:dark;--bg:#070a10;--panel:#10151e;--raised:#161c27;--line:rgba(255,255,255,.09);--text:#f3f6fa;--muted:#8390a3;--blue:#66a6ff;--green:#47dba3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--erp-bg,var(--bg));color:var(--erp-text,var(--text));font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(1900px,100%);margin:auto;padding:34px clamp(22px,3vw,56px) 140px}.fund-years{width:max-content;display:flex;gap:8px;margin:0 0 28px auto;padding:6px;border:1px solid var(--erp-line,var(--line));border-radius:15px;background:color-mix(in srgb,var(--erp-surface,var(--panel)) 92%,transparent)}.fund-year{min-width:118px;height:48px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--erp-muted,var(--muted));font-weight:900;cursor:pointer}.fund-year.on{border-color:color-mix(in srgb,var(--blue) 42%,var(--erp-line,var(--line)));background:color-mix(in srgb,var(--blue) 10%,transparent);color:var(--erp-text,var(--text))}.list{display:grid;gap:30px}.fund{--c:var(--blue);position:relative;min-height:330px;padding:56px 62px;display:grid;grid-template-columns:minmax(360px,.9fr) minmax(520px,1.1fr);align-items:stretch;gap:clamp(54px,6vw,104px);border:1px solid color-mix(in srgb,var(--c) 27%,var(--erp-line,var(--line)));border-radius:28px;background:radial-gradient(circle at 0 50%,color-mix(in srgb,var(--c) 10%,transparent),transparent 42%),var(--erp-surface,var(--panel));overflow:hidden}.fund:before{content:"";position:absolute;inset:30px auto 30px 0;width:4px;border-radius:0 8px 8px 0;background:var(--c);box-shadow:0 0 24px color-mix(in srgb,var(--c) 30%,transparent)}.fund-goal{display:flex;flex-direction:column;justify-content:center}.fund-label,.product-label{display:block;color:var(--c);font-size:10px;font-weight:900;letter-spacing:.17em;text-transform:uppercase}.fund-goal h2{margin:18px 0 20px;font-size:clamp(38px,3.4vw,56px);letter-spacing:-.06em;line-height:.94}.fund-goal p{max-width:620px;margin:0;color:var(--erp-muted,var(--muted));font-size:16px;line-height:1.72}.fund-result{min-width:0;padding:36px 40px;border:1px solid color-mix(in srgb,var(--c) 34%,var(--erp-line,var(--line)));border-radius:23px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 8%,var(--erp-raised,var(--raised))),var(--erp-raised,var(--raised)));display:flex;flex-direction:column;justify-content:center}.product-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:24px}.product-copy{margin-top:13px;color:var(--erp-text,var(--text));font-size:clamp(17px,1.5vw,22px);font-weight:850;line-height:1.35}.result-percent{padding:8px 11px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);font-size:13px;font-weight:900}.goal-head{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:34px}.goal-head span{color:var(--c);font-size:11px;font-weight:900;letter-spacing:.14em}.goal-numbers{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:22px;margin-top:25px}.goal-number{display:grid;gap:10px}.goal-number small{color:var(--erp-muted,var(--muted));font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.goal-number strong{color:var(--erp-text,var(--text));font-size:clamp(42px,4vw,62px);line-height:.82;letter-spacing:-.06em}.goal-number.current strong{color:var(--c)}.goal-divider{padding-bottom:8px;color:var(--erp-muted,var(--muted));font-size:14px;font-weight:800}.track{height:11px;margin-top:30px;border-radius:999px;background:color-mix(in srgb,var(--erp-text,var(--text)) 8%,var(--erp-raised,var(--raised)));overflow:hidden}.track i{display:block;height:100%;max-width:100%;border-radius:inherit;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 58%,white));box-shadow:0 0 20px color-mix(in srgb,var(--c) 30%,transparent)}
html[data-erp-theme="light"] .fund-years{background:#fff;box-shadow:0 8px 24px rgba(36,57,88,.06)}html[data-erp-theme="light"] .fund{background:radial-gradient(circle at 0 50%,color-mix(in srgb,var(--c) 8%,transparent),transparent 44%),#fff;box-shadow:0 14px 36px rgba(37,59,91,.065)}html[data-erp-theme="light"] .fund-result{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 7%,#f8fafc),#f8fafc)}
@media(max-width:1080px){.fund{grid-template-columns:1fr;gap:42px}.fund-result{min-height:250px}}@media(max-width:700px){.shell{padding:22px 12px 80px}.fund-years{width:100%;margin-bottom:20px}.fund-year{flex:1;min-width:0}.fund{padding:38px 28px;grid-template-columns:1fr;gap:34px}.fund-result{padding:30px 24px}.product-head{grid-template-columns:1fr}.goal-numbers{gap:12px}.goal-number strong{font-size:42px}}
</style>
</head>
<body>
<main class="shell" data-piura-keep-full>
  <div class="fund-years" aria-label="Год"><button class="fund-year on" data-year="2026">2026</button><button class="fund-year" data-year="2027">2027</button></div>
  <section class="list" id="fundList"></section>
</main>
<script>
const STORE='piura_foundation_goals_v1';
const FUNDS=[
 {key:'friend',name:'Котики',mission:'Планета без бездомных домашних животных',product:'Коты и кошки, которым оказана непосредственная помощь',fact:287,y26:400,y27:1000,color:'#66a6ff'},
 {key:'drugs',name:'Наркотики',mission:'Планета, в которой нет наркотиков',product:'Отзывы детей после антинаркотического просвещения',fact:0,y26:100,y27:500,color:'#47dba3'},
 {key:'scientology',name:'Саентология',mission:'Планета, на которой всё больше людей достигают состояния Клир',product:'Разданные книги «Дорога к счастью»',fact:0,y26:100,y27:1000,color:'#a77aff'},
 {key:'planet',name:'Уборки',mission:'Планета, избавленная от излишнего мусора',product:'Проведённые уборки',fact:0,y26:10,y27:50,color:'#58d4ee'},
 {key:'plants',name:'Растения',mission:'Планета, в которой численность растений поддерживается в норме',product:'Посаженные деревья',fact:200,y26:500,y27:5000,color:'#f5c75c'},
 {key:'association',name:'Ассоциация добрых дел',mission:'Планета, в которой люди делают добрые дела',product:'Добрые дела участников ассоциации',fact:0,y26:20,y27:500,color:'#ff986f'}
];
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
function saved(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch{return{}}}let state=saved(),activeYear=2026;
function factFor(fund){return Number(state?.[fund.key]?.current?.product??fund.fact)||0}
function result(target,fact,product){const percent=target?fact/target*100:0;return `<section class="fund-result"><div class="product-head"><div><span class="product-label">Продукт</span><div class="product-copy">${esc(product)}</div></div><b class="result-percent">${percent.toFixed(0)}%</b></div><div class="goal-head"><span>${activeYear}</span></div><div class="goal-numbers"><div class="goal-number current"><small>Сделано</small><strong>${fact.toLocaleString('ru-RU')}</strong></div><span class="goal-divider">из</span><div class="goal-number"><small>План</small><strong>${target.toLocaleString('ru-RU')}</strong></div></div><div class="track"><i style="width:${Math.min(100,percent)}%"></i></div></section>`}
function render(){document.getElementById('fundList').innerHTML=FUNDS.map(fund=>{const fact=factFor(fund),target=activeYear===2026?fund.y26:fund.y27;return `<article class="fund" style="--c:${fund.color}"><section class="fund-goal"><span class="fund-label">Цель</span><h2>${esc(fund.name)}</h2><p>${esc(fund.mission)}</p></section>${result(target,fact,fund.product)}</article>`}).join('')}
document.querySelectorAll('[data-year]').forEach(button=>button.onclick=()=>{activeYear=Number(button.dataset.year);document.querySelectorAll('[data-year]').forEach(item=>item.classList.toggle('on',item===button));render()});
window.addEventListener('message',event=>{if(event.data?.type==='piura:cloud-data-applied'){state=saved();render()}});render();
</script>
</body>
</html>
