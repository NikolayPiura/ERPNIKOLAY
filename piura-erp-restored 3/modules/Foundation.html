<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Фонды</title>
<style>
:root{color-scheme:dark;--bg:#070a10;--panel:#10151e;--raised:#161c27;--line:rgba(255,255,255,.09);--text:#f3f6fa;--muted:#8390a3;--blue:#66a6ff;--green:#47dba3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--erp-bg,var(--bg));color:var(--erp-text,var(--text));font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.shell{width:min(1680px,100%);margin:auto;padding:44px clamp(24px,4vw,72px) 120px}.header{min-height:150px;padding:34px 40px;border:1px solid var(--erp-line,var(--line));border-radius:24px;background:radial-gradient(circle at 14% 0,rgba(102,166,255,.12),transparent 34%),var(--erp-surface,var(--panel));display:flex;align-items:center;justify-content:space-between;gap:32px}.header-kicker{display:block;margin-bottom:13px;color:var(--blue);font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.header h1{margin:0;font-size:clamp(50px,5vw,76px);line-height:.88;letter-spacing:-.065em}.years{display:flex;gap:7px;padding:6px;border:1px solid var(--erp-line,var(--line));border-radius:15px;background:rgba(7,10,16,.55)}.year{min-width:126px;height:50px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--erp-muted,var(--muted));font-weight:900;cursor:pointer}.year.on{border-color:rgba(102,166,255,.46);background:rgba(102,166,255,.14);color:var(--erp-text,var(--text))}.list{display:grid;gap:30px;margin-top:34px}.fund{--c:var(--blue);position:relative;min-height:286px;padding:44px 48px;display:grid;grid-template-columns:minmax(360px,1.15fr) minmax(410px,.85fr);align-items:center;gap:64px;border:1px solid color-mix(in srgb,var(--c) 26%,var(--erp-line,var(--line)));border-radius:24px;background:radial-gradient(circle at 0 50%,color-mix(in srgb,var(--c) 10%,transparent),transparent 42%),var(--erp-surface,var(--panel));overflow:hidden}.fund:before{content:"";position:absolute;inset:26px auto 26px 0;width:5px;border-radius:0 8px 8px 0;background:var(--c);box-shadow:0 0 24px color-mix(in srgb,var(--c) 30%,transparent)}.identity h2{margin:0 0 16px;font-size:clamp(36px,3.2vw,52px);letter-spacing:-.055em;line-height:.96}.identity p{max-width:560px;margin:0;color:var(--erp-muted,var(--muted));font-size:15px;line-height:1.6}.product{max-width:620px;margin-top:28px;padding-top:20px;border-top:1px solid color-mix(in srgb,var(--c) 30%,var(--line));color:var(--erp-text,var(--text));font-size:15px;font-weight:800;line-height:1.5}.goal{min-height:200px;padding:28px 30px;border:1px solid color-mix(in srgb,var(--c) 38%,var(--erp-line,var(--line)));border-radius:20px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 10%,var(--erp-raised,var(--raised))),var(--erp-raised,var(--raised)));display:flex;flex-direction:column;justify-content:center}.goal-head{display:flex;align-items:center;justify-content:space-between;gap:20px}.goal-head span{color:var(--c);font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.goal-head b{padding:6px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--c);font-size:12px}.goal-numbers{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:18px;margin-top:25px}.goal-number{display:grid;gap:8px}.goal-number small{color:var(--erp-muted,var(--muted));font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.goal-number strong{color:var(--erp-text,var(--text));font-size:clamp(42px,4vw,62px);line-height:.82;letter-spacing:-.06em}.goal-number.current strong{color:var(--c)}.goal-divider{padding-bottom:8px;color:var(--erp-muted,var(--muted));font-size:14px;font-weight:800}.track{height:12px;margin-top:26px;border-radius:999px;background:color-mix(in srgb,var(--erp-text,var(--text)) 8%,var(--erp-raised,var(--raised)));overflow:hidden}.track i{display:block;height:100%;max-width:100%;border-radius:inherit;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 58%,white));box-shadow:0 0 20px color-mix(in srgb,var(--c) 30%,transparent)}
html[data-erp-theme="light"] .header{background:radial-gradient(circle at 12% 0,color-mix(in srgb,var(--blue) 13%,transparent),transparent 38%),#fff!important;box-shadow:0 12px 34px rgba(36,57,88,.08)!important}html[data-erp-theme="light"] .years{background:#f2f6fb}html[data-erp-theme="light"] .fund{background:radial-gradient(circle at 0 50%,color-mix(in srgb,var(--c) 9%,transparent),transparent 44%),#fff;box-shadow:0 14px 36px rgba(37,59,91,.075)}html[data-erp-theme="light"] .goal{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 10%,#f7f9fc),#f7f9fc)}
@media(max-width:1080px){.fund{grid-template-columns:1fr;gap:34px}}@media(max-width:700px){.shell{padding:16px 12px 70px}.header{padding:24px;align-items:flex-start;flex-direction:column}.years{width:100%}.year{flex:1;min-width:0}.fund{padding:34px 26px;grid-template-columns:1fr;gap:30px}.goal-numbers{gap:12px}.goal-number strong{font-size:42px}}
</style>
</head>
<body>
<main class="shell" data-piura-keep-full>
  <header class="header"><div><span class="header-kicker">Шесть направлений</span><h1>Результаты</h1></div><div class="years" aria-label="Год"><button class="year on" data-year="2026">2026</button><button class="year" data-year="2027">2027</button></div></header>
  <section class="list" id="fundList"></section>
</main>
<script>
const STORE='piura_foundation_goals_v1';
const FUNDS=[
 {key:'friend',name:'Котики',mission:'Планета без бездомных домашних животных',product:'Коты и кошки, которым оказана непосредственная помощь',fact:287,y26:400,y27:1000,color:'#66a6ff'},
 {key:'drugs',name:'Наркотики',mission:'Планета, в которой нет наркотиков',product:'Отзывы детей после антинаркотического просвещения',fact:0,y26:100,y27:500,color:'#47dba3'},
 {key:'scientology',name:'Саентология',mission:'Планета, на которой всё больше людей достигают состояния Клир',product:'Разданные книги «Дорога к счастью»',fact:0,y26:100,y27:1000,color:'#a77aff'},
 {key:'planet',name:'Уборки',mission:'Планета, избавленная от излишнего мусора',product:'Проведённые уборки',fact:0,y26:10,y27:50,color:'#58d4ee'},
 {key:'plants',name:'Растения',mission:'Планета, в которой численность растений поддерживается в норме',product:'Посаженные деревья',fact:200,y26:500,y27:5000,color:'#f5c75c'},
 {key:'association',name:'Ассоциация добрых дел',mission:'Планета, в которой люди делают добрые дела',product:'Добрые дела участников ассоциации',fact:0,y26:20,y27:500,color:'#ff986f'}
];
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
function saved(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch{return{}}}let state=saved(),activeYear=2026;
function factFor(fund){return Number(state?.[fund.key]?.current?.product??fund.fact)||0}
function goal(target,fact){const percent=target?fact/target*100:0;return `<article class="goal"><div class="goal-head"><span>Прогресс ${activeYear}</span><b>${percent.toFixed(0)}%</b></div><div class="goal-numbers"><div class="goal-number current"><small>Сделано</small><strong>${fact.toLocaleString('ru-RU')}</strong></div><span class="goal-divider">из</span><div class="goal-number"><small>План</small><strong>${target.toLocaleString('ru-RU')}</strong></div></div><div class="track"><i style="width:${Math.min(100,percent)}%"></i></div></article>`}
function render(){document.getElementById('fundList').innerHTML=FUNDS.map(fund=>{const fact=factFor(fund),target=activeYear===2026?fund.y26:fund.y27;return `<article class="fund" style="--c:${fund.color}"><div class="identity"><h2>${esc(fund.name)}</h2><p>${esc(fund.mission)}</p><div class="product">${esc(fund.product)}</div></div>${goal(target,fact)}</article>`}).join('')}
document.querySelectorAll('[data-year]').forEach(button=>button.onclick=()=>{activeYear=Number(button.dataset.year);document.querySelectorAll('[data-year]').forEach(item=>item.classList.toggle('on',item===button));render()});
window.addEventListener('message',event=>{if(event.data?.type==='piura:cloud-data-applied'){state=saved();render()}});render();
</script>
</body>
</html>
