<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Фонды</title>
<style>
:root{color-scheme:dark;--bg:#070a10;--panel:#10151e;--raised:#161c27;--line:rgba(255,255,255,.09);--text:#f3f6fa;--muted:#8390a3;--blue:#66a6ff;--green:#47dba3;--violet:#a77aff;--orange:#ff986f;--yellow:#f5c75c;--cyan:#58d4ee}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--erp-bg,var(--bg));color:var(--erp-text,var(--text));font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.shell{width:100%;padding:38px clamp(24px,4vw,68px) 100px}.header{min-height:118px;padding:28px 32px;border:1px solid var(--erp-line,var(--line));border-radius:22px;background:radial-gradient(circle at 0 0,rgba(71,219,163,.1),transparent 38%),var(--erp-surface,var(--panel));display:flex;align-items:center;justify-content:space-between;gap:24px}.header small{display:block;color:var(--green);font:900 10px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}.header h1{margin:8px 0 0;font-size:clamp(44px,4.7vw,72px);line-height:.9;letter-spacing:-.06em}.years{display:flex;gap:7px;padding:6px;border:1px solid var(--erp-line,var(--line));border-radius:15px;background:var(--erp-raised,var(--raised))}.year{min-width:108px;height:48px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--erp-muted,var(--muted));font-weight:900;cursor:pointer}.year.on{border-color:rgba(102,166,255,.42);background:rgba(102,166,255,.12);color:var(--text)}.list{display:grid;gap:28px;margin-top:34px}.fund{--c:var(--blue);position:relative;min-height:286px;padding:48px 52px;display:grid;grid-template-columns:minmax(310px,.95fr) minmax(190px,.48fr) minmax(320px,1fr);align-items:center;gap:54px;border:1px solid color-mix(in srgb,var(--c) 25%,var(--erp-line,var(--line)));border-radius:25px;background:radial-gradient(circle at 0 50%,color-mix(in srgb,var(--c) 13%,transparent),transparent 40%),var(--erp-surface,var(--panel));overflow:hidden}.fund:before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}.number{color:var(--c);font:900 10px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase}.identity h2{margin:17px 0 12px;font-size:clamp(34px,3.2vw,52px);letter-spacing:-.055em;line-height:.96}.identity p{max-width:480px;margin:0;color:var(--erp-muted,var(--muted));font-size:15px;line-height:1.55}.fact span,.goal span{color:var(--erp-muted,var(--muted));font:850 10px ui-monospace,monospace;letter-spacing:.13em;text-transform:uppercase}.fact strong{display:block;margin-top:15px;font-size:clamp(58px,5.5vw,88px);line-height:.86;letter-spacing:-.065em}.fact b{display:block;max-width:260px;margin-top:14px;color:var(--c);font-size:14px;line-height:1.35}.goal{min-height:184px;padding:26px 28px;border:1px solid color-mix(in srgb,var(--c) 20%,var(--erp-line,var(--line)));border-radius:19px;background:color-mix(in srgb,var(--c) 4%,var(--erp-raised,var(--raised)))}.goal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.goal-head span{font-size:12px;color:var(--c)}.goal-head strong{font-size:clamp(42px,4vw,62px);line-height:.9;letter-spacing:-.055em}.track{height:14px;margin-top:31px;border-radius:999px;background:rgba(255,255,255,.065);overflow:hidden}.track i{display:block;height:100%;max-width:100%;border-radius:inherit;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,white))}.goal-foot{display:flex;justify-content:space-between;gap:12px;margin-top:14px;color:var(--erp-muted,var(--muted));font-size:12px}.goal-foot b{color:var(--c)}
@media(max-width:1120px){.fund{grid-template-columns:1fr 1fr}.identity{grid-column:1/-1}.goal{grid-column:auto}}@media(max-width:720px){.shell{padding:16px 12px 70px}.header{align-items:flex-start;flex-direction:column;padding:24px}.years{width:100%}.year{flex:1;min-width:0}.fund{padding:30px 24px;grid-template-columns:1fr;gap:30px}.identity,.goal{grid-column:auto}.fact strong{font-size:62px}}
</style>
</head>
<body>
<main class="shell" data-piura-keep-full>
  <header class="header"><div><small>PIURA FOUNDATION · ПРОДУКТ</small><h1>Фонды</h1></div><div class="years" aria-label="Год цели"><button class="year on" data-year="2026">2026</button><button class="year" data-year="2027">2027</button></div></header>
  <section class="list" id="fundList"></section>
</main>
<script>
const STORE='piura_foundation_goals_v1';
const FUNDS=[
 {key:'friend',name:'Котики',product:'Спасённые котики',fact:287,y26:75,y27:500,color:'#66a6ff'},
 {key:'drugs',name:'Наркотики',product:'Дети, написавшие отзыв о наркотиках',fact:0,y26:20,y27:10,color:'#47dba3'},
 {key:'scientology',name:'Саентология',product:'Раздано книг «Дорога к счастью»',fact:0,y26:100,y27:1000,color:'#a77aff'},
 {key:'planet',name:'Уборки',product:'Проведено уборок',fact:0,y26:6,y27:50,color:'#58d4ee'},
 {key:'plants',name:'Растения',product:'Посажено деревьев',fact:200,y26:105,y27:5000,color:'#f5c75c'},
 {key:'association',name:'Ассоциация добрых дел',product:'Сделано добрых дел',fact:0,y26:125,y27:300,color:'#ff986f'}
];
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
function saved(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch{return{}}}let state=saved(),activeYear=2026;
function factFor(fund){return Number(state?.[fund.key]?.current?.product??fund.fact)||0}
function goal(target,fact){const percent=target?fact/target*100:0;return `<article class="goal"><div class="goal-head"><span>Цель ${activeYear}</span><strong>${target.toLocaleString('ru-RU')}</strong></div><div class="track"><i style="width:${Math.min(100,percent)}%"></i></div><div class="goal-foot"><span>${fact.toLocaleString('ru-RU')} из ${target.toLocaleString('ru-RU')}</span><b>${percent.toFixed(0)}%</b></div></article>`}
function render(){document.getElementById('fundList').innerHTML=FUNDS.map((fund,index)=>{const fact=factFor(fund),target=activeYear===2026?fund.y26:fund.y27;return `<article class="fund" style="--c:${fund.color}"><div class="identity"><span class="number">${String(index+1).padStart(2,'0')} · направление</span><h2>${esc(fund.name)}</h2><p>${esc(fund.product)}</p></div><div class="fact"><span>Сейчас</span><strong>${fact.toLocaleString('ru-RU')}</strong><b>${esc(fund.product)}</b></div>${goal(target,fact)}</article>`}).join('')}
document.querySelectorAll('[data-year]').forEach(button=>button.onclick=()=>{activeYear=Number(button.dataset.year);document.querySelectorAll('[data-year]').forEach(item=>item.classList.toggle('on',item===button));render()});
window.addEventListener('message',event=>{if(event.data?.type==='piura:cloud-data-applied'){state=saved();render()}});render();
</script>
</body>
</html>
