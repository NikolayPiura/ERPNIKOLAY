<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Фонды</title>
<style>
:root{color-scheme:dark;--bg:#070a10;--panel:#10151e;--raised:#161c27;--line:rgba(255,255,255,.09);--text:#f3f6fa;--muted:#8390a3;--blue:#66a6ff;--green:#47dba3;--violet:#a77aff;--orange:#ff986f;--yellow:#f5c75c;--cyan:#58d4ee}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--erp-bg,var(--bg));color:var(--erp-text,var(--text));font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.shell{width:100%;padding:38px clamp(24px,4vw,68px) 100px}.header{min-height:112px;padding:28px 32px;border:1px solid var(--erp-line,var(--line));border-radius:22px;background:radial-gradient(circle at 0 0,rgba(71,219,163,.1),transparent 38%),var(--erp-surface,var(--panel));display:flex;align-items:center;justify-content:space-between;gap:24px}.header small{display:block;color:var(--green);font:900 10px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}.header h1{margin:8px 0 0;font-size:clamp(42px,4.5vw,70px);line-height:.92;letter-spacing:-.06em}.edit{height:46px;padding:0 18px;border:1px solid rgba(102,166,255,.28);border-radius:12px;background:var(--erp-raised,var(--raised));color:var(--text);font-weight:800;cursor:pointer}.edit:hover{border-color:var(--blue);color:var(--blue)}.list{display:grid;gap:26px;margin-top:34px}.fund{--c:var(--blue);position:relative;min-height:260px;padding:42px 44px;display:grid;grid-template-columns:minmax(280px,.9fr) minmax(170px,.46fr) minmax(0,1.64fr);align-items:center;gap:46px;border:1px solid color-mix(in srgb,var(--c) 22%,var(--erp-line,var(--line)));border-radius:24px;background:radial-gradient(circle at 0 50%,color-mix(in srgb,var(--c) 12%,transparent),transparent 38%),var(--erp-surface,var(--panel));overflow:hidden}.fund:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c)}.number{color:var(--c);font:900 10px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase}.identity h2{margin:15px 0 10px;font-size:clamp(30px,3vw,48px);letter-spacing:-.05em;line-height:.96}.identity p{max-width:420px;margin:0;color:var(--erp-muted,var(--muted));font-size:14px;line-height:1.55}.fact span,.goal span{color:var(--erp-muted,var(--muted));font:850 9px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}.fact strong{display:block;margin-top:13px;font-size:clamp(48px,5vw,78px);line-height:.9;letter-spacing:-.06em}.fact b{display:block;margin-top:11px;color:var(--c);font-size:12px}.goals{display:grid;grid-template-columns:1fr 1fr;gap:14px}.goal{min-height:154px;padding:22px;border:1px solid var(--erp-line,var(--line));border-radius:17px;background:color-mix(in srgb,var(--c) 3%,var(--erp-raised,var(--raised)))}.goal-head{display:flex;align-items:center;justify-content:space-between;gap:14px}.goal-head strong{font-size:27px;letter-spacing:-.04em}.track{height:11px;margin-top:28px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}.track i{display:block;height:100%;max-width:100%;border-radius:inherit;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,white))}.goal-foot{display:flex;justify-content:space-between;gap:12px;margin-top:12px;color:var(--erp-muted,var(--muted));font-size:11px}.goal-foot b{color:var(--c)}dialog{width:min(640px,calc(100vw - 28px));max-height:88vh;padding:25px;border:1px solid var(--line);border-radius:21px;background:#111722;color:#fff;box-shadow:0 35px 120px rgba(0,0,0,.65)}dialog::backdrop{background:rgba(0,0,0,.75);backdrop-filter:blur(7px)}dialog h2{margin:0 0 7px}.note{margin:0 0 19px;color:var(--muted);font-size:13px;line-height:1.5}.editor{display:grid;gap:9px;max-height:54vh;overflow:auto}.edit-row{display:grid;grid-template-columns:1fr 130px;gap:14px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:12px}.edit-row small{display:block;margin-top:4px;color:var(--muted)}.edit-row input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#080c13;color:#fff;text-align:right}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.secondary,.primary{height:42px;padding:0 17px;border-radius:10px;cursor:pointer}.secondary{border:1px solid var(--line);background:var(--raised);color:#fff}.primary{border:0;background:var(--green);color:#06120d;font-weight:900}
@media(max-width:1180px){.fund{grid-template-columns:1fr 1fr}.identity{grid-column:1/-1}.goals{grid-column:1/-1}}@media(max-width:720px){.shell{padding:16px 12px 70px}.header{align-items:flex-start;flex-direction:column;padding:24px}.fund{padding:28px 22px;grid-template-columns:1fr;gap:28px}.identity,.goals{grid-column:auto}.goals{grid-template-columns:1fr}.fact strong{font-size:56px}}
</style>
</head>
<body>
<main class="shell" data-piura-keep-full>
  <header class="header"><div><small>PIURA FOUNDATION · ПРОДУКТ</small><h1>Фонды</h1></div><button class="edit" id="editFacts">Изменить факты</button></header>
  <section class="list" id="fundList"></section>
</main>
<dialog id="factsDialog"><h2>Фактический продукт</h2><p class="note">Меняется только текущее значение. Цели 2026 и 2027 сохраняются отдельно.</p><div class="editor" id="factsEditor"></div><div class="actions"><button class="secondary" id="cancelFacts">Отмена</button><button class="primary" id="saveFacts">Сохранить</button></div></dialog>
<script>
const STORE='piura_foundation_goals_v1';
const FUNDS=[
 {key:'friend',name:'Котики',product:'Спасённые котики',fact:287,y26:75,y27:500,color:'#66a6ff'},
 {key:'drugs',name:'Наркотики',product:'Люди, прошедшие программу',fact:0,y26:20,y27:10,color:'#47dba3'},
 {key:'scientology',name:'Саентология',product:'Раздано книг «Дорога к счастью»',fact:0,y26:100,y27:1000,color:'#a77aff'},
 {key:'planet',name:'Уборки',product:'Проведено уборок',fact:0,y26:6,y27:50,color:'#58d4ee'},
 {key:'plants',name:'Растения',product:'Посажено деревьев',fact:200,y26:105,y27:5000,color:'#f5c75c'},
 {key:'association',name:'Ассоциация добрых дел',product:'Люди, ежедневно делающие добрые дела',fact:0,y26:125,y27:300,color:'#ff986f'}
];
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
function saved(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch{return{}}}let state=saved();
function factFor(fund){return Number(state?.[fund.key]?.current?.product??fund.fact)||0}
function goal(year,target,fact){const percent=target?fact/target*100:0;return `<article class="goal"><div class="goal-head"><span>Цель ${year}</span><strong>${target.toLocaleString('ru-RU')}</strong></div><div class="track"><i style="width:${Math.min(100,percent)}%"></i></div><div class="goal-foot"><span>${fact.toLocaleString('ru-RU')} из ${target.toLocaleString('ru-RU')}</span><b>${percent.toFixed(0)}%</b></div></article>`}
function render(){document.getElementById('fundList').innerHTML=FUNDS.map((fund,index)=>{const fact=factFor(fund);return `<article class="fund" style="--c:${fund.color}"><div class="identity"><span class="number">${String(index+1).padStart(2,'0')} · направление</span><h2>${esc(fund.name)}</h2><p>${esc(fund.product)}</p></div><div class="fact"><span>Сейчас</span><strong>${fact.toLocaleString('ru-RU')}</strong><b>фактический продукт</b></div><div class="goals">${goal(2026,fund.y26,fact)}${goal(2027,fund.y27,fact)}</div></article>`}).join('')}
function openEditor(){document.getElementById('factsEditor').innerHTML=FUNDS.map(fund=>`<label class="edit-row"><span><b>${esc(fund.name)}</b><small>${esc(fund.product)}</small></span><input type="number" min="0" step="1" data-fact="${fund.key}" value="${factFor(fund)}"></label>`).join('');document.getElementById('factsDialog').showModal()}
function saveFacts(){document.querySelectorAll('[data-fact]').forEach(input=>{state[input.dataset.fact]??={};state[input.dataset.fact].current??={};state[input.dataset.fact].current.product=Number(input.value)||0});localStorage.setItem(STORE,JSON.stringify(state));document.getElementById('factsDialog').close();render();parent?.postMessage({type:'piura:data-changed'},'*')}
document.getElementById('editFacts').onclick=openEditor;document.getElementById('cancelFacts').onclick=()=>document.getElementById('factsDialog').close();document.getElementById('saveFacts').onclick=saveFacts;window.addEventListener('message',event=>{if(event.data?.type==='piura:cloud-data-applied'){state=saved();render()}});render();
</script>
</body>
</html>
