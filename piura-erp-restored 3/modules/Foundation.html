<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Фонды</title>
<style>
:root{color-scheme:dark;--bg:#070a10;--panel:#10151e;--raised:#161c27;--line:rgba(255,255,255,.09);--text:#f3f6fa;--muted:#8390a3;--blue:#66a6ff;--green:#47dba3;--violet:#a77aff;--orange:#ff986f;--yellow:#f5c75c;--cyan:#58d4ee}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--erp-bg,var(--bg));color:var(--erp-text,var(--text));font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.shell{width:100%;padding:38px clamp(24px,4vw,68px) 100px}.header{min-height:264px;padding:34px;border:1px solid rgba(71,219,163,.28);border-radius:26px;background:radial-gradient(circle at 92% 0,rgba(102,166,255,.16),transparent 40%),linear-gradient(125deg,rgba(71,219,163,.12),transparent 45%),var(--erp-surface,var(--panel));display:grid;grid-template-columns:minmax(300px,.9fr) 1.1fr;align-items:end;gap:34px;box-shadow:0 28px 70px rgba(0,0,0,.25)}.header small,.identity>span,.product-label{display:block;color:var(--green);font:900 9px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}.header h1{margin:12px 0 10px;font-size:clamp(52px,6vw,88px);line-height:.86;letter-spacing:-.07em}.header p{max-width:540px;margin:0;color:var(--muted);font-size:13px;line-height:1.55}.hero-tools{display:grid;gap:12px}.hero-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hero-summary div{min-height:94px;padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(7,10,16,.56);display:grid;align-content:end;gap:7px}.hero-summary span{color:var(--muted);font:850 8px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}.hero-summary strong{font-size:24px;letter-spacing:-.04em}.years{display:flex;gap:7px;padding:6px;border:1px solid var(--erp-line,var(--line));border-radius:15px;background:rgba(7,10,16,.6)}.year{flex:1;min-width:108px;height:48px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--erp-muted,var(--muted));font-weight:900;cursor:pointer}.year.on{border-color:rgba(102,166,255,.42);background:rgba(102,166,255,.12);color:var(--text)}.list{display:grid;gap:18px;margin-top:24px}.fund{--c:var(--blue);position:relative;min-height:240px;padding:34px 38px;display:grid;grid-template-columns:minmax(300px,1.05fr) minmax(220px,.65fr) minmax(300px,.9fr);align-items:center;gap:38px;border:1px solid color-mix(in srgb,var(--c) 22%,var(--erp-line,var(--line)));border-radius:21px;background:radial-gradient(circle at 0 50%,color-mix(in srgb,var(--c) 8%,transparent),transparent 42%),var(--erp-surface,var(--panel));overflow:hidden}.fund:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}.identity h2{margin:11px 0 12px;font-size:clamp(30px,2.8vw,44px);letter-spacing:-.05em;line-height:.96}.identity p{max-width:480px;margin:0;color:var(--erp-muted,var(--muted));font-size:13px;line-height:1.55}.fact{padding:0 8px}.fact>span,.goal span{color:var(--erp-muted,var(--muted));font:850 9px ui-monospace,monospace;letter-spacing:.13em;text-transform:uppercase}.fact strong{display:block;margin:11px 0 15px;font-size:clamp(48px,4.5vw,72px);line-height:.86;letter-spacing:-.065em}.product{padding-top:13px;border-top:1px solid color-mix(in srgb,var(--c) 25%,var(--line))}.product-label{color:var(--c);font-size:8px}.fact b{display:block;max-width:290px;margin-top:7px;color:var(--text);font-size:12px;line-height:1.42}.goal{min-height:170px;padding:24px 26px;border:1px solid color-mix(in srgb,var(--c) 28%,var(--erp-line,var(--line)));border-radius:18px;background:color-mix(in srgb,var(--c) 6%,var(--erp-raised,var(--raised)))}.goal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.goal-head span{font-size:9px;color:var(--c)}.goal-head strong{font-size:clamp(38px,3.6vw,56px);line-height:.9;letter-spacing:-.055em}.track{height:10px;margin-top:27px;border-radius:999px;background:rgba(255,255,255,.065);overflow:hidden}.track i{display:block;height:100%;max-width:100%;border-radius:inherit;background:var(--c)}.goal-foot{display:flex;justify-content:space-between;gap:12px;margin-top:13px;color:var(--erp-muted,var(--muted));font-size:10px}.goal-foot b{color:var(--c)}
@media(max-width:1120px){.header{grid-template-columns:1fr}.fund{grid-template-columns:1fr 1fr}.identity{grid-column:1/-1}.goal{grid-column:auto}}@media(max-width:720px){.shell{padding:16px 12px 70px}.header{padding:24px}.hero-summary{grid-template-columns:1fr}.years{width:100%}.year{flex:1;min-width:0}.fund{padding:28px 22px;grid-template-columns:1fr;gap:26px}.identity,.goal{grid-column:auto}.fact strong{font-size:58px}}
</style>
</head>
<body>
<main class="shell" data-piura-keep-full>
  <header class="header"><div><small>СИСТЕМА ДОБРЫХ ДЕЛ</small><h1>Фонды</h1><p>Каждый фонд начинается с ясной цели, превращает её в измеримый продукт и показывает, сколько уже сделано.</p></div><div class="hero-tools"><div class="hero-summary" id="heroSummary"></div><div class="years" aria-label="Год цели"><button class="year on" data-year="2026">Цели 2026</button><button class="year" data-year="2027">Цели 2027</button></div></div></header>
  <section class="list" id="fundList"></section>
</main>
<script>
const STORE='piura_foundation_goals_v1';
const FUNDS=[
 {key:'friend',name:'Котики',mission:'Планета без бездомных домашних животных',product:'Коты и кошки, которым оказана непосредственная помощь',fact:287,y26:400,y27:1000,color:'#66a6ff'},
 {key:'drugs',name:'Наркотики',mission:'Планета, в которой нет наркотиков',product:'Дети, получившие просветительское образование по наркотикам и написавшие отзыв',fact:0,y26:100,y27:500,color:'#47dba3'},
 {key:'scientology',name:'Саентология',mission:'Планета, на которой всё больше людей достигают состояния Клир',product:'Разданные книги «Дорога к счастью»',fact:0,y26:100,y27:1000,color:'#a77aff'},
 {key:'planet',name:'Уборки',mission:'Планета, избавленная от излишнего мусора',product:'Проведённые уборки',fact:0,y26:10,y27:50,color:'#58d4ee'},
 {key:'plants',name:'Растения',mission:'Планета, в которой численность растений поддерживается в норме',product:'Посаженные деревья',fact:200,y26:500,y27:5000,color:'#f5c75c'},
 {key:'association',name:'Ассоциация добрых дел',mission:'Планета, в которой люди делают добрые дела',product:'Сделанные добрые дела',fact:0,y26:20,y27:500,color:'#ff986f'}
];
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
function saved(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch{return{}}}let state=saved(),activeYear=2026;
function factFor(fund){return Number(state?.[fund.key]?.current?.product??fund.fact)||0}
function goal(target,fact){const percent=target?fact/target*100:0;return `<article class="goal"><div class="goal-head"><span>ПЛАН ПРОДУКТА · ${activeYear}</span><strong>${target.toLocaleString('ru-RU')}</strong></div><div class="track"><i style="width:${Math.min(100,percent)}%"></i></div><div class="goal-foot"><span>Сделано ${fact.toLocaleString('ru-RU')} из ${target.toLocaleString('ru-RU')}</span><b>${percent.toFixed(0)}%</b></div></article>`}
function render(){const facts=FUNDS.map(factFor),targets=FUNDS.map(fund=>activeYear===2026?fund.y26:fund.y27),done=facts.reduce((sum,value)=>sum+value,0),target=targets.reduce((sum,value)=>sum+value,0),progress=target?done/target*100:0;document.getElementById('heroSummary').innerHTML=`<div><span>Активных фондов</span><strong>${FUNDS.length}</strong></div><div><span>Сделано продуктов</span><strong>${done.toLocaleString('ru-RU')}</strong></div><div><span>Общий прогресс</span><strong>${progress.toFixed(0)}%</strong></div>`;document.getElementById('fundList').innerHTML=FUNDS.map(fund=>{const fact=factFor(fund),target=activeYear===2026?fund.y26:fund.y27;return `<article class="fund" style="--c:${fund.color}"><div class="identity"><span>ЦЕЛЬ ФОНДА</span><h2>${esc(fund.name)}</h2><p>${esc(fund.mission)}</p></div><div class="fact"><span>СДЕЛАНО</span><strong>${fact.toLocaleString('ru-RU')}</strong><div class="product"><span class="product-label">ПРОДУКТ</span><b>${esc(fund.product)}</b></div></div>${goal(target,fact)}</article>`}).join('')}
document.querySelectorAll('[data-year]').forEach(button=>button.onclick=()=>{activeYear=Number(button.dataset.year);document.querySelectorAll('[data-year]').forEach(item=>item.classList.toggle('on',item===button));render()});
window.addEventListener('message',event=>{if(event.data?.type==='piura:cloud-data-applied'){state=saved();render()}});render();
</script>
</body>
</html>
