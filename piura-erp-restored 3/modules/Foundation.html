<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Фонды</title>
<style>
  :root{--bg:#070a10;--panel:#0e131c;--panel2:#121925;--line:rgba(255,255,255,.085);--line2:rgba(255,255,255,.14);--text:#f2f6fb;--muted:#7f8da2;--blue:#66a6ff;--green:#47dba3;--violet:#a77aff;--orange:#ff986f;--yellow:#f5c75c;--cyan:#58d4ee}
  *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}body{background-image:radial-gradient(circle at 92% 0,rgba(71,219,163,.055),transparent 28%)}button,input,select{font:inherit}.shell{width:100%;padding:30px clamp(18px,3vw,52px) 90px}
  .service-head{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:26px;padding:13px 14px 13px 22px;border:1px solid var(--line);border-radius:17px;background:rgba(10,14,21,.94);backdrop-filter:blur(18px);margin-bottom:26px}.service-head h1{margin:0;font-size:clamp(27px,3vw,42px);line-height:1;letter-spacing:-.045em}.tabs{display:flex;gap:6px;margin-left:auto}.tab{min-height:43px;padding:0 25px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--muted);font-weight:800;cursor:pointer}.tab:hover{color:var(--text);border-color:var(--line)}.tab.on{background:#17243a;color:#fff;border-color:#315b91}.view{display:none}.view.on{display:block}
  .overview-head,.friend-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 2px 16px}.overview-head h2,.friend-head h2,.block-title h3{margin:0;font-size:23px;letter-spacing:-.025em}.edit-btn,.ghost{min-height:42px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:#c6d1df;cursor:pointer;font-weight:750}.edit-btn:hover,.ghost:hover{border-color:var(--green);color:#fff}
  .fund-grid{display:grid;gap:12px}.fund-card{--c:var(--green);position:relative;display:grid;grid-template-columns:minmax(170px,1.05fr) minmax(110px,.5fr) repeat(2,minmax(190px,1fr));align-items:center;gap:18px;min-height:158px;padding:24px 28px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(105deg,color-mix(in srgb,var(--c) 8%,var(--panel)),var(--panel) 38%);overflow:hidden}.fund-card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}.fund-card h3{font-size:28px;letter-spacing:-.04em;margin:0 0 8px}.product-label{color:#aeb9c9;font-size:13px}.fact-block small,.goal-head span{display:block;color:var(--muted);font:800 10px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}.fact{font-size:46px;font-weight:850;letter-spacing:-.055em;margin-top:6px}.goal{padding:17px 18px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.018)}.goal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.goal-head b{font-size:19px;color:var(--c)}.track{height:8px;border-radius:999px;background:#222a36;margin-top:18px;overflow:hidden}.track i{display:block;height:100%;max-width:100%;border-radius:inherit;background:var(--c)}.goal-foot{display:flex;justify-content:space-between;gap:10px;margin-top:9px;color:#68768a;font-size:11px}.goal-foot b{color:#aeb9c9}
  dialog{width:min(620px,calc(100vw - 30px));max-height:88vh;border:1px solid var(--line2);border-radius:20px;background:#101620;color:#fff;padding:24px;box-shadow:0 35px 100px rgba(0,0,0,.6)}dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(5px)}dialog h2{margin:0 0 8px}.dialog-note{margin:0 0 20px;color:var(--muted);font-size:13px;line-height:1.5}.edit-grid{display:grid;gap:10px;max-height:52vh;overflow:auto;padding-right:4px}.edit-row{display:grid;grid-template-columns:1fr 130px;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:12px}.edit-row b{font-size:14px}.edit-row small{display:block;color:var(--muted);margin-top:3px}.edit-row input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#090d14;color:#fff;text-align:right}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.primary{min-height:42px;padding:0 18px;border:0;border-radius:10px;background:var(--green);color:#07110d;font-weight:850;cursor:pointer}
  .friend-tools{display:flex;align-items:center;gap:11px}.friend-status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:var(--yellow)}.friend-status.ok .dot{background:var(--green)}.friend-status.error .dot{background:#ff6f7d}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}.kpi{padding:21px 23px;border:1px solid var(--line);border-radius:17px;background:var(--panel)}.kpi span{display:block;color:var(--muted);font:800 10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.12em}.kpi strong{display:block;font-size:32px;letter-spacing:-.045em;margin-top:10px}.kpi small{display:block;color:#6d7a8c;margin-top:7px}.positive{color:var(--green)}.negative{color:#ff7f8c}
  .panel{border:1px solid var(--line);border-radius:20px;background:var(--panel);overflow:hidden;margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:19px 22px;border-bottom:1px solid var(--line)}.panel-head h3{margin:0;font-size:18px}.panel-head small{color:var(--muted)}.trend{height:235px;display:flex;align-items:flex-end;gap:14px;padding:26px 24px 20px}.bar-col{flex:1;min-width:38px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}.bar-val{font-size:10px;color:#b8c3d1}.bar{width:min(54px,74%);min-height:3px;border-radius:8px 8px 2px 2px;background:linear-gradient(#58e0ac,#23795a)}.bar-label{font:700 9px ui-monospace,monospace;color:#69778b;text-transform:uppercase}
  .block-title{display:flex;align-items:end;justify-content:space-between;gap:18px;margin:28px 2px 13px}.block-title span{color:var(--muted);font-size:12px}.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:11px}.plan-card{--selected:transparent;min-height:132px;padding:18px;text-align:left;border:1px solid var(--line);border-radius:17px;background:var(--panel);color:var(--text);cursor:pointer;transition:border-color .15s,background .15s}.plan-card:hover{border-color:var(--green)}.plan-card.on{border-color:var(--green);background:color-mix(in srgb,var(--green) 8%,var(--panel))}.plan-card small{display:block;color:var(--muted);font:800 10px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.1em}.plan-card strong{display:block;margin-top:10px;font-size:27px;letter-spacing:-.04em}.plan-card span{display:block;color:#8290a3;margin-top:8px;font-size:12px}.plan-focus{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:1px;margin-top:11px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--line)}.focus-cell{min-height:96px;padding:18px 20px;background:var(--panel)}.focus-cell small{display:block;color:var(--muted);font:800 9px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.1em}.focus-cell strong{display:block;margin-top:9px;font-size:24px;letter-spacing:-.035em}
  .agent-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}.agent-card{min-height:145px;padding:19px;border:1px solid var(--line);border-radius:17px;background:var(--panel);color:var(--text);text-align:left;cursor:pointer}.agent-card:hover,.agent-card.on{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 7%,var(--panel))}.agent-card b{display:block;font-size:16px}.agent-card .agent-money{display:block;margin-top:18px;font-size:25px;font-weight:850;letter-spacing:-.04em;color:var(--green)}.agent-card small{display:block;color:var(--muted);margin-top:7px}.empty{padding:42px;text-align:center;color:var(--muted)}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:760px){.shell{padding:14px 12px 70px}.service-head{align-items:flex-start;flex-direction:column;gap:12px}.tabs{margin-left:0;width:100%}.tab{flex:1}.fund-card{grid-template-columns:1fr 1fr;gap:18px;padding:22px}.fund-identity{grid-column:1/-1}.plan-focus{grid-template-columns:1fr 1fr}.trend{overflow-x:auto}.kpis{grid-template-columns:1fr 1fr}.friend-head{align-items:flex-start;flex-direction:column}.friend-tools{width:100%;justify-content:space-between}}
</style>
</head>
<body>
<main class="shell">
  <header class="service-head"><h1>Фонды</h1><nav class="tabs" aria-label="Разделы фондов"><button class="tab on" data-tab="overview">Обзор</button><button class="tab" data-tab="friend">Друг</button></nav></header>

  <section class="view on" id="view-overview">
    <div class="overview-head"><h2>Продукт и цели</h2><button class="edit-btn" id="editFacts">Изменить факты</button></div>
    <div class="fund-grid" id="fundGrid"></div>
  </section>

  <section class="view" id="view-friend">
    <div class="friend-head"><h2>Фонд «Друг»</h2><div class="friend-tools"><div class="friend-status" id="friendStatus"><i class="dot"></i><span>Загружаем данные…</span></div><button class="ghost" id="reloadFriend">Обновить</button></div></div>
    <div class="kpis" id="friendKpis"></div>
    <section class="panel"><div class="panel-head"><h3>Оплаты по месяцам</h3><small id="trendMeta"></small></div><div class="trend" id="friendTrend"></div></section>
    <div class="block-title"><h3>Подписки по сумме</h3><span>Нажмите на сумму для подробностей</span></div>
    <div class="plan-grid" id="planGrid"></div>
    <div class="plan-focus" id="planFocus"></div>
    <div class="block-title"><h3>Агенты</h3><span>Люди и результат за выбранный месяц</span></div>
    <div class="agent-grid" id="agentGrid"></div>
  </section>
</main>

<dialog id="factsDialog">
  <h2>Фактический продукт</h2><p class="dialog-note">Меняются только текущие факты. Цели 2026/2027 закреплены по Админ‑шкале.</p>
  <div class="edit-grid" id="factsEditor"></div>
  <div class="dialog-actions"><button class="ghost" id="cancelFacts">Отмена</button><button class="primary" id="saveFacts">Сохранить</button></div>
</dialog>

<script>
const STORE='piura_foundation_goals_v1',TAB_KEY='piura_foundation_tab_v1',CACHE='piura_cache_friend_analytics_v1';
const FUNDS=[
  {key:'friend',name:'Котики',mission:'Планета без бездомных домашних животных',product:'Спасённые котики',fact:287,y26:75,y27:500,color:'#66a6ff',note26:'Программа 2H 2026 · стерилизация',note27:'Планы 2026–2027 · стерилизация'},
  {key:'drugs',name:'Наркотики',mission:'Планета, в которой нет наркотиков',product:'Люди, прошедшие программу',fact:0,y26:20,y27:10,color:'#47dba3',note26:'Программа 2H 2026',note27:'Планы 2026–2027'},
  {key:'scientology',name:'Саентология',mission:'Больше людей достигли состояния Клир',product:'Раздано книг «Дорога к счастью»',fact:0,y26:100,y27:1000,color:'#a77aff',note26:'Программа 2H 2026',note27:'Планы 2026–2027'},
  {key:'planet',name:'Уборки',mission:'Планета, избавленная от излишнего мусора',product:'Проведено уборок',fact:0,y26:6,y27:50,color:'#58d4ee',note26:'6 мест в программе 2H 2026',note27:'Планы 2026–2027'},
  {key:'plants',name:'Растения',mission:'Численность растений поддерживается в норме',product:'Посажено деревьев',fact:200,y26:105,y27:5000,color:'#f5c75c',note26:'5 лично + 100 через программы',note27:'Планы 2026–2027'},
  {key:'association',name:'Ассоциация добрых дел',mission:'Как можно больше людей делают добрые дела ежедневно',product:'Люди, вовлечённые в добрые дела',fact:0,y26:125,y27:300,color:'#ff986f',note26:'Программа 2H 2026',note27:'300 людей · ассоциация из 50 участников'}
];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const num=v=>{const s=String(v??'').replace(/\s/g,'').replace(/[$₽]|р\./gi,'').replace(/,(?=\d{1,2}$)/,'.').replace(/,/g,'');const n=parseFloat(s);return Number.isFinite(n)?n:0};
const money=v=>Number(v||0).toLocaleString('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0});
function savedGoals(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch(e){return{}}}
let goalData=savedGoals();
function factFor(f){return Number(goalData?.[f.key]?.current?.product ?? f.fact)||0}
function renderFunds(){
  document.getElementById('fundGrid').innerHTML=FUNDS.map(f=>{const fact=factFor(f),p26=f.y26?fact/f.y26*100:0,p27=f.y27?fact/f.y27*100:0,goal=(year,value,pct)=>`<div class="goal"><div class="goal-head"><span>${year}</span><b>${value.toLocaleString('ru-RU')}</b></div><div class="track"><i style="width:${Math.min(100,pct)}%"></i></div><div class="goal-foot"><span>выполнено</span><b>${pct.toFixed(0)}%</b></div></div>`;return `<article class="fund-card" style="--c:${f.color}"><div class="fund-identity"><h3>${esc(f.name)}</h3><div class="product-label">${esc(f.product)}</div></div><div class="fact-block"><small>Сейчас</small><div class="fact">${fact.toLocaleString('ru-RU')}</div></div>${goal('Цель 2026',f.y26,p26)}${goal('Цель 2027',f.y27,p27)}</article>`}).join('');
}
function openFacts(){document.getElementById('factsEditor').innerHTML=FUNDS.map(f=>`<label class="edit-row"><span><b>${esc(f.name)}</b><small>${esc(f.product)}</small></span><input type="number" min="0" step="1" data-fact="${f.key}" value="${factFor(f)}"></label>`).join('');document.getElementById('factsDialog').showModal()}
function saveFacts(){document.querySelectorAll('[data-fact]').forEach(input=>{goalData[input.dataset.fact]=goalData[input.dataset.fact]||{};goalData[input.dataset.fact].current=goalData[input.dataset.fact].current||{};goalData[input.dataset.fact].current.product=Number(input.value)||0});localStorage.setItem(STORE,JSON.stringify(goalData));document.getElementById('factsDialog').close();renderFunds();parent?.postMessage({type:'piura:data-changed'},'*')}
function selectTab(tab){if(!['overview','friend'].includes(tab))tab='overview';document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='view-'+tab));localStorage.setItem(TAB_KEY,tab);if(tab==='friend'&&!friendData)loadFriend()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>selectTab(b.dataset.tab)));document.getElementById('editFacts').onclick=openFacts;document.getElementById('cancelFacts').onclick=()=>document.getElementById('factsDialog').close();document.getElementById('saveFacts').onclick=saveFacts;

function csvRows(text){const rows=[];let row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quote&&n==='"'){cell+='"';i++}else if(c==='"')quote=!quote;else if(c===','&&!quote){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(v=>v!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(v=>v!==''))rows.push(row);return rows}
function sheetJsonp(id,sheet){return new Promise((resolve,reject)=>{const cb='friendSheet_'+Date.now(),script=document.createElement('script'),timer=setTimeout(()=>done(new Error('timeout')),18000);function done(error,rows){clearTimeout(timer);delete window[cb];script.remove();error?reject(error):resolve(rows)}window[cb]=res=>res?.status==='ok'?done(null,(res.table?.rows||[]).map(r=>(r.c||[]).map(c=>c?(c.f??c.v??''):''))):done(new Error('Google Sheets'));script.onerror=()=>done(new Error('network'));script.src=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=responseHandler:${cb}&sheet=${encodeURIComponent(sheet)}&t=${Date.now()}`;document.head.appendChild(script)})}
async function readSheet(){const id='167qHytXogtUN8iWVNhOc149oDR2k_0wqGjmbQOx_Db4',sheet='Подписчики ',url=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheet)}&t=${Date.now()}`;try{const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return csvRows(await r.text())}catch(e){return sheetJsonp(id,sheet)}}
function headerIndex(header,word,fallback=-1){const x=header.findIndex(v=>String(v).trim().toLocaleLowerCase('ru').includes(word));return x>=0?x:fallback}
function parseFriend(rows){
  const hi=rows.findIndex(r=>r.some(v=>/подписчик/i.test(String(v))));if(hi<0)throw new Error('Не найдена строка заголовков');const h=rows[hi];
  const nameI=headerIndex(h,'подписчик',1),dateI=headerIndex(h,'дата',2),agentI=headerIndex(h,'агент',3),sumI=headerIndex(h,'сумм',4);
  const monthWords=['янв','фев','мар','апр','май','мая','июн','июл','авг','сен','окт','ноя','дек'];let months=[];
  h.forEach((v,i)=>{const label=String(v||'').trim();if(monthWords.some(m=>label.toLocaleLowerCase('ru').startsWith(m)))months.push({i,label})});
  if(!months.length)for(let i=sumI+1;i<h.length;i++)if(String(h[i]||'').trim())months.push({i,label:String(h[i]).trim()});
  let category='',totalRow=null;const section=/наличные|разовый|подписк|ежемесяч/i,people=[];
  rows.slice(hi+1).forEach(r=>{const all=r.map(v=>String(v||'').trim()),name=all[nameI];if(/^итого$/i.test(name)){totalRow=r;return}const sectionCell=all.find(v=>section.test(v));if(sectionCell&&!all[dateI]&&!all[agentI]){category=sectionCell;return}if(!name||/итого|подписчик/i.test(name)||section.test(name))return;const values=months.map(m=>num(r[m.i])),total=values.reduce((a,b)=>a+b,0),latest=values.at(-1)||0,previous=values.at(-2)||0,base=num(r[sumI]),agent=!all[agentI]||all[agentI]==='-'?'Без агента':all[agentI];people.push({name,date:all[dateI]||'—',agent,base,total,latest,previous,values,category})});
  const totals=months.map((m,idx)=>({label:m.label,amount:totalRow?num(totalRow[m.i]):people.reduce((s,p)=>s+(p.values[idx]||0),0)})),activeIndex=Math.max(0,totals.findLastIndex(month=>month.amount>0));people.forEach(person=>{person.latest=person.values[activeIndex]||0;person.previous=person.values[activeIndex-1]||0});return{people,months:totals,activeIndex,latestLabel:months[activeIndex]?.label||'Последний заполненный месяц',previousLabel:months[activeIndex-1]?.label||'Предыдущий месяц',at:Date.now()};
}
function stateOf(p){if(p.latest>0&&p.previous===0)return['new','Новый'];if(p.latest>0)return['active','Активен'];return['paused','Без оплаты']}
let friendData=null,selectedPlan='all',selectedAgent='';
function planLabel(value){return value==='all'?'Все суммы':money(value)}
function selectPlan(value){selectedPlan=value==='all'?'all':Number(value);selectedAgent='';renderFriend()}
function renderFriend(){
  const d=friendData,people=d.people||[],activeIndex=Number.isInteger(d.activeIndex)?d.activeIndex:Math.max(0,(d.months||[]).findLastIndex(month=>month.amount>0));people.forEach(person=>{person.latest=person.values?.[activeIndex]||0;person.previous=person.values?.[activeIndex-1]||0});
  const active=people.filter(p=>p.latest>0),latest=d.months[activeIndex]?.amount||0,prev=d.months[activeIndex-1]?.amount||0,all=people.reduce((s,p)=>s+p.total,0),allAgents=new Set(people.map(p=>p.agent)),change=prev?(latest-prev)/prev*100:0,activeLabel=d.months[activeIndex]?.label||d.latestLabel;
  document.getElementById('friendKpis').innerHTML=[['Активных подписок',active.length,activeLabel],['В месяц',money(latest),`${change>=0?'+':''}${change.toFixed(1)}% к прошлому`],['Получено',money(all),'за весь период'],['Агентов',allAgents.size,'с подписчиками']].map((k,i)=>`<div class="kpi"><span>${k[0]}</span><strong class="${i===1?(change>=0?'positive':'negative'):''}">${k[1]}</strong><small>${k[2]}</small></div>`).join('');
  const max=Math.max(1,...d.months.map(m=>m.amount));document.getElementById('friendTrend').innerHTML=d.months.map(m=>`<div class="bar-col" title="${esc(m.label)} · ${money(m.amount)}"><div class="bar-val">${money(m.amount)}</div><div class="bar" style="height:${Math.max(3,m.amount/max*155)}px"></div><div class="bar-label">${esc(m.label.slice(0,3))}</div></div>`).join('');document.getElementById('trendMeta').textContent=`Всего ${money(all)}`;
  const planAmounts=[...new Set([100,500,...active.map(p=>p.latest).filter(Boolean)])].sort((a,b)=>a-b),planPeople=selectedPlan==='all'?active:active.filter(p=>p.latest===selectedPlan),plans=[{value:'all',people:active,total:latest},...planAmounts.map(value=>{const members=active.filter(p=>p.latest===value);return{value,people:members,total:members.reduce((s,p)=>s+p.latest,0)}})];
  document.getElementById('planGrid').innerHTML=plans.map(plan=>`<button class="plan-card ${String(selectedPlan)===String(plan.value)?'on':''}" data-plan="${plan.value}"><small>${plan.value==='all'?'Все активные':'Ежемесячно'}</small><strong>${planLabel(plan.value)}</strong><span>${plan.people.length} подписчиков · ${money(plan.total)}/мес.</span></button>`).join('');
  document.querySelectorAll('[data-plan]').forEach(button=>button.onclick=()=>selectPlan(button.dataset.plan));
  const selectedTotal=planPeople.reduce((s,p)=>s+p.latest,0),share=latest?selectedTotal/latest*100:0;
  document.getElementById('planFocus').innerHTML=[['Выбранная сумма',planLabel(selectedPlan)],['Подписчиков',planPeople.length],['В месяц',money(selectedTotal)],['Доля оплат',share.toFixed(0)+'%']].map(item=>`<div class="focus-cell"><small>${item[0]}</small><strong>${item[1]}</strong></div>`).join('');
  const agents=new Map();planPeople.forEach(p=>{const a=agents.get(p.agent)||{name:p.agent,people:0,total:0,latest:0};a.people++;a.total+=p.total;a.latest+=p.latest;agents.set(p.agent,a)});
  document.getElementById('agentGrid').innerHTML=[...agents.values()].sort((a,b)=>b.latest-a.latest||b.total-a.total).map(a=>`<button class="agent-card ${selectedAgent===a.name?'on':''}" data-agent="${esc(a.name)}"><b>${esc(a.name)}</b><span class="agent-money">${money(a.latest)}</span><small>${a.people} чел. · всего ${money(a.total)}</small></button>`).join('')||'<div class="empty">Для выбранной суммы агенты не найдены</div>';
  document.querySelectorAll('[data-agent]').forEach(button=>button.onclick=()=>{selectedAgent=selectedAgent===button.dataset.agent?'':button.dataset.agent;renderFriend()});
}
async function loadFriend(force=false){const status=document.getElementById('friendStatus');status.className='friend-status';status.querySelector('span').textContent='Загружаем данные из Google Sheets…';if(!force){try{const cached=JSON.parse(localStorage.getItem(CACHE)||'null');if(cached){friendData=cached;renderFriend()}}catch(e){}}try{friendData=parseFriend(await readSheet());localStorage.setItem(CACHE,JSON.stringify(friendData));renderFriend();status.className='friend-status ok';status.querySelector('span').textContent='Google Sheets синхронизирован · '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}catch(e){status.className='friend-status error';status.querySelector('span').textContent=friendData?'Сеть недоступна · показан сохранённый снимок':'Не удалось загрузить таблицу';console.warn(e)}}
document.getElementById('reloadFriend').onclick=()=>loadFriend(true);
window.addEventListener('message',event=>{if(event.data?.type==='piura:cloud-data-applied'){goalData=savedGoals();renderFunds()}});
renderFunds();selectTab(new URLSearchParams(location.search).get('tab')||localStorage.getItem(TAB_KEY)||'overview');
</script>
