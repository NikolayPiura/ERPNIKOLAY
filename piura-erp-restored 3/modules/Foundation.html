<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Фонды</title>
<style>
:root{color-scheme:dark;--bg:#070a10;--panel:#10151e;--raised:#161c27;--line:rgba(255,255,255,.09);--text:#f3f6fa;--muted:#8390a3;--blue:#66a6ff;--green:#47dba3}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--erp-bg,var(--bg));color:var(--erp-text,var(--text));font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.shell{width:100%;padding:44px clamp(24px,4vw,72px) 120px}.header{min-height:156px;padding:34px 38px;border:1px solid var(--erp-line,var(--line));border-radius:24px;background:var(--erp-surface,var(--panel));display:flex;align-items:center;justify-content:space-between;gap:32px}.header h1{margin:0;font-size:clamp(54px,6vw,88px);line-height:.86;letter-spacing:-.07em}.years{display:flex;gap:7px;padding:6px;border:1px solid var(--erp-line,var(--line));border-radius:15px;background:rgba(7,10,16,.55)}.year{min-width:126px;height:50px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--erp-muted,var(--muted));font-weight:900;cursor:pointer}.year.on{border-color:rgba(102,166,255,.38);background:rgba(102,166,255,.11);color:var(--text)}.list{display:grid;gap:28px;margin-top:34px}.fund{--c:var(--blue);position:relative;min-height:300px;padding:48px 50px;display:grid;grid-template-columns:minmax(300px,1.05fr) minmax(260px,.7fr) minmax(290px,.8fr);align-items:center;gap:58px;border:1px solid color-mix(in srgb,var(--c) 20%,var(--erp-line,var(--line)));border-radius:24px;background:linear-gradient(105deg,color-mix(in srgb,var(--c) 7%,transparent),transparent 48%),var(--erp-surface,var(--panel));overflow:hidden}.fund:before{content:"";position:absolute;inset:28px auto 28px 0;width:4px;border-radius:0 8px 8px 0;background:var(--c)}.identity h2{margin:0 0 18px;font-size:clamp(34px,3.4vw,52px);letter-spacing:-.055em;line-height:.96}.identity p{max-width:480px;margin:0;color:var(--erp-muted,var(--muted));font-size:15px;line-height:1.65}.fact strong{display:block;color:var(--c);font-size:clamp(62px,6vw,92px);line-height:.82;letter-spacing:-.07em}.product{max-width:330px;margin-top:25px;padding-top:20px;border-top:1px solid color-mix(in srgb,var(--c) 26%,var(--line));color:var(--text);font-size:14px;font-weight:750;line-height:1.5}.goal{min-height:182px;padding:28px;border:1px solid color-mix(in srgb,var(--c) 25%,var(--erp-line,var(--line)));border-radius:19px;background:color-mix(in srgb,var(--c) 5%,var(--erp-raised,var(--raised)));display:flex;flex-direction:column;justify-content:space-between}.goal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.goal-head span{color:var(--c);font-size:14px;font-weight:850}.goal-head strong{font-size:clamp(42px,4vw,62px);line-height:.88;letter-spacing:-.06em}.track{height:9px;margin-top:24px;border-radius:999px;background:rgba(255,255,255,.065);overflow:hidden}.track i{display:block;height:100%;max-width:100%;border-radius:inherit;background:var(--c)}.goal-foot{display:flex;justify-content:space-between;gap:14px;margin-top:15px;color:var(--erp-muted,var(--muted));font-size:11px}.goal-foot b{color:var(--c)}
@media(max-width:1080px){.fund{grid-template-columns:1fr 1fr;gap:36px}.identity{grid-column:1/-1}}@media(max-width:700px){.shell{padding:16px 12px 70px}.header{padding:24px;align-items:flex-start;flex-direction:column}.years{width:100%}.year{flex:1;min-width:0}.fund{padding:36px 26px;grid-template-columns:1fr;gap:34px}.identity{grid-column:auto}.fact strong{font-size:64px}}
</style>
</head>
<body>
<main class="shell" data-piura-keep-full>
  <header class="header"><h1>Фонды</h1><div class="years" aria-label="Год"><button class="year on" data-year="2026">2026</button><button class="year" data-year="2027">2027</button></div></header>
  <section class="list" id="fundList"></section>
</main>
<script>
const STORE='piura_foundation_goals_v1';
const FUNDS=[
 {key:'friend',name:'Котики',mission:'Планета без бездомных домашних животных',product:'Коты и кошки, которым оказана непосредственная помощь',fact:287,y26:400,y27:1000,color:'#66a6ff'},
 {key:'drugs',name:'Наркотики',mission:'Планета, в которой нет наркотиков',product:'Отзывы детей после антинаркотического просвещения',fact:0,y26:100,y27:500,color:'#47dba3'},
 {key:'scientology',name:'Саентология',mission:'Планета, на которой всё больше людей достигают состояния Клир',product:'Разданные книги «Дорога к счастью»',fact:0,y26:100,y27:1000,color:'#a77aff'},
 {key:'planet',name:'Уборки',mission:'Планета, избавленная от излишнего мусора',product:'Проведённые уборки',fact:0,y26:10,y27:50,color:'#58d4ee'},
 {key:'plants',name:'Растения',mission:'Планета, в которой численность растений поддерживается в норме',product:'Посаженные деревья',fact:200,y26:500,y27:5000,color:'#f5c75c'},
 {key:'association',name:'Ассоциация добрых дел',mission:'Планета, в которой люди делают добрые дела',product:'Добрые дела участников ассоциации',fact:0,y26:20,y27:500,color:'#ff986f'}
];
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
function saved(){try{return JSON.parse(localStorage.getItem(STORE)||'{}')}catch{return{}}}let state=saved(),activeYear=2026;
function factFor(fund){return Number(state?.[fund.key]?.current?.product??fund.fact)||0}
function goal(target,fact){const percent=target?fact/target*100:0;return `<article class="goal"><div class="goal-head"><span>${activeYear}</span><strong>${target.toLocaleString('ru-RU')}</strong></div><div><div class="track"><i style="width:${Math.min(100,percent)}%"></i></div><div class="goal-foot"><span>${fact.toLocaleString('ru-RU')} / ${target.toLocaleString('ru-RU')}</span><b>${percent.toFixed(0)}%</b></div></div></article>`}
function render(){document.getElementById('fundList').innerHTML=FUNDS.map(fund=>{const fact=factFor(fund),target=activeYear===2026?fund.y26:fund.y27;return `<article class="fund" style="--c:${fund.color}"><div class="identity"><h2>${esc(fund.name)}</h2><p>${esc(fund.mission)}</p></div><div class="fact"><strong>${fact.toLocaleString('ru-RU')}</strong><div class="product">${esc(fund.product)}</div></div>${goal(target,fact)}</article>`}).join('')}
document.querySelectorAll('[data-year]').forEach(button=>button.onclick=()=>{activeYear=Number(button.dataset.year);document.querySelectorAll('[data-year]').forEach(item=>item.classList.toggle('on',item===button));render()});
window.addEventListener('message',event=>{if(event.data?.type==='piura:cloud-data-applied'){state=saved();render()}});render();
</script>
</body>
</html>
