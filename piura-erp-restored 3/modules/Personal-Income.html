<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Личный доход</title>
  <link rel="stylesheet" href="Personal-Sheets.css?v=20260812j">
  <script src="Personal-Sheets.js?v=20260812j"></script>
</head>
<body>
<main class="ps-app" data-piura-keep-full>
  <header class="ps-header">
    <div class="ps-title"><h1>Личный доход</h1></div>
    <div class="ps-live" id="syncState"><i></i><span>Загрузка</span><button class="ps-refresh" id="refresh" type="button" title="Обновить" aria-label="Обновить">↻</button></div>
  </header>
  <nav class="ps-tabs" id="tabs">
    <button class="ps-tab on" data-tab="income">Доход</button>
    <button class="ps-tab" data-tab="mentor">Ментор</button>
  </nav>
  <section id="content"><div class="ps-loading">Загрузка данных</div></section>
</main>
<script>
const S=window.PIURASheet;
const content=document.getElementById('content');
const syncState=document.getElementById('syncState');
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_SHORT=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const SOURCES=['PFF (Дивиденды)','PFF (Управляющий)','КЭ (Заработная плата)','КЭ (Дивиденды)','Наставник (Абонементы)','Наставник (Доп. проекты)','Москва (Управляющий)','Solid (Управляющий)','Снитч (Итоговый доход)'];
const CATEGORIES=['Климат','Инвестиции','Наставничество','Учредитель','Управление деньгами','Снитч'];
const COLORS=['var(--blue)','var(--green)','var(--purple)','var(--orange)','var(--yellow)','#79b7d8','#d782b6','#8ea2bf','#5ce0c2'];
let tab='income',month=new Date().getMonth(),group='category',period='week',mode='fact',mentorKind='subscriptions',mentorPeriod='week',serial=0,lastData=null;

function normalized(value){return String(value||'').trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ')}
function headerIndex(rows,label){return rows.findIndex(row=>normalized(S.text(row[0]))===normalized(label))}
function rowNamed(rows,name){return rows.find(row=>normalized(S.text(row[0]))===normalized(name))}
function sum(values){return values.reduce((total,value)=>total+(Number(value)||0),0)}
function usd(value){return new Intl.NumberFormat('ru-RU',{style:'currency',currency:'USD',minimumFractionDigits:0,maximumFractionDigits:2}).format(Number(value)||0)}
function dateLabel(cell){const value=S.text(cell);const match=value.match(/^(\d{1,2})[.\/-](\d{1,2})/);return match?`${Number(match[1])}.${String(Number(match[2])).padStart(2,'0')}`:value}
function segment(name,items,active,accent=''){return `<div class="ps-segment" ${accent?`data-accent="${accent}"`:''}>${items.map(([value,label])=>`<button type="button" data-control="${name}" data-value="${value}" class="${active===value?'on':''}">${label}</button>`).join('')}</div>`}
function monthControl(){return `<div class="ps-months"><button type="button" data-month="-1" aria-label="Предыдущий месяц">‹</button><strong>${MONTHS[month]} 2026</strong><button type="button" data-month="1" aria-label="Следующий месяц">›</button></div>`}
function command(title,left,right){return `<section class="ps-command"><div class="ps-command-left"><h2>${S.esc(title)}</h2>${left||''}</div><div class="ps-command-right">${right||''}</div></section>`}
function tablePanel(title,headers,rows,totalRow,totalValue){
  return `<section class="ps-panel"><div class="ps-panel-head"><h3>${S.esc(title)}</h3><strong class="ps-panel-total">${S.esc(totalValue)}</strong></div><div class="ps-scroll"><table class="ps-table"><thead><tr>${headers.map(header=>`<th>${S.esc(header)}</th>`).join('')}</tr></thead><tbody>${rows.map((row,index)=>`<tr style="--row:${COLORS[index%COLORS.length]}">${row.map((value,col)=>`<td class="${col&&Number(value)===0?'ps-cell-zero':''}">${col===0?`<span class="ps-row-name"><i class="ps-row-dot"></i>${S.esc(value)}</span>`:S.esc(usd(value))}</td>`).join('')}</tr>`).join('')}</tbody><tfoot><tr>${totalRow.map((value,col)=>`<td>${col===0?S.esc(value):S.esc(usd(value))}</td>`).join('')}</tr></tfoot></table></div></section>`;
}
function factModel(payload){
  const rows=S.cells(payload),header=headerIndex(rows,'ИСТОЧНИК');
  if(header<0)throw new Error('Не найдена недельная таблица');
  const dateColumns=(rows[header]||[]).map((cell,index)=>index>=4&&S.monthOf(cell)>=0?index:-1).filter(index=>index>=0);
  return {rows,header,dateColumns};
}
function planModel(payload){
  const rows=S.cells(payload),header=headerIndex(rows,'ИСТОЧНИК');
  if(header<0)throw new Error('Не найден план дохода');
  return {rows,header};
}
function selectedNames(){return group==='category'?CATEGORIES:SOURCES}
function renderIncome(factPayload,planPayload){
  const fact=factModel(factPayload),plan=planModel(planPayload),names=selectedNames();
  let headers=['Категория'],body=[],total=[],title='';
  if(group==='source')headers[0]='Источник';
  if(mode==='plan'){
    headers.push(...MONTHS_SHORT,'Итого');
    body=names.map(name=>{const row=rowNamed(plan.rows,name),values=MONTHS.map((_,index)=>S.number(row?.[index+2]));return [name,...values,sum(values)]});
    title=`План 2026 · ${group==='category'?'по категориям':'по источникам'}`;
  }else if(period==='month'){
    headers.push(...MONTHS_SHORT,'Итого');
    body=names.map(name=>{const row=rowNamed(fact.rows,name),values=MONTHS.map((_,monthIndex)=>sum(fact.dateColumns.filter(col=>S.monthOf(fact.rows[fact.header][col])===monthIndex).map(col=>S.number(row?.[col]))));return [name,...values,sum(values)]});
    title=`Факт 2026 · ${group==='category'?'по категориям':'по источникам'}`;
  }else{
    const cols=fact.dateColumns.filter(col=>S.monthOf(fact.rows[fact.header][col])===month);
    headers.push(...cols.map(col=>dateLabel(fact.rows[fact.header][col])),'Итого');
    body=names.map(name=>{const row=rowNamed(fact.rows,name),values=cols.map(col=>S.number(row?.[col]));return [name,...values,sum(values)]});
    title=`${MONTHS[month]} · ${group==='category'?'по категориям':'по источникам'}`;
  }
  total=['Итого',...headers.slice(1).map((_,index)=>sum(body.map(row=>row[index+1])))]
  const totalValue=usd(total.at(-1));
  const controls=segment('group',[['category','По категориям'],['source','По источникам']],group)+segment('period',[['week','Понедельно'],['month','Помесячно']],mode==='plan'?'month':period,'green')+segment('mode',[['fact','Факт'],['plan','План']],mode);
  const chooser=mode==='fact'&&period==='week'?monthControl():'';
  content.innerHTML=command('Доход',controls,chooser)+tablePanel(title,headers,body,total,totalValue);
  bindControls();
}
function mentorModel(payload){
  const rows=S.cells(payload),subscriptions=headerIndex(rows,'АБОНЕМЕНТЫ'),bonuses=headerIndex(rows,'ПРЕМИИ'),header=mentorKind==='subscriptions'?subscriptions:bonuses;
  if(header<0)throw new Error('Не найден список ментора');
  const end=mentorKind==='subscriptions'?bonuses:rows.length;
  const people=rows.slice(header+1,end).filter(row=>S.text(row[0])).slice(0,4);
  const dateColumns=(rows[header]||[]).map((cell,index)=>index>=4&&S.monthOf(cell)>=0?index:-1).filter(index=>index>=0);
  return {rows,header,people,dateColumns};
}
function renderMentor(payload){
  const model=mentorModel(payload);let headers=['Участник'],body=[],title='';
  if(mentorPeriod==='month'){
    headers.push(...MONTHS_SHORT,'Итого');
    body=model.people.map(row=>{const values=MONTHS.map((_,monthIndex)=>sum(model.dateColumns.filter(col=>S.monthOf(model.rows[model.header][col])===monthIndex).map(col=>S.number(row[col]))));return [S.text(row[0]),...values,sum(values)]});
    title=`${mentorKind==='subscriptions'?'Абонементы':'Премии'} · 2026`;
  }else{
    const cols=model.dateColumns.filter(col=>S.monthOf(model.rows[model.header][col])===month);headers.push(...cols.map(col=>dateLabel(model.rows[model.header][col])),'Итого');
    body=model.people.map(row=>{const values=cols.map(col=>S.number(row[col]));return [S.text(row[0]),...values,sum(values)]});
    title=`${mentorKind==='subscriptions'?'Абонементы':'Премии'} · ${MONTHS[month]}`;
  }
  const total=['Итого',...headers.slice(1).map((_,index)=>sum(body.map(row=>row[index+1])))];
  const controls=segment('mentorKind',[['subscriptions','Абонементы'],['bonuses','Премии']],mentorKind)+segment('mentorPeriod',[['week','Понедельно'],['month','Помесячно']],mentorPeriod,'green');
  content.innerHTML=command('Ментор',controls,mentorPeriod==='week'?monthControl():'')+tablePanel(title,headers,body,total,usd(total.at(-1)));
  bindControls();
}
function bindControls(){
  content.querySelectorAll('[data-month]').forEach(button=>button.onclick=()=>{month=(month+Number(button.dataset.month)+12)%12;paint()});
  content.querySelectorAll('[data-control]').forEach(button=>button.onclick=()=>{
    const name=button.dataset.control,value=button.dataset.value;
    if(name==='group')group=value;
    if(name==='period'){period=value;if(value==='week'&&mode==='plan')mode='fact'}
    if(name==='mode'){mode=value;if(value==='plan')period='month'}
    if(name==='mentorKind')mentorKind=value;
    if(name==='mentorPeriod')mentorPeriod=value;
    paint();
  });
}
function paint(){
  if(!lastData)return;
  if(tab==='income')renderIncome(lastData.fact,lastData.plan);else renderMentor(lastData.mentor);
}
async function loadAll(){
  const token=++serial;content.innerHTML='<div class="ps-loading">Загрузка данных</div>';
  try{
    const [fact,plan,mentor]=await Promise.all([S.load('2026 (НЕД)'),S.load('2026 (ПЛАН)'),S.load('2026 (МЕНТОР)')]);
    if(token!==serial)return;lastData={fact,plan,mentor};const cached=[fact,plan,mentor].some(item=>item.cached);syncState.classList.toggle('cached',cached);syncState.querySelector('span').textContent=cached?'Сохранённые данные':'Данные обновлены';paint();
  }catch(error){content.innerHTML=`<div class="ps-error"><div><strong>Нет связи с таблицей</strong><p>${S.esc(error.message)}</p></div></div>`;syncState.querySelector('span').textContent='Нет соединения'}
}
document.getElementById('tabs').onclick=event=>{const button=event.target.closest('[data-tab]');if(!button)return;tab=button.dataset.tab;document.querySelectorAll('.ps-tab').forEach(item=>item.classList.toggle('on',item===button));paint()};
document.getElementById('refresh').onclick=loadAll;
loadAll();
</script>
</body>
</html>
