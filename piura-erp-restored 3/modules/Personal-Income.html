<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Доход</title>
  <link rel="stylesheet" href="Personal-Sheets.css?v=20260815a">
  <script src="Personal-Sheets.js?v=20260815a"></script>
</head>
<body>
<main class="ps-app ps-finance-app ps-income-app" data-piura-keep-full>
  <header class="ps-header ps-hero-header">
    <div class="ps-title"><span>ЛИЧНЫЕ ФИНАНСЫ</span><h1>Доход</h1></div>
    <div class="ps-live" id="syncState"><i></i><span>Загрузка</span><button class="ps-refresh" id="refresh" type="button" title="Обновить данные" aria-label="Обновить данные">↻</button></div>
  </header>
  <section id="content"><div class="ps-loading">Собираем финансовый пульс</div></section>
</main>
<script>
const S=window.PIURASheet,content=document.getElementById('content'),syncState=document.getElementById('syncState');
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_SHORT=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const SOURCES=['PFF (Дивиденды)','PFF (Управляющий)','КЭ (Заработная плата)','КЭ (Дивиденды)','Наставник (Абонементы)','Наставник (Доп. проекты)','Москва (Управляющий)','Solid (Управляющий)','Снитч (Итоговый доход)'];
const CATEGORIES=['Климат','Инвестиции','Наставничество','Учредитель','Управление деньгами','Снитч'];
const STATE_KEY='piura_personal_income_state_v2';
let state={month:new Date().getMonth(),group:'category',period:'week',showPlan:false};
try{state={...state,...JSON.parse(localStorage.getItem(STATE_KEY)||'{}')}}catch{}
let serial=0,data=null;
function saveState(){localStorage.setItem(STATE_KEY,JSON.stringify(state))}
function rowNamed(rows,name){return rows.find(row=>S.normalize(S.text(row[0]))===S.normalize(name))}
function parseSheet(payload){
  if(payload?.error&&!payload?.table)throw new Error(payload.error);
  const rows=S.cells(payload),header=S.headerIndex(rows,'ИСТОЧНИК');
  if(header<0)throw new Error('В таблице не найден блок «Источник»');
  const dateCols=(rows[header]||[]).map((cell,index)=>index>=4&&S.monthOf(cell)>=0?index:-1).filter(index=>index>=0);
  return {rows,header,dateCols};
}
function cycleButton(key,label,value,detail,on=false){return `<button class="ps-cycle-control ${on?'on':''}" type="button" data-cycle="${key}"><span>${S.esc(label)}</span><strong>${S.esc(value)}</strong><small>${S.esc(detail)}</small><i>↻</i></button>`}
function command(controls,right=''){return `<section class="ps-command ps-command-clean ps-reveal"><div class="ps-command-copy"><span>ФАКТ И ОРИЕНТИР</span><h2>Структура дохода</h2><p>Один клик меняет представление — без дублирующих переключателей.</p></div><div class="ps-cycle-controls">${controls}</div>${right?`<div class="ps-command-right">${right}</div>`:''}</section>`}
function timeline(model,row,period,month){
  if(period==='month')return MONTHS.map((_,index)=>S.sum(model.dateCols.filter(col=>S.monthOf(model.rows[model.header][col])===index).map(col=>S.number(row?.[col]))));
  return model.dateCols.filter(col=>S.monthOf(model.rows[model.header][col])===month).map(col=>S.number(row?.[col]));
}
function planValues(model,row,period,month,count){
  const monthly=MONTHS.map((_,index)=>S.number(row?.[index+2]));
  if(period==='month')return monthly;
  return Array.from({length:Math.max(1,count)},()=>monthly[month]/Math.max(1,count));
}
function incomeModel(){
  const fact=parseSheet(data.fact),plan=parseSheet(data.plan),names=state.group==='category'?CATEGORIES:SOURCES;
  const labels=state.period==='month'?MONTHS_SHORT:fact.dateCols.filter(col=>S.monthOf(fact.rows[fact.header][col])===state.month).map(col=>S.dateLabel(fact.rows[fact.header][col]));
  const rows=names.map(name=>{
    const factRow=rowNamed(fact.rows,name),planRow=rowNamed(plan.rows,name);
    return {name,fact:timeline(fact,factRow,state.period,state.month),plan:planValues(plan,planRow,state.period,state.month,labels.length)};
  });
  return {labels,rows};
}
function table(model){
  const headers=[state.group==='category'?'Категория':'Источник',...model.labels,'Итого'];
  const rows=model.rows.map(row=>[row.name,...row.fact,S.sum(row.fact)]).sort((a,b)=>b.at(-1)-a.at(-1));
  const totals=['Итого',...model.labels.map((_,i)=>S.sum(rows.map(row=>Number(row[i+1])||0))),S.sum(rows.map(row=>Number(row.at(-1))||0))];
  const max=Math.max(1,...rows.flatMap(row=>row.slice(1).map(Number).filter(Number.isFinite)));
  return `<section class="ps-panel ps-data-panel ps-reveal"><div class="ps-panel-head"><div><span>${state.group==='category'?'ПО КАТЕГОРИЯМ':'ПО ИСТОЧНИКАМ'}</span><h3>${state.period==='month'?'Весь 2026 год':MONTHS[state.month]}</h3></div><strong>${S.money(totals.at(-1),'USD',2)}</strong></div><div class="ps-scroll"><table class="ps-table ps-color-table"><thead><tr>${headers.map(item=>`<th>${S.esc(item)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map((cell,col)=>col===0?`<td><span class="ps-row-name"><i></i>${S.esc(cell)}</span></td>`:`<td class="${Number(cell)===0?'ps-cell-zero':''}"><b>${S.money(cell,'USD',2)}</b><em style="--fill:${Math.max(0,Number(cell))/max*100}%"></em></td>`).join('')}</tr>`).join('')}</tbody><tfoot><tr>${totals.map((cell,col)=>`<td>${col?S.money(cell,'USD',2):S.esc(cell)}</td>`).join('')}</tr></tfoot></table></div></section>`;
}
function render(){
  const model=incomeModel(),actual=model.labels.map((_,i)=>S.sum(model.rows.map(row=>row.fact[i]))),planned=model.labels.map((_,i)=>S.sum(model.rows.map(row=>row.plan[i])));
  const factTotal=S.sum(actual),planTotal=S.sum(planned),delta=factTotal-planTotal,average=actual.length?factTotal/actual.length:0;
  const controls=cycleButton('group','Тип',state.group==='category'?'Категории':'Источники','нажмите, чтобы сменить')+cycleButton('period','Период',state.period==='week'?'Понедельно':'Помесячно',state.period==='week'?'выбранный месяц':'весь год')+cycleButton('showPlan','План',state.showPlan?'Включён':'Показать',state.showPlan?'сравнение с фактом':'добавить ориентир',state.showPlan);
  const chooser=state.period==='week'?S.monthControl(state.month,MONTHS):'';
  const metrics=S.metricCards([
    {label:'Факт',value:S.compactMoney(factTotal),note:state.period==='month'?'за 2026 год':MONTHS[state.month],color:'#63a4ff'},
    {label:'Средний период',value:S.compactMoney(average),note:state.period==='month'?'в месяц':'в неделю',color:'#43d9a3'},
    {label:state.showPlan?'План':'Лучший период',value:S.compactMoney(state.showPlan?planTotal:Math.max(0,...actual)),note:state.showPlan?(planTotal?`${Math.round(factTotal/planTotal*100)}% выполнено`:'не задан'):'максимальный факт',color:'#a779ff'},
    {label:state.showPlan?'Отклонение':'Периодов',value:state.showPlan?S.compactMoney(delta):String(actual.length),note:state.showPlan?(delta>=0?'выше плана':'до плана'):'в расчёте',color:state.showPlan?(delta>=0?'#43d9a3':'#ff8b64'):'#f4c65d'}
  ]);
  const series=[{label:'Факт',values:actual,color:'#43d9a3'}];
  if(state.showPlan)series.push({label:'План',values:planned,color:'#a779ff'});
  content.innerHTML=command(controls,chooser)+metrics+S.lineChart({title:state.showPlan?'Факт относительно плана':'Динамика фактического дохода',subtitle:state.period==='month'?'Помесячно за 2026 год':MONTHS[state.month],labels:model.labels,series,height:300})+table(model);
  bind();
}
function bind(){
  content.querySelectorAll('[data-month]').forEach(button=>button.onclick=()=>{state.month=(state.month+Number(button.dataset.month)+12)%12;saveState();render()});
  content.querySelectorAll('[data-cycle]').forEach(button=>button.onclick=()=>{const key=button.dataset.cycle;if(key==='group')state.group=state.group==='category'?'source':'category';if(key==='period')state.period=state.period==='week'?'month':'week';if(key==='showPlan')state.showPlan=!state.showPlan;saveState();render()});
}
async function loadAll(){
  const token=++serial;content.innerHTML='<div class="ps-loading">Собираем финансовый пульс</div>';
  const result=await S.loadMany(['2026 (НЕД)','2026 (ПЛАН)']);if(token!==serial)return;
  data={fact:result['2026 (НЕД)'],plan:result['2026 (ПЛАН)']};
  const values=Object.values(result);syncState.classList.toggle('cached',values.some(item=>item.cached));syncState.querySelector('span').textContent=values.some(item=>item.error&&!item.table)?'Часть данных недоступна':values.some(item=>item.cached)?'Сохранённые данные':'Данные обновлены';
  try{render()}catch(error){content.innerHTML=S.errorCard('Не удалось собрать экран',error.message)}
}
document.getElementById('refresh').onclick=loadAll;loadAll();
</script>
</body>
</html>
