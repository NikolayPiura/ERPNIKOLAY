function setLampBusy(busy){lampBusy=Boolean(busy);const disabled=lampBusy||everythingBusy||!lightControlAvailable();document.getElementById('lampPower').disabled=disabled;document.getElementById('lampBrightness').disabled=disabled;document.querySelectorAll('[data-lamp-color]').forEach(button=>button.disabled=disabled)}
function updateMasterPower(){const button=document.getElementById('masterPower'),available=fanOnline||lightControlAvailable()||purifierState.controllable||controllableZoneDevices().length>0,power=anythingIsOn();button.disabled=everythingBusy||!available;button.classList.toggle('is-on',power);button.classList.toggle('is-busy',everythingBusy);button.setAttribute('aria-pressed',String(power));button.setAttribute('aria-label',power?'Выключить всё':'Включить всё')}
function updateMapBadge(){const label=document.getElementById('mapSyncStatus');if(label)label.textContent=mapLightAvailable?(mapLightOn?'Карта · включена':'Карта · выключена'):'Карта · нет связи';document.getElementById('mapSwatch')?.style.setProperty('--map-color',currentLampColor)}
function updateLampPanel(){const available=lightControlAvailable(),power=document.getElementById('lampPower');lampOn=goveeLampOn||elgatoLampOn||mapLightOn;power.classList.toggle('on',lampOn);power.setAttribute('aria-pressed',String(lampOn));power.setAttribute('aria-label',lampOn?'Выключить освещение и карту':'Включить освещение и карту');document.querySelector('.lamp').classList.toggle('is-offline',!available);setLampBusy(lampBusy);updateMapBadge();updateMasterPower()}

async function requestLocal(base,path,options={}){const method=String(options.method||'GET').toUpperCase(),response=await fetch(base+path,{...options,method,mode:'cors',cache:'no-store',signal:method==='POST'?AbortSignal.timeout(4500):options.signal,headers:method==='POST'?{'Content-Type':'application/json',...(options.headers||{})}:options.headers}),data=await response.json();if(!response.ok||data?.ok===false)throw new Error(data?.error||'Локальное устройство недоступно');return data}
async function requestElgato(path,options={}){const attempts=String(options.method||'GET').toUpperCase()==='POST'?2:1;let lastError;for(let attempt=0;attempt<attempts;attempt++){try{return await requestLocal(ELGATO_BRIDGE,path,options)}catch(error){lastError=error;if(error?.name==='TimeoutError'||error?.name==='AbortError')break;if(attempt+1<attempts)await new Promise(resolve=>setTimeout(resolve,180))}}throw lastError}
async function requestSmartLife(path,options={}){return requestLocal(SMART_LIFE_BRIDGE,path,options)}
async function controlLamp(command,value){const data=await requestGovee('goveeControl',{command,value});if(data?.ok===false)throw new Error(data.error||'Команда не выполнена');return data}

function renderLamp(data){goveeLightAvailable=Boolean(data?.lightAvailable);goveeLampOn=goveeLightAvailable&&Boolean(data?.power);if(goveeLightAvailable){const color=rgbHex(data?.colorRgb);if(color)selectLampColor(color);if(data?.brightness!=null)setLampBrightness(data.brightness)}updateLampPanel()}
async function refreshElgato(){try{const data=await requestElgato('/status');elgatoLightCount=Number(data.count)||0;elgatoLampOn=elgatoLightCount>0&&Boolean(data.power);if(elgatoLightCount&&!goveeLightAvailable){if(data.colorHex)selectLampColor(data.colorHex);setLampBrightness(data.brightness??data.devices?.[0]?.brightness??currentBrightness)}}catch(error){elgatoLightCount=0;elgatoLampOn=false;console.warn('Elgato bridge',error)}updateLampPanel()}
function renderMap(data){mapLightAvailable=Boolean(data?.online);mapLightOn=mapLightAvailable&&Boolean(data?.power);if(mapLightAvailable&&!goveeLightAvailable&&!elgatoLightCount){if(data?.color)selectLampColor(data.color);if(data?.brightness!=null)setLampBrightness(data.brightness)}updateLampPanel()}
async function refreshMap(){try{renderMap(await requestSmartLife('/api/map/status'))}catch(error){mapLightAvailable=false;mapLightOn=false;updateLampPanel();console.warn('Карта TY-02-3CH.V5.1',error)}}
async function controlMap(command,value){let data;if(command==='power')data=await requestSmartLife('/api/map/power',{method:'POST',body:JSON.stringify({power:/^(on|1|true)$/i.test(String(value))})});else data=await requestSmartLife('/api/map/color',{method:'POST',body:JSON.stringify({color:command==='color'?String(value):currentLampColor,brightness:command==='brightness'?Math.round(Number(value)):currentBrightness})});renderMap(command==='power'?{...data,color:currentLampColor,brightness:currentBrightness}:data);return data}
async function controlAllLights(command,value){const jobs=[];if(goveeConfig())jobs.push({source:'govee',promise:command==='color'?(async()=>{await controlLamp('color',value);return controlLamp('power','on')})():controlLamp(command,value)});jobs.push({source:'elgato',promise:requestElgato('/lights',{method:'POST',body:JSON.stringify({command,value})})});jobs.push({source:'map',promise:controlMap(command,value)});const settled=await Promise.allSettled(jobs.map(job=>job.promise));let successes=0;settled.forEach((result,index)=>{if(result.status!=='fulfilled')return;successes++;const source=jobs[index].source,on=command==='power'?/^(on|1|true)$/i.test(String(value)):true;if(source==='govee'){goveeLightAvailable=true;goveeLampOn=on}if(source==='elgato'){elgatoLightCount=Math.max(1,elgatoLightCount);elgatoLampOn=on}});updateLampPanel();if(!successes)throw new Error(settled.find(result=>result.status==='rejected')?.reason?.message||'Освещение недоступно');return settled}

function renderZoneDevices(data={}){
  const incoming=Array.isArray(data.devices)?data.devices:data.device?[data.device]:[];
  const received=new Map(incoming.map(device=>[String(device.id),device]));
  ZONE_DEVICE_CATALOG.forEach(catalog=>{
    const previous=zoneDeviceState.get(catalog.id)||{...catalog,kind:'zone',controllable:true,online:false,power:false,busy:false};
    const raw=received.get(catalog.id);
    const next=raw?{
      ...previous,
      ...catalog,
      kind:'zone',
      controllable:true,
      online:raw.online==null?previous.online:Boolean(raw.online),
      power:raw.power==null?previous.power:Boolean(raw.power)
    }:{...previous};
    zoneDeviceState.set(catalog.id,next);
    const button=document.querySelector(`[data-zone-device="${catalog.id}"]`);
    if(!button)return;
    button.classList.toggle('is-on',next.power);
    button.classList.toggle('is-offline',!next.online);
    button.classList.toggle('is-busy',Boolean(next.busy));
    button.disabled=everythingBusy||zoneAllBusy||Boolean(next.busy);
    button.setAttribute('aria-pressed',String(next.power));
    button.setAttribute('aria-label',next.power?`Выключить ${catalog.name.toLowerCase()}`:`Включить ${catalog.name.toLowerCase()}`)
  });

  const zones=controllableZoneDevices(),allOn=zones.length>0&&zones.every(device=>device.power),allButton=document.getElementById('zoneAllToggle');
  if(incoming.length)rememberZonePower();
  allButton.disabled=everythingBusy||zoneAllBusy||!zones.length;
  allButton.classList.toggle('is-on',allOn);
  allButton.classList.toggle('is-busy',zoneAllBusy);
  allButton.setAttribute('aria-pressed',String(allOn));
  allButton.setAttribute('aria-label',allOn?'Выключить все зоны':'Включить все зоны');
  updateMasterPower()
}
async function refreshZoneDevices(){try{renderZoneDevices(await requestElgato('/smart-home/status?devices=1,2,3,5'))}catch(error){renderZoneDevices();console.warn('Четыре зоны',error)}}
async function setZonePower(deviceId,power){const data=await requestElgato('/smart-home',{method:'POST',body:JSON.stringify({device:String(deviceId),power:Boolean(power)})});renderZoneDevices(data);return data}
async function toggleZoneDevice(deviceId){const device=zoneDeviceState.get(String(deviceId));if(!device||device.controllable===false||device.busy||zoneAllBusy)return;const previous=device.power,target=!previous;device.busy=true;device.power=target;renderZoneDevices();try{await setZonePower(device.id,target)}catch(error){device.power=previous;console.warn(device.name,error);await refreshZoneDevices()}finally{const current=zoneDeviceState.get(device.id);if(current)current.busy=false;renderZoneDevices()}}
async function setAllZonePower(power){return Promise.allSettled(controllableZoneDevices().map(device=>setZonePower(device.id,power)))}
async function toggleAllZones(){const zones=controllableZoneDevices();if(zoneAllBusy||!zones.length)return;const target=!zones.every(device=>device.power);zoneAllBusy=true;zones.forEach(device=>device.power=target);renderZoneDevices();try{await setAllZonePower(target);await refreshZoneDevices()}finally{zoneAllBusy=false;renderZoneDevices()}}

function renderFan(data){fanOnline=Boolean(data?.online);fanPower=fanOnline&&Boolean(data?.power);const card=document.getElementById('fanCard'),button=document.getElementById('fanToggle');card.classList.toggle('is-on',fanPower);card.classList.toggle('is-offline',!fanOnline);button.disabled=fanBusy||everythingBusy||!fanOnline;button.classList.toggle('is-busy',fanBusy);button.setAttribute('aria-pressed',String(fanPower));button.setAttribute('aria-label',fanPower?'Выключить вентилятор':'Включить вентилятор');updateMasterPower()}
async function refreshFan(){try{renderFan(await requestSmartLife('/api/status'))}catch(error){renderFan({online:false,power:false});console.warn('Вентилятор 192.168.4.23',error)}}
async function setFanPower(power){const data=await requestSmartLife('/api/power',{method:'POST',body:JSON.stringify({power:Boolean(power)})});renderFan(data);return data}
async function toggleFan(){if(!fanOnline||fanBusy)return;fanBusy=true;renderFan({online:fanOnline,power:fanPower});try{await setFanPower(!fanPower)}catch(error){console.warn('Вентилятор',error);await refreshFan()}finally{fanBusy=false;renderFan({online:fanOnline,power:fanPower})}}
function purifierMode(device){if(!device?.power)return 0;const percentage=Number(device?.settings?.percentage);if(!Number.isFinite(percentage)||percentage<=0)return 0;return percentage>=84?3:percentage>=50?2:1}
function renderPurifier(device={}){purifierState={online:Boolean(device.online),controllable:Boolean(device.controllable),power:Boolean(device.power),settings:device.settings||{}};const available=purifierState.online&&purifierState.controllable,card=document.getElementById('purifierCard'),power=document.getElementById('purifierPower'),mode=purifierMode(purifierState);card.classList.toggle('is-offline',!available);card.classList.toggle('is-on',available&&purifierState.power);card.classList.toggle('is-busy',purifierBusy);power.disabled=purifierBusy||everythingBusy||!available;power.setAttribute('aria-pressed',String(available&&purifierState.power));power.setAttribute('aria-label',purifierState.power?'Выключить очиститель':'Включить очиститель');document.querySelectorAll('[data-purifier-mode]').forEach(button=>{const selected=available&&mode===Number(button.dataset.purifierMode);button.disabled=purifierBusy||everythingBusy||!available;button.classList.toggle('is-active',selected);button.setAttribute('aria-pressed',String(selected))});updateMasterPower()}
async function refreshPurifier(){try{const data=await requestElgato('/smart-home/status?devices=purifier'),device=(data.devices||[]).find(item=>String(item.id)==='purifier');renderPurifier(device||{})}catch(error){renderPurifier({});console.warn('Очиститель',error)}}
async function setPurifierPower(power){const data=await requestElgato('/smart-home',{method:'POST',body:JSON.stringify({device:'purifier',power:Boolean(power)})});renderPurifier(data.device||purifierState);return data}
async function togglePurifier(){if(!purifierState.controllable||purifierBusy)return;purifierBusy=true;renderPurifier(purifierState);try{await setPurifierPower(!purifierState.power)}catch(error){console.warn('Очиститель',error);await refreshPurifier()}finally{purifierBusy=false;renderPurifier(purifierState)}}
async function setPurifierMode(mode){if(!purifierState.controllable||purifierBusy)return;const speed={1:33,2:66,3:100}[mode];if(!speed)return;purifierBusy=true;renderPurifier(purifierState);try{const data=await requestElgato('/smart-home/purifier',{method:'POST',body:JSON.stringify({setting:'speed',value:speed})});renderPurifier(data.device||purifierState)}catch(error){console.warn('Скорость очистителя',error);await refreshPurifier()}finally{purifierBusy=false;renderPurifier(purifierState)}}
async function refreshSmartHome(){await Promise.allSettled([refreshFan(),refreshPurifier(),refreshMap(),refreshZoneDevices()])}

async function toggleEverything(){const target=!anythingIsOn();everythingBusy=true;document.getElementById('masterPower').classList.add('is-busy');renderFan({online:fanOnline,power:fanPower});renderPurifier(purifierState);renderZoneDevices();setLampBusy(true);try{const changeFan=async()=>{if(fanOnline)await setFanPower(target)},changePurifier=async()=>{if(purifierState.controllable)await setPurifierPower(target)},changeZones=async()=>setAllZonePower(target),changeLights=async()=>controlAllLights('power',target?'on':'off');if(target){await Promise.allSettled([changeFan(),changePurifier(),changeZones(),changeLights()])}else{await Promise.allSettled([changeLights(),changeZones(),changePurifier(),changeFan()])}await Promise.allSettled([refreshFan(),refreshPurifier(),refreshMap(),refreshZoneDevices(),refreshElgato()])}finally{everythingBusy=false;setLampBusy(false);renderFan({online:fanOnline,power:fanPower});renderPurifier(purifierState);renderZoneDevices();updateLampPanel()}}

const cToF=value=>Number.isFinite(Number(value))?Number(value)*9/5+32:null;
const hvacBandStart=value=>{const fahrenheit=cToF(value);return fahrenheit==null?null:Math.round(fahrenheit)};
function renderHvac(state){
  if(state&&typeof state==='object')hvacState={...state};
  const thermostat=hvacState,available=Boolean(thermostat),card=document.getElementById('hvacCard'),mode=thermostat?.currentMode;
  card.classList.toggle('is-busy',hvacBusy);
  card.classList.toggle('is-running',['heat','cool'].includes(mode));
  card.classList.toggle('is-heating',mode==='heat');
  card.classList.toggle('is-cooling',mode==='cool');
  const lower=hvacBandStart(thermostat?.heatSetpointC);
  document.getElementById('hvacRange').textContent=lower==null?'—':`${lower}–${lower+5}`;
  document.getElementById('hvacRangeMinus').disabled=!available||hvacBusy;
  document.getElementById('hvacRangePlus').disabled=!available||hvacBusy;
}
async function refreshHvac(){try{const data=await requestLocal(ECOBEE_BRIDGE,'/api/status'),thermostat=data?.thermostat;if(!thermostat)throw new Error('Нет данных термостата');hvacState=thermostat;localStorage.setItem(HVAC_SNAPSHOT_KEY,JSON.stringify(thermostat));renderHvac(thermostat)}catch(error){if(!hvacState)hvacState=cache(HVAC_SNAPSHOT_KEY);renderHvac(hvacState);console.warn('Кондиционер',error)}}
async function commitHvac(next){if(!hvacState||hvacBusy)return;hvacBusy=true;renderHvac();try{const data=await requestLocal(ECOBEE_BRIDGE,'/api/control',{method:'POST',body:JSON.stringify(next)});hvacState=data?.thermostat||hvacState;localStorage.setItem(HVAC_SNAPSHOT_KEY,JSON.stringify(hvacState))}catch(error){console.warn('Кондиционер',error);await refreshHvac()}finally{hvacBusy=false;renderHvac()}}
async function shiftHvacRange(direction){if(!hvacState||hvacBusy)return;const step=5/9*Number(direction);let heatC=Math.round((Number(hvacState.heatSetpointC)+step)*10)/10;heatC=clamp(heatC,7,32.2);let coolC=Math.round((heatC+2.8)*10)/10;if(coolC>35){coolC=35;heatC=32.2}await commitHvac({mode:'auto',heatC,coolC})}
function setNumbersVisible(visible){const section=document.getElementById('overviewNumbers'),button=document.getElementById('numbersToggle');section.hidden=!visible;button.classList.toggle('is-open',visible);button.setAttribute('aria-expanded',String(visible));button.setAttribute('aria-label',visible?'Скрыть финансовые показатели':'Показать финансовые показатели')}

function climateProfile(type,value){const missing=value==null||!Number.isFinite(Number(value)),v=Number(value),decimal=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:1}),base={type:type==='air'?'co2':type,label:type==='temperature'?'Температура':type==='humidity'?'Влажность':'Воздух · CO₂'};if(missing)return{...base,value:'—',status:'Нет данных',severity:'unavailable'};if(type==='temperature'){const target=70,tolerance=.5,isIdeal=Math.abs(v-target)<=tolerance;return{...base,value:decimal(v)+'°F',status:isIdeal?'Комфортно':v>target?'Жарко':'Прохладно',severity:isIdeal?'good':'outside'}}if(type==='humidity'){const target=45,isIdeal=Math.abs(v-target)<=2,status=v>50?'Очень влажно':v>47?'Влажно':v<43?'Сухо':'Комфортно';return{...base,value:decimal(v)+'%',status,severity:isIdeal?'good':'outside'}}return{...base,type:'co2',value:Math.round(v).toLocaleString('ru-RU')+' ppm',status:v<=500?'Чисто':'Проветрить',severity:v<=500?'good':'outside'}}
function climateCard(profile){return `<section class="air-stat metric-${profile.type} ${profile.severity}" aria-label="${profile.label}: ${profile.value}. ${profile.status}"><div class="air-stat-head"><span class="air-label">${profile.label}</span><span class="air-status">${profile.status}</span></div><div class="air-reading"><strong class="air-value">${profile.value}</strong></div></section>`}
const CLIMATE_SNAPSHOT_KEY='overview_govee_climate_v1';
function climateReadings(data){return{temperature:climateValue(data,['temperature','temp','temperatureC','tempC','temperatureF']),humidity:climateValue(data,['humidity','humid','humidityPercent']),air:climateValue(data,['co2','carbonDioxideConcentration','airQuality','pm25'])}}
function climateHasData(readings){return readings.temperature!=null||readings.humidity!=null||readings.air!=null}
function renderClimate(readings){document.getElementById('climate').innerHTML=`<div class="air-grid">${climateCard(climateProfile('temperature',readings.temperature))}${climateCard(climateProfile('humidity',readings.humidity))}${climateCard(climateProfile('air',readings.air))}</div>`}
async function loadClimate(){const box=document.getElementById('climate'),previous=climateReadings(cache(CLIMATE_SNAPSHOT_KEY)||{});if(climateHasData(previous))renderClimate(previous);else box.innerHTML='<div class="service-state"><div class="service-state-head"><i class="service-state-dot"></i>Подключаем Govee Life</div><p>Запрашиваем свежие показатели воздуха и состояние освещения.</p><div class="service-state-metrics"><span>Температура<b>—</b></span><span>Влажность<b>—</b></span><span>CO₂<b>—</b></span></div></div>';try{const data=await requestGovee('govee'),live=climateReadings(data),readings={temperature:live.temperature??previous.temperature,humidity:live.humidity??previous.humidity,air:live.air??previous.air};if(climateHasData(live))localStorage.setItem(CLIMATE_SNAPSHOT_KEY,JSON.stringify({...readings,updatedAt:Date.now()}));renderClimate(readings);renderLamp(data)}catch(error){goveeLightAvailable=false;goveeLampOn=false;renderClimate(previous);console.warn('Govee refresh',error)}await refreshElgato()}

document.getElementById('fanToggle').onclick=toggleFan;
document.getElementById('purifierPower').onclick=togglePurifier;
document.querySelectorAll('[data-purifier-mode]').forEach(button=>button.onclick=()=>setPurifierMode(Number(button.dataset.purifierMode)));
document.querySelectorAll('[data-zone-device]').forEach(button=>button.onclick=()=>toggleZoneDevice(button.dataset.zoneDevice));
document.getElementById('zoneAllToggle').onclick=toggleAllZones;
document.getElementById('masterPower').onclick=toggleEverything;
document.getElementById('refreshClimate').onclick=loadClimate;
document.getElementById('hvacRangeMinus').onclick=()=>shiftHvacRange(-1);
document.getElementById('hvacRangePlus').onclick=()=>shiftHvacRange(1);
document.getElementById('numbersToggle').onclick=()=>setNumbersVisible(document.getElementById('overviewNumbers').hidden);
document.getElementById('lampPower').onclick=async()=>{const desired=!lampOn;setLampBusy(true);try{await controlAllLights('power',desired?'on':'off')}catch(error){console.warn('Освещение',error)}finally{setLampBusy(false);updateLampPanel()}};
document.querySelectorAll('[data-lamp-color]').forEach(button=>button.onclick=async()=>{const hex=button.dataset.lampColor;selectLampColor(hex);setLampBusy(true);try{await controlAllLights('color',hex)}catch(error){console.warn('Цвет',error)}finally{setLampBusy(false);updateLampPanel()}});
const lampWheel=document.getElementById('lampColorWheel'),lampOrbit=document.getElementById('lampColorOrbit');let lampWheelDown=false;drawLampColorWheel();placeLampWheelKnob(currentLampColor);lampWheel.onpointerdown=event=>{lampWheelDown=true;lampOrbit.classList.add('is-dragging');lampWheel.setPointerCapture(event.pointerId);pickLampWheel(event)};lampWheel.onpointermove=event=>{if(lampWheelDown)pickLampWheel(event)};lampWheel.onpointerup=event=>{lampWheelDown=false;lampOrbit.classList.remove('is-dragging');pickLampWheel(event,true)};lampWheel.onpointercancel=()=>{lampWheelDown=false;lampOrbit.classList.remove('is-dragging')};
const lampBrightness=document.getElementById('lampBrightness');
async function flushBrightness(){clearTimeout(brightnessTimer);if(brightnessSyncing||brightnessQueued==null)return;brightnessSyncing=true;document.querySelector('.minimal-lamp').classList.add('is-syncing');try{while(brightnessQueued!=null){const value=brightnessQueued;brightnessQueued=null;try{await controlAllLights('brightness',value)}catch(error){console.warn('Яркость',error)}}}finally{brightnessSyncing=false;document.querySelector('.minimal-lamp').classList.remove('is-syncing');if(brightnessQueued!=null)flushBrightness()}}
function queueBrightness(value,immediate=false){setLampBrightness(value);brightnessQueued=currentBrightness;clearTimeout(brightnessTimer);brightnessTimer=setTimeout(flushBrightness,immediate?0:100)}
lampBrightness.oninput=()=>queueBrightness(lampBrightness.value);lampBrightness.onchange=()=>queueBrightness(lampBrightness.value,true);
async function refreshAll(){document.getElementById('refreshAll').textContent='Обновляем…';await Promise.allSettled([loadClimate(),refreshFinancialSummary(),refreshFan(),refreshPurifier(),refreshMap(),refreshZoneDevices(),refreshHvac()]);renderAdditionalMetrics();document.getElementById('refreshAll').textContent='Обновлено · '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
document.getElementById('refreshAll').onclick=refreshAll;
renderFan({online:false,power:false});renderPurifier({});renderZoneDevices({devices:[]});renderHvac(cache(HVAC_SNAPSHOT_KEY));setNumbersVisible(false);updateLampPanel();if(!lightingOnly)Promise.allSettled([loadClimate(),refreshFan(),refreshPurifier(),refreshMap(),refreshZoneDevices(),refreshHvac()]);
if(!lightingOnly){setInterval(loadClimate,Math.max(1,Number(climatePrefs().refresh)||1)*60000);setInterval(refreshSmartHome,15000);setInterval(refreshHvac,30000);}
</script>
