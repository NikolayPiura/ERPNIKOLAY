<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ПЮ</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;900&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#0a0c12;--bg2:#11141c;--bg3:#171b25;--bg4:#202635;
  --brd:rgba(255,255,255,0.06);--brd2:rgba(255,255,255,0.13);
  --tx:#d8dee8;--mu:#4a566a;--mu2:#6b7990;--mu3:#94a2b8;
  --g:#3ddba0;--b:#5b9dff;--r:#ff6b85;--y:#f0c84e;
  --accent:#3ddba0;--fs:1rem;--spacing:1;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:28px;}
body{background:var(--bg);color:var(--tx);font-family:'Inter',sans-serif;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(61,219,160,0.01) 1px,transparent 1px),linear-gradient(90deg,rgba(61,219,160,0.01) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0;}
#topbar{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(10,12,18,0.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--brd2);height:92px;display:flex;align-items:stretch;}
.top-logo{display:none}
.top-logo span{color:var(--accent);}
.tabs{display:flex;flex:1;overflow:hidden;}
.tab{flex:1;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:600;letter-spacing:0.3px;text-transform:uppercase;color:var(--mu2);cursor:pointer;border-right:1px solid var(--brd);border-bottom:4px solid transparent;transition:all .2s;text-align:center;padding:0 8px;white-space:nowrap;}
.tab:hover{color:var(--tx);}
.tab.act{color:#fff;border-bottom-color:var(--tc);background:rgba(255,255,255,0.015);}
.tab.overview{flex:0.7;}
.top-right{display:flex;align-items:center;gap:12px;padding:0 20px;border-left:1px solid var(--brd2);}
#sync{font-family:'JetBrains Mono',monospace;font-size:0.85rem;color:var(--mu2);white-space:nowrap;}
#sync.live{color:var(--accent);}#sync.err{color:var(--r);}
#settbtn,#rbtn{background:transparent;border:1px solid var(--brd2);border-radius:8px;color:var(--mu3);font-family:'JetBrains Mono',monospace;font-size:1.1rem;padding:7px 14px;cursor:pointer;transition:all .2s;}
#settbtn:hover{border-color:var(--y);color:var(--y);}
#rbtn:hover{border-color:var(--accent);color:var(--accent);}
.pg{padding:128px 4vw 80px;position:relative;z-index:1;width:100%;}
.sec{margin-bottom:calc(72px * var(--spacing));}
.sec:last-child{margin-bottom:0;}
.sh{display:flex;align-items:center;gap:14px;margin-bottom:calc(28px * var(--spacing));cursor:pointer;user-select:none;}
.sh.static{cursor:default;}
.sn{font-family:'JetBrains Mono',monospace;font-size:0.85rem;color:var(--accent);letter-spacing:3px;opacity:0.85;}
.st{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:600;letter-spacing:1.5px;color:var(--mu3);}
.sl{flex:1;height:1px;background:linear-gradient(90deg,var(--brd2),transparent);}
.chev{font-family:'JetBrains Mono',monospace;font-size:1rem;color:var(--mu2);transition:transform .25s;}
.chev.open{transform:rotate(90deg);}
.card{background:var(--bg2);border:1px solid var(--brd);border-radius:12px;padding:calc(40px * var(--spacing)) calc(44px * var(--spacing));}
.collapsible{display:none;}
.collapsible.open{display:block;}
.period-switch{display:flex;gap:0.75rem;margin-bottom:calc(1.8rem * var(--spacing));}
.period-btn{background:var(--bg3);border:1px solid var(--brd2);border-radius:8px;color:var(--mu3);font-family:'JetBrains Mono',monospace;font-size:calc(var(--fs)*0.85);font-weight:600;padding:calc(0.7rem * var(--spacing)) 1.4rem;cursor:pointer;transition:all .2s;}
.period-btn:hover{border-color:var(--mu3);color:var(--tx);}
.period-btn.sel{background:var(--accent);border-color:var(--accent);color:#0a0c12;}
.ti-grid{display:grid;grid-template-columns:1fr 1fr;gap:calc(28px * var(--spacing));margin-bottom:calc(32px * var(--spacing));}
.ti-box{background:var(--bg3);border:1px solid var(--brd);border-radius:12px;padding:calc(40px * var(--spacing)) calc(44px * var(--spacing));position:relative;overflow:hidden;}
.ti-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:12px 12px 0 0;}
.ti-box.tcolor::before{background:var(--b);opacity:0.7;}
.ti-box.icolor::before{background:var(--y);opacity:0.7;}
.ti-lbl{font-family:'JetBrains Mono',monospace;font-size:calc(var(--fs)*0.75);color:var(--mu2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:calc(18px * var(--spacing));}
.ti-val{font-family:'Orbitron',sans-serif;font-size:calc(var(--fs)*3.2);font-weight:700;line-height:1;}
.dph-block{text-align:center;padding:calc(40px * var(--spacing)) 0;}
.dph-val{font-family:'Orbitron',sans-serif;font-size:calc(var(--fs)*4.2);font-weight:800;line-height:1;cursor:pointer;display:inline-block;transition:opacity .15s;}
.dph-val:hover{opacity:0.8;}
.dph-sep{font-family:'JetBrains Mono',monospace;font-size:calc(var(--fs)*2.2);color:var(--mu);}
.dph-tgt{font-family:'Orbitron',sans-serif;font-size:calc(var(--fs)*2.8);font-weight:600;color:var(--mu3);}
.dph-hint{font-family:'JetBrains Mono',monospace;font-size:calc(var(--fs)*0.65);color:var(--mu);margin-top:16px;letter-spacing:0.5px;}
.dph-goal{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:8px 13px;border:1px solid color-mix(in srgb,var(--accent) 36%,var(--brd));border-radius:999px;background:color-mix(in srgb,var(--accent) 9%,var(--bg3));color:var(--tx);font:700 calc(var(--fs)*.68) 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
.chart-head{display:flex;justify-content:flex-end;align-items:center;margin-bottom:20px;}
.mbtn{background:transparent;border:1px solid var(--brd2);border-radius:50%;color:var(--mu3);font-family:'JetBrains Mono',monospace;font-size:1rem;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;}
.mbtn:hover,.mbtn.on{border-color:var(--y);color:var(--y);}
.chart-box{position:relative;height:380px;}
.manual-row{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-top:20px;padding-top:20px;border-top:1px solid var(--brd);}
.mc{display:flex;flex-direction:column;align-items:center;gap:4px;}
.mc-lbl{font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--mu2);}
.mc-inp{width:100%;background:var(--bg3);border:1px solid var(--brd);border-radius:4px;color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:0.85rem;text-align:center;padding:5px 1px;outline:none;}
.mc-inp:focus{border-color:var(--y);}
.mc-inp:disabled{opacity:0.4;cursor:not-allowed;}
.ov-summary{background:radial-gradient(circle at 30% 20%,rgba(61,219,160,0.06),transparent 60%),var(--bg2);border:1px solid var(--brd);border-radius:16px;padding:calc(52px * var(--spacing)) 60px;margin-bottom:calc(64px * var(--spacing));text-align:center;}
.ov-summary-val{font-family:'Orbitron',sans-serif;font-size:calc(var(--fs)*5.5);font-weight:800;line-height:1;}
.ov-summary-sub{font-family:'JetBrains Mono',monospace;font-size:calc(var(--fs)*0.75);color:var(--mu2);margin-top:14px;}
.ov-list{display:flex;flex-direction:column;gap:calc(30px * var(--spacing));counter-reset:overview-rank;}
.ov-row{counter-increment:overview-rank;min-height:220px;background:linear-gradient(115deg,color-mix(in srgb,var(--oc,var(--mu)) 5%,var(--bg2)),var(--bg2) 48%);border:1px solid var(--brd);border-radius:22px;padding:calc(50px * var(--spacing)) calc(58px * var(--spacing));display:grid;grid-template-columns:1fr 1fr 1.7fr;gap:46px;align-items:center;position:relative;overflow:hidden;transition:border-color .2s,transform .2s,box-shadow .2s;}
.ov-row:hover{border-color:color-mix(in srgb,var(--oc,var(--mu)) 52%,var(--brd2));transform:translateY(-2px);box-shadow:0 14px 32px rgba(0,0,0,.16);}
.ov-row::before{content:'';position:absolute;top:0;left:0;bottom:0;width:5px;background:var(--oc,var(--mu));}
.ov-row-name{font-family:'Orbitron',sans-serif;font-size:calc(var(--fs)*1.2);font-weight:600;display:flex;align-items:center;gap:12px;}
.ov-row-rank{width:32px;height:32px;border:1px solid color-mix(in srgb,var(--oc,var(--mu)) 48%,var(--brd));border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;font:700 calc(var(--fs)*.66) 'JetBrains Mono',monospace;color:var(--oc,var(--mu));background:var(--bg3);}
.ov-row-dph{cursor:pointer;transition:opacity .15s;}
.ov-row-dph:hover{opacity:0.8;}
.ov-row-dph-val{font-family:'Orbitron',sans-serif;font-size:calc(var(--fs)*3.25);font-weight:800;line-height:1;}
.ov-row-dph-of{font-family:'JetBrains Mono',monospace;font-size:calc(var(--fs)*1);color:var(--mu3);}
.ov-row-goal{display:inline-flex;align-items:center;margin-top:14px;padding:7px 11px;border:1px solid color-mix(in srgb,var(--oc,var(--mu)) 40%,var(--brd));border-radius:999px;background:color-mix(in srgb,var(--oc,var(--mu)) 8%,var(--bg3));color:var(--tx);font:700 calc(var(--fs)*.62) 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
.ov-row-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;cursor:pointer;border-radius:12px;}
.ov-row-tile{min-height:116px;background:var(--bg3);border:1px solid var(--brd);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;justify-content:center;}
.ov-row-tile-lbl{font-family:'JetBrains Mono',monospace;font-size:calc(var(--fs)*0.6);color:var(--mu2);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;}
.ov-row-tile-val{font-family:'JetBrains Mono',monospace;font-size:calc(var(--fs)*0.9);font-weight:700;}
@media(max-width:1100px){.ov-row{grid-template-columns:1fr;gap:16px;}.ov-row-tiles{grid-template-columns:1fr 1fr;}}
#histmodal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:600;align-items:center;justify-content:center;}
#histmodal.on{display:flex;}
.hist-box{background:var(--bg2);border:1px solid var(--brd2);border-radius:16px;padding:48px 52px;width:92%;max-width:980px;}
.hist-title{font-family:'Orbitron',sans-serif;font-size:1.3rem;font-weight:600;margin-bottom:8px;}
.hist-sub{font-family:'JetBrains Mono',monospace;font-size:0.8rem;color:var(--mu2);margin-bottom:32px;}
.hist-chart-box{position:relative;height:360px;}
.hist-close{margin-top:28px;width:100%;background:transparent;border:1px solid var(--brd2);border-radius:8px;color:var(--mu3);font-family:'JetBrains Mono',monospace;font-size:0.9rem;padding:14px;cursor:pointer;transition:all .2s;}
.hist-close:hover{border-color:var(--mu3);color:var(--tx);}
#settmodal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:500;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 0;}
#settmodal.on{display:flex;}
.sett-box{background:var(--bg2);border:1px solid var(--brd2);border-radius:16px;padding:44px 48px;width:90%;max-width:800px;margin:auto;}
.sett-title{font-family:'Orbitron',sans-serif;font-size:1.2rem;font-weight:600;margin-bottom:32px;}
.sett-row{margin-bottom:28px;}
.sett-lbl{font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--mu2);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:14px;}
.sett-opts{display:flex;gap:10px;flex-wrap:wrap;}
.sett-opt{background:var(--bg3);border:1px solid var(--brd2);border-radius:8px;padding:10px 18px;font-family:'JetBrains Mono',monospace;font-size:0.85rem;color:var(--mu3);cursor:pointer;transition:all .2s;}
.sett-opt:hover{border-color:var(--mu3);}
.sett-opt.sel{background:var(--accent);border-color:var(--accent);color:#0a0c12;font-weight:600;}
.sett-num,.sett-text,.sett-select{background:var(--bg3);border:1px solid var(--brd2);border-radius:8px;color:var(--tx);font-family:'JetBrains Mono',monospace;font-size:1rem;padding:10px 14px;outline:none;}
.sett-num{width:130px;}
.sett-text{width:100%;}
.sett-select{cursor:pointer;}
.sett-num:focus,.sett-text:focus,.sett-select:focus{border-color:var(--y);}
.sett-slider-row{display:flex;align-items:center;gap:16px;}
.sett-slider{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:var(--bg4);outline:none;cursor:pointer;}
.sett-slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg2);}
.sett-colors{display:flex;gap:12px;flex-wrap:wrap;}
.sett-color{width:40px;height:40px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .2s;}
.sett-color.sel{border-color:#fff;}
.sett-color:hover{transform:scale(1.15);}
.sett-reorder{display:flex;flex-direction:column;gap:8px;}
.sett-reorder-item{background:var(--bg3);border:1px solid var(--brd2);border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:12px;cursor:grab;font-size:0.9rem;}
.sett-reorder-item:active{cursor:grabbing;}
.sett-reorder-handle{color:var(--mu);font-size:1rem;}
.sett-reorder-item.dragging{opacity:0.4;}
.sett-close{width:100%;background:var(--accent);border:none;border-radius:8px;color:#0a0c12;font-family:'Orbitron',sans-serif;font-size:0.95rem;font-weight:600;padding:16px;cursor:pointer;margin-top:20px;transition:all .2s;}
.sett-close:hover{filter:brightness(1.08);}
.sett-desc{font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:var(--mu2);margin-top:10px;line-height:1.6;}
#imodal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:1000;align-items:center;justify-content:center;cursor:pointer;}
#imodal.on{display:flex;}
#imodal img{max-width:92vw;max-height:92vh;border:1px solid var(--brd2);border-radius:8px;}
/* 2026-08-11: a spacious, stable dashboard without distracting card motion. */
.pg{max-width:1680px;margin:0 auto;padding:148px 5vw 120px}.sec{margin-bottom:calc(92px * var(--spacing))}.ov-summary{margin-bottom:calc(76px * var(--spacing));padding:calc(64px * var(--spacing)) 72px}.ov-list{gap:calc(38px * var(--spacing))}.ov-row{min-height:238px;padding:calc(58px * var(--spacing)) calc(66px * var(--spacing));gap:54px;transition:border-color .14s ease,background-color .14s ease}.ov-row:hover{transform:none;box-shadow:none}.card,.ti-box{transition:border-color .14s ease}.card:hover,.ti-box:hover{transform:none!important;box-shadow:none!important}@media(max-width:900px){.pg{padding:122px 22px 80px}.sec{margin-bottom:64px}.ov-row{padding:36px 28px;gap:24px}}
/* Четыре контрольные даты — тот же крупный ритм, что и в «Обзоре». */
.cp-shell{display:grid;gap:calc(38px * var(--spacing))}.cp-summary{margin-bottom:calc(38px * var(--spacing))!important}.cp-board{display:grid;gap:calc(38px * var(--spacing))}.cp-row{--cc:var(--b);position:relative;display:grid;grid-template-columns:minmax(250px,.72fr) minmax(0,2.1fr);gap:54px;align-items:center;min-height:238px;padding:calc(54px * var(--spacing)) calc(66px * var(--spacing));border:1px solid var(--brd);border-radius:22px;background:linear-gradient(112deg,color-mix(in srgb,var(--cc) 8%,var(--bg2)),var(--bg2) 43%);overflow:hidden}.cp-row::before{content:'';position:absolute;inset:0 auto 0 0;width:5px;background:var(--cc)}.cp-row-name{display:flex;align-items:center;gap:15px;color:var(--tx);font:800 clamp(20px,1.9vw,29px) Inter,sans-serif;letter-spacing:-.03em}.cp-rank{width:33px;height:33px;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--cc) 50%,var(--brd));border-radius:50%;color:var(--cc);font:800 11px 'JetBrains Mono',monospace}.cp-history{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.cp-point{min-width:0;min-height:126px;padding:18px 19px;border:1px solid var(--brd);border-radius:16px;background:color-mix(in srgb,var(--cc) 4%,var(--bg3));display:flex;flex-direction:column;justify-content:center}.cp-date{color:var(--mu2);font:800 10px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase}.cp-point-value{margin-top:18px;color:var(--cc);font:850 clamp(31px,3vw,49px) Inter,sans-serif;line-height:.88;letter-spacing:-.055em;white-space:nowrap}.cp-point-value span{font-size:.32em;color:var(--mu2);margin-left:.15em}.cp-empty{padding:58px;border:1px dashed var(--brd2);border-radius:20px;color:var(--mu3);text-align:center;font:600 14px/1.7 Inter,sans-serif}
@media(max-width:1180px){.cp-row{grid-template-columns:1fr;padding:38px 34px;gap:28px}}@media(max-width:850px){.cp-history{grid-template-columns:1fr 1fr}}@media(max-width:520px){.cp-row{padding:28px 22px}.cp-history{grid-template-columns:1fr}.cp-point{min-height:112px}}
</style>
</head>
<body>
<div id="topbar">
  <div class="top-logo" id="top-logo-text">П<span>Ю</span></div>
  <div class="tabs" id="tabs-bar"></div>
  <div class="top-right">
    <span id="sync">● —</span>
    <button id="settbtn" onclick="openSettings()">⚙</button>
    <button id="rbtn" onclick="loadAll()">↻</button>
  </div>
</div>
<div class="pg" id="pg"></div>

<div id="settmodal">
  <div class="sett-box">
    <div class="sett-title">⚙ Настройки</div>
    <div class="sett-row">
      <div class="sett-lbl">Целевой $/час (ИК)</div>
      <input type="number" class="sett-num" id="opt-targetdph" value="500">
    </div>
    <div class="sett-row">
      <div class="sett-lbl">Период дохода — пресеты</div>
      <div class="sett-opts" id="opt-income-preset"></div>
    </div>
    <div class="sett-row">
      <div class="sett-lbl">Своя дата начала (если выбрано выше)</div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
        <select class="sett-select" id="opt-cm">
          <option value="0">Январь</option><option value="1">Февраль</option><option value="2">Март</option>
          <option value="3">Апрель</option><option value="4">Май</option><option value="5">Июнь</option>
          <option value="6">Июль</option><option value="7">Август</option><option value="8">Сентябрь</option>
          <option value="9">Октябрь</option><option value="10">Ноябрь</option><option value="11">Декабрь</option>
        </select>
        <select class="sett-select" id="opt-cy">
          <option value="2025">2025</option><option value="2026">2026</option>
        </select>
        <div class="sett-opt" onclick="applyCustomDate()">Применить</div>
      </div>
    </div>
    <div class="sett-row">
      <div class="sett-lbl">Формула $/час</div>
      <div class="sett-opts" id="opt-formula"></div>
      <div class="sett-desc" id="formula-desc"></div>
    </div>
    <div class="sett-row">
      <div class="sett-lbl">Название (топбар)</div>
      <input type="text" class="sett-text" id="opt-logotext" maxlength="8" placeholder="ПЮ">
    </div>
    <div class="sett-row">
      <div class="sett-lbl">Цвет акцента</div>
      <div class="sett-colors" id="opt-accent"></div>
    </div>
    <div class="sett-row">
      <div class="sett-lbl">Размер текста: <span id="lbl-fs">50</span></div>
      <div class="sett-slider-row">
        <span style="font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--mu2)">А</span>
        <input type="range" class="sett-slider" id="opt-fontsize" min="0" max="100" value="50" oninput="onFontSizeSlider(this.value)">
        <span style="font-family:'JetBrains Mono',monospace;font-size:1.2rem;color:var(--mu2)">А</span>
      </div>
    </div>
    <div class="sett-row">
      <div class="sett-lbl">Компактность: <span id="lbl-compact">50</span></div>
      <div class="sett-slider-row">
        <span style="font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--mu2)">▤</span>
        <input type="range" class="sett-slider" id="opt-compact" min="0" max="100" value="50" oninput="onCompactSlider(this.value)">
        <span style="font-family:'JetBrains Mono',monospace;font-size:1.2rem;color:var(--mu2)">☰</span>
      </div>
    </div>
    <div class="sett-row">
      <div class="sett-lbl">Шрифт текста</div>
      <div class="sett-opts" id="opt-fontfamily"></div>
    </div>
    <div class="sett-row">
      <div class="sett-lbl">Порядок вкладок (потяни)</div>
      <div class="sett-reorder" id="opt-taborder"></div>
    </div>
    <button class="sett-close" onclick="closeSettings()">Готово</button>
  </div>

// ── TIME DATA ──
function commitTimeData(obj){
  timeData=obj;
  const keys=Object.keys(obj).sort();
  if(keys.length>=2){
    const first=new Date(keys[0]+'T00:00:00');
    const last=new Date(keys[keys.length-1]+'T00:00:00');
    timeDayCount=Math.max(1,Math.round((last-first)/86400000)+1);
  } else timeDayCount=Math.max(1,keys.length);
}
function localTimeData(){
  try{
    const source=JSON.parse(localStorage.getItem('tt_v4')||'{}'),obj={};
    Object.entries(source).forEach(([date,row])=>{
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!row||typeof row!=='object')return;
      obj[date]={klim:Number(row.klim)||0,inv:Number(row.inv)||0,money:Number(row.money)||0,nav:Number(row.nav)||0};
    });
    return Object.values(obj).some(row=>Object.values(row).some(value=>value>0))?obj:null;
  }catch{return null}
}
async function loadTimeData(){
  const local=localTimeData();
  if(!timeData&&local)commitTimeData(local);
  try{
    const r=await fetch(TIME_URL+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(j.status==='ok'&&j.days){
      const obj={};
      j.days.forEach(d=>{
        obj[d.date]={
          klim:d['Климат']||0,inv:d['Инвестиции']||0,
          money:d['Управление деньгами']||0,nav:d['Наставник']||0,
        };
      });
      if(!Object.values(obj).some(row=>Object.values(row).some(value=>Number(value)>0)))throw new Error('Пустой ответ учёта времени');
      commitTimeData(obj);
      localStorage.setItem(CACHE_KEY+'_time',JSON.stringify({data:timeData,days:timeDayCount,at:Date.now()}));
    }
  }catch(e){console.warn('Time load fallback:',e);}
}
function getTime(){return timeData||{};}
function timeStatsFor(tk,until=''){
  const tt=getTime(),keys=Object.keys(tt).filter(key=>!until||key<=until).sort();let totalMins=0;
  keys.forEach(k=>{totalMins+=(tt[k]?.[tk]||0);});
  let days=timeDayCount||1;
  if(until&&keys.length){const first=new Date(keys[0]+'T00:00:00'),last=new Date(keys.at(-1)+'T00:00:00');days=Math.max(1,Math.round((last-first)/86400000)+1)}
  const avgMinDay=totalMins/days;
  return{days,totalH:totalMins/60,avgHDay:avgMinDay/60,avgHWeek:(avgMinDay/60)*7,avgHMonth:(avgMinDay/60)*30};
}

function getSliding12(referenceDate=''){
  const now=referenceDate?new Date(referenceDate+'T12:00:00'):new Date(),res=[];
  for(let i=11;i>=0;i--){let m=now.getMonth()-i,y=now.getFullYear();if(m<0){m+=12;y--;}res.push({key:MO[m],year:y,label:MO[m]+(y!==now.getFullYear()?"'"+String(y).slice(2):'')});}
  return res;
}
function getCat(name){
  if(!incomeData?.sources?.categories)return null;
  return incomeData.sources.categories.find(c=>c.name.toUpperCase().indexOf(name.split(' ')[0].toUpperCase())!==-1)||null;
}
function fmt(v){if(!v&&v!==0)return'—';return'$'+Math.round(v).toLocaleString('ru');}
function getMonthVal(tab,monthKey,year,remote,manual){
  if(manual[monthKey]!==undefined)return manual[monthKey];
  if(year===2025&&FIXED_2025[tab.tk]&&FIXED_2025[tab.tk][monthKey]!==undefined)return FIXED_2025[tab.tk][monthKey];
  return remote[monthKey]||0;
}

// Returns sliding months filtered by income period setting
function getIncomeMonths(sliding){
  const p=SETTINGS.incomePreset||'12m';
  if(p==='3m') return sliding.slice(-3);
  if(p==='6m') return sliding.slice(-6);
  if(p==='12m') return sliding;
  if(p==='jan26') return sliding.filter(s=>s.year>2026||(s.year===2026));
  if(p==='jul25') return sliding;
  if(p==='custom'){
    const cs=SETTINGS.customStart||{month:0,year:2026};
    return sliding.filter(s=>s.year>cs.year||(s.year===cs.year&&MO.indexOf(s.key)>=cs.month));
  }
  return sliding;
}

function calcDph(vals, hoursPerMonth){
  if(!vals.length||hoursPerMonth<=0) return 0;
  const f=SETTINGS.formula||'avg';
  let ref=0;
  if(f==='avg'){
    ref=vals.reduce((a,b)=>a+(b||0),0)/vals.length;
  } else if(f==='last3avg'){
    const l=vals.slice(-3);ref=l.reduce((a,b)=>a+(b||0),0)/l.length;
  } else if(f==='weighted'){
    let ws=0,wt=0;vals.forEach((v,i)=>{const w=Math.pow(0.9,vals.length-1-i);ws+=(v||0)*w;wt+=w;});ref=wt>0?ws/wt:0;
  } else if(f==='best'){
    ref=Math.max(...vals.map(v=>v||0));
  } else if(f==='median'){
    const s=[...vals].map(v=>v||0).sort((a,b)=>a-b);
    const m=Math.floor(s.length/2);ref=s.length%2?s[m]:(s[m-1]+s[m])/2;
  }
  return Math.round(ref/hoursPerMonth);
}

function getTabData(tab,referenceDate=''){
  const sliding=getSliding12(referenceDate);
  const cat=getCat(tab.cat);
  const remote=cat?cat.months:{};
  const total=cat?(cat.total||0):0;
  const manual=getManual(tab.id);
  const vals=sliding.map(s=>getMonthVal(tab,s.key,s.year,remote,manual));
  const incomeMonths=getIncomeMonths(sliding);
  const incomeVals=incomeMonths.map(s=>getMonthVal(tab,s.key,s.year,remote,manual));
  const ts=timeStatsFor(tab.tk,referenceDate);
  const hoursPerMonth=ts.avgHDay*30;
  const avgMonthlyIncome=incomeVals.reduce((a,b)=>a+(b||0),0)/Math.max(1,incomeVals.length);
  const dph=calcDph(incomeVals,hoursPerMonth);
  const period=getViewPeriod(tab.id);
  const mult=VIEW_PERIODS[period].mult;
  const periodHours=ts.avgHDay*mult;
  const periodIncome=(avgMonthlyIncome/30)*mult;
  const presetLabel=(INCOME_PRESETS.find(p=>p.id===SETTINGS.incomePreset)||INCOME_PRESETS[2]).label;
  const formulaLabel=(FORMULAS.find(f=>f.id===SETTINGS.formula)||FORMULAS[0]).label;
  return{sliding,vals,total,ts,avgMonthlyIncome,hoursPerMonth,dph,manual,remote,period,periodHours,periodIncome,presetLabel,formulaLabel};
}

function getDphHistory(tab){
  const sliding=getSliding12();
  const cat=getCat(tab.cat);
  const remote=cat?cat.months:{};
  const manual=getManual(tab.id);
  const ts=timeStatsFor(tab.tk);
  const hoursPerMonth=ts.avgHDay*30;
  const monthVals=sliding.map(s=>getMonthVal(tab,s.key,s.year,remote,manual));
  let runSum=0;
  return sliding.map((s,i)=>{
    runSum+=monthVals[i];
    const avg=runSum/(i+1);
    const dph=hoursPerMonth>0?Math.round(avg/hoursPerMonth):0;
    return{label:s.label,dph,hasData:runSum>0};
  });
}

      <div class="card dph-block">
        <div class="dph-val" style="color:${ec}" onclick="openHist('${curTab}')">${fmt(dph)}</div>
        <div class="dph-goal">Цель · ${fmt(target)} $/час</div>
        <div class="dph-hint">${presetLabel} · ${formulaLabel} · нажми для истории</div>
      </div>
    </div>
  `;
  pg.appendChild(s1);

  const chartKey='chart-'+curTab;
  const chartOpen=openBlocks[chartKey];
  const s2=document.createElement('div');s2.className='sec';
  s2.innerHTML=`
    <div class="sh" onclick="toggleBlock('${chartKey}')">
      <span class="sn">// 02</span><span class="st">ГРАФИК ДОХОДА</span><div class="sl"></div>
      <span class="chev${chartOpen?' open':''}" id="chev-${chartKey}">▸</span>
    </div>
    <div class="collapsible${chartOpen?' open':''}" id="block-${chartKey}">
      <div class="card">
        <div class="chart-head">
          <button class="mbtn${manualOpen?' on':''}" onclick="toggleManual('${curTab}')" title="вручную">✎</button>
        </div>
        <div class="chart-box"><canvas id="ch-main"></canvas></div>
        ${manualOpen?'<div class="manual-row" id="manual-row"></div>':''}
      </div>
    </div>
  `;
  pg.appendChild(s2);

  setTimeout(()=>{
    if(chartOpen)drawChartForTab(curTab);
    if(manualOpen)buildManual(curTab,sliding,remote,manual,tab.color);
  },30);
}

function drawChartForTab(tid){
  const tab=ALL_TABS.find(t=>t.id===tid);if(!tab)return;
  const{sliding,vals}=getTabData(tab);
  const maxData=Math.max(...vals,0);
  const maxVal=maxData>0?maxData*1.25:1000;
  if(mainChart){mainChart.destroy();mainChart=null;}
  const ctx=document.getElementById('ch-main');if(!ctx)return;
  let lastIdx=-1;vals.forEach((v,i)=>{if(v>0)lastIdx=i;});
  const dv=vals.map((v,i)=>i<=lastIdx?(v||0):null);
  mainChart=new Chart(ctx,{
    type:'line',
    data:{labels:sliding.map(s=>s.label),datasets:[{data:dv,borderColor:tab.color,backgroundColor:tab.color+'12',fill:true,tension:0.3,
      pointRadius:dv.map(v=>v!==null?5:0),pointBackgroundColor:tab.color,pointBorderColor:tab.color,pointHoverRadius:7,borderWidth:2.5,spanGaps:false}]},
    plugins:[{id:'lbl',afterDatasetsDraw(chart){
      const ds=chart.data.datasets[0],meta=chart.getDatasetMeta(0),c2=chart.ctx;
      meta.data.forEach((pt,i)=>{
        const v=ds.data[i];if(v===null||v===0)return;
        c2.save();c2.font="600 12px 'JetBrains Mono'";c2.fillStyle=tab.color;c2.textAlign='center';
        c2.fillText('$'+(v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)),pt.x,pt.y-12);c2.restore();
      });
    }}],
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.raw!==null?' $'+Math.round(c.raw).toLocaleString('ru'):''}}},
      scales:{
        x:{ticks:{color:'#6b7990',font:{family:'JetBrains Mono',size:12}},grid:{color:'rgba(255,255,255,0.035)'},border:{color:'rgba(255,255,255,0.07)'}},
        y:{min:0,suggestedMax:maxVal,ticks:{color:'#6b7990',font:{family:'JetBrains Mono',size:11},callback:v=>'$'+(v>=1000?(v/1000).toFixed(0)+'k':v)},grid:{color:'rgba(255,255,255,0.035)'},border:{color:'rgba(255,255,255,0.07)'}}
      }
    }
  });
}

function toggleManual(tid){showManual[tid]=!showManual[tid];renderPage();}
function buildManual(tid,sliding,remote,manual,color){
  const el=document.getElementById('manual-row');if(!el)return;el.innerHTML='';
  const tab=ALL_TABS.find(t=>t.id===tid);
  sliding.forEach(s=>{
    const isFixed=s.year===2025&&FIXED_2025[tab.tk]&&FIXED_2025[tab.tk][s.key]!==undefined&&manual[s.key]===undefined;
    const val=getMonthVal(tab,s.key,s.year,remote,manual);
    const cell=document.createElement('div');cell.className='mc';
    cell.innerHTML=`<span class="mc-lbl">${s.label}${isFixed?' 🔒':''}</span><input class="mc-inp" type="number" min="0" placeholder="0" value="${val||''}" ${isFixed?'disabled':''} style="border-color:${val?color:''}" onchange="saveManualKey('${tid}','${s.key}',this.value);renderPage()">`;
    el.appendChild(cell);
  });
}

function openHist(tid){
  const tab=ALL_TABS.find(t=>t.id===tid);
  const hist=getDphHistory(tab);
  document.getElementById('hist-title').textContent=`История $/час · ${tab.name}`;
  document.getElementById('hist-sub').textContent='нарастающий средний $/час по месяцам';
  document.getElementById('histmodal').classList.add('on');
  if(histChart){histChart.destroy();histChart=null;}
  const ctx=document.getElementById('hist-chart');
  const dv=hist.map(h=>h.hasData?h.dph:null);
  const target=SETTINGS.targetDph;
  const validVals=dv.filter(v=>v!==null);
  const maxVal=(validVals.length?Math.max(...validVals,target):target)*1.2;
  histChart=new Chart(ctx,{
    type:'line',
    data:{labels:hist.map(h=>h.label),datasets:[
      {data:dv,borderColor:tab.color,backgroundColor:tab.color+'15',fill:true,tension:0.3,
       pointRadius:dv.map(v=>v!==null?5:0),pointBackgroundColor:tab.color,borderWidth:2.5,spanGaps:false},
      {data:hist.map(()=>target),borderColor:'#94a2b8',borderDash:[6,5],borderWidth:1.5,pointRadius:0,fill:false}
    ]},
    plugins:[{id:'lbl2',afterDatasetsDraw(chart){
      const ds=chart.data.datasets[0],meta=chart.getDatasetMeta(0),c2=chart.ctx;
      meta.data.forEach((pt,i)=>{
        const v=ds.data[i];if(v===null)return;
        c2.save();c2.font="600 11px 'JetBrains Mono'";c2.fillStyle=tab.color;c2.textAlign='center';
        c2.fillText('$'+Math.round(v),pt.x,pt.y-12);c2.restore();
      });
    }}],
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:'#6b7990',font:{family:'JetBrains Mono',size:12}},grid:{color:'rgba(255,255,255,0.035)'},border:{color:'rgba(255,255,255,0.07)'}},
        y:{min:0,suggestedMax:maxVal,ticks:{color:'#6b7990',font:{family:'JetBrains Mono',size:11},callback:v=>'$'+v},grid:{color:'rgba(255,255,255,0.035)'},border:{color:'rgba(255,255,255,0.07)'}}
      }
    }
  });
}
function closeHist(){document.getElementById('histmodal').classList.remove('on');}
function closeModal(){document.getElementById('imodal').classList.remove('on');}

function renderOverview(){
  const pg=document.getElementById('pg');pg.innerHTML='';
  const target=SETTINGS.targetDph;
  let totalIncomeAll=0,totalHoursPerMonth=0;
  const tabStats=ALL_TABS.map(tab=>{
    const data=getTabData(tab);
    totalIncomeAll+=data.avgMonthlyIncome;totalHoursPerMonth+=data.hoursPerMonth;
    return{tab,data};
  }).sort((a,b)=>b.data.dph-a.data.dph||b.data.avgMonthlyIncome-a.data.avgMonthlyIncome||b.data.total-a.data.total);
  const overallDph=totalHoursPerMonth?Math.round(totalIncomeAll/totalHoursPerMonth):0;
  if(overallDph>0)localStorage.setItem('piura_effectiveness_overview_v1',JSON.stringify({dph:overallDph,updatedAt:Date.now(),source:'effectiveness'}));
  const summary=document.createElement('section');summary.className='ov-summary';summary.innerHTML=`<div class="ov-summary-val">${fmt(overallDph)}<span style="font-size:.28em;color:var(--mu2);margin-left:.35em">/ час</span></div>`;pg.appendChild(summary);
  const list=document.createElement('div');list.className='ov-list';
  tabStats.forEach(({tab,data},index)=>{
    const ec=data.dph>=target?'var(--accent)':data.dph>=target*0.6?tab.color:'#ff6b85';
    const periodLabel=VIEW_PERIODS[data.period].label;
    const row=document.createElement('div');row.className='ov-row';
    row.style.setProperty('--oc',tab.color);
    row.innerHTML=`
      <div class="ov-row-name" style="color:${tab.color}"><span class="ov-row-rank">${index+1}</span><span>${tab.name}</span></div>
      <div class="ov-row-dph" onclick="openHist('${tab.id}')">
        <div class="ov-row-dph-val" style="color:${ec}">${fmt(data.dph)}</div>
        <div class="ov-row-goal">Цель · ${fmt(target)} $/час</div>
        <div style="background:color-mix(in srgb,var(--ink) 12%,var(--bg4));height:13px;border-radius:999px;overflow:hidden;margin-top:16px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 5%,transparent);">
          <div style="height:100%;width:0%;background:linear-gradient(90deg,${ec},color-mix(in srgb,${ec} 65%,white));border-radius:999px;transition:width 1s ease;box-shadow:0 0 18px color-mix(in srgb,${ec} 34%,transparent);" id="pbar-${tab.id}"></div>
        </div>
      </div>
      <div class="ov-row-tiles" role="button" tabindex="0" onclick="cycleOverviewPeriod('${tab.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();cycleOverviewPeriod('${tab.id}')}" title="Нажмите, чтобы сменить период">
        <div class="ov-row-tile"><div class="ov-row-tile-lbl">Время · ${periodLabel}</div><div class="ov-row-tile-val" style="color:var(--b)">${data.periodHours.toFixed(1)}ч</div></div>
        <div class="ov-row-tile"><div class="ov-row-tile-lbl">Деньги · ${periodLabel}</div><div class="ov-row-tile-val" style="color:${tab.color}">${fmt(data.periodIncome)}</div></div>
      </div>
    `;
    list.appendChild(row);
  });
  pg.appendChild(list);
  setTimeout(()=>{
    tabStats.forEach(({tab,data})=>{
      const pct=Math.min((data.dph/target)*100,100);
      const bar=document.getElementById('pbar-'+tab.id);
      if(bar)requestAnimationFrame(()=>bar.style.width=pct+'%');
    });
  },50);
}

function readCheckpoints(){try{const value=JSON.parse(localStorage.getItem(CHECKPOINT_KEY)||'[]');return Array.isArray(value)?value.filter(item=>item?.version===2&&item?.directions):[]}catch{return[]}}
function writeCheckpoints(value){localStorage.setItem(CHECKPOINT_KEY,JSON.stringify(value.sort((a,b)=>a.date.localeCompare(b.date))));try{parent.postMessage({type:'piura:data-changed',source:'effectiveness-checkpoints'},location.origin)}catch(error){}}
function isoToday(){const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function currentCheckpoint(date=isoToday(),reconstructed=false){
  const directions=Object.fromEntries(ALL_TABS.map(tab=>{const value=getTabData(tab,date);return[tab.id,{dph:Math.round(value.dph||0),income:Number(value.avgMonthlyIncome)||0,hours:Number(value.hoursPerMonth)||0}]}));
  return{version:2,date,directions,createdAt:new Date(date+'T12:00:00').getTime(),reconstructed};
}
function saveCheckpoint(force=false){
  if(!incomeData&&!timeData)return;
  const list=readCheckpoints(),snapshot=currentCheckpoint(),index=list.findIndex(item=>item.date===snapshot.date);
  if(index>=0)list[index]=snapshot;else list.push(snapshot);writeCheckpoints(list);
  if(force)renderProgress();
}
function ensureScheduledCheckpoint(){
  if(!incomeData&&!timeData)return;
  restoreHistoricalCheckpoints();
}
function restoreHistoricalCheckpoints(){
  if(!incomeData&&!timeData)return;
  const existing=readCheckpoints(),manual=existing.filter(item=>!item.reconstructed),automatic=[],start=new Date(2026,6,1,12),today=new Date();
  for(let cursor=new Date(start);cursor<=today;cursor.setMonth(cursor.getMonth()+1)){
    for(const day of [1,15]){
      const date=new Date(cursor.getFullYear(),cursor.getMonth(),day,12);if(date>today)continue;
      const iso=[date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(day).padStart(2,'0')].join('-');
      automatic.push(currentCheckpoint(iso,true));
    }
  }
  const byDate=new Map(automatic.map(item=>[item.date,item]));manual.forEach(item=>byDate.set(item.date,item));writeCheckpoints([...byDate.values()]);
}
function checkpointDate(value){return new Date(value+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}
function directionAt(point,id){return point?.directions?.[id]||{dph:0,income:0,hours:0}}
function checkpointPoint(point,id){const value=directionAt(point,id);return `<article class="cp-point"><div class="cp-date">${checkpointDate(point.date)}</div><div class="cp-point-value">${fmt(value.dph)}<span>$/ч</span></div></article>`}
function checkpointRow(tab,index,points){return `<section class="cp-row" style="--cc:${tab.color}"><div class="cp-row-name"><span class="cp-rank">${index+1}</span><span>${tab.name}</span></div><div class="cp-history">${points.map(point=>checkpointPoint(point,tab.id)).join('')}</div></section>`}
function renderProgress(){
  ensureScheduledCheckpoint();const pg=document.getElementById('pg'),list=readCheckpoints(),dates=['2026-07-01','2026-07-15','2026-08-01','2026-08-15'],byDate=new Map(list.map(point=>[point.date,point])),points=dates.map(date=>byDate.get(date)||currentCheckpoint(date,true));
  if(progressChart){progressChart.destroy();progressChart=null}
  let totalIncome=0,totalHours=0;ALL_TABS.forEach(tab=>{const value=getTabData(tab);totalIncome+=value.avgMonthlyIncome;totalHours+=value.hoursPerMonth});const overall=totalHours?Math.round(totalIncome/totalHours):0;
  const rankedTabs=[...ALL_TABS].sort((a,b)=>{const bd=getTabData(b),ad=getTabData(a);return bd.dph-ad.dph||bd.avgMonthlyIncome-ad.avgMonthlyIncome||bd.total-ad.total});
  pg.innerHTML=`<div class="cp-shell"><section class="ov-summary cp-summary"><div class="ov-summary-val">${fmt(overall)}<span style="font-size:.28em;color:var(--mu2);margin-left:.35em">/ час</span></div></section><div class="cp-board">${rankedTabs.map((tab,index)=>checkpointRow(tab,index,points)).join('')}</div></div>`;
}

async function loadIncome(){
  const b=document.getElementById('sync');b.textContent='● СИНХР...';b.className='';
  try{
    const r=await fetch(INCOME_URL);
    const j=await r.json();
    incomeData=j;
    localStorage.setItem(CACHE_KEY+'_income',JSON.stringify({data:j,at:Date.now()}));
    b.textContent='● LIVE';b.className='live';
  }catch(e){
    let cached=null;try{cached=JSON.parse(localStorage.getItem(CACHE_KEY+'_income')||'null')}catch{}
    if(cached?.data){incomeData=cached.data;b.textContent='● КЭШ';b.className=''}
    else{b.textContent='● НЕТ ДАННЫХ';b.className='err'}
    console.warn('Income load fallback:',e);
  }
}
async function loadAll(){await Promise.allSettled([loadIncome(),loadTimeData()]);ensureScheduledCheckpoint();buildTabs();renderPage();}
applySettings();buildTabs();renderPage();
try{const i=JSON.parse(localStorage.getItem(CACHE_KEY+'_income')||'null'),t=JSON.parse(localStorage.getItem(CACHE_KEY+'_time')||'null');if(i)incomeData=i.data;if(t){timeData=t.data;timeDayCount=t.days}if(i||t)renderPage()}catch(e){}
loadAll();setInterval(loadAll,5*60*1000);
window.addEventListener('message',event=>{if(event.origin===location.origin&&event.data?.type==='piura:cloud-data-applied'){SETTINGS=loadSettings();applySettings();renderPage()}});
</script>
