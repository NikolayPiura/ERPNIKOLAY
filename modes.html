<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PIURA · Режимы</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f3f4f6;background:#101216}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{display:grid;place-items:center;min-height:100vh;padding:48px 32px;background:radial-gradient(ellipse at 50% 0,rgba(80,90,112,.14),transparent 60%),#101216}
    main{width:min(900px,100%)}
    .eyebrow{display:flex;align-items:center;gap:10px;color:#a2aab9;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
    .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:#89b39c}
    h1{margin:22px 0 12px;font-size:clamp(36px,5vw,58px);line-height:1.08;letter-spacing:-.05em;font-weight:650}
    .lead{margin:0;color:#9199a8;font-size:15px;line-height:1.6}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:34px}
    .mode{--accent:#e6b56f;position:relative;min-height:225px;padding:28px;border:1px solid #31343b;border-radius:24px;background:#1b1e24;color:inherit;text-align:left;cursor:pointer;transition:border-color .2s,transform .2s,background .2s}
    .mode[data-mode="climate"]{--accent:#8bb9bb}
    .mode:hover{transform:translateY(-3px);border-color:var(--accent);background:#21242c}
    .mode:focus-visible{outline:2px solid var(--accent);outline-offset:5px}
    .mode:disabled{opacity:.55;cursor:wait;transform:none}
    .icon{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;color:var(--accent);background:#282b31}
    .icon svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
    .arrow{position:absolute;right:28px;top:30px;color:#646d7d;font-size:22px}
    .mode strong{display:block;margin-top:25px;font-size:29px;font-weight:600;letter-spacing:-.035em}
    .mode small{display:block;margin-top:9px;color:#969eac;font-size:12px;line-height:1.65}
    footer{margin:22px 2px 0;color:#858d9b;font-size:11px;line-height:1.6}
    #status{min-height:20px;overflow-wrap:anywhere}
    #status.busy{color:#e6b56f}
    #status.ok{color:#91c0a7}
    #status.error{color:#efa39b}
    .hint{margin-top:8px;color:#5f6878}
    @media(prefers-reduced-motion:reduce){.mode{transition:none}}
    @media(max-width:560px){body{padding:42px 20px}.grid{grid-template-columns:1fr;gap:14px;margin-top:26px}.mode{min-height:190px;padding:24px}.mode strong{margin-top:20px}h1{font-size:38px}}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">PIURA · персональная среда</div>
    <h1>В своём режиме.</h1>
    <p class="lead">Два пространства. Три экрана. Один выбор.</p>
    <section class="grid" aria-label="Режимы работы">
      <button type="button" class="mode" data-mode="morning">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 17h18M6 17a6 6 0 0 1 12 0M12 3v3M4.2 8.2l2.1 2.1m11.4 0 2.1-2.1M7 21h10"/></svg></span>
        <span class="arrow" aria-hidden="true">↗</span>
        <strong>Утро</strong>
        <small>Админ Шкала · светлая ERP «Утро»<br>Музыка · утренние обои · без уведомлений</small>
      </button>
      <button type="button" class="mode" data-mode="climate">
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M12 17v4m-4 0h8M9 4v13"/></svg></span>
        <span class="arrow" aria-hidden="true">↗</span>
        <strong>Климат</strong>
        <small>Рабочая таблица · тёмная ERP «Главная»<br>ChatGPT · два Telegram · музыка в фоне</small>
      </button>
    </section>
    <footer>
      <div id="status" role="status" aria-live="polite">Выберите режим</div>
      <div class="hint" id="hint">macOS остаётся тёмной в обоих режимах.</div>
    </footer>
  </main>
  <script>
    const status=document.getElementById('status');
    const buttons=[...document.querySelectorAll('[data-mode]')];
    const labels={morning:'Утро',climate:'Климат'};
    const setStatus=(text,kind='')=>{status.textContent=text;status.className=kind};
    const setBusy=busy=>buttons.forEach(button=>{button.disabled=busy});
    function sendMode(mode,preview=false){
      if(!Object.hasOwn(labels,mode))return;
      const bridge=window.webkit?.messageHandlers?.piura;
      window.piuraModeStarted(mode,preview);
      if(bridge){bridge.postMessage({mode,preview});return}
      window.location.href=`piura-modes://${mode}${preview?'?preview=1':''}`;
      setStatus('Команда передана PIURA Modes. Если браузер спросит — разрешите открытие приложения.','busy');
      setTimeout(()=>{
        setBusy(false);
        setStatus('Для запуска без вопроса Safari открывайте панель в приложении PIURA Modes.');
      },8000);
    }
    window.piuraModeStarted=(mode='morning',preview=false)=>{
      setBusy(true);
      setStatus(preview?`Проверяю расположение «${labels[mode]}»…`:`Запускаю режим «${labels[mode]}»…`,'busy');
    };
    window.piuraModeNeedsAccess=()=>setStatus('Разрешите PIURA Modes управление компьютером в настройках macOS и вернитесь сюда.','busy');
    window.piuraModeFinished=(result={})=>{
      setBusy(false);
      setStatus(result.message||'Готово',result.ok===false?'error':'ok');
    };
    buttons.forEach(button=>button.addEventListener('click',()=>sendMode(button.dataset.mode)));
  </script>
</body>
</html>
