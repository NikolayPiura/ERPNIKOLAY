<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PIURA · Режимы</title>
  <style>
    :root{
      color-scheme:light;
      --ink:#172033;
      --muted:#718096;
      --line:rgba(39,55,81,.11);
      --blue:#4e7ef2;
      --green:#50b890;
      --violet:#8b72dc;
      --amber:#e2a04b;
      --rose:#d8798c;
      --cyan:#4aa9bd;
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{
      display:grid;
      place-items:center;
      padding:clamp(26px,4vw,64px);
      color:var(--ink);
      background:
        radial-gradient(circle at 10% 8%,rgba(255,210,145,.42),transparent 28%),
        radial-gradient(circle at 90% 14%,rgba(141,193,255,.4),transparent 30%),
        linear-gradient(145deg,#fbfaf6,#edf4fb 72%,#f9fbfd);
    }
    main{width:min(1160px,100%)}
    .eyebrow{display:flex;align-items:center;gap:10px;color:#58708e;font-size:11px;font-weight:800;letter-spacing:.17em;text-transform:uppercase}
    .eyebrow i{width:8px;height:8px;border-radius:50%;background:#5abf91;box-shadow:0 0 0 6px rgba(90,191,145,.12)}
    h1{max-width:760px;margin:20px 0 12px;font-size:clamp(46px,7vw,86px);line-height:.94;letter-spacing:-.06em}
    .lead{max-width:660px;margin:0;color:#617087;font-size:clamp(15px,1.8vw,19px);line-height:1.6}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:44px}
    .mode{
      --accent:var(--blue);
      position:relative;
      min-height:210px;
      padding:24px;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:26px;
      background:rgba(255,255,255,.72);
      color:var(--ink);
      box-shadow:0 22px 55px rgba(50,67,91,.08),inset 0 1px 0 rgba(255,255,255,.92);
      text-align:left;
      cursor:pointer;
      transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
    }
    .mode::after{content:"";position:absolute;right:-36px;bottom:-54px;width:150px;height:150px;border-radius:50%;background:color-mix(in srgb,var(--accent) 17%,transparent);filter:blur(2px)}
    .mode:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--accent) 35%,var(--line));box-shadow:0 28px 68px rgba(50,67,91,.14)}
    .mode:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 40%,white);outline-offset:4px}
    .mode[disabled]{cursor:default;opacity:.66}.mode[disabled]:hover{transform:none;box-shadow:0 22px 55px rgba(50,67,91,.08)}
    .icon{position:relative;z-index:1;width:52px;height:52px;display:grid;place-items:center;border-radius:17px;background:color-mix(in srgb,var(--accent) 12%,white);color:var(--accent)}
    .icon svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .mode strong{position:relative;z-index:1;display:block;margin-top:28px;font-size:24px;letter-spacing:-.035em}
    .mode small{position:relative;z-index:1;display:block;margin-top:8px;color:var(--muted);font-size:12px;line-height:1.45}
    .mode em{position:absolute;z-index:1;top:25px;right:24px;padding:7px 9px;border-radius:999px;background:color-mix(in srgb,var(--accent) 10%,white);color:var(--accent);font-size:9px;font-style:normal;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .mode[data-mode="morning"]{--accent:var(--amber)}
    .mode[data-mode="climate"]{--accent:var(--cyan)}
    .mode[data-mode="learning"]{--accent:var(--blue)}
    .mode[data-mode="investments"]{--accent:var(--green)}
    .mode[data-mode="funds"]{--accent:var(--violet)}
    .mode[data-mode="mentorship"]{--accent:var(--rose)}
    footer{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:24px;padding:18px 4px 0;color:#738198;font-size:11px}
    #status{display:flex;align-items:center;gap:9px;min-height:30px}
    #status::before{content:"";width:7px;height:7px;border-radius:50%;background:#9ba8ba}
    #status.busy::before{background:#e4a24f;animation:pulse 1s infinite alternate}
    #status.ok::before{background:#4db484}
    #status.error::before{background:#d86a72}
    .preview{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.58);color:#52657e;font:700 10px inherit;letter-spacing:.04em;cursor:pointer}
    .preview:hover{border-color:rgba(78,126,242,.28);color:#2f5bb8}
    @keyframes pulse{to{transform:scale(1.55);opacity:.55}}
    @media(max-width:860px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:560px){body{padding:24px 16px}.grid{grid-template-columns:1fr;margin-top:32px}.mode{min-height:180px}footer{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow"><i></i>PIURA · персональная среда</div>
    <h1>Выберите режим</h1>
    <p class="lead">Один выбор перестраивает рабочее пространство, экраны и нужные сервисы под конкретную задачу.</p>

    <section class="grid" aria-label="Режимы работы">
      <button class="mode" data-mode="morning">
        <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
        <em>готов</em><strong>Утро</strong><small>Админ Шкала · ERP Утро · Яндекс Музыка</small>
      </button>
      <button class="mode" data-mode="climate" disabled>
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M7 18a4 4 0 1 1 2-7.5A5 5 0 0 1 19 12a3 3 0 0 1-1 5.8"/><path d="M9 20h8"/></svg></span>
        <em>следующий</em><strong>Климат</strong><small>Свет, воздух и рабочая атмосфера</small>
      </button>
      <button class="mode" data-mode="learning" disabled>
        <span class="icon"><svg viewBox="0 0 24 24"><path d="m3 9 9-5 9 5-9 5-9-5Z"/><path d="M7 12v5c3 2 7 2 10 0v-5"/></svg></span>
        <em>следующий</em><strong>Обучение</strong><small>Курсы, материалы и спокойный фокус</small>
      </button>
      <button class="mode" data-mode="investments" disabled>
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/></svg></span>
        <em>следующий</em><strong>Инвестиции</strong><small>Портфели, рынки и аналитика</small>
      </button>
      <button class="mode" data-mode="funds" disabled>
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 12 9 5 9-5m-18 4 9 5 9-5"/></svg></span>
        <em>следующий</em><strong>Фонды</strong><small>Управление фондами и капиталом</small>
      </button>
      <button class="mode" data-mode="mentorship" disabled>
        <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20c.6-4 2.9-6 7-6s6.4 2 7 6"/><path d="M18 4h3m-1.5-1.5v3"/></svg></span>
        <em>следующий</em><strong>Наставничество</strong><small>Сессии, план и материалы ментора</small>
      </button>
    </section>

    <footer>
      <div id="status" role="status" aria-live="polite">Режим «Утро» готов к запуску</div>
      <button class="preview" id="preview">Проверить расположение экранов</button>
    </footer>
  </main>
  <script>
    const status=document.getElementById('status');
    const morning=document.querySelector('[data-mode="morning"]');
    const setStatus=(text,kind='')=>{status.textContent=text;status.className=kind};
    function sendMorning(preview=false){
      setStatus(preview?'Расставляю три окна для проверки…':'Запускаю режим «Утро»…','busy');
      const bridge=window.webkit?.messageHandlers?.piura;
      if(bridge){bridge.postMessage({mode:'morning',preview});return}
      window.location.href=`piura-modes://morning${preview?'?preview=1':''}`;
      setTimeout(()=>setStatus('Передаю команду приложению PIURA Modes…','busy'),250);
    }
    morning.addEventListener('click',()=>sendMorning(false));
    document.getElementById('preview').addEventListener('click',()=>sendMorning(true));
    window.piuraModeStarted=(preview=false)=>setStatus(preview?'Расставляю три окна для проверки…':'Запускаю режим «Утро»…','busy');
    window.piuraModeFinished=(result={})=>setStatus(result.message||'Готово',result.ok===false?'error':'ok');
  </script>
</body>
</html>
