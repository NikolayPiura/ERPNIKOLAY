<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PIURA ERP — оригинальные модули</title>
  <style>
    :root{
      --shell:#070a10;--surface:rgba(11,16,25,.97);--line:rgba(255,255,255,.09);
      --line-strong:rgba(255,255,255,.17);--text:#f4f7fb;--muted:#8190a6;
      --faint:#4f5d71;--lime:#c8ff62;--blue:#8fa8ff
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--shell)}
    body{color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button{font:inherit}
    .shell{
      width:100vw;height:100vh;display:grid;grid-template-columns:284px minmax(0,1fr);
      overflow:hidden;background:var(--shell);transition:grid-template-columns .22s ease
    }
    .shell.compact{grid-template-columns:86px minmax(0,1fr)}
    .nav-column{position:relative;z-index:2;min-width:0;height:100vh;background:var(--shell)}
    .sidebar{
      width:calc(100% - 20px);height:calc(100vh - 20px);margin:10px;
      display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line-strong);
      border-radius:22px;background:linear-gradient(180deg,rgba(143,168,255,.07),transparent 22%),var(--surface);
      box-shadow:0 24px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)
    }
    .stage{position:relative;z-index:1;min-width:0;width:100%;height:100vh;overflow:hidden;background:#080b11}
    .module-frame{display:block;width:100%;height:100%;border:0;background:#080b11}
    .brand-row{min-height:82px;padding:15px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
    .brand-mark{
      width:46px;height:46px;flex:0 0 46px;display:grid;place-items:center;border:1px solid rgba(200,255,98,.36);
      border-radius:13px;background:radial-gradient(circle at 30% 20%,rgba(200,255,98,.28),transparent 42%),#111922;
      color:#d9ff92;font:800 21px/1 ui-monospace,monospace;box-shadow:0 0 28px rgba(200,255,98,.08)
    }
    .brand-copy{min-width:0;display:flex;flex:1;flex-direction:column;gap:4px}
    .brand-copy strong{font-size:18px;line-height:1;letter-spacing:.14em}
    .brand-copy span{color:var(--muted);font:650 8px/1 ui-monospace,monospace;letter-spacing:.23em}
    .collapse{width:31px;height:31px;flex:0 0 31px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.02);color:var(--muted);cursor:pointer}
    .collapse:hover{border-color:var(--line-strong);color:var(--text)}
    .menu-scroll{flex:1;min-height:0;padding:10px 10px 18px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.13) transparent}
    .menu-group{padding-top:14px}
    .group-heading{height:28px;padding:0 10px;display:flex;align-items:center;gap:8px;color:var(--muted);font:680 9px/1 ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase}
    .group-heading i{width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:var(--accent);box-shadow:0 0 13px var(--accent)}
    .group-heading span{flex:1}.group-heading b{color:var(--faint);font-weight:600}
    .menu-items{display:flex;flex-direction:column;gap:3px}
    .menu-item{position:relative;width:100%;min-height:57px;padding:8px 9px;display:flex;align-items:center;gap:11px;border:1px solid transparent;border-radius:13px;background:transparent;color:var(--muted);text-align:left;cursor:pointer;transition:.15s ease}
    .menu-item:hover{border-color:var(--line);background:rgba(255,255,255,.025);color:var(--text)}
    .menu-item.active{border-color:color-mix(in srgb,var(--accent) 25%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 13%,transparent),transparent),rgba(255,255,255,.025);color:var(--text)}
    .menu-item.active:before{content:"";position:absolute;top:12px;bottom:12px;left:-1px;width:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
    .item-code{width:35px;height:35px;flex:0 0 35px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025);color:var(--faint);font:700 9px/1 ui-monospace,monospace}
    .menu-item.active .item-code{border-color:color-mix(in srgb,var(--accent) 34%,transparent);color:var(--accent)}
    .item-copy{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
    .item-copy strong{overflow:hidden;color:inherit;font-size:12px;line-height:1.1;text-overflow:ellipsis;white-space:nowrap}
    .item-copy small{overflow:hidden;color:var(--faint);font:500 8px/1 ui-monospace,monospace;text-overflow:ellipsis;white-space:nowrap}
    .item-arrow{color:var(--faint);font-size:12px}
    .sidebar-footer{min-height:62px;padding:0 17px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line)}
    .live{display:flex;align-items:center;gap:8px;color:var(--muted);font:600 9px/1 ui-monospace,monospace;white-space:nowrap}
    .live i{width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px rgba(200,255,98,.72)}
    .version{color:var(--faint);font:600 8px/1 ui-monospace,monospace;white-space:nowrap}
    .compact .brand-row{justify-content:center;padding-inline:9px;flex-wrap:wrap;align-content:center;gap:5px}
    .compact .brand-copy,.compact .group-heading span,.compact .group-heading b,.compact .item-copy,.compact .item-arrow,.compact .live span,.compact .version{display:none}
    .compact .brand-row{min-height:96px}.compact .collapse{width:46px;height:25px;flex-basis:46px}.compact .collapse span{display:inline-block;transform:rotate(180deg)}
    .compact .group-heading{justify-content:center;padding:0}.compact .menu-item{justify-content:center;padding-inline:4px}.compact .sidebar-footer{justify-content:center;padding:0}
    @media(max-width:900px){
      .shell{grid-template-columns:86px minmax(0,1fr)}
      .brand-row{justify-content:center;padding-inline:9px;flex-wrap:wrap;align-content:center;gap:5px;min-height:96px}
      .brand-copy,.group-heading span,.group-heading b,.item-copy,.item-arrow,.live span,.version{display:none!important}
      .collapse{width:46px;height:25px;flex-basis:46px}.collapse span{display:inline-block;transform:rotate(180deg)}
      .group-heading{justify-content:center;padding:0}.menu-item{justify-content:center;padding-inline:4px}.sidebar-footer{justify-content:center;padding:0}
    }
    @media(max-height:760px){.brand-row{min-height:68px;padding-top:8px;padding-bottom:8px}.menu-item{min-height:49px}.sidebar-footer{min-height:50px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="shell" id="shell">
    <div class="nav-column">
      <aside class="sidebar">
        <div class="brand-row">
          <div class="brand-mark">P</div>
          <div class="brand-copy"><strong>PIURA</strong><span>ERP SYSTEM</span></div>
          <button class="collapse" id="collapse" aria-label="Изменить ширину меню" title="Компактное меню"><span>←</span></button>
        </div>
        <div class="menu-scroll" id="menu"></div>
        <div class="sidebar-footer"><div class="live"><i></i><span>Единая версия</span></div><span class="version">ORIGINAL · 02</span></div>
      </aside>
    </div>
    <section class="stage"><iframe class="module-frame" id="moduleFrame" title="Обзор эффективности"></iframe></section>
  </main>
  <script>
    const groups=[
      {title:"Эффективность",accent:"#c8ff62",items:[
        ["effectiveness","01","Обзор эффективности","Доход, время и направления","modules/EFFECTIVNESS.html"],
        ["morning","02","Утренний запуск","Чек-лист и настрой на день","modules/Morning.html"],
        ["time","03","Учёт времени","Часы, категории и история","modules/Time-tracker.html"],
        ["weekly","04","Недельный результат","Баллы и динамика недели","modules/Dynamics-2.html"],
        ["dynamics","05","8 динамик","Цели, программы и планы","modules/AdminScale.html"],
        ["mydynamics","06","Мои динамики","My Dynamics 2","modules/My-Dynamics.html"]
      ]},
      {title:"Финансы",accent:"#8fa8ff",items:[
        ["finance","07","Доходы и расходы","Личный финансовый обзор","modules/Finance.html"],
        ["funds","08","Структура фондов","Иерархия и капитал","modules/Fonds.html"],
        ["pff","09","Фонд PFF","Piura Family Fund","modules/PFF.html"],
        ["moscow","10","Фонд Москва","Инвестиционный портфель","modules/MSK.html"],
        ["safe","11","SAFE","Резервный портфель","modules/Safe.html"]
      ]}
    ];
    const all=groups.flatMap(group=>group.items);
    const shell=document.getElementById("shell");
    const frame=document.getElementById("moduleFrame");
    const menu=document.getElementById("menu");
    let current=all.find(item=>item[0]===localStorage.getItem("piura-erp-shell-module"))||all[0];
    if(localStorage.getItem("piura-erp-shell-compact")==="1")shell.classList.add("compact");
    function drawMenu(){
      menu.innerHTML=groups.map(group=>`<section class="menu-group" style="--accent:${group.accent}"><div class="group-heading"><i></i><span>${group.title}</span><b>${String(group.items.length).padStart(2,"0")}</b></div><div class="menu-items">${group.items.map(item=>`<button class="menu-item ${item[0]===current[0]?"active":""}" data-id="${item[0]}" title="${item[2]}"><span class="item-code">${item[1]}</span><span class="item-copy"><strong>${item[2]}</strong><small>${item[3]}</small></span><span class="item-arrow">›</span></button>`).join("")}</div></section>`).join("");
      menu.querySelectorAll("[data-id]").forEach(button=>button.addEventListener("click",()=>selectModule(button.dataset.id)));
    }
    function selectModule(id){
      current=all.find(item=>item[0]===id)||all[0];
      frame.src=current[4];frame.title=current[2];
      localStorage.setItem("piura-erp-shell-module",current[0]);drawMenu();
    }
    document.getElementById("collapse").addEventListener("click",()=>{
      shell.classList.toggle("compact");
      localStorage.setItem("piura-erp-shell-compact",shell.classList.contains("compact")?"1":"0");
    });
    drawMenu();selectModule(current[0]);
  </script>
</body>
</html>
