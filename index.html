
<!doctype html>

  <style>

    .shell.compact:not(.hover-open){grid-template-columns:var(--nav-collapsed) minmax(0,1fr)}.shell.compact.hover-open{grid-template-columns:var(--nav-width) minmax(0,1fr)}

    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function navButton(id,label,sub,icon){return `<button class="control-nav-btn ${controlPage===id?'active':''}" data-control-page="${id}"><svg viewBox="0 0 24 24">${icon}</svg><span><strong>${label}</strong><small>${sub}</small></span></button>`}
    function buildControlNav(){controlNav.innerHTML=navButton('home','Все настройки','Центр управления','<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/>')+navButton('general','Общие настройки','Темы, размеры, меню','<path d="M12 2v3m0 14v3M4.9 4.9 7 7m10 10 2.1 2.1M2 12h3m14 0h3M4.9 19.1 7 17m10-10 2.1-2.1"/><circle cx="12" cy="12" r="4"/>')+navButton('data','Данные и копии','Google Drive и восстановление','<path d="M4 6h16v12H4zM8 10h8m-8 4h5"/>')+`<div class="control-nav-title" style="margin-top:22px">Сервисы</div>`+all().map(i=>navButton('service:'+i[0],i[1],i[2],ICONS[i[0]])).join('')}
    function renderHome(){controlMain.innerHTML=`<div class="control-hero"><small>CONTROL CENTER · 05</small><h3>Настройки всей ERP</h3><p>Один центр управления для общей темы, размеров, сохранности данных и каждого сервиса. Настройки открываются здесь — без перехода внутрь сервисов.</p></div><div class="settings-home-grid">${[['general','Общие настройки','Две полные темы, палитры, неон, размеры и боковая панель','<path d="M12 2v3m0 14v3M2 12h3m14 0h3"/>'],['data','Данные и копии','Google Drive, экспорт и локальные снимки','<path d="M4 6h16v12H4zM8 10h8"/>'],...all().map(i=>['service:'+i[0],i[1],i[2],ICONS[i[0]]])].map(x=>`<button class="settings-home-card" data-control-page="${x[0]}"><span class="settings-home-icon"><svg viewBox="0 0 24 24">${x[3]}</svg></span><span><strong>${x[1]}</strong><small>${x[2]}</small></span></button>`).join('')}</div>`}
    function renderGeneral(){const paletteNames={neon:'Неон',ocean:'Океан',sunset:'Закат',forest:'Лес',mono:'Монохром',cosmos:'Космос'};controlMain.innerHTML=`<div class="control-hero"><small>Общие настройки</small><h3>Единый дизайн ERP</h3><p>Тема применяется к боковой панели и всем сервисам одновременно. Все изменения сохраняются автоматически.</p></div><div class="theme-grid"><button class="theme-card ${prefs.theme==='dark'?'active':''}" data-theme-choice="dark"><span class="theme-preview dark"><i></i><b></b></span><strong>Тёмная система</strong><small>Глубокий фон и спокойные панели</small></button><button class="theme-card ${prefs.theme==='light'?'active':''}" data-theme-choice="light"><span class="theme-preview light"><i></i><b></b></span><strong>Светлая система</strong><small>Чистый фон и контрастная типографика</small></button></div><div class="setting-section"><h4>Цветовая тема</h4><div class="palette-grid">${Object.entries(PALETTES).map(([k,v])=>`<button class="palette-card ${prefs.palette===k?'active':''}" data-palette="${k}"><span class="palette-swatches">${v.map(c=>`<i style="--c:${c}"></i>`).join('')}</span><strong>${paletteNames[k]}</strong></button>`).join('')}</div></div><div class="setting-section"><h4>Размеры и пространство</h4><div class="settings-grid">${fields.map(f=>`<div class="field"><label>${f[1]} <output data-out="${f[0]}">${prefs[f[0]]}</output></label><input data-setting="${f[0]}" type="${f[2]}" min="${f[3]}" max="${f[4]}" step="${f[5]}"></div>`).join('')}<label class="field check"><input type="checkbox" data-setting="tooltips"> Подсказки у значков</label><label class="field check"><input type="checkbox" data-setting="showSubtitles"> Подписи сервисов</label></div></div><div class="setting-section"><h4>Названия и видимость сервисов</h4><div class="menu-editor">${renderMenuEditorRows()}</div></div><div class="actions"><button class="action" data-reset-design>Вернуть стандартный дизайн</button></div>`;syncForm()}
    function renderMenuEditorRows(){const eye='<svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';return groups.flatMap(g=>g.items.map(item=>`<div class="edit-row"><svg viewBox="0 0 24 24">${ICONS[item[0]]}</svg><input type="text" value="${esc(item[1])}" data-rename="${item[0]}"><button class="visibility-toggle ${prefs.hidden.includes(item[0])?'':'on'}" data-visible="${item[0]}">${eye}</button></div>`)).join('')}
    function renderData(){const c=readCloud();controlMain.innerHTML=`<div class="control-hero"><small>Сохранность данных</small><h3>Данные и резервные копии</h3><p>Все заполненные записи сервисов остаются на месте. Здесь можно включить облачную копию и восстановление.</p></div><div class="service-setting-grid"><div class="service-setting-card"><label>Адрес Google Apps Script</label><input id="uiCloudUrl" value="${esc(c.url||'')}" placeholder="https://script.google.com/macros/s/.../exec"></div><div class="service-setting-card"><label>Ключ доступа</label><input id="uiCloudToken" type="password" value="${esc(c.token||'')}" placeholder="Хранится только на этом устройстве"></div></div><label class="field check" style="margin-top:14px"><input type="checkbox" id="uiCloudAuto" ${c.auto!==false?'checked':''}> Автоматическая резервная копия в Google Drive</label><div class="cloud-status" id="uiCloudStatus">${esc(document.getElementById('cloudStatus').textContent||'Локальное сохранение включено')}</div><div class="actions"><button class="action primary" data-data-action="sync">Синхронизировать сейчас</button><button class="action" data-data-action="export">Скачать все данные</button><button class="action" data-data-action="restore">Последний локальный снимок</button></div><div class="settings-note">Изменение дизайна не удаляет и не перезаписывает записи модулей. Перед восстановлением система автоматически создаёт локальный снимок.</div>`}
    function serviceDefault(id,key){if(id==='weekly'&&key==='title')return all().find(i=>i[0]==='weekly')?.[1]||'ПС №1';if(key==='currency')return'USD';if(key==='historyDays')return'20';if(key==='weeks')return'12';if(key==='chartHeight')return id==='time'?360:380;if(key==='dateSize')return42;if(key==='font')return17;if(key==='noteHeight')return220;if(key==='tableScale')return100;if(key==='chartSize')return340;if(key==='annualTarget')return360000;return''}
    function renderService(id){const item=all().find(i=>i[0]===id),fs=SERVICE_FIELDS[id]||[['Размер текста','font','range',13,22],['Плотность','density','select',['Свободно','Компактно']]];controlMain.innerHTML=`<div class="control-hero"><small>Настройки сервиса</small><h3>${esc(item?.[1]||id)}</h3><p>${esc(item?.[2]||'Параметры сервиса')}. Настройки сохраняются отдельно и не меняют заполненные данные.</p></div><div class="service-setting-grid">${fs.map(f=>{const v=servicePrefs[id]?.[f[1]]??serviceDefault(id,f[1]);if(f[2]==='select')return`<div class="service-setting-card"><label>${f[0]}</label><select data-service-setting="${f[1]}">${f[3].map(o=>`<option ${String(o)===String(v)?'selected':''}>${o}</option>`).join('')}</select></div>`;return`<div class="service-setting-card"><label>${f[0]}</label><input data-service-setting="${f[1]}" type="${f[2]}" value="${esc(v)}" ${f[2]==='range'?`min="${f[3]}" max="${f[4]}"`:''}></div>`}).join('')}</div><div class="settings-note">Визуальный слой этого сервиса уже связан с общей светлой/тёмной темой. Бизнес-логика и ваши записи не затрагиваются.</div>`}
    function renderControlPage(id='home'){controlPage=id;buildControlNav();if(id==='home')renderHome();else if(id==='general')renderGeneral();else if(id==='data')renderData();else if(id.startsWith('service:'))renderService(id.slice(8))}
    function openSettingsHub(){syncForm();refreshProfiles();renderControlPage('home');modal.classList.add('open')}
    document.getElementById('closeSettings').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
    modal.addEventListener('click',e=>{const page=e.target.closest('[data-control-page]')?.dataset.controlPage;if(page){renderControlPage(page);return}const theme=e.target.closest('[data-theme-choice]')?.dataset.themeChoice;if(theme){prefs.theme=theme;applyPrefs();renderGeneral();return}const pal=e.target.closest('[data-palette]')?.dataset.palette;if(pal){prefs.palette=pal;applyPrefs();renderGeneral();return}const visible=e.target.closest('[data-visible]')?.dataset.visible;if(visible){prefs.hidden=prefs.hidden.includes(visible)?prefs.hidden.filter(x=>x!==visible):[...prefs.hidden,visible];applyPrefs();renderGeneral();return}if(e.target.closest('[data-reset-design]')){const keep={hidden:prefs.hidden,collapsed:prefs.collapsed};prefs=Object.assign({},clone(DEFAULTS),keep);applyPrefs();renderGeneral();return}const act=e.target.closest('[data-data-action]')?.dataset.dataAction;if(act==='sync')document.getElementById('cloudSyncNow').click();if(act==='export')document.getElementById('exportAllData').click();if(act==='restore')document.getElementById('restoreLocal').click()});
    modal.addEventListener('input',e=>{if(e.target.matches('[data-setting]')){const k=e.target.dataset.setting;prefs[k]=e.target.type==='checkbox'?e.target.checked:(e.target.type==='range'?Number(e.target.value):e.target.value);applyPrefs();const out=controlMain.querySelector(`[data-out="${k}"]`);if(out)out.textContent=prefs[k]}if(e.target.matches('[data-service-setting]')){const id=controlPage.slice(8);servicePrefs[id]??={};servicePrefs[id][e.target.dataset.serviceSetting]=e.target.type==='range'||e.target.type==='number'?Number(e.target.value):e.target.value;localStorage.setItem(SERVICE_PREFS_KEY,JSON.stringify(servicePrefs));if(id==='weekly'&&e.target.dataset.serviceSetting==='title'&&e.target.value.trim()){const item=all().find(i=>i[0]==='weekly');item[1]=e.target.value.trim();save();drawMenu()}applyEmbeddedMode()}if(e.target.id==='uiCloudUrl'){document.getElementById('cloudUrl').value=e.target.value;document.getElementById('cloudUrl').dispatchEvent(new Event('input'))}if(e.target.id==='uiCloudToken'){document.getElementById('cloudToken').value=e.target.value;document.getElementById('cloudToken').dispatchEvent(new Event('input'))}});
    modal.addEventListener('change',e=>{if(e.target.matches('[data-rename]')){const item=all().find(i=>i[0]===e.target.dataset.rename);if(item&&e.target.value.trim()){item[1]=e.target.value.trim();save();drawMenu()}}if(e.target.id==='uiCloudAuto'){document.getElementById('cloudAuto').checked=e.target.checked;document.getElementById('cloudAuto').dispatchEvent(new Event('change'))}});
    function unifiedThemeCss(){const p=palette(),light=prefs.theme==='light',bg=light?'#f4f6fa':'#080b11',surface=light?'#ffffff':'#111722',surface2=light?'#f8fafc':'#0e141e',text=light?'#142033':'#f3f6fb',muted=light?'#65748a':'#8492a6',line=light?'rgba(24,36,54,.12)':'rgba(255,255,255,.09)',glow=(Number(prefs.neon)||0)/100;return`:root{--erp-bg:${bg};--erp-surface:${surface};--erp-surface-2:${surface2};--erp-text:${text};--erp-muted:${muted};--erp-line:${line};--erp-a:${p[0]};--erp-b:${p[1]};--erp-c:${p[2]};--bg:${bg};--panel:${surface};--card:${surface};--border:${line};--text:${text};--muted:${muted}}html,body{background:${bg}!important;color:${text}!important;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important}body{zoom:${prefs.moduleScale||1}}.logo,.hero-name,.level-name,.section-overview-head h2{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important}header,.topbar,.top-bar,.top,.header,.hero,.hero-topbar,.summary,.ov-summary,.tabs,.panel,.card,.block,.section,.metric,.history,.history-block,.tasks-block,.fund-card,.income-card,.chart-card,.chart-box,.hist-box,.hist-card,.table-wrap,.table-card,.modal-content,.section-dyn-card,.panel-hero,.entry-card,.level-block,.section-overview-head,.free-content{border-color:${line}!important;background-color:${surface}!important;color:${text}!important;box-shadow:0 18px 48px rgba(0,0,0,${light?'.06':'.18'}),0 0 ${Math.round(36*glow)}px color-mix(in srgb,${p[0]} ${Math.round(24*glow)}%,transparent)!important}.ov-row,.ov-row-tile,.ti-box,.entry-grid,.task-row,.item,.item-row,tr,.row,.list-item{border-color:${line}!important;background-color:${surface2}!important;color:${text}!important}${light?'header,.topbar,.top-bar,.top,.header,.hero,.hero-topbar,.summary,.ov-summary,.tabs,.panel,.card,.block,.section,.metric,.history,.history-block,.tasks-block,.fund-card,.income-card,.chart-card,.chart-box,.hist-box,.hist-card,.table-wrap,.table-card,.modal-content,.section-dyn-card,.panel-hero,.entry-card,.level-block,.section-overview-head,.free-content,.ov-row,.ov-row-tile,.ti-box,.entry-grid,.task-row,.item,.item-row,tr,.row,.list-item{background-image:none!important}.item *,.task-row *,.block-head *,.block-items *,.entry-card *,.level-block *{color:${text}!important}':''}h1,h2,h3,h4,h5,strong,.title,.block-name,.item-text,.task-name,th,td{color:${text}!important}p,small,label,.sub,.subtitle,.muted,.meta,.block-count,.ov-summary-sub,.ti-lbl{color:${muted}!important}button,input,select,textarea{border-color:${line}!important}input,select,textarea{background:${surface2}!important;color:${text}!important}.active,.selected,[aria-selected="true"],.sel{border-color:${p[0]}!important}canvas,svg{max-width:100%}${light?`.tabs button,.nav-btn{background:${surface}!important;color:${muted}!important}.tabs button.active,.nav-btn.active{color:${text}!important}.hero,.hero-topbar{background:${surface}!important}`:''}${EMBED_HIDE[current[0]]?EMBED_HIDE[current[0]]+'{display:none!important}':''}`}
    function applyEmbeddedMode(){try{const doc=frame.contentDocument;if(!doc)return;doc.documentElement.dataset.erpTheme=prefs.theme;doc.body?.classList.add('erp-embedded');let style=doc.getElementById('piura-unified-theme-style');if(!style){style=doc.createElement('style');style.id='piura-unified-theme-style';doc.head.appendChild(style)}style.textContent=unifiedThemeCss();if(current[0]==='weekly'){const title=servicePrefs.weekly?.title||all().find(i=>i[0]==='weekly')?.[1]||'ПС №1',el=doc.getElementById('serviceTitle');if(el)el.textContent=title.toUpperCase()}doc.documentElement.style.setProperty('--erp-shell-accent',palette()[0])}catch(e){}}
    frame.addEventListener('load',applyEmbeddedMode);
    function getProfiles(){try{return JSON.parse(localStorage.getItem(PROFILES)||'{}')}catch(e){return{}}}function refreshProfiles(){const p=getProfiles(),s=document.getElementById('profiles');s.innerHTML=Object.keys(p).map(n=>`<option>${n}</option>`).join('')||'<option>Нет профилей</option>'}
    document.getElementById('saveProfile').onclick=()=>{const n=prompt('Название профиля:','Мой профиль');if(!n)return;const p=getProfiles();p[n]={prefs,groups};localStorage.setItem(PROFILES,JSON.stringify(p));refreshProfiles()};document.getElementById('loadProfile').onclick=()=>{const p=getProfiles()[document.getElementById('profiles').value];if(p){prefs=Object.assign({},DEFAULTS,p.prefs);groups=p.groups;applyPrefs();syncForm()}};
    document.getElementById('resetSettings').onclick=()=>{if(confirm('Вернуть исходные настройки и порядок?')){prefs=clone(DEFAULTS);groups=clone(DEFAULT_GROUPS);applyPrefs();syncForm()}};
    document.getElementById('exportSettings').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({prefs,groups},null,2)],{type:'application/json'}));a.download='piura-erp-menu.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('importSettings').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);prefs=Object.assign({},DEFAULTS,d.prefs);groups=d.groups||clone(DEFAULT_GROUPS);applyPrefs();syncForm()}catch(x){alert('Некорректный файл')}};r.readAsText(f)};

    /* Полная сохранность данных всех модулей: локальные снимки + Google Drive через Apps Script. */
    const CLOUD_KEY='piura_erp_cloud_v1',LOCAL_BACKUPS='piura_erp_local_backups_v1';let dataFingerprint='',cloudTimer=null,cloudBusy=false;
    function readCloud(){try{return{auto:true,url:'',token:'',lastLocalChangeAt:0,lastRemoteAt:0,...JSON.parse(localStorage.getItem(CLOUD_KEY)||'{}')}}catch(e){return{auto:true,url:'',token:'',lastLocalChangeAt:0,lastRemoteAt:0}}}
    function writeCloud(value){localStorage.setItem(CLOUD_KEY,JSON.stringify(value));syncCloudForm()}
    function snapshotData(includeLiveCaches=true){const data={};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(!key||key===CLOUD_KEY||key===LOCAL_BACKUPS)continue;if(!includeLiveCaches&&key.startsWith('piura_cache_'))continue;data[key]=localStorage.getItem(key)}return data}
    function applySnapshot(data,overwrite=true){Object.entries(data||{}).forEach(([key,value])=>{if(key===CLOUD_KEY||key===LOCAL_BACKUPS)return;if(overwrite||localStorage.getItem(key)==null)localStorage.setItem(key,String(value))})}
    function setCloudStatus(text,kind=''){const el=document.getElementById('cloudStatus');el.textContent=text;el.className='cloud-status '+kind}
    function syncCloudForm(){const c=readCloud(),url=document.getElementById('cloudUrl'),token=document.getElementById('cloudToken'),auto=document.getElementById('cloudAuto');if(document.activeElement!==url)url.value=c.url||'';if(document.activeElement!==token)token.value=c.token||'';auto.checked=c.auto!==false}
    function downloadJson(data,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0)}
    function takeLocalBackup(){const list=read(LOCAL_BACKUPS,[]),data=snapshotData(false),raw=JSON.stringify(data);if(list[0]&&JSON.stringify(list[0].data)===raw)return true;list.unshift({at:new Date().toISOString(),data});for(const count of [3,2,1]){try{localStorage.setItem(LOCAL_BACKUPS,JSON.stringify(list.slice(0,count)));return true}catch(error){if(error?.name!=='QuotaExceededError')throw error}}setCloudStatus('Данные сохраняются в сервисах · для локального снимка не хватает места','error');return false}
    async function cloudLoad(force=false){const c=readCloud();if(!c.url)return null;const u=new URL(c.url);u.searchParams.set('action','backupLoad');u.searchParams.set('t',Date.now());if(c.token)u.searchParams.set('token',c.token);const response=await fetch(u,{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const result=await response.json();if(!result.ok)throw new Error(result.error||'Ошибка Google Drive');if(result.backup){const remoteAt=Date.parse(result.backup.updatedAt||0)||0,overwrite=force||remoteAt>Number(c.lastLocalChangeAt||0);applySnapshot(result.backup.data,overwrite);c.lastRemoteAt=remoteAt;writeCloud(c);if(overwrite){dataFingerprint=JSON.stringify(snapshotData());frame.contentWindow?.location.reload()}}return result.backup}
    async function cloudPush(force=false){const c=readCloud();if(!c.url||(!force&&c.auto===false)||cloudBusy)return;cloudBusy=true;setCloudStatus('Сохраняем резервную копию в Google Drive…');try{const body=new URLSearchParams({action:'backupSave',data:JSON.stringify({data:snapshotData()}),token:c.token||''}),response=await fetch(c.url,{method:'POST',body});if(!response.ok)throw new Error('HTTP '+response.status);const result=await response.json();if(!result.ok)throw new Error(result.error||'Ошибка Google Drive');c.lastRemoteAt=Date.parse(result.at||0)||Date.now();writeCloud(c);setCloudStatus('Google Drive · сохранено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),'ok')}catch(error){setCloudStatus('Google Drive недоступен · локальные снимки продолжают сохраняться','error');console.warn('ERP cloud backup:',error)}finally{cloudBusy=false}}
    function scheduleDataBackup(){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>{const next=JSON.stringify(snapshotData());if(next===dataFingerprint)return;dataFingerprint=next;takeLocalBackup();const c=readCloud();c.lastLocalChangeAt=Date.now();writeCloud(c);cloudPush()},900)}
    async function syncCloudNow(){const c=readCloud();if(!c.url){setCloudStatus('Укажите адрес опубликованного Google Apps Script','error');return}setCloudStatus('Проверяем Google Drive…');try{await cloudLoad(false);await cloudPush(true)}catch(error){setCloudStatus('Не удалось связаться с Google Drive: '+error.message,'error')}}
    function saveCloudForm(){const c=readCloud();c.url=document.getElementById('cloudUrl').value.trim();c.token=document.getElementById('cloudToken').value;writeCloud(c);return c}
    ['cloudUrl','cloudToken'].forEach(id=>{const input=document.getElementById(id);input.addEventListener('input',saveCloudForm);input.addEventListener('change',()=>{const c=saveCloudForm();if(c.url)syncCloudNow()})});
    document.getElementById('cloudAuto').addEventListener('change',e=>{const c=readCloud();c.auto=e.target.checked;writeCloud(c);if(c.auto)syncCloudNow()});
    document.getElementById('cloudSyncNow').onclick=syncCloudNow;
    document.getElementById('exportAllData').onclick=()=>downloadJson({version:1,exportedAt:new Date().toISOString(),data:snapshotData()},'PIURA_ERP_ALL_DATA_'+new Date().toISOString().slice(0,10)+'.json');
    document.getElementById('importAllData').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result),data=parsed.data||parsed.backup?.data;if(!data||typeof data!=='object')throw new Error();if(!confirm('Восстановить все данные ERP из этого файла?'))return;takeLocalBackup();applySnapshot(data,true);location.reload()}catch(x){alert('Это не резервная копия PIURA ERP')}};r.readAsText(f)};
    document.getElementById('restoreLocal').onclick=()=>{const list=read(LOCAL_BACKUPS,[]);if(!list.length){alert('Локальных снимков пока нет');return}if(confirm('Восстановить снимок от '+new Date(list[0].at).toLocaleString('ru-RU')+'?')){applySnapshot(list[0].data,true);location.reload()}};
    window.addEventListener('storage',e=>{if(e.key!==CLOUD_KEY&&e.key!==LOCAL_BACKUPS)scheduleDataBackup()});setInterval(scheduleDataBackup,2500);
    async function initDataSafety(){syncCloudForm();takeLocalBackup();dataFingerprint=JSON.stringify(snapshotData());const c=readCloud();if(c.url&&c.auto!==false){setCloudStatus('Проверяем облачную копию…');try{await cloudLoad(false);await cloudPush()}catch(error){setCloudStatus('Локальное сохранение работает · облако пока недоступно','error')}}else setCloudStatus('Локальное сохранение включено · адрес облака пока не указан')}
    applyPrefs();selectModule(current[0]);initDataSafety();
  </script>
