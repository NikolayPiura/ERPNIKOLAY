
<!doctype html>

  <title>PIURA ERP</title>
  <style>
    :root{
      --shell:#070a10;--surface:rgba(11,16,25,.97);--line:rgba(255,255,255,.09);
      --line-strong:rgba(255,255,255,.17);--text:#f4f7fb;--muted:#8190a6;
      --faint:#4f5d71;--lime:#5b9dff;--blue:#8fa8ff;
      --nav-width:284px;--nav-collapsed:104px;--item-height:57px;--item-gap:18px;
      --nav-font:12px;--nav-radius:22px;--nav-scale:1;--nav-opacity:.97;--nav-blur:18px;
      --nav-bg:#0b1019;--nav-accent:#5b9dff
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--shell)}
    body{color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button{font:inherit}
    .shell{
      width:100vw;height:100vh;display:grid;grid-template-columns:var(--nav-width) minmax(0,1fr);
      overflow:hidden;background:var(--shell);transition:grid-template-columns .22s ease
    }
    .shell.compact{grid-template-columns:var(--nav-collapsed) minmax(0,1fr)}
    .shell.compact.hover-open{grid-template-columns:var(--nav-width) minmax(0,1fr)}
    .nav-column{position:relative;z-index:2;min-width:0;height:100vh;background:var(--shell)}
    .sidebar{
      width:calc(100% - 20px);height:calc(100vh - 20px);margin:10px;
      display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line-strong);
      border-radius:var(--nav-radius);background:linear-gradient(180deg,rgba(143,168,255,.07),transparent 22%),color-mix(in srgb,var(--nav-bg) calc(var(--nav-opacity)*100%),transparent);
      backdrop-filter:blur(var(--nav-blur));transform:scale(var(--nav-scale));transform-origin:top left;
      width:calc((100% - 20px)/var(--nav-scale));height:calc((100vh - 20px)/var(--nav-scale));
      box-shadow:0 24px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04)
    }
    .stage{position:relative;z-index:1;min-width:0;width:100%;height:100vh;overflow:hidden;background:#080b11}
    .module-frame{display:block;width:100%;height:100%;border:0;background:#080b11}
    .brand-row{min-height:122px;padding:18px 16px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}
    .brand-mark{
      width:56px;height:56px;flex:0 0 56px;display:grid;place-items:center;border:1px solid rgba(91,157,255,.46);
      border-radius:13px;background:radial-gradient(circle at 30% 20%,rgba(91,157,255,.26),transparent 42%),#111922;
      color:#b8d5ff;font:800 25px/1 ui-monospace,monospace;box-shadow:0 0 30px rgba(91,157,255,.14)
    }
    .brand-copy{min-width:0;display:flex;flex:1;flex-direction:column;gap:4px}
    .brand-copy strong{font-size:21px;line-height:1;letter-spacing:.14em}
    .brand-copy span{color:var(--muted);font:700 10px/1 ui-monospace,monospace;letter-spacing:.2em}
    .brand-actions{display:grid;gap:12px;justify-items:center}.collapse,.settings{width:36px;height:36px;flex:0 0 36px;border:1px solid rgba(91,157,255,.3);border-radius:11px;background:linear-gradient(145deg,rgba(91,157,255,.13),rgba(143,168,255,.05));color:#b8d5ff;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 18px rgba(91,157,255,.08);transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease,color .16s ease}
    .quick-theme{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line-strong);border-radius:11px;background:rgba(255,255,255,.025);color:var(--muted);cursor:pointer;font-size:15px;line-height:1;transition:.16s ease}.quick-theme:hover{transform:translateY(-1px);border-color:rgba(91,157,255,.62);color:var(--text);background:rgba(91,157,255,.1)}
    .collapse{font-size:18px}.settings{font-size:17px}
    .collapse:hover,.settings:hover{transform:translateY(-2px);border-color:rgba(91,157,255,.72);color:#fff;box-shadow:0 0 24px rgba(91,157,255,.2)}
    .menu-scroll{flex:1;min-height:0;padding:16px 10px 24px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.13) transparent}
    .menu-group{padding-top:18px}
    .group-heading{height:38px;padding:0 10px;display:flex;align-items:center;gap:10px;color:#b7c2d1;font:760 13px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}
    .group-heading i{display:none}
    .group-heading span{flex:1}.group-heading b{color:var(--faint);font-weight:600}
    .menu-items{display:flex;flex-direction:column;gap:var(--item-gap);min-height:12px}
    .menu-item{position:relative;width:100%;min-height:var(--item-height);padding:8px 9px;display:flex;align-items:center;gap:11px;border:1px solid transparent;border-radius:13px;background:transparent;color:var(--muted);text-align:left;cursor:pointer;transition:.15s ease}
    @keyframes menuBounce{0%{transform:translateY(0) scale(1)}65%{transform:translateY(-7px) scale(1.045)}100%{transform:translateY(-4px) scale(1.025)}}.menu-item:hover{border-color:color-mix(in srgb,var(--accent) 52%,var(--line));background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 15%,transparent),rgba(255,255,255,.025));color:var(--text);animation:menuBounce .43s cubic-bezier(.2,1.22,.3,1) both;box-shadow:0 18px 38px rgba(0,0,0,.24),0 0 28px color-mix(in srgb,var(--accent) 15%,transparent)}
    .menu-item.active{border-color:color-mix(in srgb,var(--accent) 25%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 13%,transparent),transparent),rgba(255,255,255,.025);color:var(--text)}
    .menu-item.active:before{content:"";position:absolute;top:12px;bottom:12px;left:-1px;width:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
    .item-code{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025);color:var(--faint)}
    .item-code svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.menu-item.active .item-code{border-color:color-mix(in srgb,var(--accent) 34%,transparent);color:var(--accent)}
    .item-copy{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
    .item-copy strong{overflow:hidden;color:inherit;font-size:var(--nav-font);line-height:1.1;text-overflow:ellipsis;white-space:nowrap}
    .item-copy small{display:none!important}
    .item-arrow{width:25px;height:25px;display:grid;place-items:center;border:1px solid rgba(143,168,255,.17);border-radius:8px;background:rgba(143,168,255,.05);color:#8fa8ff;font-size:18px;font-weight:800;line-height:1;transition:.15s}
    .menu-item:hover .item-arrow,.menu-item.active .item-arrow{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);transform:translateX(2px);box-shadow:0 0 15px color-mix(in srgb,var(--accent) 20%,transparent)}
    .sidebar-footer{min-height:58px;padding:9px 15px;display:flex;align-items:center;justify-content:space-between;gap:9px;border-top:1px solid var(--line);background:rgba(255,255,255,.018)}
    .settings-hub-btn{width:100%;min-width:0;min-height:var(--item-height);height:auto;padding:8px 9px;display:flex;align-items:center;gap:11px;border:1px solid rgba(91,157,255,.34);border-radius:13px;background:linear-gradient(135deg,rgba(91,157,255,.16),rgba(143,168,255,.05));color:#d6e7ff;cursor:pointer;font-weight:800;font-size:13px;letter-spacing:.02em;transition:.18s}.settings-hub-btn b{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;border-radius:10px;background:rgba(91,157,255,.17)}.settings-hub-btn b svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.settings-hub-btn:hover{border-color:rgba(91,157,255,.72);animation:menuBounce .43s cubic-bezier(.2,1.22,.3,1) both;box-shadow:0 18px 38px rgba(0,0,0,.24),0 0 28px rgba(91,157,255,.17)}
    .live{display:flex;align-items:center;gap:8px;color:var(--muted);font:600 9px/1 ui-monospace,monospace;white-space:nowrap}
    .live i{width:12px;height:12px;flex:0 0 12px;border-radius:50%;background:var(--lime);box-shadow:0 0 16px rgba(91,157,255,.72)}
    .live.syncing i{background:#f2c45c;box-shadow:0 0 16px rgba(242,196,92,.65)}
    .live.error i{background:#ff7088;box-shadow:0 0 16px rgba(255,112,136,.62)}
    .version{color:var(--faint);font:600 8px/1 ui-monospace,monospace;white-space:nowrap}
    .shell.compact:not(.hover-open){grid-template-columns:var(--nav-collapsed) minmax(0,1fr)}.shell.compact.hover-open{grid-template-columns:var(--nav-width) minmax(0,1fr)}
    .compact:not(.hover-open) .brand-row{justify-content:center;padding-inline:9px;flex-wrap:wrap;align-content:center;gap:5px}
    .compact:not(.hover-open) .brand-copy,.compact:not(.hover-open) .group-heading span,.compact:not(.hover-open) .group-heading b,.compact:not(.hover-open) .item-copy,.compact:not(.hover-open) .item-arrow,.compact:not(.hover-open) .live span,.compact:not(.hover-open) .version,.compact:not(.hover-open) .settings{display:none}
    .compact:not(.hover-open) .brand-row{min-height:156px;padding-block:14px;gap:12px}.compact:not(.hover-open) .brand-actions{gap:10px}.compact:not(.hover-open) .collapse{width:46px;height:27px;flex-basis:46px}.compact:not(.hover-open) .collapse span{display:inline-block;transform:rotate(180deg)}
    .compact:not(.hover-open) .group-heading{justify-content:center;padding:0}.compact:not(.hover-open) .menu-item{justify-content:center;padding-inline:4px}.compact:not(.hover-open) .item-code{width:44px;height:44px;flex-basis:44px}.compact:not(.hover-open) .sidebar-footer{display:flex;justify-content:center;padding:8px}.compact:not(.hover-open) .sidebar-footer>div,.compact:not(.hover-open) .settings-hub-btn span{display:none}.compact:not(.hover-open) .settings-hub-btn{width:100%;min-height:var(--item-height);height:auto;padding:0;justify-content:center}.compact:not(.hover-open) .settings-hub-btn b{width:44px;height:44px}
    .dragging{opacity:.35}.drop-zone{outline:1px dashed var(--accent)}

    html[data-theme="light"] .brand-mark,html[data-theme="light"] .item-code{background:#f6f8fb;color:#3f78db}
    html[data-theme="light"] .quick-theme{background:#f4f7fb;color:#316fc8}
    html[data-theme="light"] .menu-item:hover{background:#f6f8fb}

    html[data-theme="light"] .sidebar-footer{background:#fafbfd}
    html[data-theme="light"] .modal-bg{background:rgba(225,231,240,.82)}

.field input[type=color]{height:36px;border:0;background:none}.check{display:flex;align-items:center;gap:9px;font-size:12px;text-transform:none;letter-spacing:0}.section-title{margin:28px 0 12px;padding-left:12px;border-left:3px solid #8fa8ff;font:800 11px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:#dce5f2}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.action{padding:11px 14px;border:1px solid rgba(255,255,255,.13);border-radius:10px;background:#121b29;color:#dfe7f2;cursor:pointer}.action:hover{border-color:#8fa8ff}.action.primary{border-color:rgba(200,255,98,.35);background:rgba(200,255,98,.07);color:#dfff9f}.file-input{display:none}.hidden-item{display:none!important}.cloud-status{margin-top:12px;padding:13px 15px;border:1px solid rgba(255,255,255,.08);border-radius:12px;color:#93a1b5;font:600 10px ui-monospace,monospace}.cloud-status.ok{color:#c8ff62}.cloud-status.error{color:#ff7088}.service-launcher{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-bottom:12px}.service-launch{min-height:76px;padding:12px;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.09);border-radius:14px;background:rgba(255,255,255,.025);color:#cad4e3;text-align:left;cursor:pointer}.service-launch svg{width:22px;height:22px;fill:none;stroke:#8fa8ff;stroke-width:1.8}.service-launch strong{display:block;font-size:11px}.service-launch small{display:block;margin-top:4px;color:#66758a;font:600 8px ui-monospace,monospace}.service-launch:hover{border-color:rgba(200,255,98,.45);background:rgba(200,255,98,.055);color:#fff}.service-select-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.service-select-row .field{margin:0}
    .action:disabled{opacity:.45;cursor:not-allowed;transform:none}
    .menu-editor{display:grid;gap:7px}.edit-row{display:grid;grid-template-columns:24px 1fr 36px;gap:9px;align-items:center;padding:8px 10px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(255,255,255,.02)}.edit-row svg{width:17px;height:17px;fill:none;stroke:#8fa8ff;stroke-width:1.8}.edit-row input[type=text]{min-width:0;padding:8px 9px;border:1px solid rgba(255,255,255,.11);border-radius:7px;background:#111a27;color:#fff}.visibility-toggle{width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.12);border-radius:9px;background:#111a27;color:#93a1b5;cursor:pointer}.visibility-toggle svg{stroke:currentColor}.visibility-toggle.on{border-color:rgba(200,255,98,.35);color:#c8ff62}.visibility-toggle:hover{border-color:#c8ff62;color:#fff}
    .settings-menu-group{margin:26px 0 6px;padding-top:22px;border-top:1px solid var(--line)}.settings-menu-group .settings-hub-btn{width:100%;height:auto;min-height:var(--item-height);padding:8px 9px}.service-workspace{display:none;margin-top:16px;border:1px solid rgba(143,168,255,.2);border-radius:20px;overflow:hidden;background:#080b11}.service-workspace.open{display:block}.service-workspace-head{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#111824}.service-workspace-head strong{font-size:14px}.service-workspace-head span{color:#8190a6;font:600 9px ui-monospace,monospace}.service-settings-frame{display:block;width:100%;height:min(720px,68vh);border:0;background:#090c12}
    /* CONTROL CENTER 05 — единая визуальная система ERP */

    function recolorCharts(win){try{const t=designTokens(),Chart=win.Chart;if(!Chart)return;const moduleId=current[0],base=[t.info,t.success,t.p[2],t.warning,t.muted],hexAlpha=(color,alpha)=>/^#[0-9a-f]{6}$/i.test(color)?color+alpha:color;win.document.querySelectorAll('canvas').forEach(canvas=>{const chart=Chart.getChart?.(canvas);if(!chart)return;const radial=chart.config.type==='doughnut'||chart.config.type==='pie',datasets=chart.data?.datasets||[];datasets.forEach((ds,di)=>{if(radial){const count=Math.max(ds.data?.length||0,4);ds.backgroundColor=Array.from({length:count},(_,i)=>hexAlpha(base[i%base.length],i<3?'d9':i<5?'9e':'72'));ds.borderColor=t.surface;ds.borderWidth=3}else{const color=base[di%Math.min(base.length,moduleId==='finance'?4:3)];ds.borderColor=color;ds.backgroundColor=hexAlpha(color,moduleId==='time'?'a8':'38');ds.pointBackgroundColor=color;ds.pointBorderColor=t.surface;ds.pointBorderWidth=2}});Object.values(chart.options?.scales||{}).forEach(s=>{if(s.ticks){s.ticks.color=t.muted;s.ticks.padding=10}if(s.grid){s.grid.color=moduleId==='time'?'transparent':t.line;s.grid.drawBorder=false}});if(chart.options?.plugins?.legend?.labels){chart.options.plugins.legend.labels.color=t.muted;chart.options.plugins.legend.labels.padding=18;chart.options.plugins.legend.labels.usePointStyle=true}chart.update('none')})}catch(e){console.warn('PIURA chart theme',e)}}

    function downloadJson(data,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0)}
    function takeLocalBackup(){const list=read(LOCAL_BACKUPS,[]),data=snapshotData(false),raw=JSON.stringify(data);if(list[0]&&JSON.stringify(list[0].data)===raw)return true;list.unshift({at:new Date().toISOString(),data});for(const count of [3,2,1]){try{localStorage.setItem(LOCAL_BACKUPS,JSON.stringify(list.slice(0,count)));return true}catch(error){if(error?.name!=='QuotaExceededError')throw error}}setCloudStatus('Данные сохраняются в сервисах · для локального снимка не хватает места','error');return false}
    async function cloudLoad(force=false){const c=readCloud();if(!c.url)return null;const u=new URL(c.url);u.searchParams.set('action','backupLoad');u.searchParams.set('t',Date.now());const auth=firebaseBridgeToken||c.token||'';if(auth)u.searchParams.set('token',auth);const response=await fetch(u,{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const result=await response.json();if(!result.ok)throw new Error(result.error||'Ошибка Google Drive');if(result.backup){const remoteAt=Date.parse(result.backup.updatedAt||0)||0,overwrite=force||remoteAt>Number(c.lastLocalChangeAt||0);applySnapshot(result.backup.data,overwrite);c.lastRemoteAt=remoteAt;writeCloud(c);if(overwrite){dataFingerprint=JSON.stringify(snapshotData());frame.contentWindow?.postMessage({type:'piura:cloud-data-applied',appliedAt:Date.now()},location.origin)}}return result.backup}
    async function cloudPush(force=false){const c=readCloud();if(!c.url||(!force&&c.auto===false)||cloudBusy)return;cloudBusy=true;setCloudStatus('Сохраняем резервную копию в Google Drive…');try{const body=new URLSearchParams({action:'backupSave',data:JSON.stringify({data:snapshotData()}),token:firebaseBridgeToken||c.token||''}),response=await fetch(c.url,{method:'POST',body});if(!response.ok)throw new Error('HTTP '+response.status);const result=await response.json();if(!result.ok)throw new Error(result.error||'Ошибка Google Drive');c.lastRemoteAt=Date.parse(result.at||0)||Date.now();writeCloud(c);setCloudStatus('Google Drive · сохранено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),'ok')}catch(error){setCloudStatus('Google Drive недоступен · локальные снимки продолжают сохраняться','error');console.warn('ERP cloud backup:',error)}finally{cloudBusy=false}}
    function scheduleDataBackup(){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>{const next=JSON.stringify(snapshotData());if(next===dataFingerprint)return;dataFingerprint=next;takeLocalBackup();const c=readCloud();c.lastLocalChangeAt=Date.now();writeCloud(c);cloudPush()},900)}
    async function syncCloudNow(){const c=readCloud();if(!c.url){setCloudStatus('Укажите адрес опубликованного Google Apps Script','error');return}setCloudStatus('Проверяем Google Drive…');try{await cloudLoad(false);await cloudPush(true)}catch(error){setCloudStatus('Не удалось связаться с Google Drive: '+error.message,'error')}}
    function saveCloudForm(){const c=readCloud();c.url=document.getElementById('cloudUrl').value.trim();c.token=document.getElementById('cloudToken').value;writeCloud(c);return c}
    ['cloudUrl','cloudToken'].forEach(id=>{const input=document.getElementById(id);input.addEventListener('input',saveCloudForm);input.addEventListener('change',()=>{const c=saveCloudForm();if(c.url)syncCloudNow()})});
    document.getElementById('cloudAuto').addEventListener('change',e=>{const c=readCloud();c.auto=e.target.checked;writeCloud(c);if(c.auto)syncCloudNow()});
    document.getElementById('cloudSyncNow').onclick=syncCloudNow;
    document.getElementById('exportAllData').onclick=()=>downloadJson({version:1,exportedAt:new Date().toISOString(),data:snapshotData()},'PIURA_ERP_ALL_DATA_'+new Date().toISOString().slice(0,10)+'.json');
    document.getElementById('importAllData').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result),data=parsed.data||parsed.backup?.data;if(!data||typeof data!=='object')throw new Error();if(!confirm('Восстановить все данные ERP из этого файла?'))return;takeLocalBackup();applySnapshot(data,true);location.reload()}catch(x){alert('Это не резервная копия PIURA ERP')}};r.readAsText(f)};
    document.getElementById('restoreLocal').onclick=()=>{const list=read(LOCAL_BACKUPS,[]);if(!list.length){alert('Локальных снимков пока нет');return}if(confirm('Восстановить снимок от '+new Date(list[0].at).toLocaleString('ru-RU')+'?')){applySnapshot(list[0].data,true);location.reload()}};
    window.addEventListener('storage',e=>{if(e.key!==CLOUD_KEY&&e.key!==LOCAL_BACKUPS)scheduleDataBackup()});setInterval(scheduleDataBackup,2500);
    async function initDataSafety(){syncCloudForm();takeLocalBackup();dataFingerprint=JSON.stringify(snapshotData());const c=readCloud();if(c.url&&c.auto!==false){setCloudStatus('Проверяем облачную копию…');try{await cloudLoad(false);await cloudPush()}catch(error){setCloudStatus('Локальное сохранение работает · облако пока недоступно','error')}}else setCloudStatus('Локальное сохранение включено · адрес облака пока не указан');setInterval(()=>{const c=readCloud();if(c.url&&c.auto!==false&&!cloudBusy)cloudLoad(false).catch(()=>{})},30000)}
    window.addEventListener('piura-firebase-token',event=>{firebaseBridgeToken=String(event.detail?.token||'');if(firebaseBridgeToken){frame.contentWindow?.postMessage({type:'piura:firebase-token',token:firebaseBridgeToken},location.origin);cloudLoad(false).catch(()=>{})}});
    async function purgeObsoleteCaches(){
      try{if('serviceWorker' in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(registration=>registration.unregister()))}}catch(error){console.warn('Service worker cleanup',error)}
      try{if('caches' in window){const names=await caches.keys();await Promise.all(names.map(name=>caches.delete(name)))}}catch(error){console.warn('Cache storage cleanup',error)}
    }
    async function checkPublishedBuild(){
      try{
        const response=await fetch(`build-version.json?t=${Date.now()}`,{cache:'no-store'});if(!response.ok)return;
        const published=String((await response.json()).version||'');if(!published||published===BUILD_ID)return;
        const url=new URL(location.href);if(url.searchParams.get('build')===published)return;
        url.searchParams.set('build',published);location.replace(url.href);
      }catch(error){console.warn('Build update check',error)}
    }
    purgeObsoleteCaches();checkPublishedBuild();setInterval(checkPublishedBuild,60000);
    applyPrefs();selectModule(current[0]);initDataSafety();
  </script>
