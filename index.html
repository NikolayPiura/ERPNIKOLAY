  <script>
    const ICONS={effectiveness:'<path d="M4 19V9m6 10V5m6 14v-7m4 7H2"/>',morning:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',time:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',weekly:'<path d="M4 5h16v15H4zM8 3v4m8-4v4M4 9h16"/>',dynamics:'<path d="m3 17 5-5 4 3 8-9M16 6h4v4"/>',mydynamics:'<circle cx="12" cy="8" r="3"/><path d="M5 20c.6-4 2.9-6 7-6s6.4 2 7 6"/>',finance:'<path d="M4 6h16v12H4zM4 10h16M8 15h3"/>',funds:'<path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 12 9 5 9-5m-18 4 9 5 9-5"/>',pff:'<path d="M12 21s-7-4.4-7-11a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 6.6-7 11-7 11Z"/>',moscow:'<path d="M4 21h16M6 21V9l6-6 6 6v12M9 21v-6h6v6"/>',safe:'<path d="M12 22s8-3 8-10V5l-8-3-8 3v7c0 7 8 10 8 10Z"/><path d="m9 12 2 2 4-5"/>'};
    const DEFAULT_GROUPS=[
      {id:'eff',title:"Эффективность",accent:"#c8ff62",items:[
        ["effectiveness","Эффективность","Доход, время и направления","piura-erp-restored%203/modules/EFFECTIVNESS.html?v=20260729f"],

        ["mydynamics","Мои динамики","My Dynamics 2","piura-erp-restored%203/modules/My-Dynamics.html?v=20260729f"]]},
      {id:'fin',title:"Финансы",accent:"#8fa8ff",items:[

        ["funds","Структура фондов","Иерархия и капитал","piura-erp-restored%203/modules/Fonds.html?v=20260729f"],
        ["pff","Фонд PFF","Piura Family Fund","piura-erp-restored%203/modules/PFF.html?v=20260729f"],
        ["moscow","Фонд Москва","Инвестиционный портфель","piura-erp-restored%203/modules/MSK.html?v=20260729f"],
        ["safe","SAFE","Резервный портфель","piura-erp-restored%203/modules/Safe.html?v=20260729f"]]}
    ];
    const DEFAULTS={width:284,collapsedWidth:104,itemHeight:57,fontSize:12,gap:3,scale:1,radius:22,opacity:.97,blur:18,bg:'#0b1019',accent:'#c8ff62',text:'#f4f7fb',muted:'#8190a6',hoverExpand:true,tooltips:true,showSubtitles:true,showArrows:true,collapsed:false,hidden:[]};
    const KEY='piura_erp_shell_v5',ORDER='piura_erp_shell_order_v5',PROFILES='piura_erp_shell_profiles_v1';
    const clone=v=>JSON.parse(JSON.stringify(v));
    function read(k,d){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v||(Array.isArray(d)?clone(d):Object.assign({},d))}catch(e){return Array.isArray(d)?clone(d):Object.assign({},d)}}
    let prefs=Object.assign({},DEFAULTS,read(KEY,DEFAULTS));let groups=read(ORDER,DEFAULT_GROUPS);if(!Array.isArray(groups)||!groups.length)groups=clone(DEFAULT_GROUPS);
    // Сохраняем пользовательские порядок, названия и видимость, но всегда

    const tip=document.getElementById('tip');let dragId=null;

    function applyPrefs(){const r=document.documentElement.style;r.setProperty('--nav-width',prefs.width+'px');r.setProperty('--nav-collapsed',prefs.collapsedWidth+'px');r.setProperty('--item-height',prefs.itemHeight+'px');r.setProperty('--nav-font',prefs.fontSize+'px');r.setProperty('--item-gap',prefs.gap+'px');r.setProperty('--nav-scale',prefs.scale);r.setProperty('--nav-radius',prefs.radius+'px');r.setProperty('--nav-opacity',prefs.opacity);r.setProperty('--nav-blur',prefs.blur+'px');r.setProperty('--nav-bg',prefs.bg);r.setProperty('--nav-accent',prefs.accent);r.setProperty('--text',prefs.text);r.setProperty('--muted',prefs.muted);shell.classList.toggle('compact',prefs.collapsed);save();drawMenu()}
    function drawMenu(){
      menu.innerHTML=groups.map(group=>`<section class="menu-group" style="--accent:${group.accent}"><div class="group-heading"><i></i><span>${group.title}</span><b>${String(group.items.filter(i=>!prefs.hidden.includes(i[0])).length).padStart(2,"0")}</b></div><div class="menu-items" data-group="${group.id}">${group.items.map(item=>`<button draggable="true" class="menu-item ${item[0]===current[0]?"active":""} ${prefs.hidden.includes(item[0])?'hidden-item':''}" data-id="${item[0]}" title="${item[1]}"><span class="item-code"><svg viewBox="0 0 24 24">${ICONS[item[0]]}</svg></span><span class="item-copy"><strong>${item[1]}</strong>${prefs.showSubtitles?`<small>${item[2]}</small>`:''}</span>${prefs.showArrows?'<span class="item-arrow">›</span>':''}</button>`).join("")}</div></section>`).join("");
      menu.querySelectorAll("[data-id]").forEach(button=>{button.onclick=()=>selectModule(button.dataset.id);button.ondragstart=()=>{dragId=button.dataset.id;button.classList.add('dragging')};button.ondragend=()=>button.classList.remove('dragging');button.onmouseenter=()=>showTip(button);button.onmouseleave=hideTip});
      menu.querySelectorAll('[data-group]').forEach(zone=>{zone.ondragover=e=>{e.preventDefault();zone.classList.add('drop-zone')};zone.ondragleave=()=>zone.classList.remove('drop-zone');zone.ondrop=e=>{e.preventDefault();zone.classList.remove('drop-zone');moveItem(dragId,zone.dataset.group,e.target.closest('[data-id]')?.dataset.id)}})
    }
    function moveItem(id,gid,before){let item;groups.forEach(g=>{const n=g.items.findIndex(i=>i[0]===id);if(n>=0)item=g.items.splice(n,1)[0]});const g=groups.find(x=>x.id===gid);if(!item||!g)return;const n=before?g.items.findIndex(i=>i[0]===before):-1;g.items.splice(n>=0?n:g.items.length,0,item);save();drawMenu()}
    function selectModule(id){
      current=all().find(item=>item[0]===id)||all()[0];
      if(CANONICAL_PATHS.has(current[0]))current[3]=CANONICAL_PATHS.get(current[0]);
      frame.src=current[3];frame.title=current[1];
      localStorage.setItem("piura-erp-shell-module",current[0]);drawMenu();
    }
    document.getElementById("collapse").addEventListener("click",()=>{
      prefs.collapsed=!prefs.collapsed;shell.classList.remove('hover-open');localStorage.setItem("piura-erp-shell-compact",prefs.collapsed?"1":"0");applyPrefs();
    });
    let hoverTimer;const navColumn=document.querySelector('.nav-column'),stage=document.querySelector('.stage'),hoverEligible=()=>prefs.hoverExpand&&(prefs.collapsed||matchMedia('(max-width:900px)').matches);function openNavFallback(){if(!hoverEligible())return;clearTimeout(hoverTimer);shell.classList.add('hover-open')}function openNavHover(e){if(matchMedia('(hover:hover)').matches&&e?.pointerType!=='touch')return;openNavFallback()}function closeNavHover(force=false){if(!hoverEligible())return;clearTimeout(hoverTimer);hoverTimer=setTimeout(()=>{if(force||!navColumn.matches(':hover'))shell.classList.remove('hover-open')},320)}navColumn.addEventListener('pointerenter',openNavHover);navColumn.addEventListener('pointermove',openNavHover,{passive:true});navColumn.addEventListener('pointerleave',()=>closeNavHover());navColumn.addEventListener('pointerout',e=>{if(!e.relatedTarget||!navColumn.contains(e.relatedTarget))closeNavHover()});stage.addEventListener('pointerenter',()=>closeNavHover(true));navColumn.addEventListener('focusin',openNavFallback);navColumn.addEventListener('focusout',()=>closeNavHover());document.addEventListener('pointerdown',e=>{if(!navColumn.contains(e.target))closeNavHover(true)});frame.addEventListener('load',()=>{try{frame.contentDocument?.addEventListener('pointerdown',()=>closeNavHover(true))}catch(e){}});
    function showTip(b){if(!prefs.tooltips||!prefs.collapsed||shell.classList.contains('hover-open'))return;tip.textContent=b.title;const r=b.getBoundingClientRect();tip.style.left=(r.right+10)+'px';tip.style.top=(r.top+r.height/2-15)+'px';tip.classList.add('show')}function hideTip(){tip.classList.remove('show')}
    const fields=[['width','Ширина раскрытого меню','range',240,480,2],['collapsedWidth','Ширина свёрнутого меню','range',86,160,2],['itemHeight','Высота пункта','range',44,86,1],['fontSize','Размер текста','range',10,17,.5],['gap','Расстояние между пунктами','range',0,14,1],['scale','Общий масштаб','range',.75,1.2,.01],['radius','Скругление','range',0,36,1],['opacity','Прозрачность','range',.65,1,.01],['blur','Размытие фона','range',0,36,1],['bg','Цвет панели','color'],['accent','Акцент','color'],['text','Основной текст','color'],['muted','Вторичный текст','color']];
    document.getElementById('settingsGrid').innerHTML=fields.map(f=>`<div class="field"><label>${f[1]} <output data-out="${f[0]}"></output></label><input data-setting="${f[0]}" type="${f[2]}" ${f[2]==='range'?`min="${f[3]}" max="${f[4]}" step="${f[5]}"`:''}></div>`).join('');
    function syncForm(){document.querySelectorAll('[data-setting]').forEach(el=>{const k=el.dataset.setting;el.type==='checkbox'?el.checked=!!prefs[k]:el.value=prefs[k];const o=document.querySelector(`[data-out="${k}"]`);if(o)o.textContent=prefs[k]})}
    document.querySelectorAll('[data-setting]').forEach(el=>el.oninput=()=>{prefs[el.dataset.setting]=el.type==='checkbox'?el.checked:(el.type==='range'?Number(el.value):el.value);applyPrefs();syncForm()});
    function buildMenuEditor(){const box=document.getElementById('menuEditor');box.innerHTML=groups.flatMap(g=>g.items.map(item=>`<div class="edit-row"><svg viewBox="0 0 24 24">${ICONS[item[0]]}</svg><input type="text" value="${item[1]}" data-rename="${item[0]}"><label><input type="checkbox" data-visible="${item[0]}" ${prefs.hidden.includes(item[0])?'':'checked'}> показывать</label></div>`)).join('');box.querySelectorAll('[data-rename]').forEach(inp=>inp.onchange=()=>{const item=all().find(i=>i[0]===inp.dataset.rename);if(item&&inp.value.trim()){item[1]=inp.value.trim();save();drawMenu()}});box.querySelectorAll('[data-visible]').forEach(inp=>inp.onchange=()=>{prefs.hidden=prefs.hidden.filter(id=>id!==inp.dataset.visible);if(!inp.checked)prefs.hidden.push(inp.dataset.visible);applyPrefs()})}
    const modal=document.getElementById('settingsModal');document.getElementById('settings').onclick=()=>{syncForm();refreshProfiles();buildMenuEditor();modal.classList.add('open')};document.getElementById('closeSettings').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
    function getProfiles(){try{return JSON.parse(localStorage.getItem(PROFILES)||'{}')}catch(e){return{}}}function refreshProfiles(){const p=getProfiles(),s=document.getElementById('profiles');s.innerHTML=Object.keys(p).map(n=>`<option>${n}</option>`).join('')||'<option>Нет профилей</option>'}
    document.getElementById('saveProfile').onclick=()=>{const n=prompt('Название профиля:','Мой профиль');if(!n)return;const p=getProfiles();p[n]={prefs,groups};localStorage.setItem(PROFILES,JSON.stringify(p));refreshProfiles()};document.getElementById('loadProfile').onclick=()=>{const p=getProfiles()[document.getElementById('profiles').value];if(p){prefs=Object.assign({},DEFAULTS,p.prefs);groups=p.groups;applyPrefs();syncForm()}};
    document.getElementById('resetSettings').onclick=()=>{if(confirm('Вернуть исходные настройки и порядок?')){prefs=clone(DEFAULTS);groups=clone(DEFAULT_GROUPS);applyPrefs();syncForm()}};
    document.getElementById('exportSettings').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({prefs,groups},null,2)],{type:'application/json'}));a.download='piura-erp-menu.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('importSettings').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);prefs=Object.assign({},DEFAULTS,d.prefs);groups=d.groups||clone(DEFAULT_GROUPS);applyPrefs();syncForm()}catch(x){alert('Некорректный файл')}};r.readAsText(f)};

    /* Полная сохранность данных всех модулей: локальные снимки + Google Drive через Apps Script. */
    const CLOUD_KEY='piura_erp_cloud_v1',LOCAL_BACKUPS='piura_erp_local_backups_v1';let dataFingerprint='',cloudTimer=null,cloudBusy=false;
    function readCloud(){try{return{auto:true,url:'',token:'',lastLocalChangeAt:0,lastRemoteAt:0,...JSON.parse(localStorage.getItem(CLOUD_KEY)||'{}')}}catch(e){return{auto:true,url:'',token:'',lastLocalChangeAt:0,lastRemoteAt:0}}}
    function writeCloud(value){localStorage.setItem(CLOUD_KEY,JSON.stringify(value));syncCloudForm()}
    function snapshotData(){const data={};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key!==CLOUD_KEY&&key!==LOCAL_BACKUPS)data[key]=localStorage.getItem(key)}return data}
    function applySnapshot(data,overwrite=true){Object.entries(data||{}).forEach(([key,value])=>{if(key===CLOUD_KEY||key===LOCAL_BACKUPS)return;if(overwrite||localStorage.getItem(key)==null)localStorage.setItem(key,String(value))})}
    function setCloudStatus(text,kind=''){const el=document.getElementById('cloudStatus');el.textContent=text;el.className='cloud-status '+kind}
    function syncCloudForm(){const c=readCloud(),url=document.getElementById('cloudUrl'),token=document.getElementById('cloudToken'),auto=document.getElementById('cloudAuto');if(document.activeElement!==url)url.value=c.url||'';if(document.activeElement!==token)token.value=c.token||'';auto.checked=c.auto!==false}
    function downloadJson(data,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),0)}
    function takeLocalBackup(){const list=read(LOCAL_BACKUPS,[]),data=snapshotData(),raw=JSON.stringify(data);if(list[0]&&JSON.stringify(list[0].data)===raw)return;list.unshift({at:new Date().toISOString(),data});localStorage.setItem(LOCAL_BACKUPS,JSON.stringify(list.slice(0,3)))}
    async function cloudLoad(force=false){const c=readCloud();if(!c.url)return null;const u=new URL(c.url);u.searchParams.set('action','backupLoad');u.searchParams.set('t',Date.now());if(c.token)u.searchParams.set('token',c.token);const response=await fetch(u,{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const result=await response.json();if(!result.ok)throw new Error(result.error||'Ошибка Google Drive');if(result.backup){const remoteAt=Date.parse(result.backup.updatedAt||0)||0,overwrite=force||remoteAt>Number(c.lastLocalChangeAt||0);applySnapshot(result.backup.data,overwrite);c.lastRemoteAt=remoteAt;writeCloud(c);if(overwrite){dataFingerprint=JSON.stringify(snapshotData());frame.contentWindow?.location.reload()}}return result.backup}
    async function cloudPush(force=false){const c=readCloud();if(!c.url||(!force&&c.auto===false)||cloudBusy)return;cloudBusy=true;setCloudStatus('Сохраняем резервную копию в Google Drive…');try{const body=new URLSearchParams({action:'backupSave',data:JSON.stringify({data:snapshotData()}),token:c.token||''}),response=await fetch(c.url,{method:'POST',body});if(!response.ok)throw new Error('HTTP '+response.status);const result=await response.json();if(!result.ok)throw new Error(result.error||'Ошибка Google Drive');c.lastRemoteAt=Date.parse(result.at||0)||Date.now();writeCloud(c);setCloudStatus('Google Drive · сохранено '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),'ok')}catch(error){setCloudStatus('Google Drive недоступен · локальные снимки продолжают сохраняться','error');console.warn('ERP cloud backup:',error)}finally{cloudBusy=false}}
    function scheduleDataBackup(){clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>{const next=JSON.stringify(snapshotData());if(next===dataFingerprint)return;dataFingerprint=next;takeLocalBackup();const c=readCloud();c.lastLocalChangeAt=Date.now();writeCloud(c);cloudPush()},900)}
    async function syncCloudNow(){const c=readCloud();if(!c.url){setCloudStatus('Укажите адрес опубликованного Google Apps Script','error');return}setCloudStatus('Проверяем Google Drive…');try{await cloudLoad(false);await cloudPush(true)}catch(error){setCloudStatus('Не удалось связаться с Google Drive: '+error.message,'error')}}
    function saveCloudForm(){const c=readCloud();c.url=document.getElementById('cloudUrl').value.trim();c.token=document.getElementById('cloudToken').value;writeCloud(c);return c}
    ['cloudUrl','cloudToken'].forEach(id=>{const input=document.getElementById(id);input.addEventListener('input',saveCloudForm);input.addEventListener('change',()=>{const c=saveCloudForm();if(c.url)syncCloudNow()})});
    document.getElementById('cloudAuto').addEventListener('change',e=>{const c=readCloud();c.auto=e.target.checked;writeCloud(c);if(c.auto)syncCloudNow()});
    document.getElementById('cloudSyncNow').onclick=syncCloudNow;
    document.getElementById('exportAllData').onclick=()=>downloadJson({version:1,exportedAt:new Date().toISOString(),data:snapshotData()},'PIURA_ERP_ALL_DATA_'+new Date().toISOString().slice(0,10)+'.json');
    document.getElementById('importAllData').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result),data=parsed.data||parsed.backup?.data;if(!data||typeof data!=='object')throw new Error();if(!confirm('Восстановить все данные ERP из этого файла?'))return;takeLocalBackup();applySnapshot(data,true);location.reload()}catch(x){alert('Это не резервная копия PIURA ERP')}};r.readAsText(f)};
    document.getElementById('restoreLocal').onclick=()=>{const list=read(LOCAL_BACKUPS,[]);if(!list.length){alert('Локальных снимков пока нет');return}if(confirm('Восстановить снимок от '+new Date(list[0].at).toLocaleString('ru-RU')+'?')){applySnapshot(list[0].data,true);location.reload()}};
    window.addEventListener('storage',e=>{if(e.key!==CLOUD_KEY&&e.key!==LOCAL_BACKUPS)scheduleDataBackup()});setInterval(scheduleDataBackup,2500);
    async function initDataSafety(){syncCloudForm();takeLocalBackup();dataFingerprint=JSON.stringify(snapshotData());const c=readCloud();if(c.url&&c.auto!==false){setCloudStatus('Проверяем облачную копию…');try{await cloudLoad(false);await cloudPush()}catch(error){setCloudStatus('Локальное сохранение работает · облако пока недоступно','error')}}else setCloudStatus('Локальное сохранение включено · адрес облака пока не указан')}
    applyPrefs();selectModule(current[0]);initDataSafety();
  </script>
</body>
