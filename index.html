
<!doctype html>

  <title>PIURA ERP — оригинальные модули</title>
  <style>
    :root{
      --shell:#070a10;--surface:rgba(11,16,25,.97);--line:rgba(255,255,255,.09);

      --nav-font:12px;--nav-radius:22px;--nav-scale:1;--nav-opacity:.97;--nav-blur:18px;
      --nav-bg:#0b1019;--nav-accent:#5b9dff

    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--shell)}
    body{color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button{font:inherit}
    .shell{
      width:100vw;height:100vh;display:grid;grid-template-columns:var(--nav-width) minmax(0,1fr);
      overflow:hidden;background:var(--shell);transition:grid-template-columns .22s ease

    .shell.compact{grid-template-columns:var(--nav-collapsed) minmax(0,1fr)}
    .shell.compact.hover-open{grid-template-columns:var(--nav-width) minmax(0,1fr)}
    .nav-column{position:relative;z-index:2;min-width:0;height:100vh;background:var(--shell)}
    .sidebar{

      display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line-strong);
      border-radius:var(--nav-radius);background:linear-gradient(180deg,rgba(143,168,255,.07),transparent 22%),color-mix(in srgb,var(--nav-bg) calc(var(--nav-opacity)*100%),transparent);
      backdrop-filter:blur(var(--nav-blur));transform:scale(var(--nav-scale));transform-origin:top left;
      width:calc((100% - 20px)/var(--nav-scale));height:calc((100vh - 20px)/var(--nav-scale));

    .stage{position:relative;z-index:1;min-width:0;width:100%;height:100vh;overflow:hidden;background:#080b11}

    .brand-row{min-height:92px;padding:15px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}

      border-radius:13px;background:radial-gradient(circle at 30% 20%,rgba(91,157,255,.26),transparent 42%),#111922;

    .brand-copy{min-width:0;display:flex;flex:1;flex-direction:column;gap:4px}

    .collapse,.settings{width:36px;height:36px;flex:0 0 36px;border:1px solid rgba(91,157,255,.3);border-radius:11px;background:linear-gradient(145deg,rgba(91,157,255,.13),rgba(143,168,255,.05));color:#b8d5ff;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 18px rgba(91,157,255,.08);transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease,color .16s ease}
    .collapse{font-size:18px}.settings{font-size:17px}
    .collapse:hover,.settings:hover{transform:translateY(-2px);border-color:rgba(91,157,255,.72);color:#fff;box-shadow:0 0 24px rgba(91,157,255,.2)}
    .menu-scroll{flex:1;min-height:0;padding:10px 10px 18px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.13) transparent}
    .menu-group{padding-top:14px}
    .group-heading{height:38px;padding:0 10px;display:flex;align-items:center;gap:10px;color:#b7c2d1;font:760 13px/1 ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}
    .group-heading i{width:12px;height:12px;flex:0 0 12px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent)}

    .menu-items{display:flex;flex-direction:column;gap:var(--item-gap);min-height:12px}
    .menu-item{position:relative;width:100%;min-height:var(--item-height);padding:8px 9px;display:flex;align-items:center;gap:11px;border:1px solid transparent;border-radius:13px;background:transparent;color:var(--muted);text-align:left;cursor:pointer;transition:.15s ease}

    .item-code svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.menu-item.active .item-code{border-color:color-mix(in srgb,var(--accent) 34%,transparent);color:var(--accent)}

    .menu-item:hover .item-arrow,.menu-item.active .item-arrow{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);transform:translateX(2px);box-shadow:0 0 15px color-mix(in srgb,var(--accent) 20%,transparent)}

    .live i{width:12px;height:12px;flex:0 0 12px;border-radius:50%;background:var(--lime);box-shadow:0 0 16px rgba(91,157,255,.72)}
    .version{color:var(--faint);font:600 8px/1 ui-monospace,monospace;white-space:nowrap}
    .shell.compact:not(.hover-open){grid-template-columns:var(--nav-collapsed) minmax(0,1fr)}.shell.compact.hover-open{grid-template-columns:var(--nav-width) minmax(0,1fr)}
    .compact:not(.hover-open) .brand-row{justify-content:center;padding-inline:9px;flex-wrap:wrap;align-content:center;gap:5px}
    .compact:not(.hover-open) .brand-copy,.compact:not(.hover-open) .group-heading span,.compact:not(.hover-open) .group-heading b,.compact:not(.hover-open) .item-copy,.compact:not(.hover-open) .item-arrow,.compact:not(.hover-open) .live span,.compact:not(.hover-open) .version,.compact:not(.hover-open) .settings{display:none}
    .compact:not(.hover-open) .brand-row{min-height:112px}.compact:not(.hover-open) .collapse{width:46px;height:25px;flex-basis:46px}.compact:not(.hover-open) .collapse span{display:inline-block;transform:rotate(180deg)}
    .compact:not(.hover-open) .group-heading{justify-content:center;padding:0}.compact:not(.hover-open) .menu-item{justify-content:center;padding-inline:4px}.compact:not(.hover-open) .item-code{width:44px;height:44px;flex-basis:44px}.compact:not(.hover-open) .sidebar-footer{display:flex;justify-content:center;padding:8px}.compact:not(.hover-open) .sidebar-footer>div,.compact:not(.hover-open) .settings-hub-btn span{display:none}.compact:not(.hover-open) .settings-hub-btn{width:48px;padding:0;justify-content:center}
    .dragging{opacity:.35}.drop-zone{outline:1px dashed var(--accent)}

.field input[type=color]{height:36px;border:0;background:none}.check{display:flex;align-items:center;gap:9px;font-size:12px;text-transform:none;letter-spacing:0}.section-title{margin:28px 0 12px;padding-left:12px;border-left:3px solid #8fa8ff;font:800 11px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:#dce5f2}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.action{padding:11px 14px;border:1px solid rgba(255,255,255,.13);border-radius:10px;background:#121b29;color:#dfe7f2;cursor:pointer}.action:hover{border-color:#8fa8ff}.action.primary{border-color:rgba(200,255,98,.35);background:rgba(200,255,98,.07);color:#dfff9f}.file-input{display:none}.hidden-item{display:none!important}.cloud-status{margin-top:12px;padding:13px 15px;border:1px solid rgba(255,255,255,.08);border-radius:12px;color:#93a1b5;font:600 10px ui-monospace,monospace}.cloud-status.ok{color:#c8ff62}.cloud-status.error{color:#ff7088}.service-launcher{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-bottom:12px}.service-launch{min-height:76px;padding:12px;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.09);border-radius:14px;background:rgba(255,255,255,.025);color:#cad4e3;text-align:left;cursor:pointer}.service-launch svg{width:22px;height:22px;fill:none;stroke:#8fa8ff;stroke-width:1.8}.service-launch strong{display:block;font-size:11px}.service-launch small{display:block;margin-top:4px;color:#66758a;font:600 8px ui-monospace,monospace}.service-launch:hover{border-color:rgba(200,255,98,.45);background:rgba(200,255,98,.055);color:#fff}.service-select-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.service-select-row .field{margin:0}

    document.getElementById('importAllData').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result),data=parsed.data||parsed.backup?.data;if(!data||typeof data!=='object')throw new Error();if(!confirm('Восстановить все данные ERP из этого файла?'))return;takeLocalBackup();applySnapshot(data,true);location.reload()}catch(x){alert('Это не резервная копия PIURA ERP')}};r.readAsText(f)};
    document.getElementById('restoreLocal').onclick=()=>{const list=read(LOCAL_BACKUPS,[]);if(!list.length){alert('Локальных снимков пока нет');return}if(confirm('Восстановить снимок от '+new Date(list[0].at).toLocaleString('ru-RU')+'?')){applySnapshot(list[0].data,true);location.reload()}};
    window.addEventListener('storage',e=>{if(e.key!==CLOUD_KEY&&e.key!==LOCAL_BACKUPS)scheduleDataBackup()});setInterval(scheduleDataBackup,2500);
    async function initDataSafety(){syncCloudForm();takeLocalBackup();dataFingerprint=JSON.stringify(snapshotData());const c=readCloud();if(c.url&&c.auto!==false){setCloudStatus('Проверяем облачную копию…');try{await cloudLoad(false);await cloudPush()}catch(error){setCloudStatus('Локальное сохранение работает · облако пока недоступно','error')}}else setCloudStatus('Локальное сохранение включено · адрес облака пока не указан')}
    applyPrefs();selectModule(current[0]);initDataSafety();
  </script>
